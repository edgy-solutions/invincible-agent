# User → group memberships.
#
# Every entry here is a named human's PR-reviewed decision that the
# listed user is entitled to everything the listed groups grant.
# `git blame` gives the audit trail — who granted what, when.
#
# `id` matches whichever JWT claim `USER_ENTITLEMENT_CLAIM` selects
# on the cortex-bff side — `email` by DEFAULT, not `sub`. Email is
# used because a users.yaml keyed by Keycloak's opaque `sub` UUID
# is not human-reviewable, which defeats the entire git-assertion
# discipline (nobody can PR-review "is c405218e-... a steward?").
# If your IdP lacks a stable/verified email claim, set
# USER_ENTITLEMENT_CLAIM=sub on cortex-bff and key this file by sub
# instead (accepting the readability cost).
#
# `default` picks the initial (persona, domain) cell the cortex-ui
# picker starts on for this user. Must be a cell the user's groups
# actually grant — the sync tool rejects a default outside the
# user's entitlement matrix per [[verification-must-fail]].
#
# Sandbox seeds: alice / bob / carol are the demo accounts already
# present in sandbox Keycloak. Alice is the power-user profile for
# exercising the multi-persona × multi-domain path.
# NB: `id` values are the EMAIL claim Keycloak actually issues for
# these users (`@example.com`, per the iagent-keycloak-realm import),
# NOT `@edgy-solutions.com`. The lookup keys on USER_ENTITLEMENT_CLAIM
# (email); a domain mismatch here silently blanks the user's matrix.
users:
  # ── Catalog access (data-engineers) — the 2026-07-03 grant ──────────
  # First deliberate human assertion of DATA_ENGINEERING-catalog access
  # after the domain-based gate was ratified (ADR-0025 amendment). Each
  # grant below carries its HONEST reason: a ROLE grant (the account
  # genuinely does catalog work) vs a FIXTURE grant (granted only so a
  # demo scenario has a catalog-entitled actor — named as a fixture, not
  # a claim about the persona). bob + carol are deliberately NOT granted:
  # their honest denials are the other half of the demo (access control
  # visibly working), so leaving them out is itself an assertion.

  - id: agent@example.com
    display_name: Invincible (agent-user)
    groups:
      - data-engineers      # ROLE grant: agent-user is the service/demo
                            # account whose job includes querying the
                            # DATA_ENGINEERING catalog. Genuine role, not
                            # a fixture — it needs this to do its work.
    default:
      persona: DATA_ENGINEER
      domains: [DATA_ENGINEERING]

  - id: alice@example.com
    display_name: Alice (demo - power user)
    groups:
      - aviation-engineers
      - defense-engineers
      - enterprise-architects
      - portfolio-leads     # FIXTURE grant, 2026-08-22: alice is the
                            # portfolio-review demo actor. Not a claim that
                            # alice-the-persona owns portfolio governance.
      - data-engineers      # FIXTURE grant: added so demo scenarios that
                            # need a catalog-entitled power user have one.
                            # NOT an assertion that alice-the-persona owns
                            # DATA_ENGINEERING catalog governance — she's a
                            # test fixture wearing the entitlement. If the
                            # demo stops needing a catalog-entitled alice,
                            # this line comes out.
      - maintenance-mechanics  # FIXTURE grant (2026-08-05): gives the demo
                            # power-user a MAINTENANCE cell so the ADR-0038
                            # analyst→Engine-E join is witnessable on ORGANIC
                            # traffic (E is MAINTENANCE-scoped; /resolve gates
                            # the class pool by the caller's domains, so a
                            # maintenance question from a non-maintenance cell
                            # falls to the generalist). Fixture, not a claim
                            # alice maintains aircraft — mirrors the data-
                            # engineers fixture above. Remove when the E-join
                            # demo no longer needs a maintenance-entitled actor.
    default:
      persona: DATA_ENGINEER
      domains: [AVIATION]

  - id: bob@example.com
    display_name: Bob (demo - steward)
    # NO data-engineers: deliberate. Bob is an AVIATION steward; he is
    # NOT entitled to the DATA_ENGINEERING catalog, and his honest "Not
    # entitled" denial is a demo asset, not a gap. Do not add
    # data-engineers to make a denial go away — that's the whack-a-mole
    # the ADR-0025 amendment forbids.
    groups:
      - aviation-stewards
    default:
      persona: DATA_STEWARD
      domains: [AVIATION]

  - id: carol@example.com
    display_name: Carol (demo - mechanic)
    # NO data-engineers: deliberate. Carol is a mechanic; catalog access
    # is not her role. Her denial is the other honest half of the demo.
    groups:
      - aviation-mechanics
    default:
      persona: MECHANIC
      domains: [AVIATION]

  # ── Service identities (non-human subjects) ─────────────────────────
  # A service identity is a SUBJECT in the entitlement model exactly like
  # a human — seeded here so its grants carry the same git-blame audit
  # trail — but it is a DIFFERENT species: it authenticates via Keycloak
  # client-credentials (no browser, no Ping federation), its `id` is the
  # authz_id claim in `svc:<name>` form (never an email/employee-id), and
  # it assumes NO persona/domain (it never opens the cortex-ui picker), so
  # it carries no `groups` and no `default`. Its entitlements are CAPABILITY
  # invocations (capability_grants.yaml), not persona/domain cells. This is
  # instance-one of the pattern (the dispatcher / analyst loop will follow
  # the same shape). See docs/reference/identity-mint-contract.md.
  - id: svc:review-starter
    display_name: review-starter (service - extraction-to-review sensor)
    groups: []

  # Instance TWO of the service species (2026-08-07). Engine DA's transport identity —
  # `CortexDataClient` mints per call via client-credentials to reach the data broker.
  # Seeded so the identity is LEGIBLE and grantable through the rails; NO grants are made
  # here. Before granting anything to it, read this: the service credential says WHICH
  # SERVICE is calling, not WHOSE data may be read. DA serves every caller, so a read grant
  # on svc:data-analyst would entitle EVERY caller to whatever it can reach — the confused
  # deputy the per-caller conjunction exists to prevent. The acting human currently rides
  # separately (X-Originator-Email; the can_read gate is keyed on that), and formalising
  # that delegation is an open design decision, not something to settle with a grant here.
  # Replaces the hand-created sandbox client `engine-da-svc`, whose token carried no claim
  # mapper at all — its authz_id fell back to the opaque Keycloak `sub` UUID, which is
  # precisely the not-human-reviewable key this file exists to refuse.
  - id: svc:data-analyst
    display_name: data-analyst (service - Engine DA data-broker transport identity)
    groups: []

  # Instance THREE (2026-08-07). The supervisor's DISPATCH identity — the credential its
  # specialist POSTs will present once transport auth requires one. Seeded so the identity is
  # legible and grantable; NO grants. Same caution as svc:data-analyst: the supervisor
  # dispatches on behalf of every caller, so a read grant here would entitle all of them.
  - id: svc:supervisor
    display_name: supervisor (service - specialist dispatch transport identity)
    groups: []

  # Instance FOUR (2026-08-07) — a PROCESS credential, not a role. Engine A hosts several
  # ungoverned internal callers (decision_record_writer, review_composer,
  # policy_rules_client) that reach Engine O; they hold no grants and are planned to hold
  # none, so they share this one credential and attribute per-module in the payload.
  # svc:review-starter runs in the SAME process and is deliberately NOT merged into this:
  # it holds a capability grant, so it is a governed subject and keeps its own identity.
  # IDENTITY GRANULARITY FOLLOWS GOVERNANCE, NOT TOPOLOGY — see identity-mint-contract.md.
  # REGISTRATION IDENTITIES (2026-08-08) — engines D, E, O, W.
  # `groups: []` deliberately: registration needs an identity to MINT AS, not a capability.
  # The governed act (may this caller register THIS verb) is a planned grant, and granting it
  # before the gate exists would be a capability nothing checks — the shape this repo removes.
  - id: svc:engine-d
    display_name: engine-d (service - mesh registration identity)
    groups: []
  - id: svc:engine-e
    display_name: engine-e (service - mesh registration identity)
    groups: []
  - id: svc:engine-o
    display_name: engine-o (service - mesh registration identity)
    groups: []
  - id: svc:engine-w
    display_name: engine-w (service - mesh registration identity)
    groups: []
  - id: svc:engine-a
    display_name: engine-a (service - process credential for ungoverned internal callers)
    groups: []

  # Instance NINE (2026-08-12) — doc-tools, and it is the FIRST identity for a subject that is
  # not deployed by this chart. doc-tools is a separate helm release; the Keycloak client is
  # created here (the realm lives here), and the credential is consumed there.
  #
  # WHY IT NEEDS ITS OWN, rather than reusing one of the eight: doc-tools is not engine-a, not
  # the supervisor, and not the review starter. Reusing any of them would make a doc-tools call
  # authenticate as a service it is not — the `mint_service_token()` defect committed on purpose
  # instead of by accident. IDENTITY GRANULARITY FOLLOWS GOVERNANCE: this is a distinct process
  # with a distinct owner, so it is a distinct subject.
  #
  # NO GRANTS, and the governance test says why. Its one platform-facing call is engine-o
  # `POST /classify_legacy_table` — a READ that changes no routing and no governed state — so
  # per-process identity with zero capability grants is the correct default. If doc-tools ever
  # writes governed state, that is a grant decision made HERE, visible in git blame, not a
  # capability quietly inherited by sharing someone else's credential.
  #
  # ITEM ZERO, NOT A FOLLOW-UP: the call cannot mint as an identity that does not exist, so this
  # stanza precedes the code change rather than trailing it.
  - id: svc:doc-tools
    display_name: doc-tools (service - semantic-linker transport identity)
    groups: []
