# CAPABILITY invoker grants — the git-asserted, auditable overlay that governs WHO
# may INVOKE a transitional `direct_call` capability (the workflow substrate's SIXTH
# namespace, uniform with asset_grants.yaml / ontology_compartments.yaml /
# task_grants.yaml).
#
# WHY THIS NAMESPACE (ADR-0029 Slice 1, RULING Q3). A workflow `direct_call` step is
# a TRANSITIONAL escape hatch: an infrastructural action not (yet) a mesh verb. It
# may escape the verb ONTOLOGY but NEVER the GATE — it is decided by the SAME single
# decider (Topaz `capability` `can_invoke`), deny-by-default, git-asserted +
# auditable (git-blame), the same as every other gate. The schema makes `capability`
# REQUIRED so a permanently-ungated step is inexpressible; THIS file is where the
# capability's invokers are declared. A `direct_call` is a promotion candidate:
# close the hatch by registering the action as a real mesh verb (→ `spo_operation`,
# verified through /find_compatible_verbs) — or keep it here, capability-gated.
#
# SAME model as the five content/task namespaces: `capability_grant_sync.py` flows
# these into Topaz as `capability` `invoker` relations; removing an entry REVOKES
# the ability to invoke (deny-by-default — an ungranted caller fails-and-releases at
# execution, per Situation C, never parks). Disjoint prune scope from the other five
# syncs: this tool owns `capability` `invoker` relations ONLY.
#
# PROVE-THE-NEGATIVE ON THE GRANT PATH. A capability is REFUSED (nothing applied,
# non-zero exit) when MALFORMED — missing `granted_by` (accountable grantor), `reason`,
# or `grant_to`. An unexplained or targetless capability grant is not a grant; a
# broken overlay does not partially apply. An INVOKE is an EFFECT (a mutation, not a
# read) — an unaudited effect-grant is exactly what "an unauditable grant shouldn't
# exist" forbids, so the audit trail here is load-bearing, not ceremonial.
#
# capability KEY = the capability IRI (the Topaz `capability` object_id), e.g.
# "mesh:publishArtifact". `grant_to` = entitlement keys (emails/employee-ids,
# matching seeded `user` objects). `grant_to` is USERS ONLY: a group name there would seed
# a phantom `user:<group>` object that passes readback while granting nothing to the
# group's actual members — a silent wrong-grant. A GROUP is granted through its own list,
# `grant_to_groups: [<group in groups.yaml>]` (2026-10-28), written as `group:<G>#member`
# (the manifest already declares `invoker: user | group#member`); membership lives in
# users.yaml, never here. A row needs `grant_to` OR `grant_to_groups`, at least one non-empty.
#
# THE `can_drop:<content_kind>` CONVENTION (2026-10-28 ruling: pcn and pdn droppable by the
# alert-processors group only; every other kind unchanged). The key is a REGISTERED CONTENT-KIND
# ID, and the door checks the EFFECTIVE kind (the leaf if set, else content_kind). A kind K is
# GATED iff the Topaz object `capability:can_drop:K` EXISTS -- the gated set is not a field on
# the content kind (the SDK registration forbids extra fields). So a row's EXISTENCE is the
# gate: deleting a `can_drop:` row REOPENS the kind to every caller, and
# capability_grant_sync.py (prune=True) deletes the orphan `can_drop:` objects to make that so.
# validate_policy.py refuses a `can_drop:<K>` key whose K is not a known content kind.
#
# THE `can_export:<profile>` CONVENTION. A capability keyed `can_export:<P>` decides who may
# export export profile P, by the profile's `name`. DENY-BY-DEFAULT, unlike `can_drop`: the door
# asks can_invoke on `can_export:<P>` and False refuses, so a profile with NO row is exportable by
# NOBODY; object existence decides nothing, there is no object prune, and deleting a row revokes
# through the invoker-relation prune. One row gates a single export and a batch alike (ruled
# 2026-10-29). The defaults are met by COMPLETENESS, not a generated default (the sync Job's image
# cannot reliably see every profile overlay): validate_policy.py refuses ANY known profile that no
# `can_export:<P>` row decides, of every kind: review-export (policy/exports), answer-export
# (policy/exports/answers) and fin CDRL. Its advice is the groups the rows of the same kind already
# grant; no grantee is held in code (standing rule, 2026-10-30), so the ruled grantees are the ROWS
# below: review-export `[alert-processors]`, fin CDRL `[finance-analysts]`, the program-finance
# persona's group (ruled 2026-10-29). validate_policy also refuses a `can_export:<P>` key naming no
# known profile, and a name in two kinds.
#
# THE `can_call:<tag>` CONVENTION (2026-10-30 ruling: "which tags a persona may call
# (can_call:<tag>), rows on the rail, deny by default"). A capability keyed `can_call:<T>` decides
# which callers arriving through a DOOR client may call the operations tagged T. A door client is a
# token `azp` named in the BFF's CAN_CALL_DOOR_CLIENTS (the MCP server's client is the first); every
# other caller is untouched. A door caller reaches ONLY the operations of the MCP surface (tagged
# with the MCP tag); every other route, `/docs` and an unmatched path included, is 403 for it,
# app-wide (2026-10-31 ruling, M3). The door asks can_invoke on `can_call:<T>` for EVERY tag on the
# route (AND: a tag added to a route can only narrow who calls it) and refuses on the first missing
# one, so a tag with NO row is callable through a door by NOBODY (deny-by-default; no object prune,
# and deleting a row revokes through the invoker-relation prune). Grant a persona through its group
# (`grant_to_groups`). validate_policy.py refuses a `can_call:<T>` key whose T is not a tag of the
# served MCP document (docs/api/mcp.openapi.json, held equal to the BFF by
# scripts/generate_mcp_openapi.py --check).
capabilities:
  # ADR-0029 Slice-1 demo fixture: the promotion workflow's publish emit. alice
  # (DATA_ENGINEER/DATA_STEWARD · DATA_ENGINEERING) is the initiator authorized to
  # invoke the one-way publish after an approved promotion; bob/carol are deliberately
  # NOT — bob's fail-and-release at the direct_call is the deny side of the Slice-1
  # seal, through the same Topaz single-decider as the content gates.
  mesh:publishArtifact:
    granted_by: seed
    reason: >-
      Demo fixture: exercises the capability `can_invoke` gate (ADR-0029 Slice-1
      direct_call, RULING Q3). alice may invoke mesh:publishArtifact — the promotion
      workflow's publish emit — after an approved promotion; the seal shows
      authorized-invokes / unauthorized-fails-and-releases, both live, through the
      same single decider as the four content gates and the task audiences.
    grant_to:
      - alice@example.com

  # The extraction→review sensor's service identity — the FIRST non-human invoker in the
  # entitlement model. Starting a disposition review is INVOKING mesh:startReview (an effect:
  # it composes residue + starts a durable workflow), so it is gated HERE, deny-by-default,
  # like every direct_call — NOT in the task-audience namespace. Audience membership IS
  # recipiency (task_grant materializes a queue row per actor); a `review_initiation` audience
  # would be a key whose defining property is that nothing must ever materialize for it — a
  # false statement in the fifth namespace (the disposition_item cosmetic-attribute death).
  # DISTINCT from who may REVIEW (task_grants.yaml disposition_review:<compartment>): the service
  # INITIATES; humans REVIEW. Instance-one of the service-identity pattern (dispatcher / analyst
  # loop follow the same shape). svc:review-starter is seeded in users.yaml (service species).
  mesh:startReview:
    granted_by: seed
    reason: >-
      svc:review-starter (the extraction→review Dagster sensor's client-credentials identity) may
      invoke mesh:startReview — auto-start a grouped disposition review when a doc-tools extraction
      lands its review.json. The pipeline acts under its OWN entitled, auditable identity, never a
      borrowed human token (the alice-token quick-proof was rejected precisely to avoid corrupting
      requested_by provenance on the inaugural automated run). Who may REVIEW is granted separately.
    grant_to:
      - svc:review-starter

  # Filing a TRIAGE task — routing an input that could NOT be prepared for review to the humans
  # who own the answer about it. An EFFECT (it materializes rows in people's queues), so it is
  # gated here like every other effect, deny-by-default, and separately from mesh:startReview:
  # the ability to START a review and the ability to say "this one could not be started" are
  # different powers, and a caller may hold either without the other.
  #
  # DISTINCT AGAIN from who may ACT on the resulting task (task_grants.yaml
  # disposition_review:<compartment>, enforced at /act): the service FILES, humans ACT — the same
  # split mesh:startReview draws above, for the same reason.
  #
  # DEPLOY NOTE — this grant is load-bearing for VISIBILITY, not only for permission. Ungranted,
  # the sensor's triage POST is denied 403, which it surfaces as a FAILED Dagster run rather than
  # swallowing: refusals degrade to the old (bad) behaviour LOUDLY instead of vanishing behind a
  # green run. That degradation is deliberate — but it means an unseeded grant quietly reverts the
  # routing fix, so seed it in the same window as the sensor.
  mesh:fileTriageTask:
    granted_by: seed
    reason: >-
      svc:review-starter (the extraction→review Dagster sensor's client-credentials identity) may
      invoke mesh:fileTriageTask — file a triage task when a notice is refused for a PER-NOTICE
      CONTENT reason (REVIEW_STATE_UNSOURCED / NO_PARTS_EXTRACTED / NO_AFFECTED_PARTS), so the
      refusal reaches the reviewers who own the answer instead of dying as a red Dagster run in a
      tool they do not open. Three live notices died exactly that way; this grant is the repair.
      Systemic refusals (ruleset/deployment/transport) still FAIL the run for ops and never use
      this capability — routing by who owns the answer is the whole point of the split.

      SECOND CALLER 2026-08-05, recorded because a grant's reason IS its audit trail and an
      unnamed dependent is an undeclared one. The PCN dispatch driver
      (agent_fleet/restate_analyst/dispatch_driver.py) files a triage row under this SAME service
      identity when a per-item dispatch fails TERMINALLY after a human already approved it
      (reason_code DISPATCH_FAILED_AFTER_APPROVAL, audience dispatch_failure:<compartment>). Same
      capability, same identity, one stage later — "approved but the effects never landed" is a
      refusal AFTER the decision rather than before it. Revoking this grant now breaks TWO
      surfaces, and the second one fails silently by design-of-the-old-world: it is the very
      report that makes an invisible failure visible. That is the fact this paragraph exists to
      put in front of whoever next considers pruning it.
    grant_to:
      - svc:review-starter

  # ── DISPATCHING DISPOSITIONS WITHOUT A HUMAN (ADR-0034 first promotion) ──────────────────────
  # The effect half of ONE governed act. Its other half is the `onsemi/pcn/v1 x doc-tools@d5b4482…
  # -> monitored` entry in policy/trust_table.yaml, and the two are ratified together on purpose:
  #
  #   the TRUST TABLE says the pipeline may act on this class of input without a human;
  #   this GRANT says this identity may cause the resulting effect.
  #
  # ONE AUTHORITY, TWO ENFORCEMENT POINTS. Either alone dispatches nothing — a promoted rung with
  # no grant fails exactly as recorded below, and a grant with no promotion never reaches an
  # autonomous run at all. They are separable so that a DEMOTION does not silently leave a standing
  # grant behind (the split-vendor case ADR-0034 names): revoking the rung stops the autonomy while
  # this entry keeps saying, truthfully, who could act if a rung permitted it.
  #
  # THE BEFORE-PICTURE THIS FLIPS, recorded live on the truthful key 2026-08-09
  # (inv_13mYPaB839LW09SeqPAgQ6cwIOouJgNF4D, AutonomousReview/run, completed/failure):
  #
  #   [403] caller 'svc:review-starter' is not authorized (can_invoke) for capability
  #         'mesh:dispatchDispositions' — failing and releasing.
  #
  # Caller named, capability named, state RELEASED not suspended (a denial FAILS; only a designed
  # await suspends). Merging this turns that exact line into an admission, and the discriminating
  # control is that any OTHER caller must still receive it — deny-by-default is not weakened here,
  # one subject is added to it.
  mesh:dispatchDispositions:
    granted_by: seed
    reason: >-
      svc:review-starter (the extraction→review pipeline's client-credentials identity) may invoke
      mesh:dispatchDispositions — cause the disposition effects of a review that completed WITHOUT
      a human, when and only when the trust table admits that class of input autonomously. This is
      the first grant in the system whose exercise is not preceded by a human decision on the
      specific item, which is why it is ratified alongside the rung rather than on its own: the
      accountable act is "these conditions permit autonomy", not "dispatch this notice". Scope is
      bounded by the table, not by this file — an unpromoted or version-drifted format still routes
      to grouped review and this capability is never reached. Revocation is symmetric and stays
      governed: removing this entry re-instates the recorded 403 on the next autonomous run.
      Distinct from who may REVIEW (task_grants.yaml disposition_review:<compartment>) and from
      mesh:startReview, which only begins a review and causes no outward effect.
    grant_to:
      - svc:review-starter

  # ── DOCS PAGE GATE: the verbs a docs page explains ─────────────────────────────────────────
  # A SECOND READER of this namespace. engine-docs' page gate (dark until ENABLE_AGENTIC_AUTH)
  # withholds a page unless the asker holds `can_invoke` on every verb the page explains, so a
  # grant below means BOTH "may invoke" and "may read the page about it". These are the verbs
  # `setup/ontologies/docs_corpus.ttl` names in `mesh:explains`.
  #
  # The grantees are DERIVED from the entitlement model as it stands, not chosen: each verb's
  # owning persona·domain cell (cited per entry), the group that grants that cell
  # (groups.yaml), and that group's members (users.yaml). Today that is alice on all six,
  # bob on the two multi-provider verbs (through the safety cell), and agent-user on one. alice's
  # cost/finance/portfolio memberships are themselves FIXTURE grants (users.yaml says so).
  # A verb with SEVERAL providers (resolveInstance, enumerateInstances) is granted to the members
  # of ANY provider's cell. A provider whose owner persona is not in policy/personas.yaml
  # (engine-o's OPS_OPERATOR, engine-e's AUDITOR and TECH_WRITER) has no cell, so it contributes
  # nobody. The docs census asker (agent@example.com) appears once, on resolveInstance, through
  # data-engineers -> DATA_STEWARD/DATA_ENGINEERING (datahub_wrapper's provider). It holds no other
  # cell below, so after the flip it is withheld the pages explaining those verbs. That is the gate
  # working, not a gap in this file.
  #
  # Sealed by tests/docs/test_every_explained_verb_has_a_derived_invoker.py: every explained verb
  # is granted here, and each grant_to equals the derived membership exactly.
  mesh:seedCanvas:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Owner cell PORTFOLIO_LEAD in PORTFOLIO_PLANNING (gateway's
      seed verb registration), granted by portfolio-leads; alice, erin and chris are its members (erin and chris by
      the group path, rows derived from membership, not chosen). It has a second owner cell,
      PROGRAM_FINANCE_ANALYST in PROGRAM_FINANCE (the gateway's program-finance registration,
      granted by finance-analysts); the grant list below is unchanged.
    grant_to:
      - alice@example.com
      - chris@example.com
      - erin@example.com

  mesh:seedPortfolioCanvas:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Same owner cell as mesh:seedCanvas, which supersedes it
      without removing it (ADR-0050 §4); granted by portfolio-leads; alice, erin and chris are its members (erin and chris by
      the group path, rows derived from membership, not chosen).
    grant_to:
      - alice@example.com
      - chris@example.com
      - erin@example.com

  mesh:finProgramBrief:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Owner cell PROGRAM_FINANCE_ANALYST in PROGRAM_FINANCE
      (policy/graphs/fin_program_brief.yaml), granted by finance-analysts; alice is its member.
    grant_to:
      - alice@example.com
      - chris@example.com
      - erin@example.com

  mesh:costLotCostingReview:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Owner cell COST_ANALYST in PRODUCTION_COST
      (policy/graphs/cost_lot_costing_review.yaml), granted by cost-analysts; alice is its member.
    grant_to:
      - alice@example.com
      - chris@example.com
      - erin@example.com

  mesh:enumerateInstances:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Three providers: PORTFOLIO_LEAD/PORTFOLIO_PLANNING (engine-p),
      PROGRAM_FINANCE_ANALYST/PROGRAM_FINANCE (engine-fin), COST_ANALYST/PRODUCTION_COST
      (engine-cost), SAFETY_ENGINEER/SUSTAINMENT (engine-s). alice holds the first three; bob
      holds the safety cell.
    grant_to:
      - alice@example.com
      - bob@example.com
      - chris@example.com
      - erin@example.com

  mesh:resolveInstance:
    granted_by: seed
    reason: >-
      Docs page gate prerequisite. Providers with a cell: PORTFOLIO_LEAD/PORTFOLIO_PLANNING
      (engine-p), PROGRAM_FINANCE_ANALYST/PROGRAM_FINANCE (engine-fin), COST_ANALYST/PRODUCTION_COST
      (engine-cost), DATA_STEWARD/DATA_ENGINEERING (datahub_wrapper, granted by data-engineers),
      SAFETY_ENGINEER/SUSTAINMENT (engine-s, which bob holds). engine-o's and engine-e's
      providers name personas not in personas.yaml and grant nobody.
    grant_to:
      - agent@example.com
      - alice@example.com
      - bob@example.com
      - chris@example.com
      - erin@example.com

  # The s1000d fault walk (policy/overlays/openddil-lab/verbs/s1000d_fault_walk.yaml). The verb
  # declares a domain and no persona, so its invokers are every MAINTENANCE cell: groups.yaml grants
  # MAINTENANCE to maintenance-mechanics and (2026-10-16) openddil-maintainers.
  mesh:s1000dFaultWalk:
    granted_by: seed
    reason: >-
      The verb declares domain MAINTENANCE and no persona; the only cell granting MAINTENANCE is
      MECHANIC/MAINTENANCE, granted by maintenance-mechanics and, from 2026-10-16, by
      openddil-maintainers, whose members are operator.atlantia (OpenDDIL sub 11111111-...),
      from 2026-10-17 operator.borduria (22222222-...) and, from 2026-10-20, operator.regioneast
      (55555555-...); the members are derived from users.yaml, never chosen. svc:openddil is added by ruling (2026-10-11): step 1 runs on_behalf_of the
      event's dropped_by, which for OpenDDIL events is this delegate; a service gets no cell, so it
      is enumerated in the derived-invokers seal rather than derived.
    grant_to:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
      - 55555555-5555-4555-8555-555555555555
      - alice@example.com
      - chris@example.com
      - erin@example.com
      - svc:openddil

  # origin.write (item B, 2026-10-03) — the single decider gating restate-analyst's
  # origin_record workflow's accept step (POST /internal/origin/write on the BFF). Same shape
  # as mesh:startReview above: the service INITIATES the write under its OWN entitled, auditable
  # identity, never a borrowed human token; the steward's authz_id who approved the case travels
  # separately as on_behalf_of (provenance, never a gate input), recorded on the write rather
  # than consulted for it. svc:case-runner is seeded in users.yaml (service species), kind
  # delegate (values-sandbox.yaml's extraServiceClients, onBehalfOf platform-registrar).
  origin.write:
    granted_by: seed
    reason: >-
      svc:case-runner (restate-analyst's direct_call delegate identity for steps with no human
      user_jwt) may invoke origin.write — write the case's resolved origin once the steward has
      accepted it. The workflow acts under its own entitled identity rather than forwarding the
      steward's token across the human-latency gap the accept step suspends for; the steward's
      authz_id is recorded as on_behalf_of on the write instead.
    grant_to:
      - svc:case-runner

  # can_drop:<content_kind> (2026-10-28 ruling) -- see the convention in the header. These two
  # rows are the shipped default; a deployment configures its own in its policy repository.
  can_drop:pcn:
    granted_by: seed
    reason: >-
      2026-10-28 ruling: drops of the `pcn` kind are restricted to the alert-processors group. This
      row's EXISTENCE gates the kind: deleting the row reopens `pcn` to every caller. A deployment
      configures this in its own policy repository.
    grant_to_groups: [alert-processors]

  can_drop:pdn:
    granted_by: seed
    reason: >-
      2026-10-28 ruling: drops of the `pdn` kind are restricted to the alert-processors group. This
      row's EXISTENCE gates the kind: deleting the row reopens `pdn` to every caller. A deployment
      configures this in its own policy repository.
    grant_to_groups: [alert-processors]

  # ingest:exportBatch (2026-10-28 overnight ruling): GET /ingest/export (the batch) and the
  # export of a notice the caller did not drop. See src/iagent/export_profiles.py.
  ingest:exportBatch:
    granted_by: seed
    reason: >-
      2026-10-28 overnight ruling: batch export of promoted notices over a date range, for the
      alert-processors group. DOMAIN-SCOPED (architect 2026-10-29): the capability admits a notice
      only when its promotion domain is one of the caller's entitlement-cell domains.
    grant_to_groups: [alert-processors]

  # can_export:<profile> (2026-10-29 ruling) -- see the convention in the header. One row per
  # known export profile; validate_policy refuses a profile with none. These rows ARE the ruled
  # grantees: review-export to alert-processors, answer-export (plan-answers) to portfolio-leads,
  # CDRL to the program-finance persona's group.
  can_export:default-csv:
    granted_by: seed
    reason: >-
      2026-10-29 ruling: the review-export profile policy/exports/default-csv.yaml is exportable,
      single or in a batch, by alert-processors (the review-export default). Deny-by-default:
      deleting this row leaves the profile exportable by NOBODY. A deployment configures this in
      its own policy repository.
    grant_to_groups: [alert-processors]

  can_export:default-json:
    granted_by: seed
    reason: >-
      2026-10-29 ruling: the review-export profile policy/exports/default-json.yaml is exportable,
      single or in a batch, by alert-processors (the review-export default). Deny-by-default:
      deleting this row leaves the profile exportable by NOBODY. A deployment configures this in
      its own policy repository.
    grant_to_groups: [alert-processors]

  can_export:plan-answers:
    granted_by: seed
    reason: >-
      2026-10-29 ruling, re-keyed 2026-10-30: the answer-export profile
      policy/exports/answers/plan-answers.yaml (fin's #148) is exportable, single or in a batch, by
      portfolio-leads, the group as it exists (alice, erin, chris). It is the first answer-export
      row, so validate_policy offers its group to the next answer-export profile that has none.
      Deny-by-default: deleting this row leaves the profile exportable by NOBODY. A deployment
      configures this in its own policy repository.
    grant_to_groups: [portfolio-leads]

  can_export:cdrl_a001_ev_summary:
    granted_by: seed
    reason: >-
      2026-10-29 ruling: a fin CDRL profile is exportable, single or in a batch, by the
      program-finance persona's group (finance-analysts) by default. Deny-by-default: deleting
      this row leaves the profile exportable by NOBODY. A deployment configures this in its own
      policy repository.
    grant_to_groups: [finance-analysts]

  can_export:cdrl_a001_ev_summary_json:
    granted_by: seed
    reason: >-
      2026-10-29 ruling: a fin CDRL profile is exportable, single or in a batch, by the
      program-finance persona's group (finance-analysts) by default. This is the json format of
      cdrl_a001_ev_summary (fin's #144). Deny-by-default: deleting this row leaves the profile
      exportable by NOBODY. A deployment configures this in its own policy repository.
    grant_to_groups: [finance-analysts]

  can_export:cdrl_a002_cost_performance_docx:
    granted_by: seed
    reason: >-
      2026-10-29 ruling: a fin CDRL profile is exportable, single or in a batch, by the
      program-finance persona's group (finance-analysts) by default. This is the docx sample
      (A002 / DI-NOTIONAL-0002, fin/cdrl-docx-sample). Deny-by-default: deleting this row leaves
      the profile exportable by NOBODY. A deployment configures this in its own policy repository.
    grant_to_groups: [finance-analysts]

  can_call:ingest-export:
    granted_by: seed
    reason: >-
      2026-10-31 ruling (M2): a door client's caller may call operations tagged ingest-export when
      it is in mcp-callers. The door asks EVERY tag of a route, so this row alone admits nothing;
      the caller's own persona x domain still gates the route beneath. Deny-by-default: deleting
      this row closes every MCP operation tagged ingest-export to door callers. A deployment
      configures this in its own policy repository.
    grant_to_groups: [mcp-callers]

  can_call:ingest-v1:
    granted_by: seed
    reason: >-
      2026-10-31 ruling (M2): a door client's caller may call operations tagged ingest-v1 when it is
      in mcp-callers. The door asks EVERY tag of a route, so this row alone admits nothing; the
      caller's own persona x domain still gates the route beneath. Deny-by-default: deleting this
      row closes every MCP operation tagged ingest-v1 to door callers. A deployment configures this
      in its own policy repository.
    grant_to_groups: [mcp-callers]

  can_call:mcp:
    granted_by: seed
    reason: >-
      2026-10-31 ruling (M2): a door client's caller may call operations tagged mcp when it is in
      mcp-callers. The door asks EVERY tag of a route, so this row alone admits nothing; the
      caller's own persona x domain still gates the route beneath. Deny-by-default: deleting this
      row closes every MCP operation tagged mcp to door callers. A deployment configures this in its
