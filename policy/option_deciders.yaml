# OPTION DECIDERS -- the `can_decide:<workflow_id>.<option>` rail for obsolescence resolution, ADR-0065
# (Accepted 2026-11-07).
#
#   * SOURCE TEXT, verbatim (architect via Chris, 2026-11-06): "Rails for obsolescence_resolution: roles
#     (who may approve LTB / redesign) as groups + capability rows; `can_decide:
#     <option>` rail with ratified_by: owner; contract files get a
#     `classification` field validated against levels.yaml.
#     Validator only until Lane 1's workflow row lands."
#   * STANDING RULE, verbatim: "kinds, workflows, options, levels, ontology slices, mappings and
#     contracts are rows/files a deployment supplies; dag-tools and iagent ship the types and the
#     validators, never a customer's shape."
#   * RULING 1, verbatim (architect via Chris): "Two different acts, two rails: option_deciders.yaml says
#     who may choose an option at a decide step; task_grants' approver audience says who may approve. A
#     workflow row references both by name; neither derives from the other."
#   * ONE ROW PER WORKFLOW AND OPTION, naming the groups whose members may CHOOSE that option at the
#     workflow's decide step. They are groups in groups.yaml with at least one member, and no user is ever
#     named here (membership lives in users.yaml).
#   * Who may APPROVE is a different act on a different rail: the approver `audience` in task_grants.yaml.
#   * A workflow row references both rails by name. Neither is derived from the other, and this validator
#     does not read either from the other.
#   * RULING 2, verbatim: "Key per workflow now, not later: `<workflow_id>.<option>`. A generic option
#     (archive) gets one row per workflow that offers it. Nothing reads the file yet, so there is no cost."
#   * A ROW has `workflow` (a workflow definition's `id`) and `option`, the two parts of
#     `can_decide:<workflow_id>.<option>` (each: no whitespace, no `:`, no `.`), `grant_to_groups`,
#     `granted_by` (`seed` for a shipped row), `reason`, and `ratified_by` (`owner`: a seat, never an
#     identity).
#   * DENY BY DEFAULT. An explicit `grant_to_groups: []` with a reason says nobody may choose that option in
#     that workflow.
#   * NO OPTION AND NO WORKFLOW IS NAMED IN CODE. A deployment adds its rows. The rows below are the
#     SANDBOX's, from the 2026-11-07 dispatch, verbatim: "option_deciders rows for
#     obsolescence_resolution.<option> x5 (groups: a sandbox `obsolescence-deciders`, alice;
#     ratified_by owner)." The five options are ADR-0065 §5's, verbatim: "last-time buy, alternate,
#     aftermarket, redesign and bridge." They are fixture rows, not a claim about who chooses a
#     resolution in production.
#   * A `can_decide:` capability row in capability_grants.yaml is refused: this file is the one home.
#   * RULING 3, verbatim: "Options live on the decide step of the workflow definition
#     (`steps[id=...].options`, the SDK's WorkflowDefinition). The three hard-coded option lists retire when
#     the runner reads the step -- item for 74, after the Socratic bar work."
#   * MEASURED: SDK v0.9.16 through v0.9.20 (the fleet pin) carry `HumanAwaitStep.options`, option ids (no
#     whitespace, no `:`, no `.`, none twice), refused on a grouped await.
#
# No reader applies this file, and its options are not checked for membership, until a workflow
# definition's decide step carries them. validate_policy.py checks it WHEN PRESENT (option_deciders_errors).

option_deciders:
  - workflow: obsolescence_resolution
    option: last_time_buy
    grant_to_groups: [obsolescence-deciders]
    granted_by: seed
    reason: FIXTURE (2026-11-07 dispatch). The sandbox decider may choose a last-time buy at the decide step.
    ratified_by: owner
  - workflow: obsolescence_resolution
    option: alternate
    grant_to_groups: [obsolescence-deciders]
    granted_by: seed
    reason: FIXTURE (2026-11-07 dispatch). The sandbox decider may choose an alternate at the decide step.
    ratified_by: owner
  - workflow: obsolescence_resolution
    option: aftermarket
    grant_to_groups: [obsolescence-deciders]
    granted_by: seed
    reason: FIXTURE (2026-11-07 dispatch). The sandbox decider may choose aftermarket supply at the decide step.
    ratified_by: owner
  - workflow: obsolescence_resolution
    option: redesign
    grant_to_groups: [obsolescence-deciders]
    granted_by: seed
    reason: FIXTURE (2026-11-07 dispatch). The sandbox decider may choose a redesign at the decide step.
    ratified_by: owner
  - workflow: obsolescence_resolution
    option: bridge
    grant_to_groups: [obsolescence-deciders]
    granted_by: seed
    reason: FIXTURE (2026-11-07 dispatch). The sandbox decider may choose a bridge at the decide step.
    ratified_by: owner
