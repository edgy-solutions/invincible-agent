# SAMPLE — OVERLAY layer (ADR-0036). Invented in this repo; a deployment replaces the values.
#
# PROPOSE: walk the manual, render the four options, ask the tier's maintainer to choose one.
#
# THE OPTIONS ARE A TEMPLATE, NOT CODE. Exactly four, in this order, each citing the walk's data
# module codes and the event's spares record. The citations come from the walk; the options come
# from this file ("our file provides the citations, not the options" -- 7f).
#
# A PART CITES ITS FIGURE: `icn` and `hotspot_id` are the illustrated-parts module's, read by the
# walk, so the template cites the walk for them -- never the event (OpenDDIL has the fault, not the
# manual) and never a literal null (a template lying about where a value comes from). They ride
# the chosen option into the ActionRecord's `work_order.parts[]` untouched.
#
# EVERY OPTION CITES THE INPUT REVISION it was made from (`input.revision`; 1 is the event the
# case opened on). A return to proposed re-reads the picture, so two proposals in one case may
# rest on different pictures, and the record says which.
#
# WHO DECIDES: "the reporting maintainer or the tier's maintainer role". The substrate routes to a
# declared AUDIENCE, not to an actor derived from the event, so the row goes to the tier's
# maintainer audience, which the reporting maintainer is in. Per-instance routing to the reporter
# is the same platform item as the safety redraft's author.
id: maint_fault_propose
name: "Maintenance fault -- propose a disposition"

classification: null

participants:
  - role: initiator
  - role: maintainer

domain_stages: [proposed, awaiting_approval]

steps:
  # STUBBED until 7f Phase 2(e): see verbs/s1000d_fault_walk.yaml.
  - kind: spo_operation
    id: walk
    subject: "s1000d:fault_isolation"
    verb: s1000d_fault_walk

  - kind: render
    id: options
    template:
      - verb: replace_now
        label: "Replace now"
        readiness: FMC
        takes_offline: true
        task: "Remove and replace {trigger.fault.item} from local stock"
        task_refs:
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.fault_isolation.dmc}"}
          # The walk's `remove_install.dmc` is a LIST: this manual has separate remove and
          # install procedure modules. It is ordered by LABEL (`ORDER BY ?dmc`), not by the
          # manual's sequence; here 520A (remove) sorts before 720A (install). A walk that
          # finds fewer than two refuses `.1` rather than citing a blank.
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.remove_install.dmc.0}"}
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.remove_install.dmc.1}"}
        parts:
          - item: "{trigger.fault.item}"
            part_ref: "{outputs.maint_fault_propose.walk.citations.ipd.part_number}"
            quantity: "{outputs.maint_fault_propose.walk.citations.ipd.quantity}"
            icn: "{outputs.maint_fault_propose.walk.citations.ipd.icn}"
            hotspot_id: "{outputs.maint_fault_propose.walk.citations.ipd.hotspot_id}"
            source_site: here
        spares: "{trigger.picture.spares}"
        input_revision: "{input.revision}"
        # THE ONE OPTION WHOSE SECOND APPROVAL TURNS ON MISSION-ESSENTIAL cites the fact and its
        # basis {rule, observed_at}, so the card shows why a supervisor is or is not asked.
        battle_condition: "{trigger.picture.battle_condition}"
      - verb: replace_after_resupply
        label: "Replace after resupply"
        readiness: PMC
        takes_offline: false
        task: "Order {trigger.fault.item} and replace on receipt"
        task_refs:
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.fault_isolation.dmc}"}
          # REMOVE then INSTALL: see the matching comment on `replace_now` above.
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.remove_install.dmc.0}"}
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.remove_install.dmc.1}"}
        parts:
          - item: "{trigger.fault.item}"
            part_ref: "{outputs.maint_fault_propose.walk.citations.ipd.part_number}"
            quantity: "{outputs.maint_fault_propose.walk.citations.ipd.quantity}"
            icn: "{outputs.maint_fault_propose.walk.citations.ipd.icn}"
            hotspot_id: "{outputs.maint_fault_propose.walk.citations.ipd.hotspot_id}"
            # PER PART, as the bridge contract's `work_order.parts[]` carries them (ruled
            # 2026-10-03: this option is where they are first populated). Copied from the row
            # below with the null-safe step `?.`: NULL, all three, when no site has stock.
            source_site: "{trigger.picture.nearest_spare?.site}"
            lead_time_days: "{trigger.picture.nearest_spare?.lead_time_days}"
            lead_time_source: "{trigger.picture.nearest_spare?.lead_time_source}"
        spares: "{trigger.picture.spares}"
        input_revision: "{input.revision}"
        # THE ROW THE RESUPPLY READS, WHOLE: its site, stock, lead_time_days and lead_time_source
        # (stand-in | supply-system) travel together, so the lead time is never shown without the
        # source that says how far to trust it. NULL when no site has stock -- the card renders
        # "no site has stock", no lead time. The parts above copy three of its fields; the card
        # reads this row.
        nearest_spare: "{trigger.picture.nearest_spare}"
      - verb: defer_with_restriction
        label: "Defer with restriction"
        readiness: PMC
        takes_offline: false
        task: "Operate {trigger.asset_id} under restriction until the planning interval"
        task_refs:
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.planning_interval.dmc}"}
        interval: "{outputs.maint_fault_propose.walk.citations.planning_interval.interval}"
        parts: []
        spares: "{trigger.picture.spares}"
        input_revision: "{input.revision}"
      - verb: evacuate_for_depot
        label: "Evacuate for depot"
        readiness: NMC
        takes_offline: true
        task: "Evacuate {trigger.asset_id} to depot for {trigger.fault.item}"
        task_refs:
          - {graph_uri: null, data_module_code: "{outputs.maint_fault_propose.walk.citations.fault_isolation.dmc}"}
        parts: []
        spares: "{trigger.picture.spares}"
        input_revision: "{input.revision}"

  - kind: human_await
    id: decide
    audience: "maint_fault_approval:{trigger.owning_tier}"
    task_kind: maint_fault_approval
    subject_ref: "{asset_id}"
    title: "Fault {trigger.fault.fault_code} on {asset_id}: choose a disposition"
    summary: >-
      Four options, each citing the manual and the spares record. Choosing one approves it;
      reject sends it back for a new proposal, defer parks it until a revisit time. Both need a
      reason. An unanswered proposal escalates; it is never approved by silence.
    role: maintainer
    chooses_from: outputs.maint_fault_propose.options
    approves: [replace_now, replace_after_resupply, defer_with_restriction, evacuate_for_depot]
    # SAMPLE: four hours.
    deadline_seconds: 14400

observable_state:
  visible: [domain_stages, decide.status]
  internal: []
