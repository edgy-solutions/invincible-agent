# SAMPLE — OVERLAY layer (ADR-0036). Invented in this repo; a deployment replaces the values.
#
# A MAINTENANCE EVENT FROM THE OPENDDIL BRIDGE OPENS A CASE. The event is the bridge contract's
# MaintenanceEvent, flattened; nothing in Python names a field of it.
trigger: maintenance_fault

selection: maintenance_fault_selection

# THE DEDUPE ON event_id IS THE KEY: a re-delivered event reaches the case it already opened.
key: event_id

# THE DEDUPE ON FAULT + ASSET IS THE EPISODE: a second event for the same fault on the same asset
# attaches to the open case instead of opening a second proposal for one broken part.
episode: [asset_id, fault.item, fault.fault_code]

# EVERY FACT A LATER TABLE OR TEMPLATE READS, refused at intake rather than after a maintainer
# has already chosen an option.
#
# MISSION-ESSENTIAL IS A BOOLEAN INSIDE `picture.battle_condition`, with the rule and the time it
# was decided under `basis` (OpenDDIL's answer, 2026-10-02). The supervisor rule reads it ("takes a
# mission-essential asset offline"), and the option cites its basis. An absent fact is not a
# wildcard and is never defaulted: a default of `false` would skip the supervisor for exactly the
# assets the rule exists to protect. So an event without it, or without the basis that justifies
# it, is refused at intake, naming the field.
requires:
  - kind
  - asset_id
  - owning_tier
  - fault.item
  - fault.fault_code
  - picture.battle_condition.mission_essential
  - picture.battle_condition.basis.rule
  - picture.battle_condition.basis.observed_at
  - label.originator_nation

# THE SPARES PICTURE IS CARRIED, NOT REQUIRED (ca's ruling, 2026-10-02). `picture.spares` is the
# full list of site rows; `picture.nearest_spare` is the one row the resupply option reads, the
# same shape {site, on_hand, as_of, lead_time_days, lead_time_source}, and NULL WHEN NO SITE HAS
# STOCK. That null is the business state "nothing to resupply from", so `requires` -- which
# refuses a null -- would refuse exactly the events this case exists to let through. Only an
# absent key is refused. The week-1 singular `picture.spare` is retired and no longer read.
carries:
  - picture.spares
  - picture.nearest_spare

# THE PICTURE IS RE-READ WHEN A CASE RETURNS TO PROPOSED. Each newer picture is the next SDK
# `ArtifactRevision` on the event's chain (rev 1 is the event this case opened on), appended on
# the episode after the head; the case reads the head. Today the chain grows by PUSH only: the
# bridge sends the same event_id again. A PULL is declared as the SDK's `RefreshSpec` --
# `refresh: {url_template: ".../{event_id}", method: GET, auth: seeding-delegate}` -- and the
# runner refuses one until it holds the seeding delegate's credential, so none is declared here.
# (The `pull: maintenance_picture_read` stub it replaces returned the kept push and added nothing.)
