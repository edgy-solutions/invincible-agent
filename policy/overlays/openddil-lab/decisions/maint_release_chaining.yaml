# SAMPLE — OVERLAY layer (ADR-0036). Invented in this repo; a deployment replaces the values.
#
# CLOSED ON THE OWNING TIER'S ACK. A refusal is never read as a release.
#
# RULED 2026-10-02: a tier's refusal returns the case to PROPOSED, with the refusal's reason on the
# hop (the signal requires one); a SECOND refusal in the same case parks it -- DEFERRED, with the
# park's revisit timer -- rather than putting the same choice to the same maintainer a third time.
# "Second" is the runner's measured `outcome_repeated` (this definition has ended `tier_refused`
# before in this case), so the second refusal and every later one park.
decision: maint_release_chaining

after: maint_release

matches: [outcome, outcome_repeated]

# `outcome`: the `accepts` of the release definition's `tier_ack` signal.
domain:
  outcome: [released, tier_refused]
  outcome_repeated: [true, false]

terminals: [closed]

rows:
  - when: {outcome: released}
    then: closed
  - when: {outcome: tier_refused, outcome_repeated: false}
    then: maint_fault_propose
  - when: {outcome: tier_refused, outcome_repeated: true}
    then: maint_fault_park
