# SAMPLE — OVERLAY layer (ADR-0036). Invented in this repo; a deployment replaces the values.
#
# CLOSED ON THE RELEASE. The supervisor's approval is the release (ruled 2026-10-28): the release
# definition's emit disposes `released`, and there is no acknowledgement to refuse. A refusal
# therefore no longer exists, so this table has one row and no return to PROPOSED or park.
decision: maint_release_chaining

after: maint_release

matches: [outcome]

# `outcome`: the disposition the release definition's `action` emit declares (`disposes`).
domain:
  outcome: [released]

terminals: [closed]

rows:
  - when: {outcome: released}
    then: closed
