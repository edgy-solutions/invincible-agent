# OVERLAY layer (ADR-0036). The deployment overlay is the authoritative registry for a content
# kind's domain (architect ruling 2026-10-06) -- `passes`/`outputs` here MIRROR doc-tools'
# generated `registry/content_kinds/pdn.yaml`; doc-tools gains a drift test against these rows,
# so the two are not independent sources of truth, just two places the same facts are read from.
kind: pdn
domain: sustainment
passes:
  - sustainment.baml::ExtractHeader
  - sustainment.baml::ExtractParts
outputs:
  - pcn:ProductDiscontinuationNotice
  - pcn:Component
