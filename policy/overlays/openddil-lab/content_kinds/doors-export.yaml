# OVERLAY layer (ADR-0036). Who owns which field (architect ruling 2026-10-24, amending 10-07):
# the platform owns what a kind IS -- kind, domain, arrives_as, review_shape, label -- and this
# overlay is their authority. doc-tools owns what a kind RUNS: `passes` here MIRRORS doc-tools'
# generated `registry/content_kinds/doors-export.yaml`, never the reverse, and the platform never
# executes them. When the two disagree on passes, this row is the one that is wrong; `outputs`
# mirrors the same row. A FORMAT-LEVEL kind: `domain` is null ON PURPOSE (architect ruling
# 2026-10-02, "origin resolved by evidence, not kind"). It is written explicitly, because an
# omitted key is a defect and an explicit null is the ruling (doc-tools #86's domainless split).
kind: doors-export
domain: null
passes:
  - identity.identity_from_doors_text
  - doors.requirements_rows
outputs:
  - mesh:DoorsExportArtifact
