# SAMPLE — OVERLAY layer (ADR-0036). Invented in this repo; a deployment replaces the values.
#
# THE OPENDDIL BRIDGE'S EVENT KIND (SDK 0.9.7 `branch: event`). A MaintenanceEvent arrival
# starts the `maintenance_fault` case (`policy/overlays/openddil-lab/triggers/`) rather than
# being extracted — nothing here runs a pass or stamps an OntologyClass, see that branch's own
# shape rule in `iagent_mesh.ingest.ContentKindRegistration`. `identity_field: event_id` is the
# SAME field the trigger dedupes arrivals on (`triggers/maintenance_fault.yaml`'s `key`).
kind: maintenance-fault-event
branch: event
# `domain` is the case's visibility label (case_projection.can_view_case: a caller sees the case
# with a cell for EVERY label). It must be a domain in `policy/domains.yaml`, or no human can hold
# the cell: `maintenance-bridge` was not one, so every case this kind seeded was visible to nobody
# (da479c74, 2026-10-25). MAINTENANCE from 2026-10-27, architect directive item 1.
domain: MAINTENANCE
seeds_workflow: maintenance_fault
identity_field: event_id
