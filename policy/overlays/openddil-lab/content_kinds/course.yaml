# OVERLAY layer (ADR-0036). The deployment overlay is the authoritative registry for a content
# kind's domain (architect ruling 2026-10-06) -- `passes`/`outputs` here MIRROR doc-tools'
# generated `registry/content_kinds/course.yaml` (doc-tools lane tr, ADR-0059); doc-tools' drift
# test reads these rows, so the two are not independent sources of truth.
# Architect ruling 2026-10-23: "a kind names the document, not the domain" -- a course deck in the
# training domain, the way a PCN is a notice in sustainment. `training:Course` is declared in
# setup/ontologies/training_extension.ttl.
kind: course
domain: training
arrives_as: [pptx, pdf, docx]
label: Training course
# review_shape names the card that renders this kind's reviews (ruled 2026-10-30; platform-owned).
# The row names the card (`document`: a section list left, the page right); the review's item_kind
# (`section`) comes from that shape's row in policy/review_shapes/, not from here.
review_shape: document
passes:
  - structural.outline
  - core.baml::ExtractOutline
  - training.baml::ExtractSectionConcepts
  - concepts.normalise
  - render.pages
outputs:
  - training:Course
