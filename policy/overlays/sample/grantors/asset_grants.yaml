# SAMPLE -- the sandbox's grantor overlay (ADR-0036), read by cortex-bff through
# GRANTOR_OVERLAY_DIRS in helm/invincible-agent/values-sandbox.yaml only. A deployment
# replaces it with its own approvers; the seed row (policy/grantors/asset_grants.yaml) stays
# deployment-neutral.
#
# Architect, 2026-10-27 (ruling 5 on the policy-refusal rule): "the sandbox overlay names the
# sandbox's actual approver (alice)". alice is that approver for THIS family: she is the only
# grantee of the `access_grant:DATA_ENGINEERING` audience (policy/task_grants.yaml), and
# approving that task writes the asset_grants.yaml reader row with granted_by = the approver,
# then runs grant_sync (src/iagent/human_tasks.py `write_grant_and_sync`). No other domain has
# an access_grant audience, so `how` names the git path for those.
#
# A full replacement, not a merge: family, rail_file and object_scoped are the seed's. An
# overlay that dropped object_scoped would name an asset in a refusal and break the existence
# rule; tests/security/test_the_sandbox_names_its_grantor.py holds them equal.
family: asset_grants
rail_file: policy/asset_grants.yaml
object_scoped: true
who: alice@example.com (DATA_STEWARD, DATA_ENGINEERING), this sandbox's approver of per-asset read access
how: >-
  request access in the app (POST /access_requests); for a DATA_ENGINEERING asset alice approves
  the access_grant:DATA_ENGINEERING task, which writes the reader row (granted_by alice) and runs
  grant_sync. An asset in another domain has no approver task: a reviewed change adding a grant
  row to policy/asset_grants.yaml, applied by topaz_sync
