# A SAMPLE fiscal calendar for engine-fin. It is a sample, not a default: the engine holds no
# calendar, and nothing in engine code names this one.
#
# The US federal fiscal year is the sample's own choice (October to September); it matches the
# planning engine's FY26 quarters. Before this file, no FY26 period in the repo carried a date.
#
# A deployment declares its own calendar in its own overlay (FIN_CALENDAR_OVERLAY_DIRS;
# docs/contracts/finance-overlays.md, the fin_calendar section).
calendar_id: us_federal_fy26
periods:
