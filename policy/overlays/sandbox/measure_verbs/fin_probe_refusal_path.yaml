# SANDBOX ONLY -- a refusal probe, not a sample and not a measure. It names one of dag-tools'
# planted-refusal assets (dag-tools 0.13.0, group mesh_demo_refusal), whose rows are built to be
# REFUSED, so the live leg (tests/sandbox_e2e/test_the_refusal_fixture_refuses_live.py) can show
# each rule the dataset-row readers enforce, refused on the live path. Only values-sandbox.yaml
# names this directory. The outcome of every planted case through this row is derived from the
# reader and sealed in tests/finance/test_the_refusal_probes_refuse_as_derived.py.
measure_id: fin_probe_refusal_path
verb: finProbeRefusalPath
name: "Refusal probe: per-path flow over the row-level fixture"
description: >-
  The EAC-variance flow row's reader (an amount counted once per terminal path) over dag-tools' row-level refusal fixture, the only reader that enforces varies_within_path.
anti_synonyms:
  - cumulative earned value
  - s-curve
  - estimate at completion
  - eac variance
  - actual cost
inputs:
  params: {program_id: {required: true}}
  dataset:
    urn: "urn:li:dataset:(urn:li:dataPlatform:s3,ev_refusal_fixture,PROD)"
    banner: "SYNTHETIC rows planted to be refused, not a real program."
    levels: [program_id, control_account, work_package]
    value: {minus: [eac, bac]}
    per_path: once
  other_threshold: "0.05"
computation:
  module: agent_fleet.finance_agent.measure_modules.variance_decomposition
  function: flow_edges
  version: "1.3.0"
  derived_from:
    authority: Test fixture, no external method
    clause: A signed sum split down a hierarchy
    citation: name-only
    transcription: each edge is the signed sum beneath its child
render:
  shape: FLOW_DECOMPOSITION
  value_label: Refusal probe
  unit: USD
policy:
  status: sample
  cells: [PROGRAM_FINANCE]
  granted_by: seed
  reason: a sandbox probe reaching varies_within_path, which only a per-path flow row enforces
