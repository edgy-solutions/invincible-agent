# HumanTask AUDIENCES — the git-asserted, auditable overlay that governs WHO may
# ACT on (approve/reject) a class of human-in-the-loop tasks (the HITL substrate's
# FIFTH namespace, uniform with asset_grants.yaml / ontology_compartments.yaml).
#
# SAME model as the other four content namespaces: deny-by-default, Topaz-decided
# (the task_audience `can_act` permission), git-asserted + auditable (git-blame),
# and OVERLAY-CONFIGURABLE per deployment. `task_grant_sync.py` flows these into
# Topaz as `task_audience` `actor` relations; removing an entry REVOKES it.
#
# WHY a fifth namespace and not an ad-hoc role check: "who may approve a promotion
# in compartment X" is exactly the kind of access decision that wants the SAME
# single-decider (Topaz), deny-by-default, git-blame audit trail as every other
# gate. A local role check would be a PARALLEL decider that can drift — the exact
# two-authz-truths bug the enforcement arc rejected. The HumanTask queue is the
# sealed enforcement model instantiated on a new resource kind (tasks).
#
# EXISTENCE-OF-A-TASK IS SENSITIVE (existence-oracle, like ontology-class
# existence): a task "approve promotion of AnswerArtifact X" reveals X exists and
# is pending. `can_act`/`can_view` are deny-by-default so an unauthorized caller
# neither sees nor can act on a task whose very existence is need-to-know. The task
# PAYLOAD is clearance-bounded (reference + clearance-safe summary, never
# compartmented content) so the queue itself cannot leak.

# An AUDIENCE groups tasks whose approval authority is the same, and names who may
# act. `grant_to` are entitlement keys (emails/employee-ids, matching seeded `user`
# objects) — USERS ONLY. Group names are NOT resolved here (the sync writes user
# subjects unconditionally; a group name would seed a phantom `user:<group>` that
# passes readback while routing the approval task to NOBODY — the sharpest silent-
# wrong-grant, since a workflow then suspends awaiting an approver who cannot exist).
# `validate_policy` REFUSES a grant_to not in users.yaml. Group-based audiences are a
# DEFERRED design decision (they split "who may act" across git + drifting group
# membership — a real weakening of the git-blame audit story that needs its own
# ruling; plus `actor: user | group#member` in the manifest + sync support). Every
# audience REQUIRES an accountable `granted_by` + `reason` (prove-the-negative on the
# grant path — the sync REFUSES an unexplained entry, same as the other grant files).
#
# Audience KEY convention: "<task_kind>:<compartment>" — e.g. a promotion approval
# in the DATA_ENGINEERING domain is audience "promotion:DATA_ENGINEERING". A
# workflow's UserTask declares which audience its approval belongs to; registration
# resolves the audience's actors from Topaz and materializes one queue row per
# authorized actor (so the Electric replication filter and the Topaz can_act gate
# derive from the SAME decision — two layers, one truth).
audiences:
  # Demo fixture (Case 2, ADR-0024 Part B): approve promotion of an AnswerArtifact
  # in the DATA_ENGINEERING domain before the one-way publish emit. alice is a
  # granted approver; bob/carol are deliberately NOT — their inability to see or
  # act on the task is the deny side of the seal (existence-oracle: they don't even
  # receive the task in their subscription), the same honest-denial-as-demo-asset
  # posture as the content gates.
  promotion:DATA_ENGINEERING:
    granted_by: cnogradi
    reason: >-
      Demo fixture: exercises the HITL queue's fifth-namespace can_act gate. alice
      (DATA_ENGINEER/DATA_STEWARD · DATA_ENGINEERING) may approve promotions in this
      domain; the seal shows authorized-sees-and-acts / unauthorized-neither, both
      live, through the same Topaz single-decider as the four content gates.
    grant_to:
      - alice@example.com

  # Case-1 (access-grants): who may APPROVE per-asset read-access requests in the
  # DATA_ENGINEERING domain. alice (a DATA_STEWARD for DATA_ENGINEERING) is the
  # approver; approving writes an asset_grants.yaml reader grant (granted_by=alice)
  # through the sealed grant_sync. Same fifth-namespace can_act gate as promotions.
  access_grant:DATA_ENGINEERING:
    granted_by: cnogradi
    reason: >-
      Demo fixture: alice (DATA_STEWARD - DATA_ENGINEERING) approves per-asset read
      access requests for DATA_ENGINEERING assets. Approving automates the manual
      alice->reader->customers_gold rehearsal into a self-service HITL flow.
    grant_to:
      - alice@example.com

  # The disposition-REVIEW audience for the SUSTAINMENT compartment. The
  # extraction→review sensor (svc:review-starter, capability can_invoke
  # mesh:startReview) STARTS the grouped review; the actors here are the
  # humans who see + approve it. This is the trap the work-runbook §B calls out: it
  # is NOT gated by ENABLE_DISPOSITION_AUTHZ (that gates only the initiator capability)
  # — it is deny-by-default ROUTING. Without it register_task materializes zero rows
  # → NoEntitledRecipients → 422 → the review never reaches a human. Drift-closure:
  # this relation was live in sandbox Topaz from M1 but was never committed; the next
  # task_grant_sync prune would have deleted it. Now git-asserted so the manifest
  # reproduces the working demo AND travels to work (rebind to the employee-id there).
  #
  # RENAMED M3.1 (was `pcn_disposition:SUSTAINMENT`) — the audience key is authz
  # vocabulary and carries no domain name per [[generic-at-birth]]; M3's definitions
  # declare `audience: disposition_review:<compartment>` (design blocker 3). This is a
  # KEY rename, so it needs its Topaz reseed: task_grant_sync writes the new
  # `task_audience:disposition_review:SUSTAINMENT` relation and prunes the old
  # `pcn_disposition:*` one. Between the git edit and that sync the review routes to
  # NOBODY — run the sync in the same window, then re-drive one notice.
  #
  # DELIBERATELY NOT RENAMED: the TASK KIND string `pcn_disposition` (dispatch_plan.py,
  # dispatch_driver.py) is a cross-repo contract with cortex-ui's taskKindRegistry.
  # It rides M3.3's `rendersAs` migration, which retires that registry wholesale. Two
  # identical-looking strings, one authz key and one render contract — the inconsistency
  # below is a decision, not an oversight.
  disposition_review:SUSTAINMENT:
    granted_by: cnogradi
    reason: >-
      The disposition-review audience for the SUSTAINMENT compartment. The
      extraction→review sensor auto-starts the grouped review; these actors are the
      humans who see + approve it in their queue. Sandbox reviewer = alice; bind to
      the reviewer's real employee-id at work. Who may INITIATE is granted separately
      (svc:review-starter, capability_grants.yaml) — the service initiates, humans review.
    grant_to:
      - alice@example.com

  # PCN/PDN sustainment — the dispatch-actor audience. On approval the grouped review
  # fans out one qualification task per part (alice's approve → bob's queue in the M1
  # witness); these actors act them. Same not-gated-by-the-env, deny-by-default routing
  # as the reviewer audience above; same drift-closure (live-only from M1 until now).
  qualification:
    granted_by: cnogradi
    reason: >-
      The dispatch-actor audience. On approval the review fans out a qualification task
      per affected part; these actors act it. Sandbox = bob; bind to the qualifier's
      real employee-id at work.
    grant_to:
      - bob@example.com
