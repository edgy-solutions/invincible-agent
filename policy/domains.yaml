# Canonical domain vocabulary — sourced from ADR-0009's domain enum.
#
# Same discipline as personas.yaml: adding a domain requires updating
# ADR-0009 first (which is the code-side source of truth for what
# domains the router recognizes) and this file mirrors it into topaz.
domains:
  # The domain Engine P's verbs are registered under, and the domain its
  # five OntologyClass subjects carry. /resolve domain-scopes the class pool to
  # the caller's cells, so a planning question only grounds+routes to Engine P
  # from a PORTFOLIO_PLANNING cell. Added 2026-08-22.
  - PORTFOLIO_PLANNING
  - AVIATION
  - DEFENSE
  - ENTERPRISE
  - DATA_ENGINEERING
  - MAINTENANCE
  # MANUFACTURING (2026-09-18). ALREADY IN USE BEFORE IT WAS DECLARED: neo4j_expert registers
  # three verbs with `domains=["MAINTENANCE", "MANUFACTURING"]`, and `mfg_extension.ttl` seeds
  # its classes under it — while this vocabulary did not contain it, so no group could grant it
  # and no cell could hold it. A registration naming a domain policy does not know is the
  # "registration is not entitlement" shape with the cell not merely absent but IMPOSSIBLE.
  # Granted beside MAINTENANCE in maintenance-mechanics, because the verbs that name it name
  # both and a caller holding one and not the other reaches half of a verb's declared scope.
  - MANUFACTURING
  # The domain Engine F's eight registrations live in, and the domain its fourteen
  # fin: OntologyClasses carry (setup/prime_databases.py's ONTOLOGIES entry). Same
  # consequence as PORTFOLIO_PLANNING above: /resolve domain-scopes the class pool to the
  # caller's cells, so a finance question only grounds+routes to Engine F from a
  # PROGRAM_FINANCE cell. Added 2026-08-31.
  #
  # A DOMAIN IN NO GROUP GRANTS NOBODY ANYTHING — scoping is per CELL. This line alone
  # changed nothing observable; the grant is the finance-analysts group in groups.yaml.
  - PROGRAM_FINANCE
  # The domain engine-cost's six registrations live in, and the domain its eleven cost:
  # OntologyClasses carry (setup/prime_databases.py's manifest entry). Same consequence as
  # the two above: /resolve domain-scopes the class pool to the caller's cells, so a cost
  # question only grounds+routes to engine-cost from a PRODUCTION_COST cell.
  # Added 2026-09-02.
  #
  # DELIBERATELY NOT PROGRAM_FINANCE. The two are different questions about the same effort
  # -- finance measures the authorization as earned value, this measures the manufacturing
  # run as recurring unit cost -- and they carry different entitlements. Filing cost classes
  # under the finance domain would have granted them to everyone holding the finance cell,
  # which is an entitlement decision made by a manifest field rather than by anyone.
  #
  # A DOMAIN IN NO GROUP GRANTS NOBODY ANYTHING -- scoping is per CELL. This line alone
  # changes nothing observable; the grant is the cost-analysts group in groups.yaml.
  - PRODUCTION_COST

  # The domain Engine S (ADR-0051) registers its safety verbs under, and the domain the
  # safety: OntologyClasses carry. Added 2026-09-14, and FIRST of the four edits that arc --
  # domain, persona, grant, cell -- because the sync validates both halves of a cell against
  # these vocabularies and refuses the whole overlay on an unknown component. A cell written
  # before its domain does not partially apply; it fails the file.
  #
  # DELIBERATELY THE EXISTING SUSTAINMENT PLANE, NOT A NEW SAFETY DOMAIN. ADR-0051 §9 defers a
  # separate SAFETY compartment rather than refusing it (RULED 2026-09-10, see rulings#r-004 (d)):
  # safety data is more restricted than sustainment data in some programmes and identical in
  # others, and splitting on a guess costs a re-prime and a grants migration. The eight safety
  # task audiences already spell `:SUSTAINMENT`, so a domain of another name here would put the
  # QUESTION-ASKING side and the DISPOSING side in two different compartments -- an engineer who
  # could open the hazard list but not the task about it, or the reverse.
  #
  # A DOMAIN IN NO GROUP GRANTS NOBODY ANYTHING -- scoping is per CELL. This line alone changes
  # nothing observable; the grant is the safety-engineers group in groups.yaml.
  - SUSTAINMENT

# ── THE HEADER'S "UPDATE ADR-0009 FIRST" IS STALE, AND IT IS RECORDED HERE BECAUSE IT IS A
#    PRECONDITION THAT CANNOT BE SATISFIED. Added 2026-09-14 while adding SUSTAINMENT.
#
# `personas.yaml` already carries this correction TWICE -- against PROGRAM_FINANCE_ANALYST and
# again against COST_ANALYST -- and this file, which states the same instruction in the same
# words, never received it. ADR-0009 is the ADR that SUNSET domain and persona as classification
# axes: it describes the legacy enum rather than maintaining a live one, and there is no domain
# enum in it to update. The catalog rego walks the directory instead of enumerating a hardcoded
# list, so adding a domain here needs no code-side change.
#
# WHY IT IS WRITTEN DOWN RATHER THAN JUST IGNORED. An instruction that cannot be followed is
# either skipped -- leaving the next reader unable to tell whether it was CONSIDERED or missed --
# or chased until it is abandoned. Both cost the same the second time. And a correction recorded
# against one file's copy of a shared instruction does not correct the other copy: the stale half
# reads as current precisely because its sibling was fixed and this one was not.

# ── PLATFORM DOMAINS ─────────────────────────────────────────────────────────────────────────
#
# Held by EVERY group, by declaration. `policy/sync/topaz_sync.py` expands these across every
# group's personas; they are never written as a per-group grant, because a universal grant copied
# into each group is a population maintained by remembering to — and the group that gets missed
# is the one whose users report that the corpus does not answer them.
#
# RULED 2026-09-18, after "how do I add an engine?" ground to `idp#Column` at 0.30 with
# `excluded: []`. `mesh:DocPage` was not ranked low — it was never a candidate, for anyone,
# because /resolve scopes the OntologyClass pool to the caller's cells and no cell could carry
# DOCS or MESH.
#
# WHY A UNIVERSAL GRANT AND NOT CLASS-LEVEL AGNOSTIC. The obvious answer is to mark the class
# `domains: []` the way `docs_agent` marks its verb. It is not implementable today: OntologyClass
# carries no empty-domain rows and the scoping query cannot filter on one. A universal grant that
# is WRITTEN DOWN is honest in a way an omitted argument never is — the same reason the verb
# declares `domains=[]` explicitly instead of leaving the argument off.
#
# WHAT THEY ARE. Knowledge ABOUT the platform: the runbooks, ADRs and how-do-I prose of the DOCS
# corpus, and the MESH classes the fleet's own vocabulary is written in. Every entitled user reads
# them; a runbook only DOCS-entitled personas can ask about is a runbook nobody asks about.
# WHO a page is FOR is `audience_hint`, which is a hint, not an entitlement cell.
platform_domains:
  - DOCS
  - MESH
