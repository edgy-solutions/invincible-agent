# Canonical persona vocabulary — sourced from ADR-0009's persona enum.
#
# Each persona named here becomes a topaz object of type `persona`
# via the sync tool. Groups grant entitlement to (persona, domain)
# CELLS whose components must exist in this vocabulary — the sync
# tool refuses to apply a group grant referencing a persona not
# listed here, giving a topaz-side positive control against typos
# in groups.yaml.
#
# Adding a persona: append to this list AND to the corresponding
# enum in ADR-0009 (they must stay in sync — the code-side
# consumer of the persona claim is the source of truth for what
# personas the router recognizes; this file mirrors it into topaz).
personas:
  # Engine P registers its twelve planning verbs with
  # owner_persona=PORTFOLIO_LEAD (agent_fleet/planning_agent/main.py).
  # Added 2026-08-22 for the portfolio-review demo.
  - PORTFOLIO_LEAD
  - DATA_STEWARD
  - DATA_ENGINEER
  - ARCHITECT
  - MECHANIC
  - ANALYST
  # Engine F registers its six finance verbs, plus its resolveInstance and
  # enumerateInstances providers, with owner_persona=PROGRAM_FINANCE_ANALYST
  # (agent_fleet/finance_agent/main.py OWNER_PERSONA). Added 2026-08-31.
  #
  # ASSERTABLE FROM THIS FILE ALONE. The header above says to update ADR-0009's persona
  # enum in the same edit; that instruction predates chart 0.3.12. The catalog rego now
  # walks the directory (domain.can_view) instead of enumerating a hardcoded persona
  # list — validate_policy.py's own header records this — so adding a persona here needs
  # no code-side change. ADR-0009 is the ADR that SUNSET persona as a classification
  # axis; it describes the legacy 6-way enum rather than maintaining a live one.
  - PROGRAM_FINANCE_ANALYST
