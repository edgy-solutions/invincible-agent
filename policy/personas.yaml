# Canonical persona vocabulary — sourced from ADR-0009's persona enum.
#
# Each persona named here becomes a topaz object of type `persona`
# via the sync tool. Groups grant entitlement to (persona, domain)
# CELLS whose components must exist in this vocabulary — the sync
# tool refuses to apply a group grant referencing a persona not
# listed here, giving a topaz-side positive control against typos
# in groups.yaml.
#
# Adding a persona: append to this list AND to the corresponding
# enum in ADR-0009 (they must stay in sync — the code-side
# consumer of the persona claim is the source of truth for what
# personas the router recognizes; this file mirrors it into topaz).
personas:
  # Engine P registers its twelve planning verbs with
  # owner_persona=PORTFOLIO_LEAD (agent_fleet/planning_agent/main.py).
  # Added 2026-08-22 for the portfolio-review demo.
  - PORTFOLIO_LEAD
  - DATA_STEWARD
  - DATA_ENGINEER
  - ARCHITECT
  - MECHANIC
  - ANALYST
  # Engine F registers its six finance verbs, plus its resolveInstance and
  # enumerateInstances providers, with owner_persona=PROGRAM_FINANCE_ANALYST
  # (agent_fleet/finance_agent/main.py OWNER_PERSONA). Added 2026-08-31.
  #
  # ASSERTABLE FROM THIS FILE ALONE. The header above says to update ADR-0009's persona
  # enum in the same edit; that instruction predates chart 0.3.12. The catalog rego now
  # walks the directory (domain.can_view) instead of enumerating a hardcoded persona
  # list — validate_policy.py's own header records this — so adding a persona here needs
  # no code-side change. ADR-0009 is the ADR that SUNSET persona as a classification
  # axis; it describes the legacy 6-way enum rather than maintaining a live one.
  - PROGRAM_FINANCE_ANALYST

  # engine-cost registers its six production-cost verbs with owner_persona=COST_ANALYST
  # (agent_fleet/cost_agent/main.py OWNER_PERSONA). Added 2026-09-02.
  #
  # FOUND BY THE SYNC CONTRACT, NOT BY A REVIEW: the engine was written naming this persona
  # before it existed here, and the sync tool would have refused every grant referencing it.
  # That refusal is the control working -- a persona the product never shipped must not
  # entitle through the group walk.
  #
  # Same ADR-0009 note as PROGRAM_FINANCE_ANALYST above: the header's instruction to update
  # that ADR's enum predates chart 0.3.12, and the catalog rego now walks the directory
  # rather than enumerating a hardcoded list, so adding a persona here needs no code change.
  - COST_ANALYST

  # Engine S's author/drafter role (ADR-0051) — MIL-STD-882E's system safety engineer: the
  # person who drafts a risk assessment and answers a redraft, and who is NOT the person who
  # accepts the residual risk. That separation is the whole of ADR-0051 §7, and it holds here
  # by construction rather than by rule: ACCEPTANCE IS A TASK DISPOSITION, carried by the
  # `risk_acceptance_*:SUSTAINMENT` audiences in task_grants.yaml, and no cell grants it.
  # A safety engineer holding this persona can ASK (open the hazard list, draft an assessment)
  # and cannot SIGN. Added 2026-09-14.
  #
  # THIS PERSONA IS A LABEL ON THE ANSWER, NOT A FILTER ON IT — measured, not assumed.
  # `src/iagent/auth.py:278` flattens entitlements to `{c.domain for c in cells}` and the
  # persona half is discarded before any verb filter runs; it survives as the answering VOICE
  # (`answerer_persona`) and as the `can_assume` check on a cell override. So naming a persona
  # here scopes nothing on its own — the DOMAIN half of the cell is what reaches the gate.
  #
  # Same ADR-0009 note as PROGRAM_FINANCE_ANALYST and COST_ANALYST above: the header's
  # instruction to update that ADR's persona enum predates chart 0.3.12 and there is no live
  # enum there to update. `domains.yaml` carried the identical stale instruction and did not
  # carry the correction until 2026-09-14; it does now.
  - SAFETY_ENGINEER
