# TRUST TABLE — the ADMISSION posture per vendor-format x pipeline-version.
#
# ADR-0034. This file answers ONE question: may the pipeline act on this class of input
# WITHOUT a human? It does NOT decide whether a review starts (that is the starter, posture
# AND content) and it does NOT decide what the process is (that is the workflow definition).
# No entry here may name a step; no definition may read this file.
#
# THE CONJUNCTION THAT MATTERS: `supervised` forces the review path REGARDLESS of content.
# `monitored` / `trusted` DEFER to the content chain — they never override a content refusal
# into silence. Trust buys the absence of a HUMAN, never the absence of a CHECK.
#
# ── THE RUNGS ────────────────────────────────────────────────────────────────
#   supervised  every notice enters the human queue. Full decision records. THE DEFAULT.
#   monitored   auto-proceeds, SAMPLED into the human queue, full records on every notice.
#   trusted     auto-proceeds; records still emitted; sampling optional.
#
# `supervised -> trusted` IS NOT A PERMITTED TRANSITION. `monitored` is not a formality on the
# way to automation — it is the only rung that produces COUNTERFACTUAL evidence: what the
# pipeline would have done, checked against what a human did, on traffic it is already
# handling. Skipping it promotes on evidence gathered under a different regime.
#
# ── WHY THE KEY IS vendor-format x PIPELINE-VERSION ──────────────────────────
# Never vendor alone. Three notices broke this pipeline in one week (Qorvo, Diodes, onsemi)
# and they broke on format variation WITHIN a vendor, while the extractor changed underneath
# them mid-arc (vision -> text-layer). A vendor is not a stable unit of format. Worse, trust
# keyed on vendor alone would SURVIVE A PIPELINE UPGRADE — exactly when accumulated evidence
# stops applying, because the thing that earned the trust is no longer the thing running.
#
# ── DENY-BY-DEFAULT FOR AUTONOMY ─────────────────────────────────────────────
# An unlisted vendor-format is `supervised`, computed from ABSENCE. A table that must LIST a
# format in order to supervise it fails OPEN on the format nobody added — and the format
# nobody added is precisely the one nobody has looked at.
#
# ── HOW TO CHANGE IT ─────────────────────────────────────────────────────────
# git-asserted, content-hashed, validated at load, fails LOUD. Every entry states WHO ratified
# it and on WHAT evidence — an unexplained trust grant is not a grant, for the same reason an
# unexplained capability grant is not one (capability_grants.yaml). Promotion is an approval
# (ADR-0027) and the evidence is the decision-record corpus, not a hunch.
#
# NOTHING IS PROMOTED YET, deliberately: the corpus starts empty, so every real format sits at
# the born-default until there is something to read. An empty `formats` map is the honest
# starting state, not an unconfigured one.

version: 1
formats:
  # ── FIRST PROMOTION (ADR-0034). Ratified as ONE governed act together with the
  # `can_invoke(mesh:dispatchDispositions)` grant in capability_grants.yaml: the rung says the
  # pipeline MAY act without a human, the grant says this identity MAY cause the effect. One
  # authority, two enforcement points, ratified once — either alone dispatches nothing.
  #
  # READ THE EVIDENCE FIELD BEFORE THE RUNG. This is NOT a corrections-weighted promotion and does
  # not pretend to be: the corpus at this pipeline version is N=1. `monitored` is the rung that
  # BEGINS producing counterfactual evidence, and `supervised -> trusted` is forbidden precisely so
  # that evidence must be earned here first. Entering `monitored` with no history is the designed
  # way in; claiming a correction rate that does not exist would not be.
  #
  # sample_rate 1.0 for exactly that reason — every autonomous decision is sampled while the record
  # is empty. Sampling is evidence gathered ALONGSIDE the autonomous run, never a human gate in
  # front of it (`sample_rate_for`): autonomy still happens. Lowering it once there is a record to
  # reason about is itself a ratified edit.
  #
  # KEYED ON BOTH AXES. The version is the extractor this rung was earned under; a doc-tools rebuild
  # changes it, this entry stops matching, and the floor is restored with no edit required — the
  # upgrade-invalidation property, witnessed as leg 3 on this exact key (2026-08-09).
  #
  # LEGAL ONLY BECAUSE NORMALIZATION LANDED: a rung above `supervised` is REFUSED on a sentinel
  # segment on either axis. Before canonicalization + `doc_type_source`, this format derived
  # `onsemi/unknown/v1` and the validator would have rejected this entry outright.
  # ── DEMOTED 2026-08-09, SAME DAY, BY DESIGN OF THE RAILS ────────────────────────────────────
  # Promoted to `monitored`, witnessed, and demoted within the hour. Reason: the autonomous
  # dispatch step failed on its FIRST EVER EXECUTION —
  #
  #   [500 Internal] Invalid URL '{dispatch_endpoint}': No scheme supplied.   (retry_count 16)
  #
  # `policy/workflows/autonomous_review.yaml` declares a templated endpoint that NOTHING IN THE
  # RUNTIME BINDS. It was never caught because both existing tests INJECT the binding and then
  # assert the workflow uses it (transport proven, sourcing never), and because the path sat behind
  # `can_invoke(mesh:dispatchDispositions)` — denied, and therefore executed zero times. The gate
  # that made the system safe also made the bug invisible.
  #
  # WHY DEMOTE RATHER THAN LEAVE IT AND FIX FORWARD: with `monitored` standing, this table promises
  # autonomy for a key whose autonomous path terminally fails past the gate. That is WORSE than the
  # pre-ceremony state, where the deny released cleanly by design; a notice arriving mid-fix would
  # route autonomous and die spinning. The table must say what is TRUE at every moment, and right
  # now the true statement is `supervised`.
  #
  # THE GRANT STAYS. With this entry demoted nothing routes autonomous, so
  # `can_invoke(mesh:dispatchDispositions)` sits granted-and-unexercised — which is also a true
  # state, and re-landing the promotion becomes the clean flip it was always meant to be.
  # Re-promotion lands WITH the witnessed fix (runtime binder + a seal asserting every definition
  # placeholder binds at admission), not before it.
  "onsemi/pcn/v1":
    rung: supervised
    pipeline_version: "doc-tools@d5b44829eb9bc29791aa71857b987c1d3256569c"
    sample_rate: 0.0
    ratified_by: cnogradi
    ratified_on: 2026-08-09
    demoted_on: 2026-08-09
    demotion_reason: >-
      Autonomous dispatch binding defect found on first execution; promotion re-lands with the
      witnessed fix.
    evidence: >-
      FIRST PROMOTION — entering `monitored` to BEGIN accumulating counterfactual evidence, not on
      the strength of accumulated evidence. Corpus at this pipeline version: N=1 (IPCN25300X,
      re-extracted 2026-08-09 by the deployed extractor). Correction rate at this version:
      UNMEASURED — no autonomous decision has been sampled yet, so there is nothing to weight.
      What IS established, and what this ratifies, is that the admission path is sound and
      auditable: the trust key is DERIVED from the artifact on both axes (`admitted_by=content`,
      no floor taken, hand-supplied at no hop), and the table alone decides the route — legs 2/3
      witnessed promotion routing to `autonomous_review` and a version mismatch flooring to
      `grouped_review`, with only `table=` and `rung=` differing between runs. The effect remains
      separately gated by capability. Evidence for any later move to `trusted` must be
      CORRECTIONS-weighted over the records this rung produces: approval counts measure that humans
      clicked, not that the pipeline was right. Witness:
      docs/plans/2026-08-06-artifact-uri-repair-witness.md §9.

# Shape of an entry, for when the first promotion is ratified:
#
# formats:
#   "<vendor>/<doc-kind>/<layout-fingerprint>":
#     rung: monitored              # supervised | monitored | trusted
#     pipeline_version: "doc-tools@446fbae"   # the version this rung was earned UNDER
#     sample_rate: 0.25            # monitored only — the counterfactual evidence engine
#     ratified_by: <accountable human>
#     ratified_on: 2026-08-01
#     evidence: >-
#       Correction rate over N records at this pipeline version, and the span they cover.
#       CORRECTIONS-weighted, never approval-count: N approvals measures that humans clicked,
#       not that the pipeline was right.
