# LEVEL READERS -- the `cleared_for:<level>` rail of ADR-0064 item B (Proposed, #266).
#
#   * ONE ROW PER LEVEL of policy/classification/levels.yaml, naming the groups cleared for it.
#     Every registered level needs exactly one row.
#   * RULING (c), verbatim (Chris, 2026-11-05): "Relation: `cleared_for:<level>` -- `can_read` stays
#     what it is."
#   * A GRANT IS A CEILING. Ruling (b), verbatim: "Levels are ordered; a grant at a level is a ceiling
#     and implies every less restrictive one." A group named in a level's row is cleared for that level
#     AND every less restrictive one (earlier rows of the registry). So list a group ONCE, at its
#     highest level; naming it again at a lower row is refused.
#   * A ROW has `level`, `grant_to_groups` (groups in groups.yaml with at least one member; no user
#     is ever named here, membership lives in users.yaml), `granted_by` (`seed` for a shipped row),
#     `reason`, and `ratified_by` (`owner`: a seat, never an identity).
#   * DENY BY DEFAULT. An explicit `grant_to_groups: []` with a reason says no group has this level as
#     its ceiling (groups cleared for a more restrictive level still read it).
#
# No reader applies this file until dag-tools step 5 serves a dataset's level. validate_policy.py
# checks it WHEN PRESENT (level_readers_errors).

level_readers: []
