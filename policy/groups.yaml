# Group taxonomy — each group grants entitlement to one or more
# (persona, domain) cells. Users are assigned to groups in
# users.yaml; assigning a user to a group grants them everything
# that group grants.
#
# Adding a group here (or a new `grants:` entry to an existing
# group) IS the assertion. Every line has a named human via
# `git blame`.
groups:
  # ── Portfolio review (2026-08-22) ────────────────────────────────
  # The cell Engine P's verbs live in. Without it /resolve scopes the
  # OntologyClass pool to cells the caller holds, none of which contain the
  # five planning subjects — so the question grounds to nothing and routes
  # nowhere, while every engine reports healthy.
  portfolio-leads:
    grants:
      - {persona: PORTFOLIO_LEAD, domain: PORTFOLIO_PLANNING}

  # ── Program finance (2026-08-31) ─────────────────────────────────
  # The cell Engine F's verbs live in. Exactly the shape of portfolio-leads above, and
  # for the same reason: /resolve scopes the OntologyClass pool to the cells the caller
  # holds, and none of the existing cells contain the fourteen fin: subjects — so a
  # finance question grounds to nothing and routes nowhere while engine-fin reports
  # healthy, serves all six verbs, and shows eight verb edges in the graph.
  #
  # MEASURED 2026-08-31: engine-fin was fully deployed and verified — 8 edges by name at
  # the FQDN endpoint, every verb answering — and unreachable by every user, because the
  # cell did not exist. Registration is not entitlement.
  finance-analysts:
    grants:
      - {persona: PROGRAM_FINANCE_ANALYST, domain: PROGRAM_FINANCE}

  # engine-cost's cell. MEASURED 2026-09-02, and it is the same measurement the
  # finance-analysts comment above records: engine-cost was fully deployed and verified --
  # 6 verb edges by name at the FQDN endpoint, 11 classes by name, every verb answering --
  # and unreachable by every user, because this cell did not exist.
  # REGISTRATION IS NOT ENTITLEMENT, demonstrated twice now on two consecutive engines.
  cost-analysts:
    grants:
      - {persona: COST_ANALYST, domain: PRODUCTION_COST}

  aviation-stewards:
    grants:
      - {persona: DATA_STEWARD, domain: AVIATION}

  aviation-engineers:
    grants:
      - {persona: DATA_ENGINEER, domain: AVIATION}

  defense-engineers:
    grants:
      - {persona: DATA_ENGINEER, domain: DEFENSE}

  aviation-mechanics:
    grants:
      - {persona: MECHANIC, domain: AVIATION}

  # MAINTENANCE-domain mechanic cell. Added 2026-08-05 so the ADR-0038
  # analyst→Engine-E telemetry join is witnessable on ORGANIC traffic:
  # Engine E serves the MAINTENANCE domain, and /resolve domain-scopes the
  # OntologyClass pool to the caller's cells — so a maintenance graph question
  # only grounds+routes to E from a MAINTENANCE cell, and no demo user had one.
  # Distinct from aviation-mechanics (MECHANIC·AVIATION); E's knowledge-graph
  # corpus is labelled MAINTENANCE. Files the live grant already written to the
  # sandbox directory during the E-join witness (git↔directory now agree).
  maintenance-mechanics:
    grants:
      - {persona: MECHANIC, domain: MAINTENANCE}
      # MANUFACTURING (2026-09-18). neo4j_expert's three registrations declare
      # `domains=["MAINTENANCE", "MANUFACTURING"]` TOGETHER, so a cell holding one and not the
      # other reaches half of each verb's declared scope — and the half it misses is silent,
      # because a domain-scoped pool simply omits the classes rather than refusing.
      # MANUFACTURING was seeded and registered against for weeks while absent from
      # domains.yaml, so no group COULD grant it.
      - {persona: MECHANIC, domain: MANUFACTURING}

  enterprise-architects:
    grants:
      - {persona: ARCHITECT, domain: AVIATION}
      - {persona: ARCHITECT, domain: DEFENSE}
      - {persona: ARCHITECT, domain: ENTERPRISE}

  # DATA_ENGINEERING-domain group — grants access to the DataHub
  # catalog's instance plane (the catalog serves the DATA_ENGINEERING
  # domain; the 2026-07-02 stopgap gates query_metadata on holding a
  # DATA_ENGINEERING cell). Ratified domain-based catalog gate per
  # ADR-0025's amendment. Add users here DELIBERATELY (a chosen,
  # PR-reviewed grant) to give them catalog access — NOT reactively
  # when someone hits a denial. Both catalog-governance personas
  # (steward + engineer) are granted the DATA_ENGINEERING domain;
  # finer view-vs-edit distinction is the per-asset can_view successor.
  data-engineers:
    grants:
      - {persona: DATA_ENGINEER, domain: DATA_ENGINEERING}
      - {persona: DATA_STEWARD, domain: DATA_ENGINEERING}

  # SUSTAINMENT-domain safety group — Engine S's cell (ADR-0051). Added 2026-09-14.
  #
  # WHY IT EXISTS: /resolve domain-scopes the OntologyClass pool to the caller's cells, so a
  # safety question only grounds+routes to Engine S from a SUSTAINMENT cell. This file already
  # records four engines that registered verbs no user could reach — Engine P, Engine F,
  # engine-cost, and the MAINTENANCE mechanic — each with the same sentence: REGISTRATION IS
  # NOT ENTITLEMENT. Engine S was queued to be the fifth.
  #
  # ⚠️ THIS GRANT IS NOT YET OBSERVABLE, AND THAT IS STATED RATHER THAN DISCOVERED. Two things
  # upstream of it are unfinished as of 2026-09-14, both filed:
  #   1. engine-safety's three verbs register with NO `domains` and NO `owner_persona`, which
  #      makes them DOMAIN-AGNOSTIC — and a verb with no domains is visible to EVERY caller
  #      (ontology_service/main.py's filter skips the intersection when `verb_domains` is
  #      empty). Until they carry `domains: [SUSTAINMENT]`, this cell is not what admits them
  #      and its absence is not what excludes anyone.
  #   2. the registration call cannot bind its own signature, so today it is 0 of 3 registered.
  # A cell that grants nothing observable is exactly the shape this file warns about elsewhere,
  # so it is written WITH its precondition rather than left to read as live.
  #
  # WHO IS IN IT. bob is the safety engineer — the author/drafter, who asks and cannot sign.
  # alice is here too because she holds the High and Serious acceptance audiences, and AN
  # AUTHORITY WHO CAN SIGN BUT CANNOT LOOK IS THE WRONG SHAPE: the cell grants the question
  # ("show me open hazards"), never the signature, which stays a task disposition. carol is
  # deliberately ABSENT — the user representative concurs on an assessment put in front of her
  # and has no reason to query the hazard plane; if that turns out to be wrong it is one line,
  # and the wrong direction to guess is the one that grants.
  safety-engineers:
    grants:
      - {persona: SAFETY_ENGINEER, domain: SUSTAINMENT}
