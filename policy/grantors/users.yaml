# SEED -- deployment-neutral. A deployment names its own approvers in an overlay row
# (GRANTOR_OVERLAY_DIRS), which replaces this row whole (ADR-0036).
family: users
rail_file: policy/users.yaml
object_scoped: false
who: the approvers of policy/users.yaml in this deployment's policy repository
how: >-
  a reviewed change to the caller's row in policy/users.yaml, then a hand-run topaz_sync
