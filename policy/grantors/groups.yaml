# SEED -- deployment-neutral. A deployment names its own approvers in an overlay row
# (GRANTOR_OVERLAY_DIRS), which replaces this row whole (ADR-0036).
family: groups
rail_file: policy/groups.yaml
object_scoped: false
who: the approvers of policy/groups.yaml in this deployment's policy repository
how: >-
  a reviewed change to policy/groups.yaml (a group whose grants hold the persona and domain) or to the caller's groups in policy/users.yaml, then a hand-run topaz_sync
