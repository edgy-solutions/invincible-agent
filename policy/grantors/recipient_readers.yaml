# SEED -- deployment-neutral. A deployment names its own approvers in an overlay row
# (GRANTOR_OVERLAY_DIRS), which replaces this row whole (ADR-0036).
family: recipient_readers
rail_file: policy/recipient_readers.yaml
object_scoped: true
