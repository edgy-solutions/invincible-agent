# SEED -- deployment-neutral. A deployment names its own approvers in an overlay row
# (GRANTOR_OVERLAY_DIRS), which replaces this row whole (ADR-0036).
family: ontology_compartments
rail_file: policy/ontology_compartments.yaml
object_scoped: true
who: the approvers of policy/ontology_compartments.yaml in this deployment's policy repository
how: >-
  a reviewed change adding the caller to the compartment's row (granted_by, reason), applied by topaz_sync
