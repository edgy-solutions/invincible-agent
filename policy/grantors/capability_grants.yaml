# SEED -- deployment-neutral. A deployment names its own approvers in an overlay row
# (GRANTOR_OVERLAY_DIRS), which replaces this row whole (ADR-0036).
family: capability_grants
rail_file: policy/capability_grants.yaml
object_scoped: false
who: the approvers of policy/capability_grants.yaml in this deployment's policy repository
how: >-
  a reviewed change adding the capability's row (grant_to, granted_by, reason; ADR-0026), applied by topaz_sync
