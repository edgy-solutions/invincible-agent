# PROGRAM FINANCE CANVAS — the second ratified template (ADR-0050 §9.2's second registry row).
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# ⚠ THIS TEMPLATE CANNOT SEED TODAY, AND THAT IS A PROPERTY OF THE VERBS, NOT AN OVERSIGHT.
#
# Every one of the six finance verbs takes `program_id` as a REQUIRED keyword with NO DEFAULT
# (`agent_fleet/finance_agent/measures.py`, verified 2026-09-08). `finEacCalculation` takes a
# second one — `method: EACMethod`, whose docstring says in as many words *"There is no
# default"*, and which ADR-0045 makes spoken-mandatory: a bare "what's the EAC" is refused with
# "which method?".
#
# `portfolio.yaml` could declare its verbs' defaults and be TRUE today because every planning
# verb defaults to portfolio-wide. **Finance has no such defaults to declare.** A template that
# named these verbs with empty slots and looked seedable would merge, pass every check, and
# refuse on all six panels at seed time — the exact shape ADR-0050 acceptance 1 exists to catch
# and that a file-only check cannot see.
#
# So this file is ratified, schema-valid, and **deliberately not yet seedable**. Its job today is
# to be the SECOND ROW that ADR-0050 §9.2 needs in order to decide whether a second registry
# should exist at all. Do not wire it into a seed path expecting cards.
#
# `program` IS NOW DECLARED, 2026-09-11, and this template states its true shape for the first
# time: one shared slot, six panels consuming it — §3's "six cards from one ask", and these six
# verbs are exactly why that section names `program` specifically. All six take `program_id`
# (26 occurrences in the finance engine against ZERO in planning, which is why the same slot is
# REFUSED on `portfolio`: a shared slot is a parameter the panels' verbs actually take, not a
# statement that the panels are about the same thing).
#
# WHAT DECLARING IT DOES TODAY: the seed route answers 409 — *"panel(s) consuming shared slot(s)
# ['program'] that nothing binds yet"* (R-005). That is the ADR-0050 §3 carry reported honestly,
# and it is BETTER than the previous state, where the truth lived only in this comment while the
# machine-readable artifact said `shared_slots: []`. The template is now the record; the refusal
# names the real reason. It was already unseedable behind the 501 gate, so nothing operational
# changed.
#
# `finEacCalculation`'s `method` stays PANEL-LOCAL and must not be promoted here — it is a
# per-panel choice, not a board subject, and asking it once would answer a different question.
#
# ── VERB EXISTENCE, CHECKED FROM THE MESH ────────────────────────────────────────────────────
# All six verbs verified 2026-09-08 against the live sandbox mesh — present as Neo4j
# relationship types AND in Weaviate with `registration_complete: true` and a resolving
# endpoint, which is the conjunctive read eligibility actually requires. See
# `tests/planning/test_template_verbs_are_registered.py`.
#
# ── ORDER IS THE DECLARATION ─────────────────────────────────────────────────────────────────
# Position 0 is the anchor. `role` carries the slot role only, never pixels (§7).
---
template_id: program_finance
title: Program finance status
description: >-
  Funding status anchoring the top, with burn rate and performance indices beneath it, then the
  variance decomposition, its ranked drivers, and the estimate at completion. The six
  PROGRAM_FINANCE_ANALYST measures as one board — six cards that ADR-0050 §3 intends to come
  from a single ask once `program` can be bound.

# EMPTY PER DISPATCH, and the blocker is §3's, not seedCanvas's. See the header: `program`
# belongs here and cannot be bound yet.
shared_slots:
  - name: program
    description: >-
      Which program this board is about. Asked ONCE at load and bound into all six panels —
      ADR-0050 3's worked case, and the reason that section names `program` specifically.
    required: true

panels:
  # ── SLOT 0 — the anchor ────────────────────────────────────────────────────────────────────
  - verb: mesh:finFundingStatus
    role: anchor
    slots: {}
    consumes: [program]
    note: >-
      REQUIRES program_id, which has no default — this panel cannot seed until `program` is a
      bindable shared slot. `window` defaults to None, meaning the full span. Output is
      FundingStatusGrid; a ladder (authorized ⊇ obligated ⊇ expended), not a comparison.

  # ── SLOTS 1-2 — the first pair ─────────────────────────────────────────────────────────────
  - verb: mesh:finBurnRate
    role: pair
    slots: {}
    consumes: [program]
    note: >-
      REQUIRES program_id, no default. `window` defaults to None. Counts cash leaving, NOT value
      claimed — deliberately paired with finPerformanceIndices, which asks whether the money
      bought what it was supposed to, because a program can look healthy here and be performing
      badly.

  - verb: mesh:finPerformanceIndices
    role: pair
    slots: {}
    consumes: [program]
    note: >-
      REQUIRES program_id, no default. `ca_id` and `window` default to None — program-wide, full
      span. A series rather than a point, by design: 0.84 falling from 0.95 is a different
      program from 0.84 risen from 0.75.

  # ── SLOTS 3-4 — the second pair ────────────────────────────────────────────────────────────
  - verb: mesh:finVarianceAnalysis
    role: pair
    consumes: [program]
    slots:
      variance_kind: cost
      materiality: 0.05
      max_depth: 3
    note: >-
      REQUIRES program_id, no default. The three slots declared here ARE the signature defaults
      and are stated rather than omitted so the card's parameters are legible — the same reason
      portfolio.yaml declares plan_funding_gap's group_by. `materiality` and `max_depth` change
      how far the decomposition recurses, so a reader who cannot see them cannot tell a shallow
      tree from a fully explained one.

  - verb: mesh:finVarianceDrivers
    role: pair
    consumes: [program]
    slots:
      variance_kind: cost
      level: control_account
      top_n: 10
    note: >-
      REQUIRES program_id, no default. Declared values are the signature defaults. `variance_kind`
      is pinned to `cost` to match the panel above it — a drivers ranking for a DIFFERENT
      variance than the decomposition beside it would be two answers presented as one story.

  # ── SLOT 5 — the second pair's overflow; see the note on arity ─────────────────────────────
  - verb: mesh:finEacCalculation
    role: pair
    consumes: [program]
    slots:
      method: CPI
    note: >-
      RULED 2026-09-09 — ALL THREE METHODS ON ONE PANEL. Not three panels, and not a pinned
      method: *pinning hides the divergence that is the finding*. CPI, CPI_SPI and
      REMAINING_AT_BUDGET span $13.13M / $14.15M / $14.79M against a $12.00M budget on the
      engine's own seed — a ~14%-of-BAC spread that IS the answer, and a template that silently
      picks one is choosing it on the reader's behalf.
      **THE RULING CANNOT BE HONOURED BY THIS VERB YET, so `method: CPI` stands as a placeholder
      and is NOT a considered choice.** `fin_eac_calculation` takes `method: EACMethod` — one
      Literal — and raises `MethodRequired` on anything else; there is no multi-method affordance
      anywhere in the finance engine. One panel is one verb invocation is one method. Honouring
      the ruling needs an ENGINE change (the verb returning all three rows, or a sibling
      comparison verb), which belongs to the finance lane, not to this file. Until then this
      panel is inert anyway — the template refuses at seed time, see the header — so the
      placeholder costs nothing and the ruling is recorded rather than quietly unmet.
