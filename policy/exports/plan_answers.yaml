# SAMPLE: a notional plan office. It names no real organisation.
name: plan_answers
format: csv
scope: answer
label: Plan answers (synthetic)
kinds:
  - mesh:planCostCurve
  - mesh:planFundingGap
  - mesh:planSiteLoad
  - mesh:planDependencyViolations
  - mesh:planDependencyNeighborhood
  - mesh:planCommitScenario
  - mesh:planMaturityGrid
  - mesh:planCapabilityPath
  - mesh:planProcessEvolution
  - mesh:planTechFootprint
  - mesh:planSchedule
  - mesh:planCoverageGap
  - mesh:planDiff
  - mesh:planSessionChanges
recipients: [notional-plan-office]
columns:
  - {field: answer_id, as: Answer}
  - {field: question, as: Question}
  - {field: summary, as: Summary}
  - {field: verb, as: Verb}
  - {field: subject, as: Subject}
  - {field: program, as: Program}
  - {field: valid_as_of, as: As of}
