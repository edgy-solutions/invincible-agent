# The two-act safety risk acceptance — MIL-STD-882E §4.3.7, as a LINEAR definition.
#
# STATUS: AUTHORED, NOT YET TRIGGERED. The selection that opens it (`level ∈ {High, Serious}`)
# is a decision-table row per ADR-0039's 2026-09-12 amendment, and `policy/decisions/` does not
# exist yet — it waits on the SDK composer being parameterised by key field. Stated here rather
# than left to be inferred: ADR-0040 makes the board a generated index of these headers, so a
# header that overclaims removes a real gap from the board. THIS DEFINITION RUNS NOTHING TODAY.
#
# ── WHY TWO STEPS AND NOT A GATEWAY ─────────────────────────────────────────────────────────
# MIL-STD-882E §4.3.7, verbatim: "The user representative shall be part of this process
# throughout the life-cycle of the system and shall provide formal concurrence BEFORE all
# Serious and High risk acceptance decisions." §3.2.49 puts that representative "at a peer level
# equivalent to the risk acceptance authority."
#
# So a Serious or High acceptance is TWO HUMAN ACTS, ORDERED. The ordering is expressed by the
# STEP LIST — `human_await` suspends until its promise is resolved, so step 2 cannot open until
# step 1 is disposed. **That is the structural "before", and it needs no branch.**
#
# The CHOICE — which levels need this at all — is deliberately NOT here. ADR-0034 forbids a mode
# branch and ADR-0039 forbids gateways; the level test is a decision-table row that selects
# between this definition and `safety_acceptance_direct`. A programme tailoring its concurrence
# threshold edits that row, which is where an SSPP's tailoring belongs.
#
# ── WHY THE TWO AUDIENCES ARE DIFFERENT, AND MUST BE ────────────────────────────────────────
# Peer-level means the user representative is neither the accepting authority nor that
# authority's subordinate. One audience holding both acts would collapse two independent acts
# into a single signature wearing two names, which is precisely what a formal concurrence is not.
#
# {placeholders} are bound at trigger time from the drafted assessment.
id: safety_acceptance_with_concurrence
name: "Safety risk acceptance (Serious/High) — concurrence, then acceptance"

# Left null for the same reason grouped_review.yaml leaves it null: a static classification
# cannot express a per-invocation compartment, and the audiences below carry it.
classification: null

participants:
  - role: initiator                  # the drafting engine's caller, carried end to end
  - role: user_representative        # concurs; peer-level to the authority, never the same person
  - role: acceptance_authority       # accepts the residual risk

domain_stages: [drafted, concurrence_pending, acceptance_pending, disposed]

steps:
  # STEP 1 — the concurrence. Opens FIRST and alone; the acceptance below cannot be reached until
  # this promise resolves, which is the standard's "before" made structural rather than advisory.
  - kind: human_await
    id: concurrence
    promise_name: concurrence
    audience: "risk_acceptance_concurrence_{level_lower}:SUSTAINMENT"
    subject_ref: "{hazard_id}"
    title: "Concur on {level} risk — {hazard_id}"
    summary: >-
      User representative concurrence, required before the acceptance decision
      (MIL-STD-882E 4.3.7). Disposing `not_concurred` ends this definition and a chaining row
      opens the redraft; it does not fall through to acceptance.
    completion:
      mode: single
      quorum: any_of
      claiming: false

  # STEP 2 — the acceptance. Reached ONLY because step 1 resolved. The task kind's own row
  # declares `accepted` (not the seed's `approved`) and makes both dispositions reason-required.
  - kind: human_await
    id: acceptance
    promise_name: acceptance
    audience: "risk_acceptance_{level_lower}:SUSTAINMENT"
    subject_ref: "{hazard_id}"
    title: "Accept {level} risk — {hazard_id}"
    summary: >-
      Residual risk acceptance by the authority the ratified matrix names for this level. The
      concurrence and its stated basis are carried in the payload, so the record has two names on
      it rather than one.
    completion:
      mode: single
      quorum: any_of
      claiming: false

observable_state:
  visible: [domain_stages, concurrence.status, acceptance.status]
  internal: []
