# SEED — platform species (ADR-0036). Ruled platform-generic 2026-10-02: the definition is the
# platform's; WHO stewards a domain is each deployment's grant on `origin_confirmation:<domain>`.
#
# THE ACCEPTED ORIGIN, HANDED TO ITS WRITER. This engine writes no store: it emits the confirmed
# origin with the approval chain that authorizes it, and the writer says whether the origin
# columns were written.
#
# THE ORIGIN IS THE SUGGESTION AS CONFIRMED, field for field. A steward accepts or rejects the
# suggestion whole; amending it would be a different suggestion with different evidence.
#
# THE WRITER EXISTS NOW (item B, 2026-10-03): `written` is a `direct_call` to the BFF's
# `POST /internal/origin/write`, capability `origin.write`, gated to the case runner's own
# service identity. Its declared `extra_payload` is the SAME resolution object `resolution`
# emitted above, read back from `outputs` rather than re-derived from `trigger` a second time --
# one source for what "the case resolution" means. A direct_call's HTTP response IS the step's
# result, synchronously, so there is no signal left to answer: `answer_signal`/
# `ORIGIN_WRITTEN_SIGNAL` in `origin_writer.py` are dead and removed in this same change.
id: origin_record
name: "Artifact origin -- record"

classification: null

participants:
  - role: origin_writer

domain_stages: [recorded, written]

steps:
  - kind: emit
    id: resolution
    channel: origin_resolution
    template:
      resolution_id: "{case.instance_id}"
      suggestion_id: "{trigger.suggestion_id}"
      artifact_id: "{trigger.artifact_id}"
      dropped_by:
        authz_id: "{trigger.dropped_by.authz_id}"
      origin:
        owner_domain: "{trigger.suggested.owner_domain}"
        program: "{trigger.suggested.program}"
        obtained_via: "{trigger.suggested.obtained_via}"
      evidence:
        source: "{trigger.evidence.source}"
        citation: "{trigger.evidence.citation}"
      approval_chain: "{case.approval_chain}"
      provenance:
        # RULED 2026-10-02: provenance names the CASE DEFINITION and the EMITTER, both. A case is
        # declared by its trigger (selection, key, episode), so the case definition is the
        # trigger's name. The three workflow_* fields are the week-1 contract's spelling and
        # name the emitter; emitted_by says so in a field of its own.
        case_definition: "{case.trigger}"
        case_id: "{case.case_id}"
        emitted_by: "{definition.id}"
        workflow_definition_id: "{definition.id}"
        workflow_definition_version: "{definition.version}"
        workflow_instance_id: "{case.instance_id}"

  # THE WRITE, gated by Topaz the same way every direct_call is (RULING Q3) -- the case runner's
  # own delegate identity invokes `origin.write`, never a borrowed human token (item B, 2026-10-03).
  - kind: direct_call
    id: written
    endpoint: "{origin_write_endpoint}"
    capability: origin.write
    # THE WRITER'S ANSWER IS THE DISPOSITION (outcome_from, ruled 2026-10-03): its 200 body says
    # `status: written` or `status: write_refused`, and origin_record_chaining matches on that
    # value. A body without a `status` is terminal, never an undecided case.
    outcome_from: status
    extra_payload:
      artifact_id: "{outputs.origin_record.resolution.artifact_id}"
      dropped_by: "{outputs.origin_record.resolution.dropped_by}"
      origin: "{outputs.origin_record.resolution.origin}"
      evidence: "{outputs.origin_record.resolution.evidence}"
      approval_chain: "{outputs.origin_record.resolution.approval_chain}"
