# Endpoint-gating audit manifest — the DECLARED gating posture of every agent-reachable
# HTTP route across the fleet. Source of truth for tests/test_endpoint_gating_manifest.py:
# a route in source but absent here FAILS CI (exceptions are declared, not accidental).
#
# Per route:
#   identity      — the caller-identity field the handler USES for a gate, or `none`
#   gate          — can_view | can_read | can_act | can_invoke | topaz-check |
#                   delegates:<engine> | domain-scope | auth-only | none
#   exposes       — gated-content | action | proxy | ui-state | health | render
#   consumers     — who calls it today (or none-found)
#   class         — gated | releasable_by_design | ungated_by_accident | delegates | internal
#   justification — REQUIRED for releasable_by_design and ungated_by_accident
#
# Breadth pass 2026-07-15 (read-only audit, 4 agents). 72 HTTP routes. This pass FINDS the
# exception population; it fixes nothing. `ungated_by_accident` rows are FINDINGS whose fixes
# are a separate, worst-first, seal-per-fix increment (see docs/architecture/endpoint-gating-audit.md).
# Dark-launched gates (behind ENABLE_AGENTIC_AUTH, default off) count as "gate present", not none.
#
# AMENDMENT 2026-08-07 — THAT DEFINITION OF "PRESENT" ADMITTED THREE KINDS OF NOTHING.
# The line above is kept as what was concluded; it is too weak, and the adjudication that
# found this is now the standing method. A gate counts as PRESENT only if it is
#   (a) APPLIED at an endpoint (wired, not merely importable),
#   (b) VALIDATING THE CREDENTIAL'S CONTENT (not just its presence), and
#   (c) FLAG-GATED (its posture declared and announced).
# Three members of the class, all previously counted "present", all WORSE THAN ABSENT because
# they survive an audit-by-name and train everyone to believe a property that does not hold:
#   1. [CLOSED 2026-08-07 — the named instance is DELETED; see the retirement record at the
#      foot of this file. The SPECIES stays documented: the class outlives the member, and
#      this is the one an audit-by-name cannot see. Additionally, and not caught by the
#      original finding: the helper never verified SIGNATURES (`verify_signature=False`), so
#      it was unsound as well as unapplied — reading a gate's code beats reading its name.]
#      IMPORTABLE-BUT-UNAPPLIED — core/authz.py's auth_dependency is imported by NOBODY and
#      applied nowhere; data_analyst imports the decorator and main.py:195 records that it
#      "was removed from this handler". Flipping ENABLE_AGENTIC_AUTH turns on no JWT
#      verification anywhere, because there is nothing wired to turn on.
#   2. PRESENCE-ONLY — the SDK's /execute refused an ABSENT Authorization header and accepted
#      ANY value present: `Bearer anything` passed, and LOCAL_DEV bypassed even that.
#   3. ASSUMED-ELSEWHERE — the DA read path's engine-side authz was deliberately removed in
#      favour of a gateway gate whose subject is a payload field the caller writes.
# HOW PRESENCE IS VERIFIED FROM NOW ON: import-graph plus application-site read, never a
# name-grep. A grep for Depends/verify_jwt/auth_dependency missed member 2 entirely, because
# THE WEAKEST GATES ARE THE ONES GREP CANNOT FIND — they were never built as auth machinery,
# so they carry none of its vocabulary.
#
# INBOUND TRANSPORT AUTH — WHAT "FLEET-WIDE" ENUMERATES (2026-08-07).
# A coverage claim must name its population, or "complete" gets read into whatever the glob
# happened to match. It enumerates TWELVE services, each declaring `inbound_transport_auth`:
#   ten engines (agent_fleet/*/main.py) + projector (src/iagent/projector/app.py)
#   + domain broker (helm/invincible-agent/files/domain-broker.py)
# The last two were outside the claim until this date solely because the applied-everywhere
# test derived its set from `agent_fleet/*/main.py`. THE GLOB WAS THE BOUNDARY, NOT A DECISION —
# and a boundary nobody chose is the kind that gets reported as coverage.
# Enforced by tests/test_transport_auth_applied_everywhere.py, which asserts three obligations
# per service (applied, announced, no re-implemented mint), states the expected population, and
# fails if a service silently leaves it.
#
# ONE NAMED EXCLUSION — src/iagent/gateway.py (cortex-bff). It is the USER plane, not the
# service-transport plane: inbound auth there is Keycloak JWT verification at
# `get_current_user` — signature verified against live JWKS, `algorithms=["RS256"]` PINNED
# (closing alg:none and HS256-with-public-key), all failure paths 401 including the JWKS-fetch
# catch-all, so a Keycloak outage denies rather than admits. That is a stronger and
# semantically different contract than OBSERVE-mode transport auth; layering the fleet module
# there would conflate two auth planes and let OBSERVE be read as covering the front door.
#
# THE GATEWAY'S VERIFICATION IS READ-CONFIRMED AND PROBED, NOT ASSUMED — because the deleted
# core/authz.py deferred ITS signature verification to this gateway, making "the gateway
# verifies" load-bearing for that module, the DA seam and the whole on_behalf_of design.
# See tests/security/test_gateway_jwt_verification.py: a discriminating pair (attacker-signed
# -> 401 naming the signature; JWKS-key-signed -> reaches identity resolution), proven by
# regression. This is the THIRD instance this month of security-assumed-at-a-boundary-the-
# component-does-not-control (with the DA read path and the SDK's MESH_DEV_TOKEN); two of the
# three were wrong, which is why this one is probed rather than nodded at. A row asserting a
# gate must name WHERE VERIFICATION ACTUALLY OCCURS, not merely that a check exists.
version: 1
services:

  ontology_service:
    file: agent_fleet/ontology_service/main.py
    # INBOUND TRANSPORT AUTH (2026-08-07) — declared ONCE per service, not per row, because it
    # is a FastAPI APP-LEVEL dependency: it covers every route below. Repeating it on each row
    # would misdescribe an app-wide property as a per-route decision, which is how the old
    # "gate present" rows came to mean less than they read.
    # Satisfies all three clauses of the amended definition of PRESENT:
    inbound_transport_auth:
      implementation: iagent_mesh.transport_auth   # ONE implementation, SDK-owned
      applied_as: "FastAPI app dependency — make_transport_auth_dependency()"   # (a) APPLIED
      validates: "credential CONTENT against Keycloak JWKS, not mere presence"  # (b) CONTENT
      posture_flag: REQUIRE_TRANSPORT_AUTH                                      # (c) FLAG-GATED
      posture_default: "OBSERVE — logs unverified callers, refuses none"
      announced_at_import: true
    routes:
      - method: GET
        path: /health
        identity: none
        gate: none
        exposes: health
        consumers: [k8s-probe]
        class: releasable_by_design
        justification: "liveness only"
      - method: GET
        path: /personas
        identity: none
        gate: none
        exposes: ui-state
        consumers: [frontend]
        class: releasable_by_design
        justification: "releasable persona UI vocabulary"
      - method: GET
        path: /domains
        identity: none
        gate: none
        exposes: ui-state
        consumers: [frontend]
        class: releasable_by_design
        justification: "releasable domain-scope names (UI vocab); mild which-domains-exist"
      - method: GET
        path: /mesh/config
        identity: none
        gate: none
        exposes: ui-state
        consumers: [gateway.py]
        class: releasable_by_design
        justification: "UI config (personas dict + status ONLINE)"
      - method: GET
        path: /get_physical_assets
        identity: none
        gate: none
        exposes: gated-content
        consumers: [none-found]
        class: ungated_by_accident
        justification: "FINDING: existence-oracle — caller supplies a class IRI, receives linked physical DataAsset URNs (IRI->asset mapping); no identity, no gate"
      - method: POST
        path: /classes
        identity: "OPTIONAL-IGNORED — user_email present but never read"
        gate: none
        exposes: gated-content
        consumers: [old-interview restate_analyst:1438]
        class: ungated_by_accident
        justification: "ANCHOR (highest severity): bulk-enumerates every class uri/label/definition for a domain via raw SPARQL; no can_view; identity field ignored. The Slice-2 finding. Must become can_view-applying before the store is repopulated (empty store currently masks the leak)."
      - method: POST
        path: /classify_legacy_table
        identity: none
        gate: none
        exposes: gated-content
        consumers: [dagster/doc-tools]
        class: ungated_by_accident
        justification: "FINDING: returns a resolved class IRI; candidate pool from weaviate_hybrid_search is NOT run through the _can_view_class filter /resolve applies; no identity field"
      - method: POST
        path: /classify_predicate
        identity: "entitled_domains (scope)"
        gate: domain-scope
        exposes: gated-content
        consumers: [dynamic_supervisor.py]
        class: gated
        justification: "domain-scope filter via predicate_hybrid_search; SECONDARY GAP: not per-IRI can_view, so leaks per-IRI existence within an entitled domain"
      - method: POST
        path: /find_compatible_verbs
        identity: "entitled_domains (scope)"
        gate: domain-scope
        exposes: gated-content
        consumers: [dynamic_supervisor.py, spo_interview-slice2]
        class: gated
        justification: "domain-scope verb filter; SECONDARY GAP: subject IRI itself is un-gated existence-oracle; this is the SPO interview's verb-question source"
      - method: POST
        path: /search_predicates
        identity: "entitled_domains (scope; user_id audit-only)"
        gate: domain-scope
        exposes: gated-content
        consumers: [none-live]
        class: gated
        justification: "domain-scope filter; SECONDARY GAP: no per-IRI can_view"
      - method: POST
        path: /find_tool
        identity: none
        gate: none
        exposes: gated-content
        consumers: [none-found]
        class: ungated_by_accident
        justification: "FINDING: routing existence-oracle — verb edge + output_uri class IRI + endpoint; no identity, no gate, no domain filter (INTERNAL routing intent, but ungated)"
      - method: POST
        path: /find_path
        identity: none
        gate: none
        exposes: gated-content
        consumers: [none-found]
        class: ungated_by_accident
        justification: "FINDING: multi-hop verb paths expose verb_iri/output_uri/endpoint; no identity, no gate, no domain filter (INTERNAL routing intent, but ungated)"
      - method: POST
        path: /plan
        identity: none
        gate: none
        exposes: render
        consumers: [dynamic_supervisor.py]
        class: releasable_by_design
        justification: "BAML DecomposeQuery over the user's OWN query; touches no ontology graph, exposes no existence"
      - method: POST
        path: /resolve
        identity: user_email
        gate: "can_view (per-IRI, dark-launched)"
        exposes: gated-content
        consumers: [dynamic_supervisor.py, restate_analyst/main.py]
        class: gated
        justification: "THE exemplar — the ONLY route wired to the per-IRI _can_view_class gate (flag-gated). The Slice-2 subject source should route through this gate."
      - method: POST
        path: /route_intent
        identity: "OPTIONAL-IGNORED — persona/entitled_domains echoed, not gated"
        gate: none
        exposes: render
        consumers: [gateway.py]
        class: releasable_by_design
        justification: "intent extraction (mode, entity_refs) from query; no ontology existence exposed"
      - method: POST
        path: /route_and_plan
        identity: none
        gate: none
        exposes: render
        consumers: [none-legacy]
        class: releasable_by_design
        justification: "legacy LLM classifier -> intent/domain/task_plan; no class IRIs returned"

      # ── The six undeclared engine-o routes, DECLARED 2026-08-12 ────────────────────────
      # Classes assigned per [[gate-class-follows-the-effect]]. None of the six has any auth
      # dependency (verified: zero Depends/current_user/token lines inside each definition), and
      # the service is ClusterIP with no ingress.
      #
      # THE READS AND THE WRITES SPLIT, and the packet's original proposal did NOT. It proposed
      # all six as `internal`; the human's disposition accepted "the READ/ORCHESTRATION routes
      # engine-o exposes to in-cluster callers", which is not all six. The law that landed after
      # that proposal is explicit: internal reads are acceptable WHILE THE CLOSURE HOLDS, and
      # effect/integrity writes are never acceptable on in-cluster reachability alone. So the two
      # writes below are FINDINGS, not `internal`.
      - method: POST
        path: /resolve_instance
        identity: none
        gate: none
        exposes: gated-content
        consumers: [review_composer.py, datahub_wrapper]
        class: internal
        justification: >-
          Identifier -> instance resolution. READ; changes no state. ClusterIP, no ingress.
          `internal` is honest ONLY while the cluster boundary is the trust boundary — the
          condition is restated rather than assumed, and it EXPIRES at a shared cluster. Its
          expiry is the trigger on [[engine-o-internal-hardening]].
      - method: POST
        path: /policy_rules
        identity: none
        gate: none
        exposes: gated-content
        consumers: [policy_rules_client.py]
        class: internal
        justification: "Serves ruleset Turtle. READ. Same closure condition as /resolve_instance."
      - method: POST
        path: /operable_subjects
        identity: "user_email in body — domain/can_view scope, not a transport gate"
        gate: domain-scope
        exposes: gated-content
        consumers: [spo_interview.py]
        class: internal
        justification: >-
          The OPERATION-subject menu. READ. `user_email` in the BODY scopes can_view; that is a
          CONTENT gate on the answer, not authentication of the caller — the two must not be
          read as one, which is the transport-vs-entitlement distinction this file exists to keep.
      - method: POST
        path: /instances_by_property
        identity: none
        gate: none
        exposes: gated-content
        consumers: [gateway.py]
        class: internal
        justification: "Property -> instance lookup. READ. Same closure condition."
      - method: POST
        path: /write_item_state
        identity: none
        gate: none
        exposes: action
        consumers: [dispatch_driver.py]
        class: ungated_by_accident
        justification: >-
          FINDING. INTEGRITY WRITE — stamps disposition state onto an item's node. Per
          [[gate-class-follows-the-effect]] an effect/integrity write is NEVER acceptable on
          in-cluster reachability alone, so this does not take `internal` despite the ClusterIP
          posture that covers its read siblings.
          The authority model today is caller-side only: `can_invoke(mesh:dispatchDispositions)`
          is checked by the executor BEFORE dispatch, and the endpoint authenticates nobody. So
          the mesh decides who may cause the effect and the effect endpoint trusts the mesh —
          coherent, and a single point of failure with no defence in depth. An in-cluster caller
          that bypasses the executor writes item state with no capability check anywhere.
          CALLER SIDE REMEDIATED 2026-08-11: dispatch_driver now mints svc:review-starter here
          (correct BY DESIGN — it is that role's own governed effect). The ENDPOINT side is still
          open, and the two were always meant to be fixed together.
      - method: POST
        path: /write_decision_record
        identity: none
        gate: none
        exposes: action
        consumers: [decision_record_writer.py]
        class: ungated_by_accident
        justification: >-
          FINDING. PROVENANCE/INTEGRITY WRITE — appends to the decision-record corpus, which is
          the artifact the trust-lifecycle arc exists to make truthful. Same law, same column as
          /write_item_state: not `internal`.
          Its caller DEGRADES rather than stops (its own log reads "the corpus has a HOLE here"),
          which makes this the quieter of the two failures and the worse one for audit — under
          REQUIRE the hole becomes routine rather than exceptional, and nothing announces it.

