        class: ungated_by_accident
        justification: "FINDING: existence-oracle — identifier -> catalog URN/label/IRI (dataset/dashboard/chart names) for any token; NO identity field in the model, NO gate. Same-file query_metadata gates on caller_email; this resolution sibling threads neither. Identity dies here: provider model has no field to receive user_email."
      # DECLARED 2026-08-12. The packet proposed `internal` at LOW confidence, explicitly because
      # the wrapper's exposure could not be confirmed — "checked against how the wrapper is
      # actually reachable before it is written down."
      # NOW CHECKED, and that is the only reason this row is written: the chart's Ingress covers
      # cortex-ui, cortex-bff, dagster and electric ONLY. datahub-wrapper has no ingress and is
      # ClusterIP, so the closure condition on row 1 of the law genuinely applies here.
      - method: POST
