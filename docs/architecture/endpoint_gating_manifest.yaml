        justification: "FINDING (CRITICAL — credential exposure): returns raw physical DB credentials (Postgres/ClickHouse username+password, S3 keys) for a URN, to any caller who POSTs a known URN. No identity, no gate — the only protection is the /internal/ path name + network placement. A secret-minting surface protected by network isolation alone."

