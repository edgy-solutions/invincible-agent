  planning_agent:
    inbound_transport_auth: engine-p
    notes: |
      Engine P — twelve planning verbs over server-owned plan state (ADR-0042). Every response
      carries `output_uri` and rows and NAMES NO ARCHETYPE; presentation is
      select_presentation's decision from the payload against the caller's registered menu.

      REACHED ONLY VIA cortex-bff's /plan/measure, never by a browser. The engine is
      cluster-internal and takes the mesh transport-auth dependency in OBSERVE posture, the
      same as every other engine — it was born WITHOUT it and the glob-based transport seal
      caught that on its first run, which is why this service now appears here at all.
    routes:
      - method: GET
        path: /health
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: liveness
        consumers: [kubelet]
        class: releasable_by_design
        justification: "liveness only — verb count and store version, no plan content"
      - method: GET
        path: /verbs
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: capability-catalogue
        consumers: [cortex-bff, operators]
        class: releasable_by_design
        justification: "the engine's own view of what it registered. Diagnostic: when this and
          the mesh disagree, registration is what failed. Names verbs and output types, never
          plan data."
      - method: POST
        path: /measure/{fn}
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: read-model
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "executes one verb over one state_ref. Returns output_uri + rows +
          state_version. An out-of-model subject is 422 not_in_model, never an empty 200 —
          an empty row set renders as 'none found', a false statement about something that
          does not exist."
      - method: GET
        path: /state/{state_ref}/version
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: read-model
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "the cheap poll behind ADR-0042 OQ1's pull trigger. An integer only —
          a client holding an older version knows to re-request without being told."
      - method: POST
        path: /scenario
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: action
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "forks a named scenario from baseline or another scenario. Creates no
          plan change by itself."
      - method: GET
        path: /scenario
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: read-model
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "open scenarios with their versions and op counts"
      - method: POST
        path: /scenario/{scenario_id}/op
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: action
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "appends one op to a scenario and bumps its version. Validated by
          applying eagerly, so a bad op is refused at POST time rather than surfacing at read
          time — a silently-dropped op would leave the room believing it made a change the
          diff never shows."
      - method: POST
        path: /scenario/{scenario_id}/commit
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: action
        consumers: [cortex-bff]
        class: ungated_by_accident
        justification: "PROMOTES a scenario's ops onto the BASELINE — the only engine-p route
          that mutates shared state rather than a caller's own fork. Every other write here is
          scenario-scoped and discardable; this one is not. Classed ungated_by_accident, NOT
          releasable_by_design: `gate-class-follows-the-effect` puts a write that changes what
          everyone else reads in the never-acceptable-on-in-cluster-reachability column, and
          in-cluster reachability is the only thing standing in front of it today. The gate is
          owed; recording it as accidental keeps that owed-ness visible instead of laundering
          the current posture into a decision."
      - method: POST
        path: /scenario/{scenario_id}/reschedule
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: action
        consumers: [cortex-bff]
        class: releasable_by_design
        justification: "rewrites dates within ONE scenario and bumps its version. Scenario-scoped
          like /op — the fork is the caller's own working copy and committing is a separate,
          gated act above. Discarding the scenario discards this entirely."
      - method: POST
        path: /baseline/op
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: action
        consumers: [cortex-bff]
        class: internal
        justification: "THE ONE ROUTE THAT WRITES BASELINE, and deliberately narrow: funding
          ops only. A schedule change here is a 400 — the anti-goal 'no editing baseline
          directly from a drag' with a stack trace.
          `internal` describes its REACHABILITY honestly (cluster-only, cortex-bff is the sole
          caller) and deliberately does not describe it as safe. Baseline is the shared plan of
          record and this is the only door to it, so when persistence lands in Phase 4 this
          route needs a CALLER IDENTITY and a change record, not just a transport posture.
          Recorded here rather than in a packet because the manifest is where the next reader
          of this route will actually be looking."
      - method: POST
        path: /resolve_instance
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: existence
        consumers: [engine-o /resolve fan-out]
        class: ungated_by_accident
        justification: "THE mesh:resolveInstance PROVIDER for PORTFOLIO_PLANNING. Turns a spoken
          name into an instance id — 'the Aurora site' -> S1 — so it EXPOSES EXISTENCE: a caller
          learns whether a named entity is in the plan, and an empty candidate list is itself an
          answer about the model's contents. Read-only, no effect, and the fan-out that calls it
          is in-cluster.
          `ungated_by_accident` rather than `internal` DELIBERATELY. Reachability is the only
          thing protecting it, and the four sibling providers (engine-d, engine-e, engine-o,
          engine-fin) share that posture — so this is a FLEET-WIDE property of the
          mesh:resolveInstance contract, not a gap unique to engine-p. The contract carries no
          caller identity at all: `{identifier, query}` has nowhere to put one. Gating it means
          changing the verb's contract for every provider, which is a mesh decision and not a
          per-engine one."
      - method: POST
        path: /enumerate_instances
        identity: none
        gate: "transport auth (OBSERVE)"
        exposes: existence
        consumers: [supervisor ask disposition via ENUMERATE_INSTANCES_URL]
        class: ungated_by_accident
        justification: "THE mesh:enumerateInstances PROVIDER. Exposes MORE existence than
          resolve does, and that difference is the reason this row is written out rather than
          copied: resolve answers 'is this one thing here?', enumerate answers 'what is here?'
          and returns the membership of a class — 9 capabilities, 4 sites — to any in-cluster
          caller.
          Same fleet-wide contract gap as resolve above (`{class_uri}` carries no identity), and
          the same mesh-level decision. Two things bound the exposure today and BOTH are
          incidental rather than designed: the menu bound of 8 truncates larger classes to a
          count, and PlanState holds notional demo data. Neither is a gate. When this substrate
          holds real portfolio data, this route is the first one to revisit."

