  # RETIRED AND DELETED 2026-08-07 — `core_authz` (agent_fleet/core/authz.py).
  #
  # AMENDED ABOVE THE ORIGINAL, which is preserved here because the row itself was the
  # defect worth remembering. It read:
  #
  #   "core/authz.py is a GATE HELPER (require_topaz_auth dependency factory), not a FastAPI
  #    service — it defines NO routes... It is the reusable Topaz-check dependency the ungated
  #    routes above should adopt."
  #
  # That last clause is the FALSE ROW. The manifest — the map of the fleet's gating posture —
  # was actively RECOMMENDING that every ungated route adopt this helper. Anyone who followed
  # the map would have wired an unsound gate across the fleet and recorded it as progress.
  #
  # WHY UNSOUND, not merely unapplied: it decoded the bearer with `verify_signature=False`,
  # deferring to "the API Gateway/BFF" — security assumed at a boundary the process does not
  # control. With ENABLE_AGENTIC_AUTH flipped it would have accepted any FORGED token carrying
  # a `sub` claim and then asked Topaz about that unauthenticated identity. The flag would have
  # read as enforcement while authenticating nobody: the audit-by-name failure this manifest's
  # 2026-08-07 amendment exists to catch, found in the manifest's own recommendation.
  #
  # Deleted rather than repaired because a second implementation of inbound verification is
  # precisely what the one-implementation ruling forbids. Verification now lives in
  # `iagent_mesh.transport_auth`, declared per-service above as `inbound_transport_auth`.
  #
  # Species 1 of the amendment header (IMPORTABLE-BUT-UNAPPLIED) is hereby CLOSED: its named
  # instance no longer exists. The species stays documented — the class outlives the member.
