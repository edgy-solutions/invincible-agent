        path: /me/human_tasks
        identity: get_current_user
        gate: "auth + self-scoped (recipient_id=authz_id)"
        exposes: gated-content
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "caller's own HITL queue (self-scoped filter)"
      - method: GET
        path: /me/canvases
        identity: get_current_user
        gate: "auth + self-scoped"
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "caller's own stored canvases"
      - method: PUT
        path: /me/canvases
        identity: get_current_user
        gate: "auth + self-scoped"
        exposes: action
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "upserts the caller's own canvas set"
      - method: POST
        path: /access_requests
        identity: get_current_user
        gate: "auth; subject forced to caller authz_id; grant gated at approval"
        exposes: action
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "self-service access request; the actual grant is gated downstream at approval"
      - method: POST
        path: /register_frontend_capabilities
        identity: get_current_user
        gate: auth-only
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "logs a capability advertisement; benign"
      - method: POST
        path: /internal/human_tasks/register
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [workflow/service seam]
        class: gated
        justification: "auth-gated. FINDING (over-permissioned): caller is any authenticated user, not restricted to a service identity (docstring says it should be). Tighten to a service principal."
      - method: POST
        path: /canvas/lineage_edges
        identity: "get_current_user -> caller_email + entitled_domains"
        gate: "delegates:datahub_wrapper /lineage_edges"
        exposes: gated-content
        consumers: [cortex-ui GRAPH mode]
        class: delegates
        justification: "threads identity to Engine D whose catalog gate applies"
      - method: POST
        path: /human_tasks/{task_id}/act
        identity: get_current_user
        gate: "can_act (Topaz re-check) + queue-membership 404"
        exposes: action
        consumers: [cortex-ui]
        class: gated
        justification: "high-privilege: approve/reject -> resumes a Restate workflow / writes a grant; deny-by-default Topaz can_act"
      - method: POST
        path: /orchestrate
        identity: "get_current_user -> user_email + entitled_domains + persona"
        gate: "auth + ADR-0026 cell-entitlement (403 cell_not_entitled); content gate downstream"
        exposes: action
        consumers: [cortex-ui main chat]
        class: delegates
        justification: "primary surface; cell-entitlement checked here, per-asset content gate applied downstream with the threaded identity"
      - method: POST
        path: /interview/stream
        identity: "get_current_user -> user_email + entitled_domains + persona"
        gate: "auth + ADR-0026 cell-entitlement; content gate downstream"
        exposes: action
        consumers: [cortex-ui]
        class: delegates
        justification: "same as /orchestrate (streaming variant)"
      - method: POST
        path: /decision_subgraph
        identity: get_current_user
        gate: "auth-only (bounded to OntologyClass schema)"
        exposes: gated-content
        consumers: [cortex-ui decision-path map]
        class: releasable_by_design
        justification: "auth-gated ontology CLASS schema neighborhood (low sensitivity); NOTE: no entitlement filter — revisit if class existence becomes compartment-sensitive"
      - method: GET
        path: /federated_image
        identity: "get_current_user -> entitled_domains"
        gate: "auth + domain-scope"
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "streams procedure-diagram bytes from MinIO; domain-scope filter. WEAK SPOT: domain-only, no per-asset Topaz; non-convention buckets pass through"
      - method: GET
        path: /data_module/figures
        identity: get_current_user
        gate: auth-only
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "auth-gated figure metadata (incl S3 url) for any caller-supplied DataModule URI. FINDING: no domain/Topaz scope on the arbitrary URI (bytes themselves gated by /federated_image)"
      - method: GET
        path: /electric/shape
        identity: "get_current_user -> authz_id + sub"
        gate: "self-scoped WHERE injection (recipient_id=authz_id / produced_for_user_id=sub)"
        exposes: gated-content
        consumers: [cortex-ui Electric subscription]
        class: gated
        justification: "strips client WHERE, server-injects a self-scoped filter; ownership isolation (interim, not full Topaz ACL)"
      - method: GET
        path: /node_details/{node_id}
        identity: get_current_user
        gate: none
        exposes: gated-content
        consumers: [cortex-ui NodeInspector]
        class: ungated_by_accident
        justification: "FINDING: authenticated but NO content gate — raw Neo4j node ALL-properties for any caller-supplied id; effectively read-anything-in-the-graph. (Auth required, so lower severity than the unauthenticated routes.)"
      - method: GET
        path: /graph/node/{node_id}
        identity: get_current_user
        gate: none
        exposes: gated-content
        consumers: [cortex-ui NodeInspector]
        class: ungated_by_accident
        justification: "FINDING: same as /node_details — authenticated, no content gate, returns any node's full properties"
      - method: POST
        path: /compile
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [cortex-ui workflow builder]
        class: gated
        justification: "auth-gated. FINDING (over-permissioned): any authenticated user can upsert bpmn_catalog + trigger a Dagster ReloadWorkspace mutation. Privileged write with no authorization beyond auth."
      - method: POST
        path: /workflow/compile
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [cortex-ui]
        class: gated
        justification: "alias of /compile; same over-permissioned FINDING"
      - method: POST
        path: /bpmn/save
        identity: none
        gate: "410-retired"
        exposes: action
        consumers: [none — no live HTTP reader; /compile is the authenticated writer]
        class: retired
        justification: "RETIRED (ADR-0029 Slice 2, gateway.py returns 410). WAS an unauthenticated workflow-definition WRITE (audit HIGH, browser-facing) — CLOSED now as a standalone security fix; superseded by git-asserted policy/workflows/*.yaml. DELETED later, coupled to the SPO-interview replacement being sealed (with the models + auto-compile path)."
      - method: GET
        path: /bpmn/catalog
        identity: none
        gate: "410-retired"
        exposes: gated-content
        consumers: [none — Dagster reads the bpmn_catalog TABLE directly, not this HTTP route]
        class: retired
        justification: "RETIRED (ADR-0029 Slice 2, gateway.py returns 410). WAS an unauthenticated enumerate of ALL workflow definitions (audit HIGH, browser-facing) — CLOSED now. DELETED later with the Slice-2 cleanup."

  domain_broker:
