  gateway:
    file: src/iagent/gateway.py
    routes:
      - method: GET
        path: /health
        identity: none
        gate: none
        exposes: health
        consumers: [k8s-probe]
        class: releasable_by_design
        justification: "liveness only"
      - method: GET
        path: /mesh/config
        identity: get_current_user
        gate: auth-only
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "auth-gated generic UI/persona config proxy; nothing per-user gated"
      - method: GET
        path: /me/entitlements
        identity: get_current_user
        gate: "auth + self-scoped"
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "returns the caller's OWN (persona,domain) matrix"
      - method: GET
        path: /me/human_tasks
        identity: get_current_user
        gate: "auth + self-scoped (recipient_id=authz_id)"
        exposes: gated-content
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "caller's own HITL queue (self-scoped filter)"
      - method: POST
        path: /plan/measure/{fn}
        identity: get_current_user
        gate: "auth + engine-side entitlement"
        exposes: read-model
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "thin pass-through to Engine P's planning verbs. Carries output_uri and
          rows and NAMES NO ARCHETYPE — presentation is select_presentation's decision from the
          payload against the caller's registered menu (ADR-0042 §2). Plan state is portfolio
          read-model, entitlement-scoped where the verb runs; the BFF adds no scoping of its
          own and must not, or there would be two places deciding what a caller may see."
      # THE PLAN WRITE SEAM. Five MUTATING routes, and not one of them may borrow
      # /plan/measure's row above. That route is releasable_by_design because "plan state is
      # portfolio read-model, entitlement-scoped where the verb runs; the BFF adds no scoping
      # of its own and must not". Neither clause survives contact with a write: reading an
      # entitled read-model and CHANGING it are different acts, and "the engine will scope it"
      # is not an authorization story for a mutation. Each row below states its own.
      - method: POST
        path: /plan/scenario
        identity: get_current_user + entitled_domains
        gate: "auth + PORTFOLIO_PLANNING domain (BFF) + engine-side validation"
        exposes: mutation
        consumers: [cortex-ui]
        class: gated
        justification: "creates a scenario — the sandbox a drag happens in, so no drag ever
          edits baseline. Writes no plan CONTENT: a fork is an empty op list against a named
          base. Gated on PORTFOLIO_PLANNING because an unentitled caller creating scenarios is
          both a write and a way to learn which base refs resolve. Duplicate id is the engine's
          409, forwarded."
      - method: POST
        path: /plan/scenario/{scenario_id}/op
        identity: get_current_user + entitled_domains
        gate: "auth + PORTFOLIO_PLANNING domain (BFF) + engine-side UnknownTarget refusal"
        exposes: mutation
        consumers: [cortex-ui]
        class: gated
        justification: "appends ONE op to a scenario — the primitive every plan change is made
          of. Scenario-scoped by construction: it cannot reach baseline, which has its own route
          with its own narrower rule. An op naming something the model does not contain is the
          engine's 400 and must stay one — a silently-dropped op is the failure where the room
          believes it made a change, the diff shows nothing, and the decision artifact records
          an op that never applied."
      - method: POST
        path: /plan/baseline/op
        identity: get_current_user + entitled_domains
        gate: "auth + PORTFOLIO_PLANNING domain (BFF) + engine-side funding-ops-only rule"
        exposes: mutation
        consumers: [cortex-ui]
        class: gated
        justification: "THE NARROWEST ROUTE HERE and the only non-ceremony path that touches
          baseline. Funding ops ONLY — the 'costs persist' exception; a schedule op is a 400 at
          the engine, which is the anti-goal 'no editing baseline directly from a drag' with a
          stack trace. The BFF proxy is deliberately thin: widening it into a generic passthrough
          would defeat the rule it exists to serve, so the engine's kind-check is load-bearing
          and must never be duplicated-then-relaxed here."
      - method: POST
        path: /plan/scenario/{scenario_id}/reschedule
        identity: get_current_user + entitled_domains
        gate: "auth + PORTFOLIO_PLANNING domain (BFF) + engine-side derivation and refusal"
        exposes: mutation
        consumers: [cortex-ui]
        class: gated
        justification: "the drag. Appends TWO ops — the project move and its derived
          site-impact move, offset-preserved — because a MoveProject alone moves the bar and not
          the load. Scenario-scoped. The client sends only which bar moved and where to: it
          holds no site-impact data, so the derivation happens where the state is and a client
          cannot inject impact windows it would have had to invent."
      - method: POST
        path: /plan/scenario/{scenario_id}/commit
        identity: get_current_user + entitled_domains (ACTOR forced from token)
        gate: "auth + PORTFOLIO_PLANNING domain (BFF) + engine-side rationale gate, ordered first"
        exposes: mutation
        consumers: [cortex-ui]
        class: gated
        justification: "THE ONE PATH THAT WRITES BASELINE FROM A SCENARIO, and the highest-value
          route in this block. Two properties are load-bearing. (1) ACTOR IS NOT ACCEPTED FROM
          THE BODY — the BFF supplies it from the token, because Engine P cannot see who is
          calling and forwarding a client-supplied actor would make the DecisionArtifact, the
          governance record of who moved the portfolio and why, forgeable by anyone who can post
          JSON. A field that cannot be sent cannot be spoofed. (2) THE RATIONALE REFUSAL IS THE
          ENGINE'S AND RUNS FIRST, before the scenario resolves and before any op applies, so a
          refused commit changes nothing; this hop forwards the 422 and re-implements no part of
          it, because two places deciding whether a rationale is blank is how they come to
          disagree."
      - method: GET
        path: /plan/state_version
        identity: get_current_user
        gate: "auth + engine-side entitlement"
        exposes: read-model
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "the refresh loop's pull trigger (ADR-0042 OQ1). Returns ONE INTEGER and
          the ref it answered for — a monotonic counter that says whether plan state moved, never
          what moved or what it now says. Reading it reveals only that SOME op was applied to a
          named scenario, which the caller already had to know the name of to ask. Thin
          pass-through to Engine P, which owns the entitlement decision; the BFF adds no scoping
          of its own for the same reason /plan/measure does not — two places deciding what a
          caller may see is how they diverge. An unknown ref is a 404 rather than a 200 with 0,
          so the endpoint cannot be used to probe which scenarios exist without already being
          able to read them."
      - method: POST
        path: /canvas/seed
        identity: get_current_user
        gate: "auth; delegates:/seed/portfolio_canvas -> /interview/stream per-ask cell entitlement"
        exposes: action
        consumers: [cortex-ui]
        class: delegates
        justification: >-
          The path cortex calls; a thin alias over POST /seed/portfolio_canvas, which carries
          the full security argument. It adds no identity, no privilege and no bypass: it
          calls the same in-process handler with the same caller, so every ask is still
          re-authenticated and re-checked against the caller's Topaz matrix by
          /interview/stream. Its only work is shaping the response to the receiver's fixed
          contract - {artifact_ids: [...]}, slot-ordered, nothing else - and rejecting a
          canvas_type it has no template for.

          Same amplification note as its target: one authenticated request launches five
          sequential Dagster runs. A caller who can reach this can reach /seed/portfolio_canvas
          directly, so the alias widens no surface.
      - method: POST
        path: /seed/portfolio_canvas
        identity: get_current_user
        gate: "auth; delegates:/interview/stream per-ask cell entitlement (ADR-0026 step 4)"
        exposes: action
        consumers: [cortex-ui]
        class: delegates
        justification: >-
          The seeding intent's server half. It authenticates at the door, then asks five
          questions by calling THIS SERVICE'S OWN /interview/stream once each, FORWARDING THE
          CALLER'S OWN Authorization header. It mints no privilege of its own: every ask is
          re-authenticated and re-checked against the caller's Topaz entitlement matrix by
          /interview/stream, and a non-entitled persona/domain cell 403s there exactly as it
          would for a typed question. Artifacts are minted for the caller. Stripping the
          header does not escalate — it makes all five asks 401 and the seed returns five
          holes.

          THIS IS WHY IT ASKS QUESTIONS RATHER THAN INVOKING VERBS. Calling engine-p's
          /measure/* directly would have been shorter and would have produced cards with no
          decision path, no routing record and no entitlement check — governance bypass in a
          convenience's clothing. Delegating to the interview path is what makes "seeded
          exactly like a typed question" a property rather than a claim, and it is the reason
          this row is `delegates` rather than `gated`: the authorization decision is not made
          here, and must not be.

          NAMED HONESTLY — AMPLIFICATION, NOT AUTHZ: one authenticated request launches five
          sequential Dagster runs (~18 min, ~210s each). That is a resource cost an entitled
          caller can repeat, not a privilege they can exceed. Sequential execution is
          deliberate (max_concurrent_runs is 2 and the run-monitoring reaper gap has
          deadlocked this queue twice), so the ceiling is one in-flight run per seed rather
          than five. If seeding ever becomes unauthenticated or batched, this row must be
          re-argued before that ships.
      - method: GET
        path: /me/canvases
        identity: get_current_user
        gate: "auth + self-scoped"
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "caller's own stored canvases"
      - method: PUT
        path: /me/canvases
        identity: get_current_user
        gate: "auth + self-scoped"
        exposes: action
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "upserts the caller's own canvas set"
      - method: POST
        path: /access_requests
        identity: get_current_user
        gate: "auth; subject forced to caller authz_id; grant gated at approval"
        exposes: action
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "self-service access request; the actual grant is gated downstream at approval"
      - method: POST
        path: /register_frontend_capabilities
        identity: get_current_user
        gate: auth-only
        exposes: ui-state
        consumers: [cortex-ui]
        class: releasable_by_design
        justification: "logs a capability advertisement; benign"
      - method: POST
        path: /internal/human_tasks/register
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [workflow/service seam]
        class: gated
        justification: "auth-gated. FINDING (over-permissioned): caller is any authenticated user, not restricted to a service identity (docstring says it should be). Tighten to a service principal."
      - method: POST
        path: /canvas/lineage_edges
        identity: "get_current_user -> caller_email + entitled_domains"
        gate: "delegates:datahub_wrapper /lineage_edges"
        exposes: gated-content
        consumers: [cortex-ui GRAPH mode]
        class: delegates
        justification: "threads identity to Engine D whose catalog gate applies"
      - method: POST
        path: /human_tasks/{task_id}/act
        identity: get_current_user
        gate: "can_act (Topaz re-check) + queue-membership 404"
        exposes: action
        consumers: [cortex-ui]
        class: gated
        justification: "high-privilege: approve/reject -> resumes a Restate workflow / writes a grant; deny-by-default Topaz can_act"
      - method: POST
        path: /orchestrate
        identity: "get_current_user -> user_email + entitled_domains + persona"
        gate: "auth + ADR-0026 cell-entitlement (403 cell_not_entitled); content gate downstream"
        exposes: action
        consumers: [cortex-ui main chat]
        class: delegates
        justification: "primary surface; cell-entitlement checked here, per-asset content gate applied downstream with the threaded identity"
      - method: POST
        path: /interview/stream
        identity: "get_current_user -> user_email + entitled_domains + persona"
        gate: "auth + ADR-0026 cell-entitlement; content gate downstream"
        exposes: action
        consumers: [cortex-ui]
        class: delegates
        justification: "same as /orchestrate (streaming variant)"
      - method: POST
        path: /decision_subgraph
        identity: get_current_user
        gate: "auth-only (bounded to OntologyClass schema)"
        exposes: gated-content
        consumers: [cortex-ui decision-path map]
        class: releasable_by_design
        justification: "auth-gated ontology CLASS schema neighborhood (low sensitivity); NOTE: no entitlement filter — revisit if class existence becomes compartment-sensitive"
      - method: GET
        path: /federated_image
        identity: "get_current_user -> entitled_domains"
        gate: "auth + domain-scope"
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "streams procedure-diagram bytes from MinIO; domain-scope filter. WEAK SPOT: domain-only, no per-asset Topaz; non-convention buckets pass through"
      - method: GET
        path: /data_module/figures
        identity: get_current_user
        gate: auth-only
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "auth-gated figure metadata (incl S3 url) for any caller-supplied DataModule URI. FINDING: no domain/Topaz scope on the arbitrary URI (bytes themselves gated by /federated_image)"
      - method: GET
        path: /electric/shape
        identity: "get_current_user -> authz_id + sub"
        gate: "self-scoped WHERE injection (recipient_id=authz_id / produced_for_user_id=sub)"
        exposes: gated-content
        consumers: [cortex-ui Electric subscription]
        class: gated
        justification: "strips client WHERE, server-injects a self-scoped filter; ownership isolation (interim, not full Topaz ACL)"
      - method: GET
        path: /node_details/{node_id}
        identity: get_current_user
        gate: none
        exposes: gated-content
        consumers: [cortex-ui NodeInspector]
        class: ungated_by_accident
        justification: "FINDING: authenticated but NO content gate — raw Neo4j node ALL-properties for any caller-supplied id; effectively read-anything-in-the-graph. (Auth required, so lower severity than the unauthenticated routes.)"
      - method: GET
        path: /graph/node/{node_id}
        identity: get_current_user
        gate: none
        exposes: gated-content
        consumers: [cortex-ui NodeInspector]
        class: ungated_by_accident
        justification: "FINDING: same as /node_details — authenticated, no content gate, returns any node's full properties"
      - method: POST
        path: /compile
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [cortex-ui workflow builder]
        class: gated
        justification: "auth-gated. FINDING (over-permissioned): any authenticated user can upsert bpmn_catalog + trigger a Dagster ReloadWorkspace mutation. Privileged write with no authorization beyond auth."
      - method: POST
        path: /workflow/compile
        identity: get_current_user
        gate: auth-only
        exposes: action
        consumers: [cortex-ui]
        class: gated
        justification: "alias of /compile; same over-permissioned FINDING"
      - method: POST
        path: /bpmn/save
        identity: none
        gate: "410-retired"
        exposes: action
        consumers: [none — no live HTTP reader; /compile is the authenticated writer]
        class: retired
        justification: "RETIRED (ADR-0029 Slice 2, gateway.py returns 410). WAS an unauthenticated workflow-definition WRITE (audit HIGH, browser-facing) — CLOSED now as a standalone security fix; superseded by git-asserted policy/workflows/*.yaml. DELETED later, coupled to the SPO-interview replacement being sealed (with the models + auto-compile path)."
      - method: GET
        path: /bpmn/catalog
        identity: none
        gate: "410-retired"
        exposes: gated-content
        consumers: [none — Dagster reads the bpmn_catalog TABLE directly, not this HTTP route]
        class: retired
        justification: "RETIRED (ADR-0029 Slice 2, gateway.py returns 410). WAS an unauthenticated enumerate of ALL workflow definitions (audit HIGH, browser-facing) — CLOSED now. DELETED later with the Slice-2 cleanup."

      # ── The five undeclared cortex-bff routes, DECLARED 2026-08-12 ────────────────────
      # All five carry `current_user: User = Depends(get_current_user)`, verified per route at
      # the line numbers below. This is the USER plane, so the gate is Keycloak JWT verification
      # at get_current_user — signature checked against live JWKS with algorithms=["RS256"]
      # PINNED, and every failure path 401s including the JWKS-fetch catch-all.
      # `gated` here is the STRONGEST class in this file and the only place it is earned by
      # verification rather than by reachability — which is exactly why these five were the
      # highest-confidence rows in the recommendation and the lowest-risk to write down.
      - method: POST
        path: /reviews
        identity: "current_user (verified JWT)"
        gate: auth-only
        exposes: action
        consumers: [cortex-ui]
        class: gated
        justification: "gateway.py:510. Stamps the approver FROM THE TOKEN rather than the body — the caller cannot name who approved."
      - method: POST
        path: /triage_tasks
        identity: "current_user (verified JWT)"
        gate: auth-only
        exposes: action
        consumers: [cortex-ui, dispatch_driver.py]
        class: gated
        justification: "gateway.py:332."
      - method: GET
        path: /instances_by_property
        identity: "current_user (verified JWT)"
        gate: auth-only
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "gateway.py:944. Front-door twin of engine-o's internal route of the same name — same name, DIFFERENT plane and different gate; do not read one as covering the other."
      - method: GET
        path: /notices/{notice_id}/provenance
        identity: "current_user (verified JWT)"
        gate: auth-only
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "gateway.py:904."
      - method: GET
        path: /reviews/{workflow_id}/batch
        identity: "current_user (verified JWT)"
        gate: auth-only
        exposes: gated-content
        consumers: [cortex-ui]
        class: gated
        justification: "gateway.py:639. Additionally filters on the CALLER'S OWN pending queue, so it is existence-oracle safe: a caller cannot learn that a review exists for someone else."

