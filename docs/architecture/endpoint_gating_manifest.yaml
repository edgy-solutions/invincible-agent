        gate: none
        exposes: gated-content
        consumers: [doc-tools lineage assets]
        class: internal
        justification: >-
          Read-only catalogue lineage by platform. READ; changes no state. ClusterIP, no ingress
          (verified against the chart's Ingress template, not assumed from the route's shape).
          Same expiring closure condition as engine-o's reads.

