    persona: PROGRAM_FINANCE_ANALYST
    domains: [PROGRAM_FINANCE]
    expect_verb: fin_eac_comparison
    expect_archetype: COMPETING_MEASURES
    min_rows: 3
    dispositions: [drawn]
    # COULD NOT DRAW AT ALL BEFORE 2026-09-18. The archetype existed at every layer from
