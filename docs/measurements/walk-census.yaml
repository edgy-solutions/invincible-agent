    user: alice
    persona: PROGRAM_FINANCE_ANALYST
    domains: [PROGRAM_FINANCE]
    expect_verb: fin_funding_status
    expect_archetype: SHORTFALL_GRID
    min_rows: 18
    dispositions: [drawn]
    # SIX FUNDING LINES ACROSS THREE PERIODS. The floor is the full grid rather than a token
