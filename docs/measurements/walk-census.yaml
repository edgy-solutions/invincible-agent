    question: show me CPI and SPI for NP-MERIDIAN
    user: alice
    persona: PROGRAM_FINANCE_ANALYST
    domains: [PROGRAM_FINANCE]
    expect_verb: fin_performance_indices
    expect_archetype: MULTI_SERIES
    min_rows: 6
    dispositions: [drawn]
    # THE ONE FINANCE VERB THAT DECLARES NO UNIT, deliberately: CPI is a ratio and a dollar sign
