    sheet: docs/measurements/finance-walk-sheet.md
    sheet_index: 4
    question: what is the burn rate on NP-MERIDIAN
    user: alice
    persona: PROGRAM_FINANCE_ANALYST
    domains: [PROGRAM_FINANCE]
    expect_verb: fin_burn_rate
    expect_archetype: MULTI_SERIES
    min_rows: 6
    dispositions: [drawn]
    # TWO SERIES, and the row floor cannot see that. A card drawing cumulative spend alone
