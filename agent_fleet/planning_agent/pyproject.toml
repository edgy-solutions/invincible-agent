[project]
name = "planning-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG, same as every other engine: this package governs fleet auth,
    # so a floating ref would let one SDK commit change every engine's security behaviour
    # at rebuild. Matched to the fleet pin; tests/test_lock_coherence.py polices drift.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.4.0",
    "fastapi",
    "hypercorn",
    "pydantic",
    "httpx",
    "python-dotenv",
]

# DELIBERATELY THIN. Engine P computes over an in-memory plan model and speaks to nobody:
# no LLM client, no smolagents, no DataHub, no restate. ADR-0042 §3 puts the measures here
# because a verb must run where verbs run — not because this engine needs the fleet's
# machinery. Every dependency added here should have to explain itself.
