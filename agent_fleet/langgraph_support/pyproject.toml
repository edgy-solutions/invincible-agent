[tool.poetry]
package-mode = false

[project]
name = "langgraph-support"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "langchain-openai",
    "psycopg[binary]",
    "baml-py==0.219.0",
    "python-dotenv",
    "langfuse",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
