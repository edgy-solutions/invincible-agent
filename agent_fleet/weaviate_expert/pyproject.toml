[project]
name = "weaviate-expert"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "hypercorn",
    "pydantic",
    "restate-sdk==0.14.0",
    "smolagents",
    "litellm",
    "baml-py==0.219.0",
    "httpx",
    "weaviate-client>=4.5.4",
    "python-dotenv",
    "packaging",
    "acryl-datahub",
    "langfuse>=3.0.0",   # ADR-0038 v4 telemetry
    "provenance-telemetry @ git+https://github.com/edgy-solutions/provenance-telemetry.git",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
