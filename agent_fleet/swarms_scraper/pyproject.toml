[project]
name = "swarms-scraper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "swarms",
    "litellm",
    "baml-py==0.219.0",
    "python-dotenv",
    "langfuse",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
