[project]
name = "data-analyst"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "hypercorn",
    "pydantic",
    "restate-sdk==0.14.0",
    "smolagents",
    "litellm",
    "duckdb",
    "polars",
    "httpx",
    "python-dotenv",
    "dag-tools @ git+https://github.com/edgy-solutions/dag-tools.git@61cbfa92926b8322e5b31e825fd9c9a2796fe805",
    "pyjwt[crypto]",
    "acryl-datahub",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
