[project]
name = "data-analyst"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG: this package governs fleet auth, so a floating ref would let
    # one SDK commit change every engine's security behaviour at rebuild.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.2.0",
    "fastapi",
    "hypercorn",
    "pydantic",
    "restate-sdk==0.14.0",
    "smolagents",
    "litellm",
    "duckdb",
    "polars",
    "httpx",
    "python-dotenv",
    "dag-tools @ git+https://github.com/edgy-solutions/dag-tools.git@61cbfa92926b8322e5b31e825fd9c9a2796fe805",
    "pyjwt[crypto]",
    "acryl-datahub",
    "langfuse>=3.0.0",   # ADR-0038 v4 telemetry (also pulled transitively by the leaf)
    "provenance-telemetry==0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
