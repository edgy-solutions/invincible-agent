[project]
name = "dmc-phone-book"
version = "0.1.0"
description = "B3 — DMC instance-resolution provider for mesh:resolveInstance."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "neo4j",
    "python-dotenv",
    # httpx is REQUIRED to use the mesh-registrar gateway path (post-v0.2
    # canonical registration). Without it, mesh_registration falls back
    # to direct DataHub emit, bypassing Contract D + the saga's read-back
    # probe — exactly what the gateway exists to prevent.
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
