[project]
name = "ontology-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG: this package governs fleet auth, so a floating ref would let
    # one SDK commit change every engine's security behaviour at rebuild.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.2.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "rdflib",
    "baml-py==0.219.0",
    "httpx",
    "python-dotenv",
    "weaviate-client>=4.5.4",
    "neo4j",
    "packaging",
    "langfuse>=3.0.0",   # ADR-0038 v4 telemetry
    "provenance-telemetry==0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
