[project]
name = "finance-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG, same as every other engine: this package governs fleet auth,
    # so a floating ref would let one SDK commit change every engine's security behaviour
    # at rebuild. Matched to the fleet pin; tests/test_lock_coherence.py polices drift.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.3.1",
    "fastapi",
    "hypercorn",
    "pydantic",
    "httpx",
    "python-dotenv",
]

# DELIBERATELY THIN, and copied from Engine P's list rather than from a fuller engine's.
# Engine F computes over a finance model and speaks to nobody: no LLM client, no smolagents,
# no DataHub, no restate. ADR-0045 Decision 5 means it holds no database driver either — the
# governed read goes through the broker's ticket, so a connection string has nowhere to live.
# Every dependency added here should have to explain itself.
