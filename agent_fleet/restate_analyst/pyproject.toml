[project]
name = "restate-analyst"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "hypercorn",
    "pydantic",
    "pyyaml",  # workflow_definition loader (ADR-0029 Slice 1)
    "restate-sdk==0.14.0",
    "smolagents",
    "baml-py==0.219.0",
    "httpx",
    "requests",
    "python-dotenv",
    "mem0ai[nlp]",
    "weaviate-client>=4.5.4",
    "langchain-weaviate",
    "langchain-community",
    "langchain-ollama",
    "langchain-openai",
    "ollama",
    "langfuse",
    "litellm",
    # Mesh membership package — owns transport auth (the app-factory dependency) and the
    # ONE general mint. PINNED TO A TAG, never a branch: this package now governs fleet
    # auth and identity minting, so a floating ref would let a single SDK commit change
    # every engine's security behaviour at rebuild — the library-bump outage class with
    # credentials attached (cf. the doc-tools floating-@rev finding).
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.3.0",
    "provenance-telemetry==0.1.0",  # ADR-0038 telemetry leaf (via baml_shared/telemetry.py shim)
    # ADR-0034 phase 1.3 — ReviewStarter fetches review.json to DERIVE the trust key from the
    # artifact instead of trusting a caller-asserted one. The MinIO credentials were already in
    # engine-a's env (ARTIFACT_BUCKET / MINIO_*) but no S3 client was: the auth was provisioned
    # fleet-wide ahead of a consumer that never arrived, so nothing read them. This is that
    # consumer.
    "boto3",
    "packaging",
    "mcp",
    "acryl-datahub",
    "rdflib",  # pcn_rules_loader + policy_rules_client parse the served rules Turtle (found live: the
               # offline tests overlay --with rdflib, masking that the container image lacked it).
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
