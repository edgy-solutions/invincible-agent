[project]
name = "restate-analyst"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "hypercorn",
    "pydantic",
    "pyyaml",  # workflow_definition loader (ADR-0029 Slice 1)
    "restate-sdk==0.14.0",
    "smolagents",
    "baml-py==0.219.0",
    "httpx",
    "requests",
    "python-dotenv",
    "mem0ai[nlp]",
    "weaviate-client>=4.5.4",
    "langchain-weaviate",
    "langchain-community",
    "langchain-ollama",
    "langchain-openai",
    "ollama",
    "langfuse",
    "litellm",
    "packaging",
    "mcp",
    "acryl-datahub",
    "rdflib",  # pcn_rules_loader + policy_rules_client parse the served rules Turtle (found live: the
               # offline tests overlay --with rdflib, masking that the container image lacked it).
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
