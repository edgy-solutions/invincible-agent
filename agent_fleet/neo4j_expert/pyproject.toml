[project]
name = "neo4j-expert"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG: this package governs fleet auth, so a floating ref would let
    # one SDK commit change every engine's security behaviour at rebuild.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.3.0",
    "fastapi",
    "hypercorn",
    "pydantic",
    "restate-sdk==0.14.0",
    "smolagents",
    "baml-py==0.219.0",
    "httpx",
    "neo4j",
    "mem0ai[nlp]",
    "weaviate-client>=4.5.4",
    "langchain-weaviate",
    "langchain-community",
    "langchain-ollama",
    "langchain-openai",
    "ollama",
    "python-dotenv",
    "langfuse>=3.0.0",
    "provenance-telemetry==0.1.0",
    "litellm",
    "packaging",
    "acryl-datahub",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
