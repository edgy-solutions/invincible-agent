[project]
name = "mesh-registrar"
version = "0.1.0"
description = "Contract D registration gateway for the agentic data mesh."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Mesh membership package — transport auth (the app dependency) + the ONE general
    # mint. PINNED TO A TAG: this package governs fleet auth, so a floating ref would let
    # one SDK commit change every engine's security behaviour at rebuild.
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.2.1",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "httpx",
    "neo4j",
    # acryl-datahub ships here ONCE so engines don't each pay the ~150MB cost.
    "acryl-datahub",
    "python-dotenv",
    # v0.2 saga writes the Weaviate Predicate row directly (lifted from the
    # doc-tools sensor) so the gateway becomes sole writer for AITool
    # registrations. ADR-0006 §Addendum (2026-06-13).
    "weaviate-client>=4.4,<5.0",
    # v0.2.1 (architect's A1, 2026-06-12): wrap the saga in a Restate
    # VirtualObject keyed on (verb_iri, _tool_urn) for crash recovery
    # and multi-replica serialization. Same SDK engine_a pins.
    "restate-sdk==0.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
