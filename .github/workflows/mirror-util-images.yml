name: Mirror utility images

# WHY THIS EXISTS. The chart's minio-bucket-init pre-install/pre-upgrade hook runs `mc`. Upstream
# stopped publishing it: `minio/mc` answers 401 to an anonymous pull on BOTH quay.io and docker.io
# (measured 2026-09-30, and from a GitHub runner too), and no sandbox node caches it. Every
# `helm upgrade` with hooks therefore blocked at hook weight -5 until the helm timeout, and rolls
# had to be fired with `--no-hooks`, which also skips the reregister and ontology-seed hooks.
#
# SO WE BUILD IT, NOT COPY IT. A copy needs a pullable source and there isn't one. The source
# tree is still public, so this builds `mc` from the EXACT upstream release tag the chart already
# pins (`utilImages.mc.tag`), using the same ldflags generator as upstream's Makefile, and pushes
# it under the same tag to a repository we own. The tag is a name for bytes built from one
# upstream commit; re-running at the same release rebuilds that same commit.
#
# OUTSIDE `global.imagePrefix` ON PURPOSE. `ghcr.io/edgy-solutions/mirror/*` is not an image this
# repo builds from its own source, so the chart helper must not treat it as "ours" (which would
# float its tag to Chart.Version), and the release retag must not touch it.
#
# Manual trigger only: it runs when the pinned release changes, never on push.

on:
  workflow_dispatch:
    inputs:
      mc_release:
        description: 'Upstream minio/mc release tag to build (must match utilImages.mc.tag)'
        required: true
        default: 'RELEASE.2025-08-13T08-35-41Z'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mirror/mc

jobs:
  mc:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a tag that is not an upstream release name
        env:
          MC_RELEASE: ${{ inputs.mc_release }}
        run: |
          [[ "$MC_RELEASE" =~ ^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]] \
            || { echo "not a release tag: $MC_RELEASE"; exit 1; }
          git ls-remote --exit-code https://github.com/minio/mc "refs/tags/$MC_RELEASE"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        id: buildx
        continue-on-error: true
      # Same one-retry as build-containers.yml: buildx setup pulls from docker.io and times out
      # transiently.
      - uses: docker/setup-buildx-action@v3
        if: steps.buildx.outcome == 'failure'

      - name: Build and push (linux/arm64 for the cluster, linux/amd64 for everything else)
        env:
          MC_RELEASE: ${{ inputs.mc_release }}
        run: |
          mkdir -p ctx
          cat > ctx/Dockerfile <<'DOCKERFILE'
          FROM --platform=$BUILDPLATFORM golang:1.23-alpine AS build
          ARG MC_RELEASE
          ARG TARGETOS
          ARG TARGETARCH
          RUN apk add --no-cache git
          RUN git clone --depth 1 --branch "$MC_RELEASE" https://github.com/minio/mc /src
          WORKDIR /src
          # Upstream's Makefile turns the tag into the RFC3339 time gen-ldflags expects.
          RUN V=$(echo "$MC_RELEASE" | sed -E 's#RELEASE\.([0-9]+)-([0-9]+)-([0-9]+)T([0-9]+)-([0-9]+)-([0-9]+)Z#\1-\2-\3T\4:\5:\6Z#') \
           && LDFLAGS=$(MC_RELEASE=RELEASE go run buildscripts/gen-ldflags.go "$V") \
           && CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH \
              go build -trimpath -tags kqueue --ldflags "$LDFLAGS" -o /out/mc
          FROM alpine:3.20
          RUN apk add --no-cache ca-certificates
          COPY --from=build /out/mc /usr/bin/mc
          ENTRYPOINT ["mc"]
          DOCKERFILE
          docker buildx build ctx \
            --platform linux/arm64,linux/amd64 \
            --build-arg MC_RELEASE="$MC_RELEASE" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="minio/mc built from upstream $MC_RELEASE" \
            -t "$IMAGE:$MC_RELEASE" \
            --push
          docker buildx imagetools inspect "$IMAGE:$MC_RELEASE" | head -20
