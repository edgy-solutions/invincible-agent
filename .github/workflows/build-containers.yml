name: Build & Push Container Images

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/invincible-agent

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # Matrix build — all services via Cloud Native Buildpacks (no Docker)
  # ------------------------------------------------------------------
  build:
    name: "CNB · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dagster-control-plane
            path: .
            port: "3000"
          - service: ontology-service
            path: agent_fleet/ontology_service
            port: "8084"
          - service: restate-analyst
            path: agent_fleet/restate_analyst
            port: "8081"
          - service: langgraph-support
            path: agent_fleet/langgraph_support
            port: "8082"
          - service: swarms-scraper
            path: agent_fleet/swarms_scraper
            port: "8083"
          - service: datahub-wrapper
            path: agent_fleet/datahub_wrapper
            port: "8085"
          - service: neo4j-expert
            path: agent_fleet/neo4j_expert
            port: "8086"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.7.4

      - name: Build image with Cloud Native Buildpacks
        run: |
          pack build ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }} \
            --path ./${{ matrix.path }} \
            --builder paketobuildpacks/builder-jammy-base \
            --env BP_CPYTHON_VERSION=3.12 \
            --trust-builder

      - name: Tag latest
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: |
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

      - name: Push images
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  # ------------------------------------------------------------------
  # Lint & syntax check (runs in parallel with builds)
  # ------------------------------------------------------------------
  lint:
    name: "Lint & Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check — all Python files
        run: |
          python -m py_compile src/iagent/defs/dynamic_factory.py
          python -m py_compile agent_fleet/models.py
          echo "All syntax checks passed"
