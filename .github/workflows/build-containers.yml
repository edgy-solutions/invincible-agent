name: Build & Push Container Images

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/invincible-agent

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # Matrix build — Native Multi-Stage Docker Builds (Powered by uv)
  # ------------------------------------------------------------------
  build:
    name: "Docker · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dagster-control-plane
            path: .
            port: "3000"
          # Thin dagster runtime image (dagster + webserver + daemon +
          # postgres + graphql; no iagent code). docker.io/dagster/dagster-k8s
          # is amd64-only, so we publish our own multi-arch equivalent for
          # the webserver/daemon pods to use. Cluster: arm64 k3s.
          - service: dagster-server
            path: .
            port: "3000"
          - service: ontology-service
            path: agent_fleet/ontology_service
            port: "8084"
          - service: mesh-registrar
            path: agent_fleet/mesh_registrar
            port: "8090"
          - service: restate-analyst
            path: agent_fleet/restate_analyst
            port: "8081"
          - service: langgraph-support
            path: agent_fleet/langgraph_support
            port: "8082"
          - service: swarms-scraper
            path: agent_fleet/swarms_scraper
            port: "8083"
          - service: datahub-wrapper
            path: agent_fleet/datahub_wrapper
            port: "8085"
          - service: neo4j-expert
            path: agent_fleet/neo4j_expert
            port: "8086"
          - service: presentation-agent
            path: agent_fleet/presentation_agent
            port: "8087"
          - service: weaviate-expert
            path: agent_fleet/weaviate_expert
            port: "8088"
          - service: data-analyst
            path: agent_fleet/data_analyst
            port: "8089"
          - service: planning-agent
            path: agent_fleet/planning_agent
            port: "8095"
          # Engine F, the finance engine (ADR-0045). Image name is finance-agent; the
          # SERVICE it runs as is engine-fin. Port must match project.toml's PORT launch env
          # and the chart's engineFinance.port, or the readiness probe hits a closed port.
          - service: finance-agent
            path: agent_fleet/finance_agent
            port: "8096"
          # engine-cost, production cost accounting. Image name is cost-agent; the SERVICE it
          # runs as is engine-cost. Port must match project.toml's PORT launch env and the
          # chart's engineCost.port, or the readiness probe hits a closed port.
          - service: cost-agent
            path: agent_fleet/cost_agent
            port: "8097"
            # THE ONLY SERVICE THAT CARRIES THE PYODIDE RUNTIME. Named here rather than
            # inferred from the service name, so adding a second exporting engine is a
            # decision somebody makes in this table.
            package_runtime: ".pyodide-cache"
          # engine-safety, sustainment safety assessment (ADR-0051). Image name is safety-agent;
          # the SERVICE it runs as is engine-safety; the values key is engineSafety. Port must
          # match the chart's engineSafety.port, or the readiness probe hits a closed port.
          # WITHOUT THIS ENTRY NO IMAGE IS EVER BUILT at any pinned sha — the omission with no
          # error message, because nothing fails until a deploy asks for a tag that was never
          # produced.
          - service: safety-agent
            path: agent_fleet/safety_agent
            port: "8099"
          # engine-docs, the corpus answering for itself (ADR-0037). Image name is
          # docs-agent; the SERVICE it runs as is engine-docs; the values key is engineDocs.
          # Port must match the chart's engineDocs.port or the readiness probe hits a closed
          # port. WITHOUT THIS ENTRY NO IMAGE IS EVER BUILT at any pinned sha — the omission
          # with no error message, because nothing fails until a deploy asks for a tag that
          # was never produced.
          - service: docs-agent
            path: agent_fleet/docs_agent
            port: "8100"
          # engine-lg, the graph host. RIDES Dockerfile.agent, which already carries
          # ARG GIT_SHA / ENV IAGENT_GIT_SHA and is built with --build-arg
          # GIT_SHA=${{ github.sha }} — so no new stage and no new build-arg are needed, and
          # /version reports a real commit rather than the literal "unknown" the census treats
          # as absent. Port must match graphHost.port in the chart and the Procfile, or the
          # readiness probe hits a closed port.
          - service: graph-host
            path: agent_fleet/graph_host
            port: "8098"
          - service: cortex-bff
            path: .
            # Port aligned with the helm chart's cortexBff.port (8090).
            # The chart's Deployment templates use cortexBff.port for both
            # the container port spec and the service targetPort, so the
            # image's PORT env var (used in the uvicorn --port arg) must
            # match. Previously was 8000, causing the readiness probe to
            # hit a closed port — cortex-bff pod stuck 0/1 Ready.
            port: "8090"
            # cortex-bff's source is at agent_fleet/cortex_bff/main.py but
            # the image needs the whole repo (src/iagent/gateway.py is the
            # FastAPI app). Build from repo root, override main module path.
            main_module: "agent_fleet.cortex_bff.main"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      # docker/setup-buildx-action@v3 pulls a buildx binary/image from
      # docker.io during setup; that path occasionally times out
      # ("context deadline exceeded" on registry-1.docker.io) — observed
      # on dagster-server build at run 28306220148 (2026-06-27). Same
      # transient class as the rancher-gateway flakes in helm. One
      # automatic retry covers the typical case without adding a
      # third-party retry action.
      - name: Set up Docker Buildx (retry on transient docker.io timeout)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image (Multi-Arch)
        run: |
          # Determine tags based on the branch
          TAGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"
          fi

          if [ "${{ matrix.service }}" == "dagster-server" ]; then
            echo "Building dagster-server (thin runtime, no iagent code)..."
            # Tiny single-stage image: dagster + webserver + daemon + postgres
            # + graphql. Used by the chart's webserver and daemon Deployments
            # (multi-arch — replaces the amd64-only docker.io/dagster/dagster-k8s).
            # NOTE: heredoc body must NOT be extra-indented; YAML `|` strips
            # the common 10-space leading indent of this `run:` block, so any
            # extra indent here ends up in bash and the EOF terminator must
            # match column 0 in bash to actually close the heredoc.

            docker buildx build \
              --platform linux/amd64,linux/arm64               --build-arg GIT_SHA=${{ github.sha }} \
              -f .github/docker/Dockerfile.dagster-server \
              $TAGS \
              --push .
          elif [ "${{ matrix.service }}" == "dagster-control-plane" ]; then
            echo "Building dagster-control-plane with dynamic Multi-Stage Dockerfile..."

            # Generate the Dagster Dockerfile on the fly
            
            # Strip leading spaces to ensure valid Dockerfile syntax
            
            docker buildx build \
              --platform linux/amd64,linux/arm64               --build-arg GIT_SHA=${{ github.sha }} \
              -f .github/docker/Dockerfile.dagster \
              $TAGS \
              --push .
          
          else
            echo "Building ${{ matrix.service }} with dynamic Multi-Stage Dockerfile..."
            
            # Generate the Agent Fleet Dockerfile on the fly
            

            # ── FETCH THE PINNED RUNTIME, FOR THE ONE SERVICE THAT DECLARES IT ─────────
            #
            # `.pyodide-cache/` is gitignored, so the matrix row above names a directory that
            # does not exist in a fresh checkout. Without this step the COPY fails the build —
            # loudly, which is the right failure — but the point is to make it present.
            #
            # REFUSES RATHER THAN BUILDING A CRIPPLED IMAGE. If the fetch fails the step exits
            # non-zero: an image carrying the builder and half a runtime would pass every test
            # and refuse at ANSWER time with a missing-files list, which is the slow way to
            # learn that CI had no network.
            if [ -n "${{ matrix.package_runtime }}" ]; then
              echo "Fetching the pinned Pyodide runtime..."
              python3 scripts/build_cost_package.py --fetch-runtime \
                --runtime-dir "${{ matrix.package_runtime }}"
              ls -la "${{ matrix.package_runtime }}"
            fi

            docker buildx build \
              --platform linux/amd64,linux/arm64               --build-arg GIT_SHA=${{ github.sha }} \
              -f .github/docker/Dockerfile.agent \
              --build-arg AGENT_DIR=${{ matrix.path }} \
              --build-arg PORT=${{ matrix.port }} \
              --build-arg MAIN_MODULE=${{ matrix.main_module || 'main' }} \
              --build-arg PACKAGE_RUNTIME_SRC=${{ matrix.package_runtime || '.docker-empty' }} \
              $TAGS \
              --push .
          fi


  # ------------------------------------------------------------------
  # Lint & syntax check (runs in parallel with builds)
  # ------------------------------------------------------------------
  lint:
    name: "Lint & Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check — all Python files
        run: |
          python -m py_compile src/iagent/defs/dynamic_factory.py
          python -m py_compile agent_fleet/models.py
          echo "All syntax checks passed"

      - name: Values files carry NO duplicate top-level keys
        # THE SILENT-LAST-WINS CLASS, killed at authoring time. values-sandbox.yaml once
        # carried TWO top-level `keycloak:` keys; helm's YAML parser takes last-wins with no
        # warning, so the first block's auth.adminPassword override was DISCARDED on every
        # render and Keycloak booted on the chart default instead. The duplicate was fixed
        # weeks later — but Keycloak reads its admin password ONCE, at first boot, so the fix
        # could structurally never reach the running server. Recovering it (2026-08-07) took
        # a git-history archaeology run against a live cluster whose admin credential nobody
        # knew. A declaration error captured by a one-shot consumer outlives its own fix.
        # This check costs four lines and makes that class unwritable.
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, pathlib, collections, re
          bad = 0
          for f in sorted(pathlib.Path("helm").rglob("values*.yaml")):
              seen = collections.Counter(
                  m.group(1) for m in
                  (re.match(r"^([A-Za-z_][\w-]*):", ln) for ln in f.read_text(encoding="utf-8").splitlines())
                  if m
              )
              for key, n in seen.items():
                  if n > 1:
                      print(f"DUPLICATE top-level key {key!r} x{n} in {f} — helm takes LAST-WINS silently")
                      bad += 1
          print("no duplicate top-level keys" if not bad else f"{bad} duplicate key(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Telemetry mapping truth-check (ADR-0038)
        # The mesh telemetry mapping (baml_shared/telemetry-mapping.yaml) must name only
        # fields build_trace_values produces — a dangling or unmapped field fails here,
        # before it silently emits nothing to Langfuse. Needs just the leaf + pytest (the
        # test puts baml_shared on sys.path itself), so it stays a fast PR check.
        run: |
          pip install pytest pydantic pyyaml "provenance-telemetry @ git+https://github.com/edgy-solutions/provenance-telemetry.git"
          python -m pytest tests/test_telemetry.py -q
