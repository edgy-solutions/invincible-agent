name: Build & Push Container Images

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/invincible-agent

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # Matrix build — Native Multi-Stage Docker Builds (Powered by uv)
  # ------------------------------------------------------------------
  build:
    name: "Docker · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dagster-control-plane
            path: .
            port: "3000"
          # Thin dagster runtime image (dagster + webserver + daemon +
          # postgres + graphql; no iagent code). docker.io/dagster/dagster-k8s
          # is amd64-only, so we publish our own multi-arch equivalent for
          # the webserver/daemon pods to use. Cluster: arm64 k3s.
          - service: dagster-server
            path: .
            port: "3000"
          - service: ontology-service
            path: agent_fleet/ontology_service
            port: "8084"
          - service: restate-analyst
            path: agent_fleet/restate_analyst
            port: "8081"
          - service: langgraph-support
            path: agent_fleet/langgraph_support
            port: "8082"
          - service: swarms-scraper
            path: agent_fleet/swarms_scraper
            port: "8083"
          - service: datahub-wrapper
            path: agent_fleet/datahub_wrapper
            port: "8085"
          - service: neo4j-expert
            path: agent_fleet/neo4j_expert
            port: "8086"
          - service: presentation-agent
            path: agent_fleet/presentation_agent
            port: "8087"
          - service: weaviate-expert
            path: agent_fleet/weaviate_expert
            port: "8088"
          - service: data-analyst
            path: agent_fleet/data_analyst
            port: "8089"
          - service: cortex-bff
            path: .
            # Port aligned with the helm chart's cortexBff.port (8090).
            # The chart's Deployment templates use cortexBff.port for both
            # the container port spec and the service targetPort, so the
            # image's PORT env var (used in the uvicorn --port arg) must
            # match. Previously was 8000, causing the readiness probe to
            # hit a closed port — cortex-bff pod stuck 0/1 Ready.
            port: "8090"
            # cortex-bff's source is at agent_fleet/cortex_bff/main.py but
            # the image needs the whole repo (src/iagent/gateway.py is the
            # FastAPI app). Build from repo root, override main module path.
            main_module: "agent_fleet.cortex_bff.main"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image (Multi-Arch)
        run: |
          # Determine tags based on the branch
          TAGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"
          fi

          if [ "${{ matrix.service }}" == "dagster-server" ]; then
            echo "Building dagster-server (thin runtime, no iagent code)..."
            # Tiny single-stage image: dagster + webserver + daemon + postgres
            # + graphql. Used by the chart's webserver and daemon Deployments
            # (multi-arch — replaces the amd64-only docker.io/dagster/dagster-k8s).
            # NOTE: heredoc body must NOT be extra-indented; YAML `|` strips
            # the common 10-space leading indent of this `run:` block, so any
            # extra indent here ends up in bash and the EOF terminator must
            # match column 0 in bash to actually close the heredoc.
            cat << 'EOF' > Dockerfile.dagster-server
          FROM python:3.12-slim-bookworm
          # `useradd -r -m` creates the home directory at /home/dagsteruser
          # so dagster_shared.telemetry's get_or_create_user_telemetry_dir
          # doesn't crash with PermissionError. DAGSTER_TELEMETRY_ENABLED=false
          # also short-circuits it but the dir still gets touched on import,
          # so create it as a belt-and-suspenders fix.
          RUN groupadd -r dagsteruser && useradd -r -m -g dagsteruser dagsteruser
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              DAGSTER_HOME="/opt/dagster/dagster_home" \
              DAGSTER_TELEMETRY_ENABLED=false \
              PIP_NO_CACHE_DIR=1
          RUN apt-get update && apt-get install -y --no-install-recommends \
                libpq5 ca-certificates && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p $DAGSTER_HOME && chown -R dagsteruser:dagsteruser $DAGSTER_HOME
          # Install latest dagster ecosystem — the user-code image
          # (dagster-control-plane) doesn't pin dagster in iagent's
          # pyproject.toml (it pulls `dagster-postgres` which transitively
          # pulls dagster latest), so we MUST match by also not pinning,
          # otherwise the gRPC code-location protocol versions diverge.
          RUN pip install --no-cache-dir \
              dagster dagster-webserver dagster-postgres dagster-graphql
          USER dagsteruser
          WORKDIR /app
          CMD ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]
          EOF

            sed -i 's/^[ \t]*//' Dockerfile.dagster-server
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Dockerfile.dagster-server \
              $TAGS \
              --push .
          elif [ "${{ matrix.service }}" == "dagster-control-plane" ]; then
            echo "Building dagster-control-plane with dynamic Multi-Stage Dockerfile..."

            # Generate the Dagster Dockerfile on the fly
            cat << 'EOF' > Dockerfile.dagster
          # STAGE 1: BUILDER
          FROM python:3.12-slim-bookworm AS builder
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential git libpq-dev && rm -rf /var/lib/apt/lists/*
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/
          ENV UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy \
              PYTHONUNBUFFERED=1 \
              UV_PROJECT_ENVIRONMENT=/app/.venv \
              UV_CACHE_DIR=/root/.cache/uv
          WORKDIR /app
          COPY pyproject.toml uv.lock* requirements.txt* ./
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "uv.lock" ]; then uv sync --frozen --no-install-project --no-dev --compile-bytecode; else uv pip install --system -r requirements.txt; fi
          COPY . /app
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "uv.lock" ]; then uv sync --frozen --no-dev --no-install-project --compile-bytecode; else uv pip install --system -e .; fi

          # STAGE 2: SECURE RUNNER
          FROM python:3.12-slim-bookworm
          RUN groupadd -r dagsteruser && useradd -r -g dagsteruser dagsteruser
          # PYTHONPATH includes /app/src first so `import iagent.definitions`
          # resolves to /app/src/iagent/definitions.py (the iagent package
          # uses a src/ layout in pyproject.toml [tool.hatch]). Previously
          # missing — `uv sync --no-install-project` doesn't install iagent,
          # so without /app/src on PYTHONPATH the dagster code-location
          # server crashes on startup with `No module named 'iagent'`.
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH="/app/src:/app:/app/.venv/lib/python3.12/site-packages:${PYTHONPATH}" \
              PATH="/app/.venv/bin:$PATH" \
              DAGSTER_HOME="/opt/dagster/dagster_home"
          WORKDIR /app
          # Install lightweight runtime libs only (no compilers)
          RUN apt-get update && apt-get install -y --no-install-recommends libpq5 ca-certificates && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p $DAGSTER_HOME && chown -R dagsteruser:dagsteruser $DAGSTER_HOME
          COPY --from=builder --chown=dagsteruser:dagsteruser /app /app
          USER dagsteruser
          CMD ["/app/.venv/bin/dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "iagent.definitions"]
          EOF
            
            # Strip leading spaces to ensure valid Dockerfile syntax
            sed -i 's/^[ \t]*//' Dockerfile.dagster
            
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Dockerfile.dagster \
              $TAGS \
              --push .
          
          else
            echo "Building ${{ matrix.service }} with dynamic Multi-Stage Dockerfile..."
            
            # Generate the Agent Fleet Dockerfile on the fly
            cat << 'EOF' > Dockerfile.agent
          # STAGE 1: BUILDER
          FROM python:3.12-slim-bookworm AS builder
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential git && rm -rf /var/lib/apt/lists/*
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/
          ENV UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy \
              PYTHONUNBUFFERED=1 \
              UV_PROJECT_ENVIRONMENT=/app/.venv \
              UV_CACHE_DIR=/root/.cache/uv
          WORKDIR /app
          ARG AGENT_DIR
          COPY ${AGENT_DIR}/pyproject.toml* ${AGENT_DIR}/uv.lock* ./
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "pyproject.toml" ]; then \
                  uv sync --frozen --no-dev --no-install-project --compile-bytecode && \
                  uv pip install packaging setuptools wheel; \
              fi
          COPY ${AGENT_DIR}/ /app/
          COPY baml_shared/baml_client/baml_client/ /app/baml_client/
          COPY agent_fleet/llm_utils.py /app/llm_utils.py
          COPY agent_fleet/utils/ /app/utils/
          COPY agent_fleet/core/ /app/core/
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "pyproject.toml" ]; then \
                  uv sync --frozen --no-dev --no-install-project --compile-bytecode && \
                  uv pip install packaging setuptools wheel; \
              fi

          # ------------------------------------------------------------------
          # Pre-download offline-required NLP models.
          # The target cluster has no internet access at runtime; mem0ai[nlp]
          # otherwise tries to fetch spaCy models from raw.githubusercontent.com
          # on first /search and crashes the request. We pre-bake the model
          # into the venv during build (where the CI runner does have internet)
          # so the runtime image is truly self-contained.
          #
          # Guarded by spacy availability — services that don't depend on
          # mem0ai[nlp] (most of the fleet) skip this step at no cost.
          # ------------------------------------------------------------------
          RUN if /app/.venv/bin/python -c "import spacy" 2>/dev/null; then \
                  echo "Pre-downloading spaCy en_core_web_sm for offline runtime..." && \
                  /app/.venv/bin/python -m spacy download en_core_web_sm; \
              else \
                  echo "spaCy not installed for this service — skipping model bake."; \
              fi

          # STAGE 2: SECURE RUNNER
          FROM python:3.12-slim-bookworm
          # Create appuser with an explicit home directory inside /app
          RUN groupadd -r appuser && useradd -r -g appuser -d /app appuser
          
          # PYTHONPATH includes /app/src first so cortex-bff's `from
          # src.iagent.gateway import app` resolves to /app/src/iagent/
          # when building with AGENT_DIR=. (whole-repo copy). Other agent
          # fleet services don't have /app/src/ at all so this is a no-op
          # for them.
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              HOME=/app \
              PYTHONPATH="/app/src:/app:/app/.venv/lib/python3.12/site-packages:${PYTHONPATH}" \
              PATH="/app/.venv/bin:$PATH" \
              # Force swarms and other libs to use /app instead of /home/appuser
              SWARMS_WORKSPACE=/app/agent_workspace \
              XDG_CACHE_HOME=/app/.cache

          WORKDIR /app
          RUN mkdir -p /app/agent_workspace /app/.cache && chown -R appuser:appuser /app

          ARG PORT=8080
          ENV PORT=${PORT}
          # MAIN_MODULE is the Python module path (dotted) that exports
          # the FastAPI `app`. Defaults to `main` (services with main.py
          # at /app/main.py). cortex-bff overrides to
          # `agent_fleet.cortex_bff.main` because its main.py lives at
          # /app/agent_fleet/cortex_bff/main.py (the build pulls the whole
          # repo). Without this override the runner CMD's hardcoded
          # `main:app` fails for cortex-bff with "Could not import module 'main'".
          ARG MAIN_MODULE=main
          ENV MAIN_MODULE=${MAIN_MODULE}
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*

          # Copy everything from builder with appuser ownership
          COPY --from=builder --chown=appuser:appuser /app /app

          USER appuser
          CMD ["/bin/sh", "-c", "\
              if [ -f '/app/.venv/bin/hypercorn' ]; then \
                  echo \"Starting with Hypercorn (HTTP/2 enabled) — module ${MAIN_MODULE}:app...\" && \
                  /app/.venv/bin/python -m hypercorn ${MAIN_MODULE}:app --bind 0.0.0.0:${PORT}; \
              else \
                  echo \"Starting with Uvicorn — module ${MAIN_MODULE}:app...\" && \
                  /app/.venv/bin/python -m uvicorn ${MAIN_MODULE}:app --host 0.0.0.0 --port ${PORT}; \
              fi"]
          EOF
            
            sed -i 's/^[ \t]*//' Dockerfile.agent

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Dockerfile.agent \
              --build-arg AGENT_DIR=${{ matrix.path }} \
              --build-arg PORT=${{ matrix.port }} \
              --build-arg MAIN_MODULE=${{ matrix.main_module || 'main' }} \
              $TAGS \
              --push .
          fi


  # ------------------------------------------------------------------
  # Lint & syntax check (runs in parallel with builds)
  # ------------------------------------------------------------------
  lint:
    name: "Lint & Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check — all Python files
        run: |
          python -m py_compile src/iagent/defs/dynamic_factory.py
          python -m py_compile agent_fleet/models.py
          echo "All syntax checks passed"
