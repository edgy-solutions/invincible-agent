name: Build & Push Container Images

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/invincible-agent

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # Matrix build — Native Multi-Stage Docker Builds (Powered by uv)
  # ------------------------------------------------------------------
  build:
    name: "Docker · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dagster-control-plane
            path: .
            port: "3000"
          - service: ontology-service
            path: agent_fleet/ontology_service
            port: "8084"
          - service: restate-analyst
            path: agent_fleet/restate_analyst
            port: "8081"
          - service: langgraph-support
            path: agent_fleet/langgraph_support
            port: "8082"
          - service: swarms-scraper
            path: agent_fleet/swarms_scraper
            port: "8083"
          - service: datahub-wrapper
            path: agent_fleet/datahub_wrapper
            port: "8085"
          - service: neo4j-expert
            path: agent_fleet/neo4j_expert
            port: "8086"
          - service: presentation-agent
            path: agent_fleet/presentation_agent
            port: "8087"
          - service: weaviate-expert
            path: agent_fleet/weaviate_expert
            port: "8088"
          - service: data-analyst
            path: agent_fleet/data_analyst
            port: "8089"
          - service: cortex-bff
            path: .
            port: "8000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push image (Multi-Arch)
        run: |
          # Determine tags based on the branch
          TAGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest"
          fi

          if [ "${{ matrix.service }}" == "dagster-control-plane" ]; then
            echo "Building dagster-control-plane with dynamic Multi-Stage Dockerfile..."
            
            # Generate the Dagster Dockerfile on the fly
            cat << 'EOF' > Dockerfile.dagster
          # STAGE 1: BUILDER
          FROM python:3.12-slim-bookworm AS builder
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential git libpq-dev && rm -rf /var/lib/apt/lists/*
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/
          ENV UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy \
              PYTHONUNBUFFERED=1 \
              UV_PROJECT_ENVIRONMENT=/app/.venv \
              UV_CACHE_DIR=/root/.cache/uv
          WORKDIR /app
          COPY pyproject.toml uv.lock* requirements.txt* ./
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "uv.lock" ]; then uv sync --frozen --no-install-project --no-dev; else uv pip install --system -r requirements.txt; fi
          COPY . /app
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "uv.lock" ]; then uv sync --frozen --no-dev; else uv pip install --system -e .; fi

          # STAGE 2: SECURE RUNNER
          FROM python:3.12-slim-bookworm
          RUN groupadd -r dagsteruser && useradd -r -g dagsteruser dagsteruser
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              PATH="/app/.venv/bin:$PATH" \
              DAGSTER_HOME="/opt/dagster/dagster_home"
          WORKDIR /app
          # Install lightweight runtime libs only (no compilers)
          RUN apt-get update && apt-get install -y --no-install-recommends libpq5 ca-certificates && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p $DAGSTER_HOME && chown -R dagsteruser:dagsteruser $DAGSTER_HOME
          COPY --from=builder --chown=dagsteruser:dagsteruser /app /app
          USER dagsteruser
          CMD ["/app/.venv/bin/dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "iagent.definitions"]
          EOF
            
            # Strip leading spaces to ensure valid Dockerfile syntax
            sed -i 's/^[ \t]*//' Dockerfile.dagster
            
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Dockerfile.dagster \
              $TAGS \
              --push .
          
          else
            echo "Building ${{ matrix.service }} with dynamic Multi-Stage Dockerfile..."
            
            # Generate the Agent Fleet Dockerfile on the fly
            cat << 'EOF' > Dockerfile.agent
          # STAGE 1: BUILDER
          FROM python:3.12-slim-bookworm AS builder
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential git && rm -rf /var/lib/apt/lists/*
          COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/
          ENV UV_COMPILE_BYTECODE=1 \
              UV_LINK_MODE=copy \
              PYTHONUNBUFFERED=1 \
              UV_PROJECT_ENVIRONMENT=/app/.venv \
              UV_CACHE_DIR=/root/.cache/uv
          WORKDIR /app
          ARG AGENT_DIR
          COPY ${AGENT_DIR}/pyproject.toml* ${AGENT_DIR}/uv.lock* ./
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "pyproject.toml" ]; then uv sync --frozen --no-dev --compile-bytecode; fi
          COPY ${AGENT_DIR}/ /app/
          COPY baml_shared/baml_client/baml_client/ /app/baml_client/
          COPY agent_fleet/llm_utils.py /app/llm_utils.py
          RUN --mount=type=cache,target=/root/.cache/uv \
              if [ -f "pyproject.toml" ]; then uv sync --frozen --no-dev --compile-bytecode; fi

          # STAGE 2: SECURE RUNNER
          FROM python:3.12-slim-bookworm
          # Create appuser with an explicit home directory inside /app
          RUN groupadd -r appuser && useradd -r -g appuser -d /app appuser
          
          ENV PYTHONUNBUFFERED=1 \
              PYTHONDONTWRITEBYTECODE=1 \
              HOME=/app \
              PATH="/app/.venv/bin:$PATH" \
              # Force swarms and other libs to use /app instead of /home/appuser
              SWARMS_WORKSPACE=/app/agent_workspace \
              XDG_CACHE_HOME=/app/.cache
          
          WORKDIR /app
          RUN mkdir -p /app/agent_workspace /app/.cache && chown -R appuser:appuser /app

          ARG PORT=8080
          ENV PORT=${PORT}
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
          
          # Copy everything from builder with appuser ownership
          COPY --from=builder --chown=appuser:appuser /app /app
          
          USER appuser
          CMD python -m uvicorn main:app --host 0.0.0.0 --port ${PORT}
          EOF
            
            sed -i 's/^[ \t]*//' Dockerfile.agent

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Dockerfile.agent \
              --build-arg AGENT_DIR=${{ matrix.path }} \
              --build-arg PORT=${{ matrix.port }} \
              $TAGS \
              --push .
          fi


  # ------------------------------------------------------------------
  # Lint & syntax check (runs in parallel with builds)
  # ------------------------------------------------------------------
  lint:
    name: "Lint & Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check — all Python files
        run: |
          python -m py_compile src/iagent/defs/dynamic_factory.py
          python -m py_compile agent_fleet/models.py
          echo "All syntax checks passed"
