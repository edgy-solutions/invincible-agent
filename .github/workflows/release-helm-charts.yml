name: Release Helm Charts

# NO `push` TRIGGER, AND THAT IS THE FIX (ruling 2026-10-25). This ran on its own `push` beside
# build-containers.yml, finished in ~25 s while the matrix took ~5 min, and so published 0.4.66,
# 0.4.68 and 0.4.69 with 0 of 19 images tagged: charts whose tag floor names images that did not
# exist. A release that references images that do not exist is not a release. It is now CALLED by
# build-containers.yml's `release` job, which `needs: build` for the same commit, and a missing
# image fails it.
on:
  workflow_call:
    inputs:
      chart_version:
        type: string
        required: false
        default: ''
      sha:
        type: string
        required: false
        default: ''
  # THE REPAIR DISPATCH, for a release whose retag did not complete (0.3.77, which predates the
  # retag; 0.4.68 and 0.4.69, which raced the build). It takes the RELEASE'S OWN COMMIT and tags the
  # images built from it, because a release is its commit -- what the sandbox runs is a separate
  # decision. The retag needs `write:packages`, which CI's own token has and a person's PAT
  # generally does not, so the act happens where the credential already lives, and the run's job
  # summary is its log. It never moves a tag: see retag_images_by_digest.py.
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart version to retag images to (e.g. 0.3.77)'
        required: true
      sha:
        description: 'The release tag''s commit, whose images are retagged (full 40-char sha)'
        required: true

jobs:
  release:
    # Need write permissions for the release to push assets and update gh-pages branch index
    permissions:
      contents: write
      # RETAGGING PUSHES TO GHCR. Without this the retag step 403s at PUSH while every
      # digest READ succeeds - a failure that looks like a registry problem and is a scope
      # problem. Measured: a PAT with repo+workflow read all 18 digests and pushed none.
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required for chart-releaser to determine if chart changed and needs release
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      # THE PUSH CHANGED helm/** — SO THE VERSION MUST HAVE MOVED.
      #
      # This job only runs on a helm/** change, so "the version already has a release"
      # means the chart's CONTENTS changed while its VERSION did not, and whatever is
      # published under that version is now a lie. `skip_existing: true` used to absorb
      # exactly this case: it was added so the workflow would stop failing with
      # "tag_name already_exists", which turned a loud failure into a green run that
      # published nothing.
      #
      # It cost a work cluster. Eight chart-changing commits stacked on 0.3.36 unpublished
      # — among them the ENGINE_*_CLIENT_SECRET wiring — so an install of "the latest
      # chart" resolved to 0.3.36's contents from eight commits earlier. Every engine hit
      # `KeyError: 'ENGINE_A_CLIENT_SECRET'` at mint, registered zero verbs, and routing
      # degraded to the generalist with no error anywhere: a green pipeline, a green
      # release, a cluster that could not answer a catalog question.
      #
      # A version number that does not move while its contents do is unfalsifiable from
      # the outside — the same class as a `:latest` image tag. So the drift FAILS here,
      # at the only point that can still see both halves.
      #
      # A PENDING BUMP IS NOT DRIFT (the architect, via Chris, 2026-11-08). A CHANGELOG entry
      # `## <next> — not yet cut` says the bump is owed and names a version that does not exist
      # yet. The run then publishes NOTHING and stays green; every step below is gated on
      # `pending`. Without it, every helm/** PR between cuts turned master red (#277, #262,
      # #300, #294). Neither a bump nor that entry is still refused. The logic and its verdicts
      # are in scripts/chart_version_seal.py, sealed by tests/test_chart_version_seal.py.
      - name: Refuse to publish a chart whose version did not move
        id: version_seal
        if: github.event_name != 'workflow_dispatch'
        run: python scripts/chart_version_seal.py helm/invincible-agent

      # ── RETAG EVERY IMAGE TO THE CHART VERSION, BY DIGEST ────────────────────────────────
      #
      # A chart that resolves to its OWN images is the point. `global.defaultImageTag` was
      # `latest`, so an unpinned deploy got whatever `latest` happened to be AT PULL TIME — a
      # different artifact on Tuesday than on Monday, from the same chart, with nothing
      # recording that they differed. After this step `:0.3.77` names the exact bytes
      # `:<sha>` named, and "install 0.3.77" means one thing forever.
      #
      # BY DIGEST, NOT BY TAG: `imagetools create -t repo:<ver> repo@<digest>` points the new
      # name at the BYTES, not at another name that can itself move.
      #
      # THE POPULATION IS DERIVED from build-containers.yml's matrix — a hand-kept service list
      # in this file would be right the day it was written and silently short the day a service
      # was added.
      - name: Log in to GHCR
        if: steps.version_seal.outputs.pending != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag images to the chart version, by digest
        if: steps.version_seal.outputs.pending != 'true'
        id: retag
        run: |
          version="${{ inputs.chart_version }}"
          if [ -z "${version}" ]; then
            version="$(helm show chart helm/invincible-agent | awk '/^version:/ {print $2}')"
          fi
          sha="${{ inputs.sha }}"
          if [ -z "${sha}" ]; then sha="${{ github.sha }}"; fi
          # A DISPATCH TAGS THE RELEASE'S OWN COMMIT. The sha is typed by a person; the tag says
          # which commit the release is. They must agree, or the release would name another
          # commit's images.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tagged="$(git rev-parse -q --verify "refs/tags/invincible-agent-${version}^{commit}" || true)"
            if [ "${tagged}" != "${sha}" ]; then
              echo "::error::invincible-agent-${version} is commit '${tagged:-<no such tag>}', not ${sha}. Nothing tagged."
              exit 2
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # `|| rc=$?` IS LOAD-BEARING, not defensive. A GitHub `run:` block is `bash -e`, so a
          # non-zero exit aborts the step AT the python line and the annotation below never runs.
          rc=0
          python scripts/retag_images_by_digest.py \
            --chart-version "${version}" \
            --sha "${sha}" \
            --manifest image-digests.json \
            --summary-file "$GITHUB_STEP_SUMMARY" || rc=$?
          # EVERY NON-ZERO IS FATAL. 3 = an image of this commit does not exist; 4 = a release tag
          # already names another digest (never overwritten); 1 = a retag or a read failed. The
          # codes differ so the annotation says which; none of them publishes.
          case "$rc" in
            0) ;;
            3) echo "::error::images missing for ${sha}; no chart is published over them (image-digests.json)"; exit 3 ;;
            4) echo "::error::a :${version} tag already names another digest; nothing was tagged or overwritten"; exit 4 ;;
            *) echo "::error::the retag failed (exit ${rc}); see the log"; exit "$rc" ;;
          esac

      # READ BACK, NOT REPORTED. Every :<version> tag must resolve to the digest the manifest
      # names, and the controls (fake digest, short commit, unpushed tag, wrong digest) must fail.
      # Any non-zero, 3 included, fails the release.
      - name: Verify the release tags resolve to the manifest digests
        if: steps.version_seal.outputs.pending != 'true'
        run: |
          rc=0
          python scripts/retag_images_by_digest.py --verify \
            --chart-version "${{ steps.retag.outputs.version }}" \
            --manifest image-digests.json > verify.log 2>&1 || rc=$?
          # A FILE, NOT `| tee`: the default `run:` shell is `bash -e` without pipefail, so a pipe
          # would hand `rc` tee's exit and a failed verify would read as 0.
          cat verify.log
          tail -n 1 verify.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ]; then
            echo "::error::the release tags did not verify (exit ${rc})"
            exit "$rc"
          fi

      # EVERY IMAGE BY DIGEST, WRITTEN HERE AND NOWHERE ELSE. The artefact of record for "what does
      # chart X run" is values-release-<version>.yaml: ours from image-digests.json, third party
      # from the digests values.yaml pins (each confirmed in its registry by digest; a tag is never
      # resolved). The seal then renders the chart WITH that file, and once more with every
      # optional workload on, and fails the release if any container or initContainer image is not
      # `@sha256:`. The roll (scripts/upgrade-sandbox.sh) downloads this file; it resolves nothing.
      # Files, not pipes: the step is `bash -e` without pipefail, so a pipe would hand `rc` the
      # last command's exit and a refusal would read as 0. The renders hold Secrets and stay in
      # RUNNER_TEMP, never printed.
      - name: Write the release values (every image by digest) and seal the render
        if: steps.version_seal.outputs.pending != 'true'
        run: |
          version="${{ steps.retag.outputs.version }}"
          out="values-release-${version}.yaml"
          python -m pip install --quiet pyyaml
          rc=0
          python scripts/write_release_values.py             --manifest image-digests.json             --chart-version "${version}"             --out "${out}" || rc=$?
          if [ "$rc" != "0" ]; then
            echo "::error::the release values were not written (exit ${rc}); nothing is published"
            exit "$rc"
          fi
          cat "${out}" >> "$GITHUB_STEP_SUMMARY"
          for extra in "" scripts/values-every-workload.yaml; do
            args="-f ${out}"
            if [ -n "${extra}" ]; then args="${args} -f ${extra}"; fi
            rc=0
            helm template invincible-agent helm/invincible-agent ${args} > "${RUNNER_TEMP}/render.yaml" 2> "${RUNNER_TEMP}/render.err" || rc=$?
            if [ "$rc" != "0" ]; then
              echo "::error::helm template failed (exit ${rc}) for '${extra:-base}'; $(tail -n 1 "${RUNNER_TEMP}/render.err")"
              exit "$rc"
            fi
            rc=0
            python scripts/seal_image_digests.py < "${RUNNER_TEMP}/render.yaml" > "${RUNNER_TEMP}/seal.log" 2>&1 || rc=$?
            cat "${RUNNER_TEMP}/seal.log"
            if [ "$rc" != "0" ]; then
              echo "::error::an image in the '${extra:-base}' render is not pinned by digest (exit ${rc}); nothing is published"
              exit "$rc"
            fi
          done

      # PUBLISHED ONLY NOW, after every image is tagged and read back. chart-releaser used to run
      # first, which is how a release came to exist over images that did not.
      - name: Run chart-releaser
        if: github.event_name != 'workflow_dispatch' && steps.version_seal.outputs.pending != 'true'
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          # Belt-and-braces only. The guard step above is what enforces the invariant;
          # this must never again be the thing that silently swallows a drift.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # THE MANIFEST IS THE CHECKABLE ARTEFACT. It records service -> digest, plus what was
      # MISSING and what FAILED — a manifest listing only successes is a claim that its list is
      # everything. Anyone can verify it against the registry without trusting this run.
      - name: Attach the digest manifest to the chart release
        if: steps.version_seal.outputs.pending != 'true'
        run: |
          gh release upload "invincible-agent-${{ steps.retag.outputs.version }}" \
            image-digests.json "values-release-${{ steps.retag.outputs.version }}.yaml" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
