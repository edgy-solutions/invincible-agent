name: Release Helm Charts

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'helm/**'

jobs:
  release:
    # Need write permissions for the release to push assets and update gh-pages branch index
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required for chart-releaser to determine if chart changed and needs release
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          # Skip if the chart version already has a published release
          # (i.e. someone touched helm/** without bumping Chart.yaml).
          # Without this, every helm/** commit that doesn't bump the
          # version fails the workflow with "tag_name already_exists".
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
