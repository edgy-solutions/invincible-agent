name: Release Helm Charts

on:
  push:
    branches:
      - master
    paths:
      - 'helm/**'

jobs:
  release:
    # Need write permissions for the release to push assets and update gh-pages branch index
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required for chart-releaser to determine if chart changed and needs release
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Build and package chart
        run: |
          mkdir -p .cr-release-packages
          helm package helm/invincible-agent --dependency-update -d .cr-release-packages
          ls -la .cr-release-packages/

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          skip_packaging: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
