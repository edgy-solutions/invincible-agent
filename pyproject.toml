[project]
name = "iagent"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    # DECLARED 2026-09-11 — imported DIRECTLY by this repo and previously arriving only
    # transitively. A DEPENDENCY THAT ARRIVES TRANSITIVELY IS UNDECLARED, AND UNDECLARED
    # MEANS IT CAN LEAVE WITHOUT NOTICE: `dagster` broke a CI runner with
    # "cannot import name 'Definitions' from 'dagster' (unknown location)" — the
    # NAMESPACE existed, contributed by dagster-postgres/-webserver/-dg-cli, while the core
    # distribution did not. Nothing was shadowing it; the name resolved BECAUSE the core
    # was absent. Same class as uvicorn (survived on the base image) and duckdb (survived
    # on a build the deployment did not have). All three passed locally.
    #
    # FLOORS READ OUT OF uv.lock, NOT INVENTED. These state the resolution that was already
    # green rather than moving it — a fresh constraint would relock to a different fleet
    # than the one under test. Sealed by tests/test_every_import_is_a_declared_dependency.py.
    "botocore>=1.43.24",
    "dagster>=1.12.20",
    "acryl-datahub>=1.7.0",
    "jsonschema>=4.26.0",
    # Imported directly and legitimately: scripts/probes/probe_ambient.py manipulates OTel
    # ambient-context semantics (the provenance-telemetry wrapper IS the subject there), and
    # tests/test_replay_safe_boundary.py needs InMemorySpanExporter from the SDK. Only -api
    # and -sdk are imported; the four exporter/proto distributions are not.
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "pydantic>=2.12.5",
    "starlette>=1.0.0",
    "urllib3>=2.6.3",
    "PyYAML>=6.0.3",
    "dagster-postgres",
    "psycopg2-binary",
    "httpx",
    "baml-py==0.219.0",
    "fastapi",
    "uvicorn[standard]",
    "neo4j",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite",
    "python-dotenv",
    "requests",
    "pyjwt[crypto]",
    "cryptography",
    # Upstream renamed the DISTRIBUTION (not the module) from `dag_tools` to `edgy-dag-tools`
    # between v0.1.0 and v0.1.1. This requirement floated on @master, so it silently followed the
    # rename into a metadata/name mismatch: uv refuses ("Package metadata name `edgy-dag-tools`
    # does not match given name `dag-tools`"), pip tolerates it. A Windows venv installed before
    # the rename kept working, so the break surfaced only on a fresh resolve — the floating-ref
    # failure mode exactly. Pinned to a TAG; the import name is still `dag_tools` at v0.1.1.
    # NOTE: agent_fleet/data_analyst pins the pre-rename SHA 61cbfa92 and is the only real
    # importer. Moving it to v0.1.1 is an upstream UPGRADE, not this rename fix, so it is
    # deliberately left alone — see the two-dists-one-module hazard if both land in one env.
    "edgy-dag-tools @ git+https://github.com/edgy-solutions/dag-tools.git@v0.1.1",
    # PROMOTED from the dev group 2026-08-07. The projector and the sandbox domain broker are
    # mesh services that ship in the iagent image and now take the SDK's inbound transport-auth
    # dependency, so `iagent_mesh` must be present at RUNTIME. As a dev-only dependency it
    # resolved fine in the dev venv and in tests, and would have ImportError'd at container
    # start — the failure mode that looks like a passing suite. Pinned to a TAG (see the
    # floating-ref guard in tests/test_no_floating_git_dependencies.py).
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.8.1",
    "mcp",
    # boto3 for cortex-bff's /federated_image endpoint: proxies MinIO image
    # reads through the same JWT + entitled_domains gate the rest of the bff
    # uses (Option A in the doc-tools image-from-MinIO architecture). The
    # browser never talks to MinIO STS directly — consistent authz with the
    # rest of the data path.
    "boto3",
    # weaviate-client is a MAIN dep (not just the agent-fleet extra / dev
    # group) because setup/prime_databases.py runs in the dagster-control-
    # plane image — built with `uv sync --no-dev` and NO `--extra` — and its
    # --wipe path must connect to Weaviate to clear it. Without this the
    # `import weaviate` failed silently (weaviate=None) and the wipe SKIPPED
    # Weaviate entirely, leaving stale OntologyClass phantoms + a
    # mis-configured Predicate collection across every "wipe". Constraint is
    # the intersection of the extra (>=4.5.4) and dev (>=4.4,<5.0) pins so
    # one resolved version serves all three.
    "weaviate-client>=4.5.4,<5.0",
]

[project.optional-dependencies]
agent-fleet = [
    "fastapi",
    "uvicorn",
    "rdflib",
    "baml-py",
    "restate-sdk==0.14.0",
    "smolagents",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "swarms",
    "litellm",
    "mem0ai[nlp]",
    "weaviate-client>=4.5.4",
    "langchain-weaviate",
    "langchain-community",
    "neo4j",
    "httpx",
    "h2",
    "httptools",
    "hypercorn",
    "python-dotenv",
    "langfuse",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "pytest",
    "pytest-asyncio",
    # Order-independence guard. The suite had never been collected in any order but
    # alphabetical, and that hid a mutual-pollution pair: tests/test_ontology_routing.py
    # could not pass ALONE (11/11 errors) and only went green by borrowing another file's
    # sys.path setup, while its own `del sys.modules["main"]` broke nine security-gate
    # tests in tests/security/test_effect_write_gate.py. Neither is visible to a run that
    # only ever uses one order. Invoked explicitly, never in addopts -- a shuffle that is
    # on by default makes every unrelated failure unreproducible:
    #   pytest tests/ --random-order --random-order-bucket=module --random-order-seed=<N>
    # See docs/principles/a-stub-that-needs-another-test-is-not-a-stub.md
    "pytest-random-order",
    "weaviate-client>=4.4,<5.0",
    "lxml>=6.1.1",
    # ADR-0038 telemetry leaf — lets the mesh-mapping truth-check (tests/test_telemetry.py)
    # RUN rather than importorskip. Also declared in restate_analyst for runtime emission.
    # Mesh membership package — owns transport auth (the app-factory dependency) and the
    # ONE general mint. PINNED TO A TAG, never a branch: this package now governs fleet
    # auth and identity minting, so a floating ref would let a single SDK commit change
    # every engine's security behaviour at rebuild — the library-bump outage class with
    # credentials attached (cf. the doc-tools floating-@rev finding).
    "iagent-mesh @ git+https://github.com/edgy-solutions/iagent-mesh-sdk.git@v0.8.1",
    "provenance-telemetry==0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "iagent"
registry_modules = [
    "iagent.components.*",
]


