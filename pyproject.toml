[project]
name = "iagent"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    "dagster-postgres",
    "psycopg2-binary",
    "httpx",
    "baml-py",
    "fastapi",
    "uvicorn[standard]",
    "neo4j",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "python-dotenv",
]

[project.optional-dependencies]
agent-fleet = [
    "fastapi",
    "uvicorn",
    "rdflib",
    "baml-py",
    "restate-sdk==0.14.0",
    "smolagents",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "swarms",
    "mem0ai",
    "weaviate-client",
    "neo4j",
    "httpx",
    "h2",
    "httptools",
    "hypercorn",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "iagent"
registry_modules = [
    "iagent.components.*",
]


