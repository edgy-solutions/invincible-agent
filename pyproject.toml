[project]
name = "iagent"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = [
    "dagster-postgres",
    "psycopg2-binary",
    "httpx",
    "baml-py",
]

[project.optional-dependencies]
agent-fleet = [
    "fastapi",
    "uvicorn",
    "rdflib",
    "baml-py",
    "restate-sdk",
    "smolagents",
    "langgraph",
    "psycopg[binary]",
    "swarms",
    "httpx",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "iagent"
registry_modules = [
    "iagent.components.*",
]


