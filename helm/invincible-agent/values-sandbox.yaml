# ==========================================================================
# Sandbox values override — Phase 2 deployment to k3s `sandbox` namespace.
#
# Scope: DA flow end-to-end + ADR-0008 fallback to Engine A + ADR-0009
# routing through Weaviate hybrid + doc-tools registration loop +
# DataHub Quickstart as the registry inbox.
#
# Disabled engines (B, C, E, W) are deferred to Phase 3 once the DA flow
# is verified end-to-end. The chart's defaults are preserved for them
# (enabled: true) — we explicitly flip them off here so the override is
# auditable.
#
# Service-name override pattern: the chart creates `{Release}-foo`
# services but the chart's agentFleet env defaults to bare names
# (`bolt://neo4j` etc). We override the env to match the actual service
# names this release will produce. Release name assumed: `iagent`.
# Adjust the prefix if you use a different name.
# ==========================================================================

global:
  imagePullSecrets:
    - name: ghcr-pull-secret  # must exist in sandbox namespace — see deploy plan
  # Sandbox uses :latest tags + iterates as CI rebuilds. Always re-pull
  # so `kubectl delete pod` picks up the new :latest after CI finishes,
  # instead of caching the broken pre-fix layer.
  imagePullPolicy: Always
  # The sandbox-only electric mirror (values.yaml pins the upstream electric instead). Rebuilt from
  # upstream's @core/sync-service@1.0.13 by .github/workflows/mirror-electric.yml; see `electric:`.
  imageDigests:
    "ghcr.io/edgy-solutions/mirror/electric": "sha256:70b57efaacb5efeed39283439e050b88c328bae866a4086c6a188d0394a323c3"

# --------------------------------------------------------------------------
# Disabled engines for Phase 2 (re-enable in Phase 3)
# --------------------------------------------------------------------------
# engineB's override is GONE, not flipped: the chart default is now false (Engine B is
# retired, ADR-0046 §8.4), so an override repeating it would be a second place to change
# and a reader could not tell whether sandbox was disabling a live engine or echoing a
# retired one. This list is "disabled for Phase 2, re-enable in Phase 3"; Engine B is not
# coming back, so it does not belong on it.
engineC:
  enabled: false  # Swarms scraper — out of scope for DA
engineE:
  enabled: true   # Neo4j graph expert — promoted from Phase 3 (was running as a deployment orphan; this aligns values with cluster reality)
engineW:
  enabled: true   # Weaviate semantic expert — exercised by the DataHub regression suite tonight; aligned with cluster reality

# 2026-06-16 fresh-bootstrap rehearsal finding: the chart's default has
# meshRegistrar.enabled=false (a stale comment in values.yaml says
# "Disabled by default until the SDK in registering engines is updated
# to use the gateway path" — that migration happened long ago;
# agentFleet env already pins MESH_REGISTRAR_URL=http://iagent-mesh-registrar:8090
# via configmap.yaml, and all engines have been registering through it
# for weeks). The mesh-registrar pod that was running was deployed
# out-of-band by an earlier session; the rehearsal's helm upgrade
# reconciled cluster-to-chart and removed it, surfacing the
# inconsistency. Enabling it here (sandbox-scoped) so a fresh-bootstrap
# rebuilds the system with engine registration actually working. Work
# cluster needs the same flip in its values file (separate ops decision).
meshRegistrar:
  enabled: true
  # A1, ruled 2026-09-30: the registrar's delegate owner.
  onBehalfOfUser: platform-registrar

# --------------------------------------------------------------------------
# Agent fleet env overrides.
#
# NOTE: most infrastructure URLs (NEO4J_URI, WEAVIATE_HTTP_HOST,
# JENA_SPARQL_ENDPOINT, KEYCLOAK_REALM_URL, engine-to-engine discovery,
# etc.) are rendered by the chart's configmap.yaml template with the
# correct {Release.Name}-foo prefix already. Do NOT re-set them here —
# duplicate keys in ConfigMaps create "last one wins" races. Only set
# things the template doesn't already cover.
# --------------------------------------------------------------------------
agentFleet:
  env:
    # LLM endpoint — ai1 Ollama, IP-resolved (no LAN DNS for `ai1`).
    # ⚠️ DEPLOYED REALITY: the sandbox is deployed base + the
    # `values-sandbox-litellm-rehearsal.yaml` overlay, which OVERRIDES these to
    # SMOLAGENTS_PROVIDER=openai + OPENAI_BASE_URL=http://iagent-litellm:4000/v1
    # (route through the LiteLLM proxy). Do NOT reason about the model path from
    # THIS block alone — the running cluster uses the proxy path. The proxy's
    # model_list routes gpt-oss via `ollama_chat/` (NOT `ollama/`, which drops
    # tool_calls — see values.yaml note). ToolCallingAgent engines require that
    # proxy+ollama_chat/ path. This `ollama`/direct block is the base default;
    # the overlay is the truth in this cluster.
    SMOLAGENTS_PROVIDER: "ollama"
    SMOLAGENTS_MODEL: "gpt-oss-128k:120b"
    OLLAMA_BASE_URL: "http://192.168.1.126:11434/v1"  # verified reachable from sandbox pods
    # EMBEDDINGS ENDPOINT — set PER ENVIRONMENT, never defaulted in the base chart.
    #
    # Without this, engine-o's client-side embed fails and verb nomination
    # silently degrades to BM25-only. Measured 2026-08-23: the Predicate
    # collection held 65 rows and ZERO vectors while a WARNING scrolled past on
    # every /classify_predicate call. The whole planning bake-off ran on
    # keyword-only nomination without anyone noticing.
    #
    # THE WARNING'S SUGGESTED REMEDY IS WRONG FOR THIS CLUSTER: it names
    # http://iagent-litellm:4000/v1, and no such service exists here — following
    # the error message verbatim converts a loud, working fallback into a broken
    # endpoint. The configured embedder in this cluster is ai1, which already
    # serves nomic-embed-text (verified: 768-dim, /v1/embeddings, 2026-08-24) and
    # is the same host DocumentChunk's server-side text2vec-ollama uses — so
    # Predicate's vectors will be model-consistent with the rest of the substrate.
    #
    # DELIBERATELY NOT IN values.yaml. Sandbox points at ollama; work points at
    # its LiteLLM proxy. An environment that sets NEITHER must get the loud
    # fallback rather than inherit another cluster's endpoint — a convenience
    # default travelling where it does not belong is how "engine-f" ended up in
    # a frontend's identity field.
    LLM_BASE_URL: "http://192.168.1.126:11434/v1"
    LLM_API_KEY: "ollama"
    BAML_LOG_LEVEL: "info"
    # Telemetry (ADR-0038): tags every trace with the cluster it ran in. The LANGFUSE_*
    # creds ride in via agentFleet.secrets (values-sandbox.secret.yaml, gitignored).
    DEPLOY_ENV: "sandbox"
    # The Langfuse SDK's own environment tag, set per deployment (the architect, 11-10). On
    # provenance-telemetry 0.2.0 the boundary span reads DEPLOY_ENV and its children read this key;
    # unset, the children land in "default". From 0.2.1 the boundary reads this key too, so it must
    # be set no later than that pin. Keep it equal to DEPLOY_ENV.
    LANGFUSE_TRACING_ENVIRONMENT: "sandbox"
    # A MEASURE IS AN OVERLAY ROW (proposal docs/proposals/a-measure-is-an-overlay-row-and-a-cdrl-is-an-export-profile.md).
    # SANDBOX ONLY, not the chart's default configmap: the sample TCPI row and its board are
    # invented to prove the contract. engine-fin reads the first, cortex-bff the second; the
    # shared agentFleet configmap carries both and each service reads only its own.
    # The second directory holds the refusal probes: rows over dag-tools' planted-refusal assets,
    # which exist only so the live leg can see each reader rule refuse. Nothing else names it.
    # The separator is the pod's os.pathsep (":").
    MEASURE_VERB_OVERLAY_DIRS: "/app/policy/overlays/sample/measure_verbs:/app/policy/overlays/sandbox/measure_verbs"
    CANVAS_OVERLAY_DIRS: "/app/policy/overlays/sample/canvases"
    # A CDRL IS AN EXPORT PROFILE (same proposal, Part 2). SANDBOX ONLY: the sample A001 profile
    # and its template are invented. engine-fin reads it.
    FIN_EXPORT_PROFILE_OVERLAY_DIRS: "/app/policy/overlays/sample/fin_export_profiles"
    # The sample REVIEW-export profiles (`part-list`, `part-list-reviewed`), SANDBOX ONLY. cortex-bff reads it;
    # the topaz-seed and task-grant-sync Jobs read it from here too, so capability_grant_sync knows the
    # profiles a `can_export:` row may name (a deployment without this line refuses those two rows).
    INGEST_EXPORT_PROFILE_OVERLAY_DIRS: "/app/policy/overlays/sample/exports"
    # bob's three sample capability grants (can_export:part-list, can_export:part-list-reviewed,
    # ingest:exportBatch), SANDBOX ONLY. Read only by capability_grant_sync; it reaches the
    # task-grant-sync and topaz-seed Jobs through the invincible-agent.podOverlayEnv helper, which
    # exports every *_OVERLAY_DIRS key of agentFleet.env. Add-only: the shared seed names no sample user.
    CAPABILITY_GRANT_OVERLAY_DIRS: "/app/policy/overlays/sample"

    # MinIO / S3 — the SHARED config (iagent-config) the prime-substrate Job reads
    # (it bridges these to S3_ENDPOINT_URL / AWS_* via optional configMapKeyRefs).
    # Absent in sandbox before 2026-07-22 → the Job's optional refs fell through and
    # botocore defaulted to localhost:9000 → prime FAILED "Could not connect to
    # http://localhost:9000/ontologies". iagent-minio is the in-cluster svc; these
    # are sandbox test creds (same values cortexBff.env already carries in plaintext).
    MINIO_ENDPOINT_URL: "http://iagent-minio:9000"
    MINIO_ACCESS_KEY: "minio-sandbox"
    MINIO_SECRET_KEY: "minio-sandbox-secret"

    # External DataHub web UI (Phase 3 follow-up 2026-06-24).
    # When set, datahub_wrapper's /query_metadata response includes
    # an open_url per MatchedAsset so the cortex-ui SourcesTrail can
    # link out to the DataHub asset page. Hosted via Traefik at
    # datahub.edgy-solutions.com per the cluster's ingress.
    DATAHUB_FRONTEND_URL: "https://datahub.edgy-solutions.com"

    # mem0 LLM decoupling — gpt-oss crashes on mem0's structured-output
    # request shape, so route mem0's internal extraction/scoring through a
    # smaller non-reasoning model on a DIFFERENT physical ollama host.
    # ADR-0001.
    #
    # Before 2026-06-03: both 120b (agent) and gemma4:31b (mem0) lived on
    # ai1 (192.168.1.126). The Strix Halo unified 128 GB pool held both
    # while flash attention compressed the 120b KV cache (~70 GB). After
    # flash-attn was disabled for stability the 120b grew to ~97 GB and
    # no longer co-resided with gemma4:31b (~37 GB), causing model swap
    # thrash on every smolagent step.
    #
    # New layout: agent reasoning (120b) stays on ai1; mem0 LLM moves to
    # ai2 (192.168.1.169, Strix Halo + R97000 PRO — added 2026-06-21 as
    # the secondary inference host for this project) running phi4-16k:14b
    # (~9 GB) — a custom Modelfile tag of phi4:14b with num_ctx 16384
    # (the model's native max). The bare `phi4:14b` tag would serve at
    # ollama's default 2k context, which silently truncates Mem0's
    # fact-extraction prompts as soon as the agent's conversation grows
    # beyond a couple of turns — and once truncated facts are written
    # to the Mem0migrationsOllama Weaviate collection, they poison every
    # subsequent agent run. phi4 satisfies the no-Chinese-models
    # constraint and emits clean JSON for mem0's fact-extraction
    # pipeline. Embedder switches to `nomic-embed-8k:latest` (same
    # custom-Modelfile pattern) for consistency, though the underlying
    # `nomic-bert.context_length` is architecturally capped at 2048
    # regardless — see follow-up note about switching to
    # `nomic-embed-text:v1.5` or `snowflake-arctic-embed` for a
    # genuinely-8k embedder when we revisit.
    #
    # HOST RESERVATION RULE (2026-06-21): 192.168.1.179 and 192.168.1.188
    # are RESERVED for goat-yard-archive production work and MUST NOT
    # appear in this project's values files. Only ai1 (.126) and ai2
    # (.169) are valid LLM hosts here. See memory/project_inference_hosts.md.
    MEM0_LLM_MODEL: "phi4-16k:14b"
    MEM0_LLM_PROVIDER: "ollama"
    MEM0_OLLAMA_BASE_URL: "http://192.168.1.169:11434"
    MEM0_EMBEDDER_MODEL: "nomic-embed-8k:latest"
    MEM0_EMBEDDING_MODEL: "nomic-embed-8k:latest"

    # DataHub points at the separate datahub Helm release deployed in the
    # same namespace (acryldata chart, release name "datahub").
    DATAHUB_GMS_URL: "http://datahub-datahub-gms:8080/api/graphql"
    DATAHUB_MOCK_MODE: "false"

    # Work-around for chart bug: values.yaml's agentFleet.env has stale
    # legacy URLs (a default keycloak realm + a bare `http://jena:3030`)
    # that render AFTER the configmap template's explicit lines and
    # therefore win the "last-key-wins" race in the rendered ConfigMap.
    # We re-declare the correct values here so OUR override is last.
    # Fix in the chart itself is to remove these two keys from
    # values.yaml's agentFleet.env since they duplicate the
    # template-rendered values.
    KEYCLOAK_REALM_URL: "http://iagent-keycloak:8080/realms/invincible-agent"
    # /ds/sparql, NOT /ds/query: this Fuseki dataset returns HTTP 405 on POST to
    # /ds/query (engine-o's execute_sparql POSTs form-encoded queries), so the old
    # value made every Fuseki query 405 -> silent fallback/empty. /ds/sparql is the
    # working query endpoint. (Was hot-patched via `kubectl set env` on 2026-07-22
    # to unblock; folded here so a fresh install reproduces it — bootstrap-state-debt.)
    JENA_SPARQL_ENDPOINT: "http://iagent-fuseki:3030/ds/sparql"
    # DECLARED BESIDE ITS SIBLING, AND FOR THE SAME REASON THE OVERRIDE EXISTS AT ALL. This file
    # overrides the QUERY endpoint to the short service name; without the same override the
    # UPDATE endpoint would keep the helper's FQDN and the two would name different hosts for one
    # substrate. Rendering both and reading them side by side is what caught it — a single render
    # of the new key alone looked correct.
    JENA_UPDATE_ENDPOINT: "http://iagent-fuseki:3030/ds/update"
    # NEO4J_URI override RETIRED (chart 0.3.16): the configmap derives it
    # from neo4j.*/externalNeo4j.* with hasKey guards, and the stale
    # values.yaml default (`bolt://neo4j`, the duplicate-key race that
    # made Engine E conclude "knowledge graph was not accessible" in run
    # 850f43fa) is deleted. Set agentFleet.env.NEO4J_URI only to point
    # the fleet at a DIFFERENT neo4j than the chart knows about.

    # Default Ollama model for BAML's `client Ollama`. Switch via configmap +
    # rolling restart (no rebuild). The 128k-context variant is the standing
    # default for reasoning-heavy prompts (e.g. VerifyVerbChoice can stuff
    # several candidate descriptions into context); fall back to `gpt-oss:120b`
    # if you need the standard-context build for latency.
    OLLAMA_MODEL: "gpt-oss-128k:120b"

    # ADR-0008 routing fallback policy (operator-tunable). Start at the
    # default and adjust based on observed predicate_routing_score logs.
    #
    # THRESHOLD (0.40): below this → low_confidence → generalist fallback.
    # THRESHOLD_HIGH (0.85): between THRESHOLD and this → yellow zone →
    #   supervisor calls BAML.VerifyVerbChoice; LLM confirms or rejects.
    # Above THRESHOLD_HIGH → trust BM25 score, no LLM verifier.
    # ANTI_SYNONYM_ALPHA (0.50): penalty weight Engine O applies when a
    #   candidate's verb_anti_synonyms lexically overlap the query.
    PREDICATE_FALLBACK_SCORE_THRESHOLD: "0.40"
    PREDICATE_FALLBACK_SCORE_THRESHOLD_HIGH: "0.85"
    PREDICATE_ANTI_SYNONYM_ALPHA: "0.50"

  secrets:
    # NEO4J_PASSWORD override RETIRED (chart 0.3.16): derived from
    # neo4j.auth.password — ONE place to change, no must-match coupling.

# --------------------------------------------------------------------------
# Resource trimming for sandbox — limit blast radius alongside goatyardarchive
# Setting explicit `limits` so a runaway smolagents loop can't starve gya pods.
# --------------------------------------------------------------------------
# All engine + frontend + dagster images pinned to :latest so the sandbox
# exercises the recent ADR-0008 / ADR-0009 commits, not the chart's
# appVersion (0.1.1, which predates those changes). Engines A and central-
# gateway and the disabled engines already default to :latest in values.yaml.
dataAnalyst:
  enabled: true
  image:
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi  # DuckDB query memory can spike — give headroom
  # 2026-06-17 incident: user-reported UI failure on "what tables do you
  # have?" traced to substrate edge for mesh:analyzeDataset registered
  # with legacy DNS data-analyst-svc.default.svc.cluster.local:8089 (the
  # source default the OLD image bakes in; my source fix in the legacy-
  # DNS class-sweep hasn't reached this pod via image rebuild yet).
  # Belt-and-suspenders env var pin reproduces the rehearsal-W/E fix
  # pattern: on pod restart, register_engine_to_mesh reads the env var
  # (correct DNS), MERGE in mesh-registrar's atomic saga updates the
  # substrate edge endpoint URL to iagent-data-analyst:8089. Source fix
  # is committed; the env var pin makes the deployment NOT depend on
  # the image being rebuilt first.
  env:
    ENGINE_DA_PUBLIC_URL: "http://iagent-data-analyst:8089/analyze_data"
    # 2026-07-10: smolagents 1.24 native structured generation. DA is
    # CodeAgent-by-necessity (duckdb/polars code-exec) so it can't drop the
    # fumble-prone free-form-code envelope by switching to ToolCallingAgent;
    # this flag moves the action code into a JSON field (response_format=
    # CODEAGENT_RESPONSE_FORMAT) so gpt-oss stops fumbling the <code> envelope.
    # PROVEN on the sandbox by a live A/B (direct /analyze_data, N=6/arm, same
    # query+URN, freshly-measured baseline): flag OFF fumbled 6/6 runs (1.17
    # step_errors/run, 23% step-error rate, 4-6 steps); flag ON fumbled 0/6
    # (0 errors, constant 3 steps, ~40% faster). gpt-oss HONORS the json-schema
    # constraint through litellm->ollama (an inert flag would have spiked
    # json.loads failures instead). Sandbox-scoped until validated on other
    # deployments; promote to values.yaml (global default) after that.
    # Preferred over a BAML integration (bigger hammer, same effect); BAML was
    # the fallback only if this proved inert. Reversible: set to "0".
    DA_STRUCTURED_OUTPUTS: "1"

engineA:
  enabled: true
  # image.tag already "latest" in values.yaml default
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi  # smolagents loop can hold context
  # 2026-06-17 incident: same pattern as dataAnalyst above. Engine A's
  # 9 catalog-verb substrate edges (lookupOwnership, traceLineage,
  # describeAsset, enumerateCatalog, findSchema, checkFreshness,
  # filterByTag, assessImpact, analyzeWithCodeAgent) ALL register
  # against the legacy DNS restate-agent-svc.default.svc.cluster.local:8081
  # because the OLD deployed image bakes in that source default. User's
  # query "what tables do you have?" hit mesh:enumerateCatalog and
  # dispatched to the broken URL, killing the run before
  # generate_ui_payload could fire. ENGINE_A_PUBLIC_URL pinned here so
  # the new pod registers with correct iagent-engine-a:8081 DNS even
  # while the image bake-in remains stale.
  #
  # DATAHUB_WRAPPER_URL also pinned: Engine A's smolagent calls
  # search_datahub which targets DATAHUB_WRAPPER_URL, and the OLD image
  # has it defaulting to datahub-wrapper-svc.default.svc.cluster.local
  # (also non-resolvable). Without this pin, even successful dispatch
  # to Engine A would fail at the search_datahub tool call.
  env:
    ENGINE_A_PUBLIC_URL: "http://iagent-engine-a:8081/analyze"
    DATAHUB_WRAPPER_URL: "http://iagent-engine-d:8085"

engineO:
  enabled: true
  image:
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

engineD:
  enabled: true
  image:
    tag: ""
  # Chart bug workaround: values.yaml has `engineD.resources:` with a
  # literal `...` placeholder that renders as a string and breaks the
  # Deployment schema. Re-declare with a real ResourceRequirements shape.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

engineF:
  enabled: true
  image:
    tag: ""

# Engine F, the FINANCE engine — a DIFFERENT service from engineF above (which is the
# presentation agent). Component engine-fin, image finance-agent, port 8096. ADR-0045.
engineFinance:
  enabled: true
  image:
    tag: ""
  # DECLARED MEASURES READ THE EV FIXTURE, as the caller (ADR-0052 §3, §5). Ruled permanent for
  # 0.4.81 (architect, 2026-11-05), after the live leg on 0.4.80 passed with the flag set by hand.
  # The URN and banner are contracts/ev_fixture.yaml's, and a test holds them equal to it.
  # Set, a declared measure (fin_tcpi, fin_vac_cpi) needs a per-asset grant: a caller without one
  # gets 403 `access_denied`, never the seed. Built-in verbs, packages and CDRLs read the asset as the
  # caller too, except a built-in whose row says `source: seed` (fin_funding_status ships so). A
  # package naming a declared or dataset-kind panel is the builder's named 503 (ruled 2026-11-08/09).
  env:
    FIN_DATASET_URN: "urn:li:dataset:(urn:li:dataPlatform:s3,ev_fixture,PROD)"
    FIN_DATASET_BANNER: "SYNTHETIC earned-value fixture, not a real program."

engineCost:
  enabled: true
  image:
    tag: ""

# --------------------------------------------------------------------------
# Infrastructure — sandbox-sized storage
# --------------------------------------------------------------------------
postgresql:
  enabled: true
  # image: inherited from values.yaml (bitnamilegacy/postgresql since 0.4.80).
  auth:
    postgresPassword: "changeme-postgres-sandbox"  # CHANGE BEFORE DEPLOY
    password: "changeme-iagent-sandbox"            # CHANGE BEFORE DEPLOY

restate:
  enabled: true
  image:
    # Pin to a tag compatible with the existing /restate-data PVC. The chart
    # default "1.1" is a floating tag that drifted on Docker Hub and at one
    # point pulled 1.1.6, which is forward-incompatible with data dirs
    # written by Restate >= 1.5.0 — that's how this sandbox first cratered
    # after a routine helm upgrade. Keep this pinned to whatever is currently
    # on the StatefulSet; do not change without coordinating a PVC reset.
    # Post-0.3.0 sweep: registry is a separate field. Setting both here
    # keeps overlay intent explicit.
    registry: "docker.io"
    repository: "restatedev/restate"
    tag: "1.6.2"
  storage:
    size: 2Gi  # sandbox — half the default

neo4j:
  enabled: true
  auth:
    username: "neo4j"
    password: "changeme-neo4j-sandbox"  # CHANGE — must match agentFleet.secrets.NEO4J_PASSWORD
  persistence:
    size: 5Gi  # sandbox — half the default

weaviate:
  enabled: true
  persistence:
    size: 3Gi  # sandbox

fuseki:
  enabled: true
  auth:
    adminPassword: "changeme-fuseki-sandbox"
  persistence:
    size: 2Gi

# Substrate priming — bootstrap-state-debt fix (docs/principles/bootstrap-state-debt.md).
# ENABLED for sandbox so a fresh install / upgrade reproduces the ontology in Fuseki with
# ZERO hand-run scripts. The prime post-install/post-upgrade hook uploads the canonical TTLs
# to MinIO and triggers doc-tools' `ingest_ontology_to_jena` (Graph-Store-Protocol PUT into
# Fuseki) + reregisters engines (triggerIngest + reregisterEngines both default true).
#
# Root cause it heals (found 2026-07-21): on 2026-07-13 the Fuseki pod was recreated and its
# dataset came back EMPTY — Neo4j (955 OntologyClass) + Weaviate kept their own PVCs, so the
# verb question (/find_compatible_verbs, Neo4j) kept working while /classes (SPARQL over the
# empty store) went blank. Nothing reproducible re-ingested because this was disabled and
# never overridden in sandbox values — textbook bootstrap-state-debt.
#
# wipe:false keeps it IDEMPOTENT (GSP PUT overwrites per graph; re-registration is
# idempotent), so leaving it ON is self-healing on every install/upgrade rather than a
# one-shot "flip on then flip back" manual toggle. For a scorched-earth routing re-prime set
# wipe:true temporarily (preserves answer-durability data); see values.yaml for the guards.
# Engine P ON for sandbox: the portfolio-review workshop tool's twelve verbs. The BFF's
# /plan/measure route returns an honest 502 planning_engine_unreachable without it — correct,
# and not an answer.
enginePlanning:
  enabled: true
  image:
    # REQUIRED, not cosmetic. values.yaml leaves this "" so production pins the
    # chart appVersion deliberately; sandbox tracks master. Without this override
    # the pod asks for planning-agent:2026.07.02 — a tag that never existed, since
    # this image was first built today — and sits in ImagePullBackOff.
    tag: ""

primeSubstrate:
  enabled: true
  wipe: false

# ontologySeed ON for sandbox: the mro_extension routing nouns
# (TechnicalManual/Diagram/ProcedureStep) aren't in the prime ingest set, so a
# fresh sandbox needs this gated seed to reach working routing with zero hand
# scripts. Default-off in values.yaml (work uses its own overlayEnums vocab).
# Runs at prime+5 (after prime, before reregister); idempotent, so it's
# self-healing on every install/upgrade — same posture as primeSubstrate above.
ontologySeed:
  enabled: true

keycloak:
  enabled: true
  # ONE claim for every species (identity-mint-contract.md): service clients emit it through
  # authz-id-svc, local humans through a user attribute of this name (= their email) that the
  # cortex-ui client emits, brokered humans through the broker's sub mapper (= upstream sub).
  # USER_ENTITLEMENT_CLAIM is rendered from this same key.
  authzClaim: "authz_id"
  # The training workbench's login (the architect, 2026-10-24). Its UI and API share this host.
  publicClients:
    - clientId: training-workbench
      redirectUris: ["https://training.edgy-solutions.com/*"]
      webOrigins: ["https://training.edgy-solutions.com"]
  # A1, ruled 2026-09-30: the person the mesh-registrar delegate acts for. No credentials.
  nonInteractiveUsers:
    - username: platform-registrar
      email: platform-registrar@example.com
  # Chart 0.4.36 dropped these three from nonInteractiveUsers: they were MIRRORED email users
  # (local stand-ins for OpenDDIL's principals), replaced by brokered principals bound to the
  # upstream `sub` (brokers.openddil.principals below). The reconcile job is additive, so any
  # Keycloak first booted before 0.4.36 still holds them; this list makes the job remove them
  # (only when they carry no federated identity link).
  retiredUsers:
    - operator.atlantia
    - operator.borduria
    - liaison
  # OIDC BROKER to OpenDDIL's realm. OpenDDIL's own principals sign in THROUGH us and their grants
  # bind to THEIR `sub` (authz_id = upstream sub), replacing the three mirrored email users the
  # 0.4.25 block carried (operator.atlantia, operator.borduria, liaison). The issuer and client are
  # OpenDDIL's (packet 2026-10-10): confidential client iagent-broker, auth-code only, scopes
  # openid/profile/email. Their redirect URI is
  # https://keycloak.edgy-solutions.com/realms/invincible-agent/broker/openddil/endpoint (realm
  # `invincible-agent`); they also registered an `iagent` one, which we will ask them to drop.
  # THE FLIP (0.4.50, 2026-10-16): OpenDDIL's issuer chains to their lab CA ("OpenDDIL Lab
  # Internal CA", CA:TRUE, pathlen:0); Keycloak trusts that CA's PEM (public, not a secret) from a
  # Secret created out of band:
  #   kubectl create secret generic keycloak-openddil-trust --from-file=ca.pem=<lab-ca.pem>
  # The client secret is ALSO out of band, by reference only: Secret openddil-broker-client, key
  # client-secret (existingSecret below). Neither value is in any values file, committed or not.
  truststore:
    enabled: true   # the flip (0.4.50)
    existingSecret: keycloak-openddil-trust
    key: ca.pem
  brokers:
    openddil:
      enabled: true   # the flip (0.4.50)
      displayName: "OpenDDIL"
      issuer: "https://openddil.cortex.edgy-solutions.com/idp/realms/openddil"
      clientId: iagent-broker
      existingSecret: openddil-broker-client
      secretKey: "client-secret"
      # The subs below are the fixed ids from OpenDDIL's realm-openddil.json; the 2026-10-10 packet did not
      # restate them, so they are UNCONFIRMED against the live realm.
      principals:
        - sub: "11111111-1111-4111-8111-111111111111"
          username: operator.atlantia
          label: "Operator, Atlantia"
        - sub: "22222222-2222-4222-8222-222222222222"
          username: operator.borduria
          label: "Operator, Borduria"
        - sub: "33333333-3333-4333-8333-333333333333"
          username: liaison.coalition
          label: "Coalition liaison"
        # Ruled 2026-10-21: every OpenDDIL operator the delegate may drop for. Its login lands on
        # MECHANIC/MAINTENANCE since the 10-21 Topaz apply.
        - sub: "55555555-5555-4555-8555-555555555555"
          username: operator.regioneast
          label: "Operator, Region East"
  # OpenDDIL's delegate client (2026-10-02), "Model Y": an external workload like doc-tools —
  # a separate release, credential created here because the realm lives here. It authenticates
  # AS ITSELF (kind: delegate), never as the brokered principals above (by username; the
  # DELEGATE_ON_BEHALF_OF env carries their SUBs); those are RECORDED in
  # onBehalfOf, not verified this pass (R-089). configmap.yaml renders it as
  # DELEGATE_ON_BEHALF_OF; the BFF's /human_tasks/{id}/act reads it to let this client act for
  # exactly these principals, can_act asked of the principal, the delegate recorded as acted_via.
  # Declared here, in extraServiceClients, rather than the base values.yaml serviceClients:
  # onBehalfOf's referential check requires its users to be in THIS environment's
  # nonInteractiveUsers, so the base chart would otherwise fail to render on its own.
  # NO secretRef: this chart deploys nothing that needs to read the secret value, so Keycloak
  # MINTS it (first-boot import and reconcile both omit "secret") and nothing here ever sets,
  # regenerates or rotates it on an existing client.
  extraServiceClients:
    - clientId: "iagent-openddil"
      authzId: "svc:openddil"
      kind: delegate
      onBehalfOf:
        - user: operator.atlantia
          role: operator
        - user: operator.borduria
          role: operator
        - user: operator.regioneast
          role: operator
        - user: liaison.coalition
          role: supervisor
    # The case runner's delegate identity (item B, 2026-10-03): restate-analyst's direct_call
    # steps act as this client when a step carries no human user_jwt. kind: delegate, same
    # reason as iagent-openddil above — onBehalfOf.user (platform-registrar) only exists in
    # THIS environment's nonInteractiveUsers, so the base chart's values.yaml would fail to
    # render this client on its own. UNLIKE iagent-openddil, this one HAS a secretRef: engine-a
    # (restate-analyst's image) reads the secret to mint its own tokens, so Keycloak's
    # self-minted secret would be unusable by the only process that needs it — the same
    # declared-but-unwired gap secrets.yaml's comments name for engine-a/p/fin/safety.
    - clientId: "iagent-case-runner"
      authzId: "svc:case-runner"
      kind: delegate
      secretRef: "caseRunnerClientSecret"
      onBehalfOf:
        - user: platform-registrar
          role: operator
  # Case runner's client secret — read by templates/secrets.yaml's CASE_RUNNER_CLIENT_SECRET
  # projection (hasKey-guarded, same fallback literal) and by the realm reconcile/configmap
  # templates via secretRef above (`get $.Values.keycloak $c.secretRef`), so both sides of the
  # mint agree on one value rather than drifting.
  caseRunnerClientSecret: "sandbox-case-runner-secret"
  # ADMIN CREDENTIALS ARE DECLARED IN values-sandbox.secret.yaml — NOT HERE.
  #
  # This block used to say `adminPassword: "changeme-keycloak-sandbox"  # CHANGE`, and that
  # value was NEVER this instance's password. The file carried two top-level `keycloak:` keys;
  # helm's last-wins parse discarded this override on every render, so Keycloak first-booted on
  # the CHART DEFAULT (`changeme-keycloak`) while this file looked like it had changed it. And
  # KEYCLOAK_ADMIN_PASSWORD is first-boot-only, so the database has held that value ever since.
  #
  # Fixing the duplicate-key bug ACTIVATED this previously inert line. The first render after
  # the fix (rev 65) handed the realm-reconcile hook a credential the database has never had and
  # the release wedged on `invalid_grant`. THE BUG HAD BEEN MASKING A WRONG DECLARATION, so
  # repairing the bug is what broke the deploy — the value was wrong the whole time and inert.
  #
  # Left with NO value on purpose: two declarations of one secret is how last-wins reasserted
  # the wrong one, and a stale duplicate here would do it again. Exactly one home.
  ingress:
    # Keycloak ingress added 2026-06-04. Template (templates/keycloak.yaml)
    # adds KC_PROXY_HEADERS=xforwarded + KC_HTTP_ENABLED=true when
    # ingress.enabled, so Keycloak trusts Traefik's X-Forwarded-Proto
    # header and the issuer URL in .well-known/openid-configuration
    # flips to https when Traefik terminates TLS on the ingress —
    # which is exactly what cortex-ui's OIDC client expects.
    enabled: true
    className: traefik
    hosts:
      - host: keycloak.edgy-solutions.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - keycloak.edgy-solutions.com
        secretName: edgy-wildcard-tls

topaz:
  enabled: true

# The ReBAC schema must exist before taskGrantSync's startup syncs try to write objects/
# relations of a type the base manifest only recently gained — see values.yaml's
# topazManifestLoad comment and templates/topaz-manifest-load-job.yaml.
topazManifestLoad:
  enabled: true

# Task grants must exist without a human hand-running policy/sync/task_grant_sync.py — see
# values.yaml's taskGrantSync comment and templates/task-grant-sync-job.yaml.
taskGrantSync:
  enabled: true

# Dagster — webserver and daemon use our own thin multi-arch
# `dagster-server` image (built by iagent CI specifically for this
# purpose — see the `dagster-server` matrix entry in build-containers.yml).
# Canonical docker.io/dagster/dagster-k8s would be ideal but it's
# amd64-only and the cluster is arm64. dagster-server has dagster +
# webserver + daemon + postgres + graphql but no iagent code, so it
# stays small while serving the orchestration plane.
# User-code stays on the iagent dagster-control-plane image because
# that one has `iagent.definitions` baked in.
dagster:
  webserver:
    enabled: true
    image:
      # Our thin arm64-capable dagster runtime. ghcr.io/edgy-solutions/...
      # is the default registry so no override needed.
      tag: ""
      repository: "edgy-solutions/invincible-agent/dagster-server"
    ingress:
      # Dagster UI exposed at dagster.edgy-solutions.com — useful for
      # inspecting supervisor_query_job runs / Engine A routing decisions
      # / Op state on a real query. Same TLS pattern as the other four.
      enabled: true
      className: traefik
      hosts:
        - host: dagster.edgy-solutions.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - dagster.edgy-solutions.com
          secretName: edgy-wildcard-tls
  daemon:
    enabled: true
    image:
      tag: ""
      repository: "edgy-solutions/invincible-agent/dagster-server"
  userCode:
    enabled: true  # loads iagent.definitions
                    # doc-tools is deployed as a SEPARATE Dagster code-location
                    # via the doc-tools chart; both register with this webserver.
    # image: the base default is the control-plane image (the chart's old `dagster-user-code` was never built).

  # Doc-tools is deployed standalone via the doc-tools chart but exposes
  # a Dagster gRPC code-location server on port 3030. Wiring it into this
  # workspace.yaml lets the iagent dagster daemon discover doc-tools'
  # sensors + assets (aitool_registration_sensor, sync_aitool_predicate_*).
  # Disabled by default; sandbox flips it on.
  docToolsCodeLocation:
    enabled: true
    host: "doc-tools"
    port: 3030

# --------------------------------------------------------------------------
# Frontend — disable ingress for sandbox (use kubectl port-forward instead)
# --------------------------------------------------------------------------
centralGateway:
  enabled: true
  # The dag-tools central-gateway image binds to 8090 internally (hardcoded
  # in its hypercorn invocation). Chart default of 8000 caused
  # readiness/liveness probes to hit a closed port — pod stuck 0/1 Running.
  port: 8090
  # PINNED BY DIGEST in values.yaml `global.imageDigests` (dag-tools v0.14.0); no image override here.
  env:
    # The gateway's verified identity (dag-tools PR #6). The issuer is what a realm token carries,
    # so it is the public realm URL. JWKS is fetched inside the cluster, like every other realm read.
    # From v0.14.0 the gateway accepts LISTS: GATEWAY_JWT_ISSUERS and GATEWAY_JWT_AUDIENCES are
    # rendered by the chart from cortexBff.auth (templates/engines.yaml), so they cannot be set here.
    # The singular issuer below stays: cortexBff.auth.acceptedIssuers quotes it, and the gateway reads
    # it as one more entry of the same list, so the union equals the BFF's list.
    #
    # THE POSTURE IS WRITTEN OUT, not left to the default, because the parser reads any value it does
    # not recognise as enforce. The sandbox enforces from 0.4.85 (architect, 11-11), with the lists
    # served in the same roll; post-roll the startup line reads enforce_ready=yes. The internal doors
    # (dag-tools PR #8) read their own INTERNAL_DOOR_POSTURE, unset here, which means observe.
    GATEWAY_IDENTITY_POSTURE: "enforce"
    GATEWAY_JWKS_URL: "http://iagent-keycloak:8080/realms/invincible-agent/protocol/openid-connect/certs"
    GATEWAY_JWT_ISSUER: "https://keycloak.edgy-solutions.com/realms/invincible-agent"

cortexUi:
  # Enabled 2026-06-04. cortex-ui CI now builds multi-arch
  # (linux/amd64,linux/arm64) per cortex-ui commit 6312f31 — the prior
  # amd64-only image was the only thing keeping this off; the rest of
  # the chart wiring was correct.
  enabled: true
  image:
    tag: ""
    # PINNED BY DIGEST in values.yaml `global.imageDigests` (this file used to repeat the digest;
    # the pin history is in git and in the comment above that row).
  ingress:
    # 2026-06-04: Traefik ingress at 192.168.1.50, matching the existing
    # *.edgy-solutions.com hostname pattern (vault/redpanda/tika already
    # live there). Pi-hole resolves the new hostnames to .50.
    #
    # TLS added 2026-06-04 because oidc-client-ts uses window.crypto.subtle
    # for PKCE, which browsers refuse to expose on plain HTTP origins.
    # Self-signed wildcard cert lives in the `edgy-wildcard-tls` Secret
    # (sandbox namespace), generated locally and applied via kubectl.
    # Browsers throw a one-time untrusted-cert warning; users click
    # through. Replace with cert-manager + a real CA when this graduates
    # out of sandbox.
    enabled: true
    className: traefik
    hosts:
      - host: cortex.edgy-solutions.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - cortex.edgy-solutions.com
        secretName: edgy-wildcard-tls
  env:
    # External URLs — HTTPS because the browser needs a secure context
    # to use crypto.subtle for PKCE. Traefik does the TLS termination
    # and forwards plain HTTP upstream to the backends (X-Forwarded-Proto
    # carries the protocol the browser used). cortex-ui's
    # docker-entrypoint.sh injects these into /config.js at container
    # boot so the bundled JS picks them up via window.__RUNTIME_CONFIG__
    # without a rebuild.
    VITE_API_URL: "https://bff.edgy-solutions.com"
    VITE_KEYCLOAK_REALM_URL: "https://keycloak.edgy-solutions.com/realms/invincible-agent"
    VITE_KEYCLOAK_CLIENT_ID: "cortex-ui"
    # Electric subscription endpoint (ADR-0023 / Hop 3). Browser
    # subscribes directly to Electric's shape stream; ingress block
    # for `electric:` below exposes the in-cluster service. When this
    # is empty, cortex-ui's electric.ts logs "subscription skipped"
    # and the canvas falls back to SSE-only (no refresh resilience).
    VITE_ELECTRIC_URL: "https://electric.edgy-solutions.com"
    # Runtime feature flags (cortex-ui adf44b5+): canvas export and the ingest client. Read at
    # boot from /config.js like the URLs above; rendered by frontend.yaml's generic env loop.
    # 0.4.72 (architect, 2026-10-30): `promotionRuns` goes on in the same roll that first stores
    # `review_coverage` on the promotion record (ingest-v1 1.4.0) -- never ahead of it.
    # 0.4.85 (architect via Chris, 2026-11-11): `reviewExport` goes on in the same roll as cortex
    # a255a8e and saf's #356 export routes -- never ahead of the image that reads exportable_states.
    VITE_FEATURES: "canvasExport,ingest,promotionRuns,reviewExport"
    # 2026-10-10, rev 186b: cortex #6 sends `frontend_version` on /interview/stream only when this
    # is "true" (docker-entrypoint.sh at 865c080 filters it to "true"/""). Its platform half, IA
    # #27, rolled in 186 and reads a request with or without it, so this is the switch, not a
    # dependency. Empty or absent = cortex sends nothing, the pre-186 wire.
    VITE_SEND_FRONTEND_VERSION: "true"
    # 2026-10-15, rev 188b (architect: confirm one live row-edit correction in the roll packet, or
    # set this false). None exists to confirm: no grouped review has been acted on since
    # 2026-10-10, none ever carried row_edits, and no extraction_defect task has ever been filed.
    # So row edits are OFF on the sandbox until one is confirmed. The image's entrypoint honours
    # only the exact lowercase string "false"; anything else, including absent, is ON.
    # 2026-10-20, ON for 199: the row and header editors both sit behind this flag, and the first
    # live correction (TYC's mfr, header_edits) is made THROUGH the card, so the card's flag has to
    # be on for the correction that proves it. The server's IAGENT_PROMOTION_ROW_EDITS is on since 198.
    VITE_REVIEW_ROW_EDITS: "true"
    # 2026-10-20, for 200: from cortex 7a7666d the promotion card's row and header editors have
    # their own flag, OFF in the image unless exactly lowercase "true"; VITE_REVIEW_ROW_EDITS above
    # now gates grouped review only. The sandbox keeps the promotion editor on, with the server's
    # IAGENT_PROMOTION_ROW_EDITS.
    VITE_PROMOTION_ROW_EDITS: "true"

cortexBff:
  enabled: true
  image:
    tag: ""
  # CPU limit 2, not the base 500m. One GET /me/entitlements costs ~2.6 s of CPU: ~37 Topaz directory
  # calls, each building its own httpx.Client. At 500m the pod was throttled in 40% of periods, and the
  # UI's 15 s entitlements timeout expired on every attempt (2026-11-12 incident). At 2 it was 4%.
  # The limit was set by hand on the live pod first; this carries it so a roll does not reset it.
  # Revisit once human_tasks.py reuses one client per request.
  resources:
    limits:
      cpu: "2"
  # MinIO connection for the /federated_image endpoint (Option A: bff
  # proxies image reads from MinIO so they share the same JWT +
  # entitled_domains gate as the rest of the data path; the browser
  # never speaks to MinIO directly). Credentials are minio-sandbox /
  # minio-sandbox-secret per the cluster's iagent-minio StatefulSet
  # root user/password env vars. Endpoint is the in-cluster service
  # name; production would point at a TLS-terminated ingress.
  env:
    MINIO_ENDPOINT_URL: "http://iagent-minio:9000"
    MINIO_ACCESS_KEY: "minio-sandbox"
    MINIO_SECRET_KEY: "minio-sandbox-secret"
    MINIO_REGION: "us-east-1"
    # Steward corrections (row_edits) on a document_promotion. OFF until one live correction is
    # proven; then this and cortexUi.env.VITE_REVIEW_ROW_EDITS go "true" together. Only the exact
    # word "true" turns it on.
    # 2026-10-20, ON for 198 with cortex's flag still off (step 2 of the order in the 10-19
    # morning report): the server takes row_edits on a promotion, no UI sends them yet.
    IAGENT_PROMOTION_ROW_EDITS: "true"
    # Who a policy refusal names as the grantor (src/iagent/authz/refusal.py). The seed
    # (policy/grantors/) is deployment-neutral; this overlay names the sandbox's own approver
    # (architect, 2026-10-27, ruling 5). Sandbox only: the chart sets no default, so a deployment
    # without this key reads the seed. A path that does not exist composes NOTHING, silently --
    # tests/security/test_the_sandbox_names_its_grantor.py holds it to a directory with rows.
    GRANTOR_OVERLAY_DIRS: "/app/policy/overlays/sample/grantors"
  # Token acceptance (architect, 2026-11-11). Keycloak runs without a fixed hostname, so `iss` is the URL a
  # token was minted at: the public realm URL for the browser and outside callers (the gateway's
  # GATEWAY_JWT_ISSUER), and the in-cluster realm URL for every in-cluster mint
  # (iagent_mesh.service_identity.mint_token reads agentFleet.env's KEYCLOAK_REALM_URL; doc-tools quotes
  # the same URL). Both entries quote those values rather than retyping them.
  auth:
    acceptedIssuers:
      - '{{ .Values.centralGateway.env.GATEWAY_JWT_ISSUER }}'
      - '{{ .Values.agentFleet.env.KEYCLOAK_REALM_URL }}'
    acceptedAudiences:
      - cortex-bff
    realmAudience: cortex-bff
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: bff.edgy-solutions.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - bff.edgy-solutions.com
        secretName: edgy-wildcard-tls

# (keycloak.ingress moved into the SINGLE keycloak block above — this file
# carried TWO top-level `keycloak:` keys and helm's YAML parser silently
# takes last-wins, so the first block's auth.adminPassword override was
# being DISCARDED on every render: keycloak ran on the chart-default
# admin password while this file looked like it had changed it.)

# --------------------------------------------------------------------------
# Electric (ADR-0023 / Hop 3 substrate). Browser clients subscribe
# directly to Electric's shape endpoint; we expose it via the same
# *.edgy-solutions.com pattern as cortex-bff / Keycloak. The cortexUi
# block above sets VITE_ELECTRIC_URL to this host.
# --------------------------------------------------------------------------
electric:
  # 2026-10-02: docker.io electricsql/electric is WITHDRAWN (the repo endpoint 404s; the pod sat
  # in ImagePullBackOff). Rebuilt from upstream's tag @core/sync-service@1.0.13 by
  # .github/workflows/mirror-electric.yml. NOT upstream's binary: upstream's pinned builder
  # (erlang-27.2) can no longer fetch hex (TLS key_usage_mismatch), so the builder runs OTP
  # 27.3.4.4 on bookworm-20260610 and the tag says so. Pinned by digest, measured anonymously:
  # this tag answers 200 with this digest; bare 1.0.13 and -otp27.3.4.5 answer 404.
  # values.yaml keeps the upstream default for deployments that mirror it themselves.
  image:
    registry: "ghcr.io"
    repository: "edgy-solutions/mirror/electric"
    tag: "1.0.13-otp27.3.4.4"
  # 2026-06-30: direct Electric ingress CLOSED. Per-user isolation
  # interim flows browser → cortex-bff `/electric/shape` proxy → in-
  # cluster Electric service (`http://iagent-electric:3000`). Exposing
  # Electric directly would let a tester construct a ShapeStream with
  # a client-supplied WHERE clause and bypass the proxy's verified
  # `produced_for_user_id = <sub>` filter. Trust the proxy, close the
  # bypass. See gateway.py `electric_shape_proxy` for the trusted path.
  ingress:
    enabled: false

# --------------------------------------------------------------------------
# Secrets — sandbox tokens. Real prod secrets go in a separate Sealed-
# Secret or external-secrets-operator-managed object — NOT in this file.
# --------------------------------------------------------------------------
secrets:
  openaiApiKey: ""  # not needed if Ollama is the only LLM provider
  hfToken: ""
  datahubToken: ""  # populate after DataHub deploys + generates a PAT

# --------------------------------------------------------------------------
# ENGINE-LG (graph host) — ON in sandbox, and WRITTEN DOWN rather than --set.
#
# THE REGRESSION THIS PREVENTS, 2026-09-12. `graphHost.enabled: true` lived
# ONLY in release rev 112's user-supplied values — someone had passed it as
# `--set` and it was never written into a file. `scripts/upgrade-sandbox.sh`
# deliberately does NOT use `--reuse-values` (so a value deleted from a file
# cannot outlive the commit that deleted it), so the next roll computed the
# render from the files, found `enabled: false`, and DELETED the deployment.
#
# The fleet went 17 services -> 16 and the census said "OK: all 16 at <sha>".
# Nothing was wrong with any of the 16. A verb whose HOST had disappeared
# still resolves, because registration persists in the graph — so the pick
# fails at dispatch, which is the furthest possible point from the cause.
#
# `--reuse-values` is NOT the fix; it is the thing the script refuses on
# purpose. THE FIX IS THAT A LIVE DEPLOYMENT'S EXISTENCE IS DECLARED IN A
# TRACKED FILE. A `--set` is an instruction, not a declaration: it survives
# exactly one release and is invisible to every reader of this repo.
#
# values.yaml keeps `enabled: false` — that is the platform default and B5's
# to change. This is the sandbox saying it wants it.
# --------------------------------------------------------------------------
graphHost:
  enabled: true

# --------------------------------------------------------------------------
# ENGINE-SAFETY — ON in sandbox, increment 5 (ADR-0051).
#
# DECLARED HERE, NOT PASSED AS `--set`. A --set survives exactly one release
# and is invisible to every reader of this repo; upgrade-sandbox.sh refuses
# --reuse-values on purpose, so the next roll computes from the files and a
# --set-only engine is DELETED. That is not hypothetical — graphHost.enabled
# lived only in a release's user-supplied values on 2026-09-12, the roll
# dropped it, and the census reported "OK: all 16" while a host had vanished.
#
# values.yaml keeps `enabled: false` — the platform default, and B5's to
# change. This is the sandbox saying the sandbox wants it.
#
# SHIPS WITH bcd9d37 OR THE CELL GRANTS NOTHING: the registration passing
# domains=DOMAINS is what makes the SUSTAINMENT/SAFETY_ENGINEER cell mean
# anything. Before that commit the engine registered 0/3 verbs and any that
# had landed would have been domain-agnostic — visible to every caller in the
# fleet, the gate inverted by an OMITTED argument rather than a wrong one.
# --------------------------------------------------------------------------
engineSafety:
  enabled: true


# --------------------------------------------------------------------------
# User deployments — no override here. Both images (dag-tools, pub-tools) are cross-repo and
# are pinned by digest in values.yaml `global.imageDigests`; this file used to carry its own
# dag-tools digest (4096a11), which was a second place to change and is gone. History is in git.
# --------------------------------------------------------------------------

# ==========================================================================
# NetworkPolicy -- the gate-on roll PROPOSAL. The gate STAYS OFF here
# (networkPolicy.enabled is not set, so it is false): this block renders nothing until a roll
# turns it on. Source: docs/measurements/2026-10-08-the-networkpolicy-gate-cuts-the-callers-it-admits.md
# tables A and B -- a CONFIGURATION census, not a traffic census; the flag-on census is the
# traffic half, and a cut it names is a new row.
#
# Every entry expires 2026-12-14, the same backstop as the engine-f exception in
# templates/networkpolicy-stores.yaml. The ban tightens by DELETING entries as callers move
# onto the Mesh* services.
#
# NOT HERE, DELIBERATELY:
#   - the model/embedding endpoint is OFF-CLUSTER: it goes in `networkPolicy.extraEgress` in the
#     untracked secret values file (an ipBlock), never in this file, and has no address here.
#   - MinIO and Redis are not components of this chart (no workload carries their label), so
#     no podSelector can name them; they ride extraEgress too.
#   - doc-tools, datahub-gms and engine-b are not rendered in this release (separate release
#     or disabled), so no entry names them.
# ==========================================================================
