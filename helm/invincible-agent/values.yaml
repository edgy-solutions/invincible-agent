# ==========================================================================
# Invincible Agent — Helm Values
# ==========================================================================

# -- Global image settings -------------------------------------------------
global:
  imageRegistry: ghcr.io
  imagePrefix: edgy-solutions/invincible-agent
  imagePullPolicy: IfNotPresent
  # -- Suffix for internal K8s service resolution (e.g., .default.svc.cluster.local)
  clusterDomain: ""
  imagePullSecrets:
    - name: ghcr-pull-secret
  # -- Utility images for hooks/init-containers
  images:
    curl: "curlimages/curl:latest"
    postgresClient: "postgres:15-alpine"

# ==========================================================================
# PostgreSQL
# Set postgresql.enabled=false + externalPostgresql if you BYO Postgres.
# ==========================================================================
postgresql:
  enabled: true
  image:
    repository: "postgres"
    tag: "16"
  auth:
    postgresPassword: "changeme-postgres"
    username: "iagent"
    password: "changeme-iagent"
    database: "iagent"
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi
    initdb:
      scriptsConfigMap: "{{ .Release.Name }}-initdb"

# Use this when postgresql.enabled=false (bring your own Postgres)
externalPostgresql:
  host: ""
  port: 5432
  database: "iagent"
  username: "iagent"
  password: "changeme-iagent"

# ==========================================================================
# Restate Server
# Set restate.enabled=false + externalRestate if you BYO Restate.
# ==========================================================================
restate:
  enabled: true
  image:
    repository: docker.io/restatedev/restate
    tag: "1.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  storage:
    enabled: true
    storageClass: ""
    size: 5Gi
  ingressPort: 8080
  adminPort: 9070

# Use this when restate.enabled=false (bring your own Restate)
externalRestate:
  ingressUrl: ""    # e.g. "http://my-restate.infra.svc:8080"
  adminUrl: ""      # e.g. "http://my-restate.infra.svc:9070"

# ==========================================================================
# Dagster Control Plane
# Set dagster.webserver.enabled / dagster.daemon.enabled = false if you
# already run Dagster and only want the user code deployment.
# ==========================================================================
dagster:
  webserver:
    enabled: true
    replicas: 1
    image:
      tag: ""  # defaults to .Chart.AppVersion
    port: 3000
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: dagster.iagent.local
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []
  daemon:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  userCode:
    enabled: true
    replicas: 1
    image:
      tag: ""  # defaults to .Chart.AppVersion
    port: 4000
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  # When webserver/daemon are disabled, point to external Dagster's gRPC
  externalWorkspace:
    # Set to true if an external Dagster should discover this user code
    registerWithExternal: false
    # External Dagster admin URL for auto-registration (future use)
    adminUrl: ""

# ==========================================================================
# Agent Fleet — Shared Configuration
# Use this to define common setting (Ollama, Models, Keycloak)
# that will be injected into ALL agent containers automatically.
# ==========================================================================
agentFleet:
  env:
    # 🔗 Agent Runtime Essentials
    SMOLAGENTS_PROVIDER: "ollama"
    SMOLAGENTS_MODEL: "gpt-oss-128k:120b"
    OLLAMA_BASE_URL: "http://ollama:11434/v1"
    BAML_LOG_LEVEL: "info"
    
    # 🔗 Network & Service Discovery
    KEYCLOAK_REALM_URL: "https://keycloak/realms/d4"
    JENA_SPARQL_ENDPOINT: "http://jena:3030/ds/query"
    DATAHUB_GMS_URL: "http://datahub-gms:8080/api/graphql"
    DATAHUB_MOCK_MODE: "false"
    
    # 🔗 Storage Layer (Neo4j & Weaviate)
    NEO4J_URI: "bolt://neo4j"
    NEO4J_USER: "neo4j"
    WEAVIATE_DOC_COLLECTION: "DocumentChunk"

    # 🔗 Global Timeouts
    AGENT_HTTP_TIMEOUT: "300"
    
    # 🔗 Superset Analytics
    SUPERSET_URL: "http://superset:8088"
    
  secrets:
    NEO4J_PASSWORD: "xxxxx"
    SUPERSET_ACCESS_TOKEN: ""
    # openaiApiKey: ""
    # hfToken: ""

# ==========================================================================
# Agent Fleet — Engine Configs
# ==========================================================================

engineO:
  enabled: true
  replicas: 1
  image:
    name: ontology-service
    tag: ""
  port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}

engineA:
  enabled: true
  replicas: 1
  image: { name: "restate-analyst", tag: "latest" }
  port: 8081
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env: {}

engineB:
  enabled: true
  replicas: 1
  image: { name: "langgraph-support", tag: "latest" }
  port: 8082
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env:
    LANGGRAPH_POSTGRES_URI: "postgresql://iagent:iagent@postgresql:5432/iagent"

engineC:
  enabled: true
  replicas: 1
  image: { name: "swarms-scraper", tag: "latest" }
  port: 8083
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env: { SWARMS_MODEL: "gpt-oss-128k:120b" }

engineD:
  enabled: true
  replicas: 1
  image:
    name: datahub-wrapper
    tag: ""
  port: 8085
  resources:
    ...
  # NOTE: DATAHUB_GMS_URL deliberately NOT set here. Engine-level env entries
  # are rendered as explicit `env:` on the Deployment and override anything
  # coming from envFrom (the shared ConfigMap). Shared infrastructure URLs
  # live in agentFleet.env (above) and propagate to every engine via the
  # ConfigMap so cluster operators can override per-environment.
  env: {}

engineE:
  enabled: true
  replicas: 1
  image: { name: "neo4j-expert", tag: "latest" }
  port: 8086
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env: {}

engineW:
  enabled: true
  replicas: 1
  image: { name: "weaviate-expert", tag: "latest" }
  port: 8088
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  env: {}

# B3 — DMC phone book. Third instance-resolution provider for
# mesh:resolveInstance. Looks up Data Module Codes against the B2
# substrate (Neo4j :DataModule instances with dmc_uri_unique index).
# Boundary: this service READS from Neo4j; the sandbox cluster's
# substrate may include SANDBOXRTX test instances, but neither this
# values block nor the service's main.py reference the marker (it's
# a guard-asserted invariant — see test_b2_ingest_sandboxrtx.py).
dmcPhoneBook:
  enabled: true
  replicas: 1
  image: { name: "dmc-phone-book", tag: "latest" }
  port: 8091
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  env: {}

engineF:
  enabled: true
  replicas: 1
  image:
    name: presentation-agent
    tag: ""
  port: 8087
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}

dataAnalyst:
  enabled: true
  replicas: 1
  image:
    name: data-analyst
    tag: ""
  port: 8089
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: {}

# ==========================================================================
# Data Plane Services
# ==========================================================================

centralGateway:
  enabled: true
  replicas: 1
  image:
    repository: "edgy-solutions/dag-tools/central-gateway"
    tag: "latest"
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    # Topaz Authorizer URL (Internal K8s DNS) — central-gateway specific
    TOPAZ_AUTHORIZER_URL: "http://topaz-svc:8383"
    # NOTE: DATAHUB_GMS_URL deliberately NOT set here. See engineD for the
    # reasoning — shared infrastructure URLs live in agentFleet.env so the
    # ConfigMap is the single source of truth and remains overridable.

# ==========================================================================
# mesh-registrar — Contract D registration gateway.
# Engines opt into this path by setting MESH_REGISTRAR_URL on themselves
# (typically via agentFleet.env so all engines pick it up). Disabled by
# default until the SDK in registering engines is updated to use the
# gateway path (see iagent_mesh.core._emit_to_registrar).
# ==========================================================================

meshRegistrar:
  enabled: false
  replicas: 1
  image:
    name: mesh-registrar
    tag: "latest"
  port: 8090
  # v0.2 saga budget: how long bounded forward-retry runs before the
  # saga gives up and compensates. Sized to absorb transient-blip
  # registration latency without alarming, while still failing fast
  # enough that a sustained outage produces a 5xx within request
  # budget. See ADR-0006 §Addendum §Indicators-for-revisiting: raise
  # this if forward-retry exhaustion becomes non-rare without an
  # underlying-blip root cause being available.
  registerSagaBudgetSeconds: 15
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==========================================================================
# Frontend Services
# ==========================================================================

cortexUi:
  enabled: true
  replicas: 1
  image:
    repository: edgy-solutions/cortex-ui/frontend
    tag: ""
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Environment variables passed as NAME: VALUE
  env:
    VITE_API_URL: "http://localhost:8000"
    VITE_KEYCLOAK_REALM_URL: "http://localhost:8080/realms/invincible-agent"
    VITE_KEYCLOAK_CLIENT_ID: "cortex-ui"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

cortexBff:
  enabled: true
  replicas: 1
  image:
    name: cortex-bff
    tag: ""
  port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# ==========================================================================
# Additional Infrastructure
# ==========================================================================

neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5.26.0"
  auth:
    username: "neo4j"
    password: "changeme"
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

externalNeo4j:
  uri: ""     # e.g. "bolt://my-neo4j.infra.svc:7687"
  username: "neo4j"
  password: "changeme"

weaviate:
  enabled: true
  image:
    repository: semitechnologies/weaviate
    tag: "1.27.0"
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  grpcEnabled: true
  grpcServicePort: 50051

externalWeaviate:
  url: ""     # e.g. "http://my-weaviate.infra.svc:8080"

fuseki:
  enabled: true
  image:
    repository: secoresearch/fuseki
    tag: "latest"
  auth:
    adminPassword: "changeme-fuseki"
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi

externalFuseki:
  url: ""     # e.g. "http://my-fuseki.infra.svc:3030"

# ==========================================================================
# Identity Management (Keycloak)
# ==========================================================================
keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "latest"
  auth:
    adminUser: "admin"
    adminPassword: "changeme-keycloak"
  realm: "invincible-agent"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: keycloak.iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# ==========================================================================
# Authorization (Topaz FGA)
# ==========================================================================
topaz:
  enabled: true
  image:
    repository: ghcr.io/aserto-dev/topaz
    tag: "0.33.13"
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi

externalTopaz:
  url: ""     # e.g. "http://my-topaz.infra.svc:8383"
  grpcUrl: "" # e.g. "my-topaz.infra.svc:8282"

# ==========================================================================
# Secrets — override these in your values-production.yaml
# ==========================================================================
secrets:
  openaiApiKey: ""
  hfToken: ""
  datahubToken: ""
