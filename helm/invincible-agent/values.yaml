# ==========================================================================
# Secrets — override these in your values-production.yaml
# ==========================================================================
# ==========================================================================
# Enforcement posture (ADR-0025)
# ==========================================================================
# DECLARED, NEVER IMPLIED. `false` = the enforcement gates are DARK-LAUNCHED:
# present in code, inert at runtime. `true` = ENFORCING.
#
# This matches the code's own fallback deliberately — the point is that the
# posture is VISIBLE here rather than living in three separate os.getenv
# defaults, so a reader can tell "deliberately off" from "nobody decided".
# Each service also ANNOUNCES its resolved posture at startup, naming whether
# it came from explicit config or the default.
#
# Setting this to `true` is NOT a configuration change — it is ADR-0025's
# final step ("flips LAST, after all enforcement points migrate"), and it
# turns on THREE gates at once (JWT verification, catalog can_view, per-chunk
# can_read). Read docs/plans/enable-agentic-auth-flip-packet.md first; its
# precondition enumeration includes work that is not yet built.
enforcement:
  agenticAuth: false

secrets:
  openaiApiKey: ""
  hfToken: ""
  # DataHub personal access token — consumed by Engine D, mesh-registrar, and the
  # dag-tools io-manager when the metadata service runs with
  # METADATA_SERVICE_AUTH_ENABLED=true (the correct posture). Populate at DEPLOY
  # time (NOT committed — this repo is public), e.g. `--set secrets.datahubToken=<PAT>`
  # or a sealed/external secret. Mint a NO-EXPIRY token (a PERSONAL PAT expires):
  #   POST <frontend>/logIn {username:datahub,password:<root>} -> cookie
  #   POST /api/v2/graphql mutation createAccessToken(input:{
  #     type: PERSONAL, actorUrn:"urn:li:corpuser:datahub",
  #     duration: NO_EXPIRY, name:"mesh-service"}){accessToken}
  # After rotating DataHub's datahub-auth-secrets, existing tokens are invalidated
  # (the signing key changed) — re-mint. Pin datahub-auth-secrets in the datahub
  # release to stop upgrades from rotating them.
  datahubToken: ""
