# ==========================================================================
# Invincible Agent — Helm Values
# ==========================================================================

# -- Global image settings -------------------------------------------------
global:
  imageRegistry: ghcr.io
  imagePrefix: edgy-solutions/invincible-agent
  imagePullPolicy: IfNotPresent
  # -- Suffix for internal K8s service resolution (e.g., .default.svc.cluster.local)
  clusterDomain: ""
  imagePullSecrets:
    - name: ghcr-pull-secret
  # Legacy `global.images.*` (curl/postgresClient/mc) RETIRED as of
  # chart 0.3.0. Utility images now live under top-level `utilImages:`
  # with the same registry/repository/tag split as component images.
  # See `utilImages:` block at the end of this file.

# ==========================================================================
# PostgreSQL
# Set postgresql.enabled=false + externalPostgresql if you BYO Postgres.
# ==========================================================================
postgresql:
  enabled: true
  # Two image styles supported. Set `imageStyle` to match whichever
  # image your registry has:
  #
  #   postgres (default) — Docker library `postgres` image or any
  #     downstream mirror that keeps the same entrypoint. Config
  #     comes in via `-c` args + POSTGRES_* env vars.
  #
  #   bitnami — Bitnami's `bitnami/postgresql` image or downstream
  #     mirrors. Ignores command args entirely; reads config from
  #     POSTGRESQL_* env vars. Data mounted at /bitnami/postgresql.
  #     Use this if your work registry mirrors Bitnami.
  #
  # Both styles enable wal_level=logical + slot/sender bumps that
  # Electric needs. Auth / db creation are equivalent.
  imageStyle: "bitnami"
  image:
    # `registry` non-empty wins over global.imageRegistry. Leave blank
    # to inherit global.imageRegistry.
    # DEFAULT = Bitnami 17.5.0 (the version work runs bundled; validated on
    # sandbox 2026-07-13). NOTE the source path: after Bitnami's 2025-08 Docker
    # Hub migration the pinned `-r2` tag exists on docker.io ONLY at
    # `bitnamilegacy/postgresql` (bitnami/postgresql there is `:latest`-only).
    # Work pulls from Artifactory where the mirror seeds it under `bitnami/`
    # (see scripts/mirror-to-artifactory.ps1). A docker.io-direct deploy
    # (e.g. sandbox) must override repository -> `bitnamilegacy/postgresql`
    # (see values-sandbox.yaml). For the official image instead:
    # imageStyle: postgres, repository: library/postgres, tag: "17".
    registry: "docker.io"
    repository: "bitnami/postgresql"
    tag: "17.5.0-debian-12-r2"
  auth:
    postgresPassword: "changeme-postgres"
    username: "iagent"
    password: "changeme-iagent"
    database: "iagent"
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi
    initdb:
      scriptsConfigMap: "{{ .Release.Name }}-initdb"

# Use this when postgresql.enabled=false (bring your own Postgres)
externalPostgresql:
  host: ""
  port: 5432
  database: "iagent"
  username: "iagent"
  password: "changeme-iagent"

# ==========================================================================
# Restate Server
# Set restate.enabled=false + externalRestate if you BYO Restate.
# ==========================================================================
restate:
  enabled: true
  image:
    registry: "docker.io"
    repository: "restatedev/restate"
    tag: "1.6.2"   # pin to the sandbox-tested + mirrored version (was stale "1.1"); see scripts/mirror-to-artifactory.ps1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  storage:
    enabled: true
    storageClass: ""
    size: 5Gi
  ingressPort: 8080
  adminPort: 9070

# Use this when restate.enabled=false (bring your own Restate)
externalRestate:
  ingressUrl: ""    # e.g. "http://my-restate.infra.svc:8080"
  adminUrl: ""      # e.g. "http://my-restate.infra.svc:9070"

# ==========================================================================
# Dagster Control Plane
# Set dagster.webserver.enabled / dagster.daemon.enabled = false if you
# already run Dagster and only want the user code deployment.
# ==========================================================================
dagster:
  webserver:
    enabled: true
    replicas: 1
    image:
      tag: ""  # defaults to .Chart.AppVersion
    port: 3000
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: dagster.iagent.local
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []
  daemon:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  userCode:
    enabled: true
    replicas: 1
    image:
      tag: ""  # defaults to .Chart.AppVersion
    port: 4000
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  # When webserver/daemon are disabled, point to external Dagster's gRPC
  externalWorkspace:
    # Set to true if an external Dagster should discover this user code
    registerWithExternal: false
    # External Dagster admin URL for auto-registration (future use)
    adminUrl: ""

# ==========================================================================
# Agent Fleet — Shared Configuration
# Use this to define common setting (Ollama, Models, Keycloak)
# that will be injected into ALL agent containers automatically.
# ==========================================================================
agentFleet:
  env:
    # 🔗 Agent Runtime Essentials
    #
    # LLM provider selection (SMOLAGENTS_PROVIDER controls the agent
    # reasoning path AND, by fallback, mem0's structured-output path).
    # Supported values:
    #   ollama      — Ollama daemon at OLLAMA_BASE_URL. mem0 uses native
    #                 Ollama protocol; smolagents/BAML use Ollama's
    #                 OpenAI-compat endpoint.
    #   openai      — Generic OpenAI-compatible endpoint at OPENAI_BASE_URL.
    #                 Covers LiteLLM proxies (point at LiteLLM's /v1 URL),
    #                 vLLM (point at /v1), and real OpenAI (leave
    #                 OPENAI_BASE_URL unset to use api.openai.com).
    #                 OPENAI_API_KEY is required for real OpenAI; LiteLLM
    #                 and vLLM accept any non-empty string ("any" is the
    #                 default fallback).
    #   openrouter  — OpenRouter via its hosted endpoint
    #                 (OPENROUTER_API_KEY required).
    #
    # mem0 can override independently via MEM0_LLM_PROVIDER (e.g. agents
    # on ollama, mem0 on openai-via-LiteLLM-routing-to-vLLM). When
    # MEM0_LLM_PROVIDER is unset, mem0 inherits SMOLAGENTS_PROVIDER.
    SMOLAGENTS_PROVIDER: "ollama"
    SMOLAGENTS_MODEL: "gpt-oss-128k:120b"
    OLLAMA_BASE_URL: "http://ollama:11434/v1"
    # OPENAI_BASE_URL: "http://litellm:4000/v1"   # uncomment + flip
    # OPENAI_MODEL: "gpt-oss-128k:120b"           # provider to "openai"
    # OPENAI_API_KEY: "..."                       # for an OpenAI-compat
                                                  # backend (LiteLLM/vLLM)
    BAML_LOG_LEVEL: "info"

    # --- Embedding gateway (agent_fleet/utils/embed.py) ---
    # All Weaviate vector writes + reads in iagent code go through this
    # endpoint via embed_text(). Same family of env vars as OPENAI_* /
    # LLM_* — by convention point at the same LiteLLM proxy so embeddings,
    # chat completions, and BAML calls share one auth boundary and one
    # observability stream.
    #
    # LLM_BASE_URL falls back to OPENAI_BASE_URL when unset, so existing
    # deployments that already set OPENAI_BASE_URL keep working without
    # an extra knob. Set LLM_EMBED_MODEL only if you've routed a different
    # model name through LiteLLM than the default.
    #
    # Default model "nomic-embed-text" matches the chart's litellm.config
    # model_list entry (`ollama/nomic-embed-text` → ai2 at 192.168.1.169:11434).
    # Changing this model requires REBUILDING any Weaviate collections
    # populated under the old name — vectors are NOT compatible across
    # embedding models even when dimensions match.
    LLM_EMBED_MODEL: "nomic-embed-text"
    # LLM_BASE_URL: "http://litellm:4000/v1"   # else falls back to OPENAI_BASE_URL
    # LLM_API_KEY: "any"                        # else falls back to OPENAI_API_KEY
    
    # 🔗 Network & Service Discovery
    # Default realm matches the chart name; operators override in their
    # per-cluster values file when their Keycloak instance uses a
    # different realm name.
    KEYCLOAK_REALM_URL: "https://keycloak/realms/invincible-agent"
    JENA_SPARQL_ENDPOINT: "http://jena:3030/ds/query"
    DATAHUB_GMS_URL: "http://datahub-gms:8080/api/graphql"
    DATAHUB_MOCK_MODE: "false"

    # External DataHub web UI for SourcesTrail click-through
    # (Phase 3 follow-up 2026-06-24). Empty by default — per-cluster
    # override should set it in values-<cluster>.yaml. When empty,
    # the wrapper omits open_url on MatchedAsset records and the UI
    # renders sources without a click-through link.
    DATAHUB_FRONTEND_URL: ""

    # 🔗 mesh-registrar opt-in for all engines that ship a capability
    # registration on boot (Engines A, D, E, W, F use this; Engine O is
    # the registry consumer so it stays off). The value lives in
    # agentFleet.env (broadcasts to every engine via the ConfigMap) so
    # one switch controls the whole fleet — and so a fresh-bootstrap
    # reproduces the registering behavior without manual kubectl-patch
    # steps. Set to "false" to disable cluster-wide. Engine O ignores
    # the value (its registration code path is gated separately).
    #
    # Banked here because the alternative (each engine's deployment
    # carrying a hardcoded env entry) is the meshRegistrar-accretion
    # class of cluster state: it works in a long-lived cluster where
    # someone manually set it once, and silently breaks on every
    # fresh bootstrap until the operator remembers the manual step.
    # Surfaced 2026-06-23 by tracing engine-f's runtime env back to a
    # 2026-06-06 kubectl-patch that hit the whole fleet and was never
    # reconciled into chart values.
    MESH_REGISTER_ON_STARTUP: "true"
    
    # 🔗 Storage Layer (Neo4j & Weaviate)
    # NEO4J_URI / NEO4J_USER / NEO4J_USERNAME are DERIVED from neo4j.*
    # (or externalNeo4j.*) by the shared ConfigMap since chart 0.3.16 —
    # do not set them here unless the fleet talks to a DIFFERENT neo4j
    # than the chart knows about (an explicit value here wins and
    # suppresses the derived one). The old defaults ("bolt://neo4j")
    # duplicated the derived keys and pointed fresh deploys at a
    # hostname that doesn't exist.
    WEAVIATE_DOC_COLLECTION: "DocumentChunk"

    # 🔗 Global Timeouts
    AGENT_HTTP_TIMEOUT: "300"
    
    # 🔗 Superset Analytics
    SUPERSET_URL: "http://superset:8088"
    
  secrets:
    # NEO4J_PASSWORD is DERIVED from neo4j.auth.password (or
    # externalNeo4j.password) since chart 0.3.16 — set neo4j.auth.password
    # ONCE and both the server and the fleet use it. Setting it here
    # overrides the derivation (split-topology only). The old default was
    # the literal placeholder "xxxxx", a second truth that silently
    # diverged from the server's password.
    SUPERSET_ACCESS_TOKEN: ""
    # openaiApiKey: ""
    # hfToken: ""

# ==========================================================================
# Agent Fleet — Engine Configs
# ==========================================================================

engineO:
  enabled: true
  replicas: 1
  image:
    name: ontology-service
    tag: ""
  port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}

engineA:
  enabled: true
  replicas: 1
  image: { name: "restate-analyst", tag: "latest" }
  port: 8081
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env: {}

engineB:
  enabled: true
  replicas: 1
  image: { name: "langgraph-support", tag: "latest" }
  port: 8082
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env:
    LANGGRAPH_POSTGRES_URI: "postgresql://iagent:iagent@postgresql:5432/iagent"

engineC:
  enabled: true
  replicas: 1
  image: { name: "swarms-scraper", tag: "latest" }
  port: 8083
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  env: { SWARMS_MODEL: "gpt-oss-128k:120b" }

engineD:
  enabled: true
  replicas: 1
  image:
    name: datahub-wrapper
    tag: ""
  port: 8085
  resources:
    ...
  # NOTE: DATAHUB_GMS_URL deliberately NOT set here. Engine-level env entries
  # are rendered as explicit `env:` on the Deployment and override anything
  # coming from envFrom (the shared ConfigMap). Shared infrastructure URLs
  # live in agentFleet.env (above) and propagate to every engine via the
  # ConfigMap so cluster operators can override per-environment.
  env: {}

engineE:
  enabled: true
  replicas: 1
  image: { name: "neo4j-expert", tag: "latest" }
  port: 8086
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  # ENGINE_E_PUBLIC_URL pins the endpoint Engine E registers into the mesh
  # against its actual K8s service (iagent-engine-e). Belt-and-suspenders
  # with the source default in agent_fleet/neo4j_expert/main.py: the default
  # is now correct, and this env var makes the deployment's intent explicit
  # so a future drift between source default and cluster reality surfaces
  # at config-review time rather than at pod-restart time.
  env:
    ENGINE_E_PUBLIC_URL: "http://iagent-engine-e:8086/query_graph"

engineW:
  enabled: true
  replicas: 1
  image: { name: "weaviate-expert", tag: "latest" }
  port: 8088
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  # ENGINE_W_PUBLIC_URL pins the endpoint Engine W registers into the mesh
  # against its actual K8s service (iagent-engine-w). See ENGINE_E note above
  # for the belt-and-suspenders rationale.
  env:
    ENGINE_W_PUBLIC_URL: "http://iagent-engine-w:8088/query_knowledge"

engineF:
  enabled: true
  replicas: 1
  image:
    name: presentation-agent
    tag: ""
  port: 8087
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}

dataAnalyst:
  enabled: true
  replicas: 1
  image:
    name: data-analyst
    tag: ""
  port: 8089
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: {}

# ==========================================================================
# Data Plane Services
# ==========================================================================

centralGateway:
  enabled: true
  replicas: 1
  image:
    repository: "edgy-solutions/dag-tools/central-gateway"
    tag: "latest"
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    # Topaz Authorizer URL (Internal K8s DNS) — central-gateway specific
    TOPAZ_AUTHORIZER_URL: "http://topaz-svc:8383"
    # NOTE: DATAHUB_GMS_URL deliberately NOT set here. See engineD for the
    # reasoning — shared infrastructure URLs live in agentFleet.env so the
    # ConfigMap is the single source of truth and remains overridable.

# ==========================================================================
# domain-broker — iagent's URN → routing resolver.
#
# Previously kubectl-applied as an inline ConfigMap; brought under chart
# management 2026-06-24 (closes the chart-can't-reproduce gap surfaced
# by [[project-broker-chart-gap]]). The broker code lives at
# helm/invincible-agent/files/domain-broker.py and is rendered into a
# ConfigMap by templates/domain-broker.yaml via .Files.Get.
#
# This is the *transitional* shape: serves iagent's hardcoded URN list
# under chart control. The longer-term migration retires this file in
# favor of running `dag_tools.domain_broker.main:app` from iagent's
# own image, with sales_customers + instance_state declared as proper
# Dagster @asset definitions in iagent.definitions. Gated on that
# migration; tracked in [[project-sidecar-registry-pattern]].
# ==========================================================================

domainBroker:
  enabled: true
  replicas: 1
  # iagent-mesh SDK tag installed at pod start (see the pip line in
  # templates/domain-broker.yaml). This pod runs STOCK python:3.12-slim and is NOT
  # built from the iagent image, so the SDK cannot be baked in — it is fetched from
  # the GitHub tag tarball (no `git` in this image, so `git+https://` would fail).
  # MUST equal the engines' `iagent-mesh @ ...@vX.Y.Z` pyproject pin: the broker takes
  # the same inbound transport-auth dependency as the fleet, and a version skew here
  # means it authenticates by different rules than the services around it. Asserted
  # equal by tests/test_lock_coherence.py.
  meshSdkVersion: "v0.2.1"
  # Broker code runs inside a python:slim container — the code itself
  # is baked into a ConfigMap via .Files.Get, so any Python 3.12 slim
  # variant works. Override via image.* below or the chart-wide
  # global.imageRegistry.
  image:
    registry: "docker.io"
    repository: "library/python"
    tag: "3.12-slim"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # All connection env defaults derive from the release name; override
  # any of these per-cluster when an external Postgres / ClickHouse /
  # MinIO is in use.
  # centralGatewayUrl: "http://iagent-central-gateway:8090"
  # brokerUrl:         "http://iagent-domain-broker:8000"
  # pgHost:            "iagent-postgresql"
  # chHost:            "iagent-clickhouse"
  # s3EndpointUrl:     "http://iagent-minio:9000"
  # s3AccessKey:       "minio-sandbox"
  # s3SecretKey:       "minio-sandbox-secret"
  pgPasswordSecretKey: "BPMN_POSTGRES_PASSWORD"

# ==========================================================================
# minioBucketInit — Helm-hook bucket creation for MinIO.
#
# MinIO is deployed externally to this chart (the ``iagent-minio``
# service comes from a separate manifest, not chart dependencies).
# This Job runs as a pre-install / pre-upgrade hook to ensure the
# buckets each user-deployment writes to actually exist before the
# first materialization fires.
#
# Idempotent: ``mc mb --ignore-existing`` makes re-running on every
# chart upgrade safe.
#
# Disable when MinIO isn't reachable from inside the cluster (rare;
# the iagent-minio service is in-cluster) or when bucket creation is
# owned by a different ops process.
# ==========================================================================

minioBucketInit:
  enabled: true
  # `mc` (MinIO client) image is sourced from `utilImages.mc` at the
  # bottom of this file. Chart 0.3.0 retired the legacy
  # `global.images.mc` key + `minioBucketInit.image` string.
  endpoint: "http://iagent-minio:9000"
  accessKey: "minio-sandbox"
  secretKey: "minio-sandbox-secret"
  # Buckets to ensure exist. Order doesn't matter (each is mc-mb'd
  # idempotently). Add new entries when a new user-deployment needs
  # a bucket.
  buckets:
    # pub-tools' real-data lake (DLA PUB LOG content) — historically
    # created out-of-band; listed here so future installs auto-create it.
    - publog-lake
    # dag-tools' user-deployment bucket (demo + future singletons).
    # Required when userDeployments.dag-tools.enabled=true with
    # DAG_TOOLS_DEMO_MODE=true so mesh_demo_customers can materialize.
    - dag-lake

# ==========================================================================
# userDeployments — Dagster user-deployments that participate in the mesh
# via the "same image, two startups" pattern.
#
# Each entry renders TWO pods from the SAME image:
#   * A Dagster code-location pod (`dagster api grpc -m <module>`) so the
#     iagent Dagster daemon can discover/trigger materializations.
#   * A broker pod (`hypercorn dag_tools.domain_broker.main:app`) with
#     DAGSTER_DEFS_MODULE=<module>:defs. The broker imports the user's
#     Definitions, derives URNs via dag_tools.inventory.extract_records,
#     and registers with the mesh's central-gateway.
#
# Requirements for the user image:
#   * Includes the user's Definitions module (e.g. `pub_tools.definitions`).
#   * Has `dag-tools`, `fastapi`, `hypercorn`, `httpx`, `pydantic` installed
#     so the broker pod can boot without a runtime pip install.
#   * Has `dagster` and any Dagster integrations the Definitions need.
#
# To add a new user-deployment to the mesh: add a key under this map
# with `enabled: true`, the `image`, and the `dagsterModule`. The chart
# does the rest. See [[project-sidecar-registry-pattern]].
# ==========================================================================

userDeployments:
  pub-tools:
    enabled: true
    image:
      registry: "ghcr.io"
      repository: "edgy-solutions/pub-tools"
      tag: "latest"
    imagePullPolicy: Always
    # Python import path to the Dagster Definitions object. Used by
    # both the code-location pod (`-m <module>`) and the broker pod
    # (DAGSTER_DEFS_MODULE=<module>:defs).
    dagsterModule: "pub_tools.definitions"
    codeLocation:
      replicas: 1
      port: 4000
      # AWS env for the publog_pipeline component's CSV/parquet path.
      # MESH_DEMO_PREFIX was removed when the mesh_demo component
      # relocated to the dag-tools user-deployment (2026-06-26); only
      # publog-relevant config stays here.
      env:
        AWS_ACCESS_KEY_ID: "minio-sandbox"
        AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
        AWS_ENDPOINT_URL: "http://iagent-minio:9000"
        AWS_DEFAULT_REGION: "us-east-1"
        PUBLOG_S3_BUCKET: "publog-lake"
        # DataHub GMS base URL (NOT the GraphQL endpoint). Used by
        # any IO manager that emits the URN of materialized assets
        # directly to DataHub via the REST API. Service name is
        # "datahub-datahub-gms" — the prefix comes from the acryl
        # helm chart's release name.
        DATAHUB_SERVER: "http://datahub-datahub-gms:8080"
        # Cap DuckDB's memory. Its default budget is a fraction of
        # DETECTED SYSTEM RAM, not the pod's cgroup limit, so on a large
        # PUB LOG CSV it exceeds the limit and the pod is OOMKilled
        # instead of spilling to disk. Not theoretical: a 251 MB CSV
        # conversion killed this pod at the 1 Gi default, and because
        # Dagster's run worker dies with it, the run then sat STARTED for
        # hours with no failure event ever written.
        #
        # Capping is close to free — measured at 5M rows, a 256MB cap cut
        # peak RSS from 434 MB to 136 MB for ~6% more wall time.
        DUCKDB_MEMORY_LIMIT: "256MB"
      # Sized from the measured conversion cost, not a round number.
      # Per concurrent step: ~256 MB DuckDB (capped above) plus ~250 MB
      # of Python/Dagster subprocess, so ~500 MB each; the parent run
      # process adds ~300 MB. At publog's max_concurrent of 4 that is
      # ~2.3 Gi, so 3 Gi leaves headroom without over-reserving.
      #
      # Raising PUBLOG_MAX_CONCURRENT means raising this too: six
      # concurrent steps need ~3.3 Gi and would OOMKill at this limit.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 3Gi
    broker:
      replicas: 1
      port: 8000
      # Defaults to http://<release>-central-gateway:8090 when unset.
      # centralGatewayUrl: ""
      env:
        AWS_ACCESS_KEY_ID: "minio-sandbox"
        AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
        AWS_ENDPOINT_URL: "http://iagent-minio:9000"
        AWS_DEFAULT_REGION: "us-east-1"
        PUBLOG_S3_BUCKET: "publog-lake"
      # resources:
      #   requests: { cpu: 50m, memory: 128Mi }
      #   limits:   { cpu: 500m, memory: 512Mi }

  # dag-tools — generic / source-singleton user-deployment.
  #
  # Hosts content that is NOT tied to a customer-domain pipeline. Has a
  # single demo-mode switch (DAG_TOOLS_DEMO_MODE):
  #
  # * ``true`` — registers the synthetic mesh_demo_customers dataset
  #   that the bar-chart demo reads. Used in sandbox / dev clusters.
  # * ``false`` (production override) — registers only the source-
  #   singleton surface (currently empty; future code from the owner
  #   provides Snowflake all-assets, etc.). Production-safe.
  #
  # Same image, two pods (code-location gRPC + broker hypercorn) via
  # the user-deployments template above. Cluster-specific demoMode is
  # set per-environment: sandbox defaults to true (this file); work-
  # cluster / production values files should override DAG_TOOLS_DEMO_MODE
  # to "false".
  dag-tools:
    enabled: true
    image:
      registry: "ghcr.io"
      repository: "edgy-solutions/dag-tools/user-deployment"
      tag: "latest"
    imagePullPolicy: Always
    dagsterModule: "dag_tools.user_deployment.definitions"
    codeLocation:
      replicas: 1
      port: 4000
      env:
        # Demo-mode toggle — read by definitions.py at module load
        # to pick which components subdir registers. Default true
        # here matches the sandbox-friendly defaults pattern in this
        # file; production values files MUST override to "false".
        DAG_TOOLS_DEMO_MODE: "true"
        AWS_ACCESS_KEY_ID: "minio-sandbox"
        AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
        AWS_ENDPOINT_URL: "http://iagent-minio:9000"
        AWS_DEFAULT_REGION: "us-east-1"
        # New bucket for dag-tools-owned demo content. Replaces
        # pub-tools' publog-lake for mesh_demo_customers. The bucket
        # MUST exist in the cluster's MinIO before the first
        # materialization fires.
        DAG_TOOLS_DEMO_S3_BUCKET: "dag-lake"
        MESH_DEMO_PREFIX: "mesh_demo"
        DATAHUB_SERVER: "http://datahub-datahub-gms:8080"
    # Grist ingest surface — OFF by default (no default Grist/Postgres
    # connection can be guessed). When `enabled: true`, the chart renders
    # a ConfigMap from `grist.config` (GristIngestComponent attributes),
    # mounts it at /etc/dag-tools/grist/grist.yaml, and sets
    # DAG_TOOLS_GRIST_CONFIG so definitions.py loads it. `{{ env.VAR }}`
    # refs in the config resolve against the pod env at load time — wire
    # tokens/passwords via `grist.secretEnv` (kept out of the ConfigMap).
    grist:
      enabled: false
      # config:
      #   name: crm
      #   grist:
      #     host: grist.example.com
      #     org: myorg
      #     token: "{{ env.GRIST_TOKEN }}"
      #   postgres:
      #     protocol: postgresql
      #     host: iagent-postgresql
      #     port: 5432
      #     database: analytics
      #     schema: grist
      #     username: postgres
      #     password: "{{ env.GRIST_PG_PASSWORD }}"
      # secretEnv:
      #   - name: GRIST_TOKEN
      #     secretName: iagent-secrets
      #     secretKey: GRIST_TOKEN
      #   - name: GRIST_PG_PASSWORD
      #     secretName: iagent-secrets
      #     secretKey: GRIST_PG_PASSWORD
    broker:
      replicas: 1
      port: 8000
      env:
        # Broker reads the same demo flag so its physical_coordinates
        # advertisements match the code-location's writes.
        DAG_TOOLS_DEMO_MODE: "true"
        AWS_ACCESS_KEY_ID: "minio-sandbox"
        AWS_SECRET_ACCESS_KEY: "minio-sandbox-secret"
        AWS_ENDPOINT_URL: "http://iagent-minio:9000"
        AWS_DEFAULT_REGION: "us-east-1"
        DAG_TOOLS_DEMO_S3_BUCKET: "dag-lake"
        MESH_DEMO_PREFIX: "mesh_demo"

# ==========================================================================
# mesh-registrar — Contract D registration gateway.
# Since chart 0.3.15, `enabled: true` ALSO wires the fleet to it: the
# shared ConfigMap auto-sets MESH_REGISTRAR_URL=http://<release>-mesh-
# registrar:8090 (an explicit agentFleet.env.MESH_REGISTRAR_URL always
# wins). Previously enabling only DEPLOYED the gateway — engines choose
# the path per-pod from that env var, so the gateway sat idle while
# every engine took the legacy direct-GMS fallback (seen live at
# work-deploy). NOTE: engines read this via the ConfigMap, and ConfigMap
# changes don't restart pods — rollout-restart the engines after
# flipping this on.
# ==========================================================================

meshRegistrar:
  enabled: false
  replicas: 1
  image:
    name: mesh-registrar
    tag: "latest"
  port: 8090
  # v0.2 saga budget: how long bounded forward-retry runs before the
  # saga gives up and compensates. Sized to absorb transient-blip
  # registration latency without alarming, while still failing fast
  # enough that a sustained outage produces a 5xx within request
  # budget. See ADR-0006 §Addendum §Indicators-for-revisiting: raise
  # this if forward-retry exhaustion becomes non-rare without an
  # underlying-blip root cause being available.
  registerSagaBudgetSeconds: 15
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==========================================================================
# primeSubstrate — Helm-managed bootstrap Job for the canonical ontology
# pipeline.
#
# Runs `setup/prime_databases.py` as a post-install / post-upgrade Helm hook
# inside the dagster-server image (which has the script + all required
# Python deps + the canonical TTL list baked in). Inherits the chart's
# {{ Release.Name }}-config ConfigMap, so it automatically picks up the
# right Neo4j / Weaviate / Jena / MinIO endpoints for your cluster —
# whether those services are chart-internal or external (BYO Neo4j etc.).
#
# Why this exists: the script's prior invocation pattern was "operator
# clones the repo, sets up 5 port-forwards, sets env vars, runs script."
# That works but is operator-friction-heavy and assumes the cluster's
# rendered service shapes match what the operator port-forwards. For
# clusters with external Neo4j/Weaviate/Jena (work cluster, multi-tenant
# environments), the port-forward shape diverges from chart defaults entirely.
# This Job sidesteps all of that — it runs in-cluster against whatever
# endpoints the ConfigMap declares.
#
# Usage modes:
#   1. First-time install: leave `enabled: true` to prime substrate as
#      part of `helm install`.
#   2. Fresh-start re-prime (the "month-old substrate" recovery case):
#      `helm upgrade ... --set primeSubstrate.enabled=true \
#        --set primeSubstrate.wipe=true`. The Job triple-guards the wipe
#      with the script's own --i-mean-it + --namespace gate; the wipe
#      flag also requires `enabled: true` to fire.
#   3. Idempotent re-run on every upgrade: leave `enabled: true` and
#      `wipe: false`. Safe because the canonical pipeline MERGE on URI.
#      The cost is a small Job runtime on every upgrade; the benefit is
#      substrate drift is corrected automatically if it accumulates.
#
# After a successful first-prime, most installations flip
# `enabled: false` for routine upgrades to skip the Job. The default
# below is `false` so charts upgraded from older versions don't
# unexpectedly trigger priming.
# ==========================================================================

primeSubstrate:
  enabled: false
  # When true, the Job invokes the script with
  # `--wipe --i-mean-it --namespace=<release-ns>`. Triple-guarded by the
  # script itself; one mis-set boolean cannot wipe the wrong cluster.
  # ROUTING-SUBSTRATE ONLY: clears Neo4j OntologyClass + edges, every
  # Weaviate collection, the Jena graphs, and the MinIO TTLs (the ingest
  # rebuilds them). PRESERVES answer-durability data
  # (AnswerArtifact/Actor/Source/WatermarkSequence) and the Postgres
  # projections, so a wipe+reprime can't strand the projector cursor or
  # delete answer history. Use for a fresh routing re-prime; flip back to
  # false after it runs. For scorched-earth, ALSO set nuclear=true below.
  wipe: false
  # When true (AND wipe=true), escalates to a NUCLEAR wipe: additionally
  # deletes the answer-durability graph AND resets the Postgres projection
  # stores (answer_artifact_projection / human_task_projection truncated,
  # projector_cursor rewound to 0) TOGETHER with the Neo4j source — a
  # consistent scorched-earth that never leaves a stranded cursor. DESTROYS
  # all answer history. Requires the projector Postgres to be reachable
  # (the Job wires PROJECTOR_POSTGRES_DSN from the same BPMN_POSTGRES_*
  # config/secret the projector uses). No effect when wipe=false.
  nuclear: false
  # Allowlist of cluster identifiers the script will accept for `--wipe`.
  # The script defaults to "sandbox,work,local" when this is unset. When
  # your release runs in a namespace OUTSIDE that list (e.g. "app-cluster",
  # "prod-east-1") the wipe will refuse with "namespace not in allowlist."
  # Set this to a comma-separated list that INCLUDES your cluster
  # identifier — typically the same as your k8s namespace, since the
  # chart passes `--namespace={{ .Release.Namespace }}`.
  #
  # Empty (default) -> script falls back to "sandbox,work,local".
  # Example: "sandbox,work,local,app-cluster" — keeps the safe defaults
  # and adds the new cluster.
  #
  # Doesn't change anything when wipe=false; only consulted on the
  # guarded-wipe path.
  namespaceAllowlist: ""
  # When true, the Job invokes `--trigger-ingest`, which fires the
  # dagster ingest_ontology_job for each partition. Typically true —
  # without it, the canonical pipeline only uploads TTLs to MinIO and
  # waits for the dagster sensor / manual UI trigger to ingest.
  triggerIngest: true
  # Image reuse: the dagster-control-plane image (the SAME image the
  # dagster-user-code Deployment runs) has the full invincible-agent
  # source COPY'd into /app, which includes setup/prime_databases.py
  # and the full CANONICAL_TTL_MANIFEST. The thin dagster-server image
  # is webserver/daemon only — it has dagster ecosystem libs but NO
  # iagent source, so it can't run the prime script.
  #
  # Three override knobs:
  #   - registry: explicit registry host. When set, the image becomes
  #     "<registry>/<repository>:<tag>" — useful for pointing prime at
  #     a DIFFERENT registry than the global.imageRegistry the engines
  #     use (e.g. a bootstrap-only / proxy-traversal-only registry, or
  #     a hand-built image with extra deps). Leave empty to inherit
  #     global.imageRegistry.
  #   - repository: image path within the registry.
  #   - tag: image tag; pin to a SHA when reproducibility matters.
  image:
    registry: ""
    repository: "edgy-solutions/invincible-agent/dagster-control-plane"
    tag: "latest"
    pullPolicy: "Always"
  # Prime-only env vars. Iterated by the prime-substrate-job template
  # AFTER its hardcoded bridges, so anything you set here wins over the
  # defaults. Common uses:
  #   - HTTP_PROXY / HTTPS_PROXY / NO_PROXY when the prime script must
  #     reach OUTSIDE the cluster (e.g. fetching the PROV-O / IOF Core
  #     / S3000L TTLs from the public web) but engines do NOT — keeping
  #     proxy config off the global agentFleet.env block.
  #   - Self-signed-CA paths (REQUESTS_CA_BUNDLE, SSL_CERT_FILE) when
  #     the proxy terminates TLS.
  #   - One-shot overrides for a manual re-prime (e.g. ONTOLOGY_BUCKET).
  # Keys land ONLY on the prime container; engines are unaffected.
  env: {}
    # HTTP_PROXY: "http://corp-proxy.example.com:3128"
    # HTTPS_PROXY: "http://corp-proxy.example.com:3128"
    # NO_PROXY: "localhost,127.0.0.1,.svc,.svc.cluster.local,minio,iagent-litellm"
  # CA bundle mount for corporate proxies that MITM TLS with a private
  # root CA. When enabled, the chart:
  #   - mounts <existingSecret>/<secretKey> at <mountPath>/<secretKey>
  #     (read-only volume)
  #   - sets REQUESTS_CA_BUNDLE, SSL_CERT_FILE, and CURL_CA_BUNDLE env
  #     vars on the prime container to point at the mounted file
  #
  # The Secret is NOT managed by this chart — operators create it
  # out-of-band so the chart values don't carry private CA bytes. The
  # mounted file is treated as the FULL trust set; if you also need the
  # standard public roots (e.g. real CDN URLs in CANONICAL_TTL_MANIFEST
  # that bypass the proxy), concatenate the system bundle into the file
  # BEFORE creating the Secret:
  #
  #   cat /etc/ssl/certs/ca-certificates.crt corp-root.pem > combined.pem
  #   kubectl create secret generic prime-ca-bundle \
  #     --from-file=ca-bundle.crt=combined.pem -n <ns>
  caBundle:
    enabled: false
    existingSecret: ""        # e.g. "prime-ca-bundle"
    secretKey: "ca-bundle.crt"
    mountPath: "/etc/ssl/certs/extra"
  # Resource budget. The script is mostly I/O (downloads TTLs, uploads
  # to MinIO, triggers dagster), so CPU/memory are modest. The dagster
  # ingest itself runs in dagster-user-code, not here.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Helm hook configuration. post-install fires on initial deploy;
  # post-upgrade fires on every `helm upgrade` when enabled=true.
  # hook-delete-policy ensures a failed previous Job is cleaned up
  # before retrying, so re-runs don't pile up old Jobs in the
  # namespace.
  hook:
    weight: "10"
    deletePolicy: "before-hook-creation"
  # ------------------------------------------------------------------
  # Self-healing engine re-registration after a wipe+reprime.
  #
  # A substrate wipe clears BOTH the TTL-owned state (OntologyClass nodes
  # + subClassOf edges) AND the runtime-owned state (engine verb edges).
  # The reprime's ingest rebuilds the TTL half — but verb edges are
  # RUNTIME state that only re-forms when the engines restart and
  # re-register, and prime FIRE-AND-FORGETS the ingest (it launches the
  # dagster runs and returns). So a wipe+reprime WITHOUT this leaves a
  # perfect class graph with ZERO verbs → routing silently degrades to
  # the generalist (the exact symptom, no error).
  #
  # This companion post-hook (weight above prime's, so it runs after
  # prime completes) WAITS for the ingest sentinel node in Neo4j, THEN
  # rolling-restarts the registering engines via the in-cluster K8s API
  # (same as `kubectl rollout restart`). No new image (reuses the prime
  # image, which has neo4j + requests); minimal namespaced RBAC.
  reregisterEngines:
    # Default ON with prime so wipe+reprime is self-healing. No-op if the
    # engine deployments don't exist; harmless on a non-wipe triggerIngest.
    enabled: true
    # The engine deployments that self-register verbs on startup. Engine O
    # is the registry CONSUMER and is deliberately excluded. Names render
    # as <release>-<entry>. Trim to your enabled engine set.
    deployments:
      - engine-a
      - engine-d
      - engine-e
      - engine-w
      - engine-f
      # Data Analyst self-registers mesh:analyzeDataset on startup — it was
      # omitted here, so wipe+reprime left analyzeDataset unregistered while
      # every other catalog verb came back (the graph showed 8 of 9 verbs on
      # idp:Dataset). Renders as <release>-data-analyst.
      - data-analyst
    # The Neo4j node whose presence signals "the ontology ingest populated
    # the class graph" — restart is deferred until it exists so the
    # re-registering engines don't Contract-D-reject against an empty graph.
    sentinelUri: "http://invincible-agent/idp#Dataset"
    # Max seconds to wait for the sentinel before restarting anyway. A
    # timeout is best-effort, not failure: the DataHub→doc-tools sensor
    # registration path self-heals via retries once the classes land.
    #
    # SIZED TO THE REAL INGEST (raised 420 -> 900, 2026-07-30). prime launches
    # ~13 ontology partitions and its own note says "~30-60s per partition";
    # the Dagster run queue is effectively concurrency-1, so they run SERIALLY
    # = 390-780s. At 420 the hook gave up right before the thing it waits for
    # arrived — and giving up means engines re-register against a class graph
    # that isn't populated yet, which is the exact silent generalist-degradation
    # this hook exists to prevent.
    #
    # !! YOU MUST RAISE helm's --timeout TO MATCH !!
    # helm's default --timeout is 5m (300s) and it bounds the WHOLE release
    # INCLUDING hooks — prime AND this one, which run in sequence. With the
    # defaults, helm gives up on the hook BEFORE the hook gives up on the
    # sentinel: the release reports a timeout failure while the job is doing
    # exactly what it was designed to do, and then completes fine a few minutes
    # later. The cluster is healthy; only helm's report is wrong. Deploy with:
    #     helm upgrade --install ... --timeout 20m
    # (must exceed primeSubstrate's runtime + sentinelTimeout + the rollout
    # restarts). Do NOT "fix" a helm timeout by lowering sentinelTimeout —
    # that trades a cosmetic failure for the real one.
    sentinelTimeout: 900

# ==========================================================================
# demoSeed — GATED reproducible DEMO CONTENT (bootstrap-state-debt #4).
#
# Promotes the hand-run scripts/seed_weaviate_manuals.py (the Engine-W
# DocumentChunk knowledge corpus) to a helm-gated Job, so a fresh install or a
# wipe+reprime restores it with NO hand scripts — the demoSeed.enabled-style
# gated seed tests/test_bootstrap_reproducible.py already assumes exists.
#
# Default OFF: this is SANDBOX demo content. A sandbox sets enabled=true so its
# Engine-W suite has a corpus; a work cluster leaves it false and ingests real
# manuals. Runs as a post-install/post-upgrade hook at weight 30 — AFTER prime
# (10) and reregister (20) — so the prime --wipe (which clears EVERY Weaviate
# collection) can't delete the corpus this seed creates.
#
# Now folds BOTH demo seeds: seed_weaviate_manuals (DocumentChunk corpus) AND
# seed_datahub_catalog (the demo datasets/dashboards the Engine-D suite resolves
# against). The catalog seed needs acryl-datahub (baked into the control-plane
# image venv — the cluster has no PyPI egress) and the GMS BASE url (below).
# Each seed is toggleable (seedManuals / seedCatalog).
# ==========================================================================
demoSeed:
  enabled: false
  # Which demo-content seeds run when enabled. Both default on. A cluster with a
  # REAL DataHub can set seedCatalog=false to keep the manuals corpus but not
  # overwrite its catalog with the demo assets (though demoSeed is default-OFF
  # at work regardless).
  seedManuals: true
  seedCatalog: true
  # GMS BASE URL for seed_datahub_catalog's acryl REST emitter — the base, NOT
  # the /api/graphql form the ConfigMap publishes (the emitter 404s on that).
  # In-cluster default; override for BYO / external DataHub.
  datahubGmsUrl: "http://datahub-datahub-gms:8080"
  # NOTE: seedCatalog WRITES to DataHub (REST /aspects), which requires a write
  # token when the GMS enforces auth (it does at work + the shared sandbox
  # DataHub). The token rides in as DATAHUB_TOKEN via the secrets envFrom — set
  # `secrets.datahubToken` to a DataHub PAT. If it's empty AND the GMS enforces
  # auth, the catalog emit 401s (manuals still run). Work already sets the PAT;
  # a demo cluster that wants the catalog reproducibly seeded must set it too.
  hook:
    weight: "30"
    deletePolicy: "before-hook-creation"
  # Same dagster-control-plane image prime uses (has scripts/ + neo4j +
  # weaviate-client). Pin tag to a SHA for reproducibility.
  image:
    registry: ""
    repository: "edgy-solutions/invincible-agent/dagster-control-plane"
    tag: "latest"
    pullPolicy: "Always"
  # The seed reads Weaviate host/port SEPARATELY (the engines use a combined
  # host:port ConfigMap form). Empty host -> the chart's in-cluster
  # <release>-weaviate / <release>-weaviate-grpc services. Set for BYO-Weaviate.
  weaviate:
    httpHost: ""
    httpPort: "8080"
    grpcHost: ""
    grpcPort: "50051"
  # Extra env for the seed, applied LAST (wins over the above). At work, point
  # the text2vec-ollama vectorizer at your ollama via OLLAMA_API_ENDPOINT, and
  # override OLLAMA_EMBED_MODEL / WEAVIATE_DOC_COLLECTION if they differ.
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==========================================================================
# ontologySeed — GATED reproducible ROUTING substrate (bootstrap-state-debt).
# Promotes scripts/seed_mro_extension_runtime.py (the 3 mro_extension routing
# nouns from setup/ontologies/mro_extension.ttl -> Weaviate OntologyClass at
# domain=MAINTENANCE + Neo4j :OntologyClass) to a gated Job. Runs at prime+5:
# after prime's --wipe/ingest, before reregister. Default OFF — this is the
# SANDBOX domain vocabulary; work brings its own nouns via overlayEnums. The
# sandbox overlay (values-sandbox.yaml) flips it on so a fresh install reaches
# working routing with zero hand-run scripts. See templates/ontology-seed-job.yaml.
# ==========================================================================
ontologySeed:
  enabled: false
  hook:
    deletePolicy: "before-hook-creation"
  # Same dagster-control-plane image prime uses (has scripts/ + neo4j +
  # weaviate-client). Pin tag to a SHA for reproducibility.
  image:
    registry: ""
    repository: "edgy-solutions/invincible-agent/dagster-control-plane"
    tag: "latest"
    pullPolicy: "Always"
  # The seed reads Weaviate host SEPARATELY from port (host-only); the engines
  # use a combined host:port ConfigMap form. Empty host -> the chart's in-cluster
  # <release>-weaviate / <release>-weaviate-grpc services. Set for BYO-Weaviate.
  weaviate:
    httpHost: ""
    grpcHost: ""
  # Extra env for the seed, applied LAST (wins over the above).
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==========================================================================
# Frontend Services
# ==========================================================================

cortexUi:
  enabled: true
  replicas: 1
  image:
    repository: edgy-solutions/cortex-ui/frontend
    tag: ""
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Environment variables passed as NAME: VALUE
  env:
    VITE_API_URL: "http://localhost:8000"
    VITE_KEYCLOAK_REALM_URL: "http://localhost:8080/realms/invincible-agent"
    VITE_KEYCLOAK_CLIENT_ID: "cortex-ui"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

cortexBff:
  enabled: true
  replicas: 1
  image:
    name: cortex-bff
    tag: ""
  port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}
  # Optional cluster-specific TLS trust override.
  #
  # When the cortex-bff pod needs to talk to an external HTTPS endpoint
  # signed by a private CA (the canonical case is Keycloak's public
  # interface on a corporate work cluster — see src/iagent/auth.py's
  # PyJWKClient JWKS fetch), the CI cortex-bff image's stock trust store
  # doesn't have the CA root and the JWKS call fails with a cert
  # verification error.
  #
  # Setting ``tlsTrust.secretName`` mounts a PEM bundle from the named
  # Secret and points Python's SSL stack at it via SSL_CERT_FILE. This
  # collapses what used to be a parallel image lineage ("rebuild
  # cortex-bff with work certs in the trust store, push to private
  # registry, redeploy") into deployment config — the CI image is
  # unmodified on every cluster; the cluster-specific trust lives in
  # a Secret.
  #
  # **CRITICAL** — the Secret must contain a COMBINED bundle:
  #     cat /etc/ssl/certs/ca-certificates.crt corporate-ca.pem > combined.pem
  # SSL_CERT_FILE REPLACES the default cert bundle rather than appending
  # to it; if you provide ONLY the corporate CA, every public-CA HTTPS
  # call from cortex-bff will start failing with cert errors. The Python
  # base image (python:3.12-slim-bookworm) ships ca-certificates.crt at
  # /etc/ssl/certs/ca-certificates.crt — the canonical recipe is to
  # concatenate that file with the corporate PEM(s) before creating the
  # Secret.
  #
  # Sandbox / local clusters: leave ``secretName`` empty; nothing
  # mounts, no env vars set, behavior unchanged.
  tlsTrust:
    secretName: ""      # Secret containing the combined PEM bundle.
    secretKey: "ca.pem" # Key within the Secret.
    mountPath: "/etc/ssl/work-ca-bundle.pem"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# ==========================================================================
# Projector (Hop 2 of docs/plans/projector-build-plan.md)
# Standalone Deployment per Decision 4 (PERMANENT). Mirrors cortex-bff's
# shape — single replica, env-driven config, no PVC. Apply loop is
# INTERIM under Decision 1; retires with the Restate+topic successor
# per [[coupled-interim-mechanisms-retire-together]].
# ==========================================================================
projector:
  enabled: true
  replicas: 1
  image:
    # Same image as cortex-bff — both run from src/iagent/. The entry
    # point is `python -m iagent.projector`, set as the container's
    # `command` in the template so the same image serves both pods.
    name: cortex-bff
    # `latest` matches the cortexBff pattern in this chart's sandbox
    # overlay. Empty here used to fall back to Chart.AppVersion (0.1.1),
    # a tag that does NOT exist on GHCR — the projector pod went into
    # ImagePullBackOff on every fresh deploy, and a kubectl set image
    # patch was the only way to keep it running. Pinning `latest`
    # makes the chart reproducible from values alone. Per-cluster
    # overrides (e.g., production SHA-pin) still go through the
    # values-{env}.yaml overlay.
    tag: "latest"
  port: 8095
  pollIntervalSeconds: 0.5
  batchLimit: 100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env: {}

# ==========================================================================
# Electric (Hop 3 of docs/plans/projector-build-plan.md)
# Standalone Deployment serving CDC from Postgres to the cortex-ui
# client over a shape subscription. PREREQUISITE: Postgres must be
# running with wal_level=logical (set in infrastructure.yaml's
# Postgres args block at this same commit). INTERIM under Decisions
# 0+1+3 per [[coupled-interim-mechanisms-retire-together]] — retires
# with the projector poll loop and watermark column when the
# Restate+topic successor lands.
# ==========================================================================
electric:
  enabled: true
  replicas: 1
  image:
    # `registry` is honored by the invincible-agent.image helper: when
    # non-empty it wins over global.imageRegistry (useful when a single
    # third-party component lives at a different registry from the
    # rest of the iagent images). Leave blank to fall through to
    # `global.imageRegistry`, or set explicitly in your overlay:
    #   electric:
    #     image:
    #       registry: "artifactory.corp.example.com"
    #       repository: "electricsql/electric"
    #       tag: "1.0.13"
    registry: "docker.io"
    repository: "electricsql/electric"
    tag: "1.0.13"
  port: 3000
  insecure: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Browser clients (cortex-ui) subscribe to Electric's shape endpoint
  # directly — same domain as `bff.edgy-solutions.com`. Disabled by
  # default for portability; enable per-environment in the values
  # overlay (see values-sandbox.yaml) when an externally-routable
  # endpoint is needed.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: electric.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# ==========================================================================
# Additional Infrastructure
# ==========================================================================

neo4j:
  enabled: true
  image:
    registry: "docker.io"
    repository: "library/neo4j"
    tag: "5.26.0"
  auth:
    username: "neo4j"
    password: "changeme"
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

externalNeo4j:
  uri: ""     # e.g. "bolt://my-neo4j.infra.svc:7687"
  username: "neo4j"
  password: "changeme"

weaviate:
  enabled: true
  image:
    registry: "docker.io"
    repository: "semitechnologies/weaviate"
    tag: "1.27.0"
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  grpcEnabled: true
  grpcServicePort: 50051

# Point the fleet at a Weaviate outside this release (e.g. a shared instance in
# an infra namespace). Set `weaviate.enabled: false` and fill these in.
# NOTE the two forms: the fleet's env vars are HOST:PORT (no scheme) while
# `url` is scheme-ful. `httpHost` wins if set; otherwise it is derived from
# `url` by stripping the scheme. `grpcHost` has NO url to derive from — set it
# explicitly whenever the gRPC client is in play.
externalWeaviate:
  url: ""       # e.g. "http://my-weaviate.infra.svc.cluster.local:8080"
  httpHost: ""  # e.g. "my-weaviate.infra.svc.cluster.local:8080" (overrides url)
  grpcHost: ""  # e.g. "my-weaviate-grpc.infra.svc.cluster.local:50051"

fuseki:
  enabled: true
  image:
    registry: "docker.io"
    repository: "secoresearch/fuseki"
    tag: "5.5.0"   # pin to sandbox-tested + mirrored version (was "latest" — no :latest exists in the airgapped mirror)
  auth:
    adminPassword: "changeme-fuseki"
  persistence:
    enabled: true
    storageClass: ""
    # 5Gi filled on the work cluster: TDB2 grows monotonically across re-primes
    # (DROP is logical; only compaction returns disk) until msync fails with "No
    # space left on device" and TDB2 wedges. prime_databases now compacts each
    # run to bound growth; this headroom absorbs the between-compaction working
    # set + a reasoner-materialized SUSTAINMENT/MAINTENANCE graph. Expanding an
    # EXISTING deploy needs a PVC resize (allowVolumeExpansion) or STS recreate —
    # the volumeClaimTemplate size is immutable, so `helm upgrade` alone won't.
    size: 20Gi

externalFuseki:
  url: ""     # e.g. "http://my-fuseki.infra.svc:3030"

# BYO Dagster. When dagster.webserver.enabled=false the chart's
# prime-substrate-job uses externalDagster.url instead of the chart's
# bundled webserver. Set the FQDN so a NO_PROXY entry of
# ".svc.cluster.local" suffix-matches it (bare service names DON'T —
# they have no trailing dot for suffix matching).
externalDagster:
  url: ""     # e.g. "http://dagster-dagster-webserver.<namespace>.svc.cluster.local:80"

# ==========================================================================
# Identity Management (Keycloak)
# ==========================================================================
# Point the fleet at a Keycloak outside this release (e.g. a shared IdP in an
# infra namespace). Set `keycloak.enabled: false` and fill ONE of these:
#   * `url`      — base, realm path appended from `keycloak.realm` below;
#   * `realmUrl` — full override, for an issuer whose path isn't /realms/<realm>.
# `keycloak.realm` still applies with an external IdP: the realm NAME is
# independent of where Keycloak runs.
externalKeycloak:
  url: ""       # e.g. "http://my-keycloak.infra.svc.cluster.local:8080"
  realmUrl: ""  # e.g. "https://sso.example.com/auth/realms/corp" (overrides url)

keycloak:
  enabled: true
  image:
    registry: "quay.io"
    repository: "keycloak/keycloak"
    tag: "26.6.4"   # pin to the version the LIVE sandbox runs (its :latest resolves to 26.6.4); mirror must push 26.6.4 too
  auth:
    adminUser: "admin"
    adminPassword: "changeme-keycloak"
  realm: "invincible-agent"
  # Client secret for the iagent-review-starter service account (the extraction->review sensor's
  # client-credentials identity). This ONE value feeds BOTH the client `secret` in the realm import
  # (keycloak-configmap.yaml) AND REVIEW_STARTER_CLIENT_SECRET in the Secret — they must match. Override
  # per deployment (a real secret at work); the sandbox default is a dev value, not sensitive.
  # The claim the hardcoded-claim mapper writes = USER_ENTITLEMENT_CLAIM. `email` in
  # sandbox; set to the employee-id claim at work so service authz_ids land in the same
  # slot human ones do.
  authzClaim: "email"
  # Realm reconcile (realm-reconcile-job.yaml) — converges the serviceClients list below
  # into the LIVE realm on every install/upgrade, because a realm import only applies at
  # first boot. ADDITIVE ONLY: creates missing clients, repairs a missing authz-id mapper,
  # never prunes. Disable only if an external process owns realm state.
  reconcileClients:
    enabled: true
    # ESCAPE HATCH — explicit, announced, never default. The job BLOCKS the upgrade when it
    # cannot reconcile, which is correct (a release whose identity plane is unverified is a
    # failed release) but leaves one trap: a wedged release cannot upgrade to ship the fix
    # for its own wedge. Set true ONLY to break that cycle. The job announces the skip in its
    # log, so a bypassed reconcile is never silent — same discipline as the enforcement
    # posture's startup announcement.
    skip: false
  # ── SERVICE CLIENTS — ONE list, TWO consumers ────────────────────────────────────────
  # Drives BOTH the first-boot realm import (keycloak-configmap.yaml) AND the realm
  # reconcile job (realm-reconcile-job.yaml, every upgrade). Adding a service identity is
  # an edit HERE — never a kcadm command — in any environment.
  #
  # WHY THE RECONCILE JOB EXISTS: a realm import applies at FIRST BOOT ONLY. Before it,
  # any client added to this chart after a realm was imported existed in git and not in the
  # running Keycloak — the write-only-artifact shape, and the same hand-seeded-state class
  # as the Restate registrations and DA's credentials. The chart declared it; nothing
  # reconciled it. Now something does.
  #
  # `authzId` is the `svc:<name>` entitlement subject (docs/plans/identity-mint-contract.md);
  # `clientId` is `iagent-<name>`; `secretRef` names the key under .Values.keycloak holding
  # the secret, so this list and secrets.yaml cannot drift.
  serviceClients:
    - clientId: "iagent-review-starter"
      authzId: "svc:review-starter"
      secretRef: "reviewStarterClientSecret"
    - clientId: "iagent-data-analyst"
      authzId: "svc:data-analyst"
      secretRef: "dataAnalystClientSecret"
    # The SUPERVISOR's dispatch identity (2026-08-07). Engine calls currently carry NO
    # Authorization at all; this is the credential those calls will present, so the
    # transport-auth contract phase has something verifiable to accept. Without it, flipping
    # REQUIRE_TRANSPORT_AUTH would deny the supervisor's own calls — the empty-caller failure,
    # predicted from the caller graph rather than witnessed in an incident.
    # TRANSPORT, NOT ENTITLEMENT: it says WHICH SERVICE dispatched, never whose data may be
    # read. The acting human continues to travel as data (lock 2), derived from the
    # front-door identity and guarded by tests/test_subject_derivation.py.
    - clientId: "iagent-supervisor"
      authzId: "svc:supervisor"
      secretRef: "supervisorClientSecret"
    # Engine A's PROCESS credential (2026-08-07), for its UNGOVERNED resident callers:
    # decision_record_writer, review_composer, policy_rules_client. They hold no grants and
    # are planned to hold none, so they share one credential and attribute per-module in the
    # payload. `svc:review-starter` lives in the same process and is NOT merged — it holds
    # can_invoke(mesh:startReview), so it is a governed subject and survives as its own
    # identity. See the IDENTITY GRANULARITY ruling in identity-mint-contract.md.
    - clientId: "iagent-engine-a"
      authzId: "svc:engine-a"
      secretRef: "engineAClientSecret"

  reviewStarterClientSecret: "sandbox-review-starter-secret"
  # Engine DA's service-account client secret (iagent-data-analyst). Same contract as the
  # review starter's above — this value AND the realm import's `secret` come from here, so
  # they cannot drift. Override per deployment (a real secret at work); the sandbox default
  # is a dev value, not sensitive. Reaches DA as CORTEX_CLIENT_SECRET.
  dataAnalystClientSecret: "sandbox-data-analyst-secret"
  # Supervisor dispatch identity — reaches the supervisor as SUPERVISOR_CLIENT_SECRET.
  supervisorClientSecret: "sandbox-supervisor-secret"
  # Engine A process credential — reaches engine-a as ENGINE_A_CLIENT_SECRET.
  engineAClientSecret: "sandbox-engine-a-secret"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: keycloak.iagent.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# ==========================================================================
# Authorization (Topaz FGA)
# ==========================================================================
# Topaz seed CronJob (ADR-0025 enforcement hop-1) — durable keep-current of
# the authz directory (both syncs, readback-gated). DEFAULT-DISABLED so it
# never surprise-runs/prunes; enable when ready. One-off run:
#   kubectl create job --from=cronjob/<release>-topaz-seed manual-seed -n <ns>
topazSeed:
  enabled: false
  schedule: "0 * * * *"            # hourly keep-current when enabled
  # Seed runner = the cortex-bff image (carries policy/sync + the
  # canonical enums + the Topaz manifest, all version-locked). Structured
  # form resolves via the invincible-agent.image helper, so it HONORS
  # global.imageRegistry/global.imagePrefix (airgapped/Artifactory
  # clusters need only the global override + a pinned tag). A plain
  # string (legacy 0.3.11 form) is honored verbatim and BYPASSES the
  # global registry.
  image:
    name: cortex-bff
    registry: ""                   # non-empty wins over global.imageRegistry
    repository: ""                 # non-empty replaces imagePrefix/name path
    tag: "latest"                  # PIN at work (>= chart-0.3.12 build)
  imagePullPolicy: Always
  topazDirectoryUrl: "http://topaz-svc:9393"
  datahubGmsUrl: "http://datahub-datahub-gms:8080/api/graphql"
  # Load the chart-shipped ReBAC manifest (<release>-topaz-config) before
  # every sync run. Idempotent — retires the fresh-cluster manual
  # extract-manifest-and-port-forward step and picks up chart-shipped
  # manifest updates automatically. Leave on.
  loadManifest: true
  # WHERE the five policy DATA files come from (users.yaml, groups.yaml,
  # asset_grants.yaml, task_grants.yaml, ontology_compartments.yaml).
  # A data file missing from an overlay FAILS the run (no silent fallback
  # to the image's sandbox copy). personas.yaml / domains.yaml come from
  # the product image by default; a deployment may assert ownership of
  # either via `overlayEnums` below.
  #   image     — /app/policy baked into topazSeed.image (sandbox default).
  #   configMap — a ConfigMap holding the five files, applied out-of-band
  #               (e.g. by a private policy repo's CI pipeline).
  #   git       — an initContainer clones a PRIVATE policy repo on every
  #               run; merging to `ref` converges the cluster on the next
  #               schedule tick. GitOps for entitlements with no extra
  #               controllers — the CronJob IS the reconcile loop.
  policySource:
    type: image
    # Enum files the OVERLAY asserts instead of the image (only meaningful
    # with type configMap|git). Listed => the overlay MUST provide it and
    # the image copy is ignored; unlisted => image-canonical, and an
    # overlay carrying the file anyway FAILS the run (two-truths guard).
    #   domains.yaml  — a deployment's CLASSIFICATION vocabulary; labels
    #                   must match the deployment's data tagging at ingest.
    #                   Overriding is the normal private-deployment move.
    #   personas.yaml — fully assertable since chart 0.3.12 (the catalog
    #                   rego walks the directory instead of enumerating a
    #                   hardcoded list) — ADDING personas included. The
    #                   labels must still match what verb registrations /
    #                   JWT claims carry (see personas-and-domains.md).
    overlayEnums: []                # e.g. [domains.yaml] or [domains.yaml, personas.yaml]
    configMap:
      name: ""                      # required when type=configMap
    git:
      repoUrl: ""                   # required when type=git, e.g. https://git.example.com/org/iagent-policy.git
      ref: "main"                   # branch/tag the cluster tracks
      path: "policy"                # subdirectory holding the five data files
      authSecretName: ""            # optional Secret w/ keys `username`+`password` (PAT); omit for anonymous clone
      # Optional Secret holding the CA bundle (key `ca.crt`) that signed
      # the git host's TLS cert — for INTERNAL/self-signed git servers:
      #   kubectl create secret generic iagent-policy-git-ca \
      #       --from-file=ca.crt=<internal-ca-or-selfsigned>.pem
      # Mounted read-only into the clone initContainer and passed via
      # GIT_SSL_CAINFO, so verification stays ON against YOUR CA. There
      # is deliberately NO skip-TLS-verify knob: this channel delivers
      # the authorization policy itself — an unverified clone would let
      # a MITM serve attacker-authored grants that the readback would
      # then faithfully confirm.
      caSecretName: ""
      # Clone-only helper image. Structured form goes through the image
      # helper; registry defaults to docker.io explicitly (alpine/git is
      # not on ghcr, so it must NOT inherit global.imageRegistry unless
      # you point it at a mirror — airgapped: set registry to your
      # Artifactory repo-base; the mirror script carries alpine/git).
      # Keep tag in lockstep with scripts/mirror-to-artifactory.ps1.
      image:
        registry: "docker.io"
        repository: "alpine/git"
        tag: "v2.45.2"

topaz:
  enabled: true
  image:
    registry: "ghcr.io"
    repository: "aserto-dev/topaz"
    tag: "0.33.13"
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi

  # 2026-07-02: ADR-0026 step-2 CI sync tool + policy/ YAML source of
  # truth landed and its readback control is green — the coupled-interim
  # `topaz.seed` values path retires here per
  # `[[coupled-interim-mechanisms-retire-together]]`. Two writers to
  # one authz substrate is the two-truths shape the ADR rejects
  # everywhere else; leaving both write paths active until "the org
  # standardizes" was how that divergence would sneak back in via our
  # own chart. Retire together, and now.
  #
  # The chart no longer ships a seed Job. To populate entitlements
  # in a new cluster:
  #
  #   1. Manifest load (one-time per cluster): the topaz-configmap
  #      still mounts manifest.yaml at /policies/manifest.yaml; run
  #        kubectl exec deploy/<release>-topaz -- \
  #            /app/topaz ds set manifest /policies/manifest.yaml -N -P
  #      or add `--load-manifest` to the sync tool (planned follow-up).
  #
  #   2. Entitlements: run policy/sync/topaz_sync.py against the
  #      cluster's topaz endpoint. See policy/README.md.
  #
  # `externalTopaz.url` is the operator override for pointing the
  # chart at a topaz outside the release (unchanged from step 1).

externalTopaz:
  url: ""     # e.g. "http://my-topaz.infra.svc:8383"
  grpcUrl: "" # e.g. "my-topaz.infra.svc:8282"

# ==========================================================================
# LiteLLM (OpenAI-compatible proxy / router) — optional, opt-in
# ==========================================================================
# When enabled (litellm.enabled: true) the chart deploys an in-cluster
# LiteLLM proxy at:
#   http://<release>-litellm.<namespace>.svc.cluster.local:4000/v1
#
# It fronts one or more backend LLMs (Ollama, vLLM, real OpenAI, etc.)
# with a single OpenAI-compatible URL — the same protocol the new
# "openai" provider in llm_utils.py / mem0_utils.py speaks. Useful for:
#   - Routing a single OPENAI_BASE_URL to multiple physical backends
#   - Rehearsing the "openai" provider locally against existing Ollama
#     before vLLM is deployed
#   - Centralizing rate limits, fallbacks, and per-model routing
#
# To wire engines through LiteLLM after enabling it:
#   agentFleet.env.SMOLAGENTS_PROVIDER: "openai"
#   agentFleet.env.OPENAI_BASE_URL:     "http://<release>-litellm:4000/v1"
#   agentFleet.env.OPENAI_MODEL:        "<a model_name from litellm.config>"
#   agentFleet.env.OPENAI_API_KEY:      "<general_settings.master_key>"
#
# DISABLED BY DEFAULT — no resources are rendered when litellm.enabled is
# false, so existing deployments pointing directly at Ollama / OpenRouter
# / real OpenAI are unaffected by this block existing.
litellm:
  enabled: false
  image:
    registry: "ghcr.io"
    repository: "berriai/litellm"
    # Pinned to v1.89.2 — the version validated end-to-end in sandbox
    # (matrix 23/23, mem0 round-trip, cortex-bff). Matches the pin in
    # scripts/mirror-to-artifactory.ps1. To roll: bump both alongside
    # a sandbox revalidation.
    tag: "v1.89.2"
  replicas: 1
  # LiteLLM loads many provider modules at startup; 1Gi limit OOMs in <60s
  # under the main-stable image (observed 2026-06-17). 2Gi is the empirical
  # comfort zone; bump further if you enable many providers / large model_list.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  # Probe timings. LiteLLM main-stable can take 60-120s before port 4000
  # is bound — too slow for a typical 30s liveness initialDelay, so the
  # template uses a generous startup probe to bracket the slow boot and
  # then hand off to liveness/readiness. Tune here if your config is
  # faster (smaller model_list, fewer providers).
  probes:
    startup:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30   # 30 * 10s = 5 min max startup window
    liveness:
      initialDelaySeconds: 180
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
  # Full LiteLLM YAML config (model_list + settings). The operator owns
  # this — adjust model_name entries and api_base URLs for the backends
  # in your environment. See https://docs.litellm.ai/docs/proxy/configs.
  # The example below routes two model names to the dev ai1 Ollama; flip
  # it to your vLLM endpoint(s) when those are available.
  #
  # NOTE: no `general_settings.master_key` is set. With master_key set
  # AND no `database_url`, LiteLLM's auth path errors with
  #   "No connected db." (user_api_key_auth.py:1644)
  # on /v1/chat/completions for non-cached key validation — observed in
  # sandbox rehearsal 2026-06-17. For stateless deployments inside a
  # trusted cluster network, leave master_key OUT (any Authorization
  # header value is accepted). To enable auth in production, EITHER add
  # a postgres `database_url` here, OR run a LiteLLM image variant with
  # the DB schema pre-applied.
  config: |
    model_list:
      # api_key required on each entry — LiteLLM v1.89.x unified backends
      # to use openai-python internally for ALL routing (including
      # ollama/* model names), and openai-python's client constructor
      # raises if api_key is unset. The upstream (Ollama) ignores it,
      # but the openai-python client checks it at init. Without an
      # explicit value here LiteLLM errors:
      #   litellm.AuthenticationError: OpenAIException - The api_key
      #   client option must be set...
      # (observed at work-cluster engine-o BAML call 2026-06-19).
      # "any" is conventional for stateless / Ollama backends.
      # ai1 (Strix Halo + R97000 PRO, 192.168.1.126) — large model host.
      - model_name: gpt-oss-128k:120b
        litellm_params:
          # ollama_chat/ (NOT ollama/) — the ollama/ prefix routes to Ollama's
          # /api/generate (completion) endpoint which SILENTLY DROPS tool_calls
          # (model emits the call as prose in `content`, tool_calls stays empty);
          # ollama_chat/ routes to /api/chat which parses tool_calls correctly.
          # Proven 2026-07-07: same LiteLLM 1.89.2, same backend — ollama/ → 0
          # tool_calls, ollama_chat/ → clean find_nodes call. Enables native
          # tool-calling FLEET-WIDE (ToolCallingAgent); content path unchanged
          # (no-tools calls return identical content). See engine-E harness arc.
          model: ollama_chat/gpt-oss-128k:120b
          api_base: http://192.168.1.126:11434
          api_key: "any"
      # ai2 (Strix Halo + R97000 PRO, 192.168.1.169) — secondary inference
      # host added 2026-06-21. Hosts embeddings and lighter models so the
      # 120b's KV cache stays on ai1 without thrash. Note: .188 and .179
      # are RESERVED for goat-yard-archive production and MUST NOT be
      # referenced by this project. Use only ai1 (.126) and ai2 (.169).
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://192.168.1.169:11434
          api_key: "any"
    litellm_settings:
      drop_params: true

  # ----------------------------------------------------------------------
  # Environment for the LiteLLM proxy container.
  #
  # Two paths, mirror the engine/cortex-bff pattern:
  #
  #   env:                  inline key/value pairs (non-secret tuning).
  #   envFromConfigMaps:    bulk-import a ConfigMap's keys as env vars.
  #   envFromSecrets:       bulk-import a Secret's keys as env vars.
  #
  # Use envFromSecrets for credentials — e.g. self-hosted Langfuse:
  #
  #   kubectl create secret generic langfuse-creds -n <ns> \
  #     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
  #     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
  #     --from-literal=LANGFUSE_HOST=http://langfuse-web.observability:3000
  #
  #   litellm:
  #     envFromSecrets: ["langfuse-creds"]
  #     config: |
  #       ...
  #       litellm_settings:
  #         success_callback: ["langfuse"]
  #         failure_callback: ["langfuse"]
  #
  # The proxy's callback machinery reads LANGFUSE_* from process env at
  # request time — the YAML `config` block does NOT inherit them, so
  # setting them in agentFleet.env does not reach the LiteLLM container.
  env: {}
  envFromConfigMaps: []
  envFromSecrets: []

# ==========================================================================
# Utility images used by helm hooks / init-containers.
#
# Chart 0.3.0 retired the legacy `global.images.curl` / `global.images.mc`
# / `global.images.postgresClient` map in favor of per-hook image blocks
# that follow the same registry/repository/tag shape every other component
# uses. Overrides flow through `global.imageRegistry` OR per-image `registry`
# just like the component images above.
#
# For a private-registry deploy, either:
#   - Set `global.imageRegistry: "your.artifactory"` and clear the `registry`
#     field below on each image you want to redirect, OR
#   - Set `registry:` on each individually.
# ==========================================================================
utilImages:
  # `curl` — used by the restate-init hook's wait-for-services init-container.
  curl:
    registry: "docker.io"
    repository: "curlimages/curl"
    tag: "8.11.0"   # pin to sandbox-tested + mirrored version (was "latest" — no :latest exists in the airgapped mirror)
  # `postgres-client` — used by the db-init hook (wait-for-db + apply-schema).
  postgresClient:
    registry: "docker.io"
    repository: "library/postgres"
    tag: "15-alpine"   # matches what the LIVE sandbox runs for the throwaway psql client; mirror must carry library/postgres:15-alpine
  # `mc` (MinIO client) — used by the minio-bucket-init hook to `mc mb` the
  # buckets declared in `minioBucketInit.buckets`. Version-aligned with the
  # mirrored minio server (see scripts/mirror-to-artifactory.ps1).
  mc:
    registry: "quay.io"
    repository: "minio/mc"
