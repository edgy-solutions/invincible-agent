{{- if .Values.restate.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-restate
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "restate" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-restate
  replicas: {{ .Values.restate.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "restate" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "restate" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: restate
          image: {{ include "invincible-agent.image" (dict "name" "restate" "registry" .Values.restate.image.registry "repository" .Values.restate.image.repository "tag" .Values.restate.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.restate.image.pullPolicy }}
          ports:
            - name: ingress
              containerPort: {{ .Values.restate.ingressPort }}
            - name: admin
              containerPort: {{ .Values.restate.adminPort }}
          env:
            - name: RESTATE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.restate.resources | nindent 12 }}
          volumeMounts:
            - name: restate-data
              mountPath: /restate-data
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: restate-data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.restate.storage.storageClass }}
        storageClassName: {{ .Values.restate.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.restate.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-restate
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "restate" "root" .) | nindent 4 }}
  ports:
    - name: ingress
      port: {{ .Values.restate.ingressPort }}
      targetPort: ingress
    - name: admin
      port: {{ .Values.restate.adminPort }}
      targetPort: admin
{{- end }}
