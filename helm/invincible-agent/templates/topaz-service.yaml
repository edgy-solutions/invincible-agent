{{- if .Values.topaz.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: topaz-svc
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "topaz" "root" .) | nindent 4 }}
  ports:
    - name: grpc
      port: 8282
      targetPort: 8282
    - name: http
      port: 8383
      targetPort: 8383
    - name: metrics
      port: 9292
      targetPort: 9292
{{- end }}