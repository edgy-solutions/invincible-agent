{{- /*
LiteLLM — OpenAI-compatible proxy / router. Optional, opt-in.

When enabled (.Values.litellm.enabled = true) this renders a ConfigMap
holding the operator-supplied LiteLLM YAML config, a single-replica
Deployment running the LiteLLM proxy, and a ClusterIP Service exposing
port 4000.

Engines that should reach LiteLLM set:
  SMOLAGENTS_PROVIDER = "openai"
  OPENAI_BASE_URL     = "http://{{ .Release.Name }}-litellm:4000/v1"
  OPENAI_MODEL        = "<a model_name from litellm.config.model_list>"
  OPENAI_API_KEY      = "<general_settings.master_key from litellm.config>"

When disabled (default) NO resources are rendered — existing deployments
pointing directly at Ollama / OpenAI / OpenRouter are unaffected.
*/ -}}
{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm-config
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
data:
  config.yaml: |
{{ .Values.litellm.config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "litellm" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "litellm" "root" .) | nindent 8 }}
      annotations:
        # Roll the pod when the config changes — otherwise a values
        # update to litellm.config never reaches the running proxy.
        checksum/config: {{ .Values.litellm.config | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          args:
            - "--config"
            - "/config/config.yaml"
            - "--port"
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          # envFrom — pull operator-managed ConfigMaps and Secrets in bulk.
          # Typical use: a `langfuse-creds` Secret carrying
          # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST so the
          # proxy's success_callback/failure_callback can authenticate
          # against self-hosted Langfuse. The proxy reads these from its
          # own process env at request time; the YAML config block does
          # NOT inherit them.
          {{- if or .Values.litellm.envFromConfigMaps .Values.litellm.envFromSecrets }}
          envFrom:
            {{- range .Values.litellm.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.litellm.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # env — explicit inline key/value pairs. Operator overlays often
          # use this for non-secret tuning (LITELLM_LOG, LITELLM_DROP_PARAMS,
          # OTEL endpoint, etc.). Secrets belong in envFromSecrets above.
          {{- if .Values.litellm.env }}
          env:
            {{- range $k, $v := .Values.litellm.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # LiteLLM main-stable startup loads many provider modules and can
          # take 60-120s before port 4000 is bound. Default delays here are
          # deliberately generous; tune via .Values.litellm.probes if you
          # know your config starts faster.
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: {{ .Values.litellm.probes.liveness.initialDelaySeconds | default 180 }}
            periodSeconds: {{ .Values.litellm.probes.liveness.periodSeconds | default 20 }}
            timeoutSeconds: {{ .Values.litellm.probes.liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.litellm.probes.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: {{ .Values.litellm.probes.readiness.initialDelaySeconds | default 60 }}
            periodSeconds: {{ .Values.litellm.probes.readiness.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.litellm.probes.readiness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.litellm.probes.readiness.failureThreshold | default 6 }}
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: {{ .Values.litellm.probes.startup.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.litellm.probes.startup.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.litellm.probes.startup.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.litellm.probes.startup.failureThreshold | default 30 }}
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-litellm-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "litellm" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
{{- end }}
