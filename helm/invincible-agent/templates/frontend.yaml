{{- if .Values.cortexUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortex-ui
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cortexUi.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cortex-ui
          image: {{ include "invincible-agent.image" (dict "repository" .Values.cortexUi.image.repository "tag" .Values.cortexUi.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cortexUi.port }}
          env:
            - name: VITE_API_URL
              value: {{ .Values.cortexUi.env.VITE_API_URL | default "http://localhost:8000" | quote }}
            - name: VITE_KEYCLOAK_REALM_URL
              value: {{ .Values.cortexUi.env.VITE_KEYCLOAK_REALM_URL | quote }}
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: {{ .Values.cortexUi.env.VITE_KEYCLOAK_CLIENT_ID | quote }}
          resources:
            {{- toYaml .Values.cortexUi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cortex-ui
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}

---
{{- if .Values.cortexBff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortex-bff
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cortexBff.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cortexBff.tlsTrust.secretName }}
      # Cluster-specific TLS trust override — mount a combined PEM
      # bundle (system roots + corporate CA) from a Secret so cortex-bff
      # can talk to private-CA-signed external endpoints (Keycloak's
      # public interface on a work cluster being the canonical case).
      # Closes the [[cortex-bff-stale-drift]] seam: the CI image runs
      # unmodified on every cluster; cluster-specific trust lives in
      # config, not in a parallel image lineage.
      volumes:
        - name: work-ca-bundle
          secret:
            secretName: {{ .Values.cortexBff.tlsTrust.secretName }}
            items:
              - key: {{ .Values.cortexBff.tlsTrust.secretKey | quote }}
                path: ca.pem
      {{- end }}
      containers:
        - name: cortex-bff
          image: {{ include "invincible-agent.image" (dict "name" .Values.cortexBff.image.name "repository" .Values.cortexBff.image.repository "tag" .Values.cortexBff.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cortexBff.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            {{- if .Values.cortexBff.tlsTrust.secretName }}
            # Python's ssl module + the `requests` library both honor
            # these. PyJWKClient (auth.py:42) → urllib → ssl.create_default_context
            # reads SSL_CERT_FILE; httpx (used elsewhere in gateway.py)
            # also honors it. REQUESTS_CA_BUNDLE is set as belt-and-
            # suspenders in case any sub-library uses requests directly.
            - name: SSL_CERT_FILE
              value: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
            {{- end }}
            {{- if .Values.cortexBff.env }}
            {{- range $k, $v := .Values.cortexBff.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.cortexBff.tlsTrust.secretName }}
          volumeMounts:
            - name: work-ca-bundle
              mountPath: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
              subPath: ca.pem
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.cortexBff.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cortex-bff
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.cortexBff.port }}
      targetPort: http
{{- end }}
