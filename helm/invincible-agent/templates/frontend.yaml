{{- if .Values.cortexUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortex-ui
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cortexUi.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cortex-ui
          image: {{ include "invincible-agent.image" (dict "repository" .Values.cortexUi.image.repository "tag" .Values.cortexUi.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cortexUi.port }}
          # Render every key in cortexUi.env so adding a new VITE_*
          # variable doesn't require a template edit. Mirrors the
          # cortex-bff pattern below. Closes a [[verify-subtle-acceptance-
          # by-inspection]] class catch: the prior hardcoded enumeration
          # silently dropped VITE_ELECTRIC_URL (Hop 3 / ADR-0023) even
          # though the values block defined it.
          {{- if .Values.cortexUi.env }}
          env:
            {{- range $k, $v := .Values.cortexUi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.cortexUi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cortex-ui
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-ui" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}

---
{{- if .Values.cortexBff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortex-bff
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cortexBff.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cortexBff.tlsTrust.secretName }}
      # Cluster-specific TLS trust override — mount a combined PEM
      # bundle (system roots + corporate CA) from a Secret so cortex-bff
      # can talk to private-CA-signed external endpoints (Keycloak's
      # public interface on a work cluster being the canonical case).
      # Closes the [[cortex-bff-stale-drift]] seam: the CI image runs
      # unmodified on every cluster; cluster-specific trust lives in
      # config, not in a parallel image lineage.
      volumes:
        - name: work-ca-bundle
          secret:
            secretName: {{ .Values.cortexBff.tlsTrust.secretName }}
            items:
              - key: {{ .Values.cortexBff.tlsTrust.secretKey | quote }}
                path: ca.pem
      {{- end }}
      containers:
        - name: cortex-bff
          image: {{ include "invincible-agent.image" (dict "name" .Values.cortexBff.image.name "repository" .Values.cortexBff.image.repository "tag" .Values.cortexBff.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cortexBff.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            # HITL substrate: cortex-bff writes the human_task_projection into the
            # SAME Electric-replicated Postgres the projector uses. Constructed from
            # the shared configmap's BPMN_POSTGRES_* + the secret's
            # BPMN_POSTGRES_PASSWORD (both already on this pod via envFrom), exactly
            # as templates/projector.yaml does — one secret, one place. Absent → the
            # HITL substrate is dormant (migration no-ops), never a boot blocker.
            - name: PROJECTOR_POSTGRES_DSN
              value: "postgresql://$(BPMN_POSTGRES_USER):$(BPMN_POSTGRES_PASSWORD)@$(BPMN_POSTGRES_HOST):$(BPMN_POSTGRES_PORT)/$(BPMN_POSTGRES_DB)"
            # 2026-07-01: default the Electric proxy's upstream URL from
            # the release name so clusters with a release name other
            # than "iagent" (e.g. "invincible-agent" at work) don't hit
            # "Name or service not known" from a hardcoded `iagent-electric`
            # default. Operator overrides via `cortexBff.env.ELECTRIC_UPSTREAM_URL`
            # still win — this is just a sensible default when unset.
            {{- if not (hasKey (default (dict) .Values.cortexBff.env) "ELECTRIC_UPSTREAM_URL") }}
            {{- if .Values.electric.enabled }}
            - name: ELECTRIC_UPSTREAM_URL
              value: "http://{{ .Release.Name }}-electric:{{ .Values.electric.port | default 3000 }}"
            {{- end }}
            {{- end }}
            {{- if .Values.cortexBff.tlsTrust.secretName }}
            # Python's ssl module + the `requests` library both honor
            # these. PyJWKClient (auth.py:42) → urllib → ssl.create_default_context
            # reads SSL_CERT_FILE; httpx (used elsewhere in gateway.py)
            # also honors it. REQUESTS_CA_BUNDLE is set as belt-and-
            # suspenders in case any sub-library uses requests directly.
            - name: SSL_CERT_FILE
              value: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
            {{- end }}
            {{- if .Values.cortexBff.env }}
            {{- range $k, $v := .Values.cortexBff.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.cortexBff.tlsTrust.secretName }}
          volumeMounts:
            - name: work-ca-bundle
              mountPath: {{ .Values.cortexBff.tlsTrust.mountPath | quote }}
              subPath: ca.pem
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.cortexBff.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cortex-bff
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "cortex-bff" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.cortexBff.port }}
      targetPort: http
{{- end }}
