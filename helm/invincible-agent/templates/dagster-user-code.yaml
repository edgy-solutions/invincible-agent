{{- if .Values.dagster.userCode.enabled }}
# Dagster User Code Deployment (Code Location Server)
# Hosts the user's definitions and serves them to the webserver/daemon via gRPC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dagster-user-code
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-user-code" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.dagster.userCode.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-user-code" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-user-code" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: user-code
          image: {{ include "invincible-agent.image" (dict "name" "dagster-user-code" "repository" .Values.dagster.userCode.image.repository "tag" .Values.dagster.userCode.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - "-m"
            - dagster
            - api
            - grpc
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "{{ .Values.dagster.userCode.port }}"
            - "-m"
            - "iagent.definitions"
          ports:
            - name: grpc
              containerPort: {{ .Values.dagster.userCode.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: DAGSTER_POSTGRES_HOST
              value: {{ include "invincible-agent.pgHost" . | quote }}
            - name: DAGSTER_POSTGRES_PORT
              value: {{ include "invincible-agent.pgPort" . | quote }}
            - name: DAGSTER_POSTGRES_DB
              value: {{ include "invincible-agent.pgDatabase" . | quote }}
            - name: DAGSTER_POSTGRES_USER
              value: {{ include "invincible-agent.pgUser" . | quote }}
            - name: DAGSTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: BPMN_POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.dagster.userCode.resources | nindent 12 }}
          # Probe timings have to accommodate the dagster CLI cold-start
          # cost on arm64: the `dagster api grpc-health-check` command
          # alone takes ~9 seconds on arm64 (vs ~2s on amd64) because of
          # Python module import overhead. With timeoutSeconds=1 (the
          # default), kubelet kills the pod within ~2 minutes of startup.
          # Values below match `/tmp/probe-patch-v2.yaml`'s sandbox-tested
          # config — generous enough that arm64 doesn't get killed during
          # legitimate operation, while still catching real hangs.
          # Tunable in future via `.Values.dagster.userCode.probes.*` if
          # other deployments need different timings.
          readinessProbe:
            exec:
              command: ["dagster", "api", "grpc-health-check", "-p", "{{ .Values.dagster.userCode.port }}"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["dagster", "api", "grpc-health-check", "-p", "{{ .Values.dagster.userCode.port }}"]
            initialDelaySeconds: 300
            periodSeconds: 120
            timeoutSeconds: 30
            failureThreshold: 5
---
# User Code Service (gRPC)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dagster-user-code
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-user-code" "root" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.dagster.userCode.port }}
      targetPort: grpc
---
# Dagster workspace.yaml — tells webserver + daemon where to find user code
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dagster-workspace
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  workspace.yaml: |
    load_from:
      - grpc_server:
          host: {{ .Release.Name }}-dagster-user-code
          port: {{ .Values.dagster.userCode.port }}
          location_name: iagent
      {{- if .Values.dagster.docToolsCodeLocation.enabled }}
      # doc-tools is deployed as a separate helm release (see
      # ../../doc-tools/charts/doc-tools/values-sandbox.yaml) running a
      # Dagster code-location gRPC server. Wiring it here lets the iagent
      # dagster daemon discover doc-tools' sensors (aitool_registration_sensor)
      # and assets (sync_aitool_predicate_to_neo4j, etc.) without merging
      # the two codebases. Gate with docToolsCodeLocation.enabled so deploys
      # that don't have doc-tools installed in the namespace don't get a
      # "could not resolve grpc server" failure in dagster-webserver.
      - grpc_server:
          host: {{ .Values.dagster.docToolsCodeLocation.host | default "doc-tools" }}
          port: {{ .Values.dagster.docToolsCodeLocation.port | default 3030 }}
          location_name: doc-tools
      {{- end }}
      {{- /*
        Every enabled .Values.userDeployments entry renders an additional
        grpc_server pointing at the code-location service that
        templates/user-deployments.yaml created. Without this, the
        Dagster webserver and daemon never connect to the user-deployment
        pods — pods run fine in isolation but their assets don't show up
        in Dagit. Each entry's service name matches "<release>-<name>"
        and the port is the value of $deploy.codeLocation.port (default
        4000). Location name uses the entry's key so Dagit lists each
        user-deployment under its own label.
      */}}
      {{- range $name, $deploy := .Values.userDeployments }}
      {{- if $deploy.enabled }}
      - grpc_server:
          host: {{ printf "%s-%s" $.Release.Name $name | quote }}
          port: {{ default 4000 $deploy.codeLocation.port }}
          location_name: {{ $name | quote }}
      {{- end }}
      {{- end }}
{{- end }}
