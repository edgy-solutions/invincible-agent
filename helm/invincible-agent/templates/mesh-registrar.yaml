{{- if .Values.meshRegistrar.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mesh-registrar
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "mesh-registrar" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.meshRegistrar.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "mesh-registrar" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "mesh-registrar" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mesh-registrar
          image: {{ include "invincible-agent.image" (dict "name" .Values.meshRegistrar.image.name "repository" .Values.meshRegistrar.image.repository "tag" .Values.meshRegistrar.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.meshRegistrar.image.pullPolicy | default "Always" }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            # The full release Secret, same as the engine pods — the
            # registrar EMBEDS Predicate rows (utils/embed.py reads
            # LLM_API_KEY/OPENAI_API_KEY) and WRITES Neo4j (needs the
            # derived NEO4J_PASSWORD). Previously only a lone
            # DATAHUB_TOKEN secretKeyRef reached this pod: embeddings
            # ran keyless (rows written WITHOUT vectors — semantic verb
            # search silently degraded) and Neo4j writes fell back to a
            # hardcoded sandbox default password (auth failure on any
            # deployment with a real password, e.g. work's external
            # neo4j). DATAHUB_TOKEN now arrives via this secretRef too.
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            # Restate ingress URL — used by the v0.2 saga registration
            # workflow. Resolves to the chart-managed Restate service
            # when `restate.enabled=true`, or to `externalRestate.ingressUrl`
            # when the cluster is BYO-Restate (work cluster scenario).
            # Falls back to empty string so the legacy non-saga path still
            # serves /v1/register on clusters that haven't enabled v0.2.
            - name: RESTATE_INGRESS_URL
              value: {{ if .Values.restate.enabled -}}
                "http://{{ .Release.Name }}-restate:{{ .Values.restate.ingressPort | default 8080 }}"
              {{- else -}}
                {{ .Values.externalRestate.ingressUrl | quote }}
              {{- end }}
            - name: RESTATE_ADMIN_URL
              value: {{ if .Values.restate.enabled -}}
                "http://{{ .Release.Name }}-restate:{{ .Values.restate.adminPort | default 9070 }}"
              {{- else -}}
                {{ .Values.externalRestate.adminUrl | quote }}
              {{- end }}
            # Saga register total budget (forward-retry deadline). Past
            # this point the saga compensates (durable DELETE) and the
            # caller gets 5xx against clean state. Tuned per the cluster's
            # observed transient-blip floor.
            - name: REGISTER_SAGA_BUDGET_S
              value: {{ .Values.meshRegistrar.registerSagaBudgetSeconds | default "15" | quote }}
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.meshRegistrar.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mesh-registrar
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "mesh-registrar" "root" .) | nindent 4 }}
{{- end }}
