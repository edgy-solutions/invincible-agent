{{- /*
Object-store CONSUMER Secret creator (pre-install / pre-upgrade hook).

The chart does not deploy MinIO and holds no store credential as a value. Every workload reads the
consumer pair from a Secret by reference (`objectStore.consumerSecret`). When the deployment does not
name one, THIS hook creates `<release>-object-store` IF IT IS ABSENT, and never replaces it.

  * Nothing is generated at render time (no `lookup`, no random function in any template): the pair is
    drawn by the Job's own script (`secrets.choice`) the first time, and only then.
  * It decides on NAME AND KEYS only: present with both keys non-empty -> exit 0, no write; present with
    a key missing or empty -> exit non-zero naming the key, no write (it never repairs or overwrites);
    404 -> POST a new Opaque Secret.
  * The created Secret carries `helm.sh/resource-policy: keep` and NO Helm ownership labels, so Helm
    never deletes it and a later release does not adopt it.
  * It prints "created", "present" or the refusal. It never prints a value.

The hook renders only when a store is configured (objectStore.adminSecret.name set); see iagent.objectStore.generated.

Hook weights: ServiceAccount/Role/RoleBinding -20, this Job -10, minioBucketInit -5 (which reads the
Secret this Job makes).
*/ -}}
{{- if include "iagent.objectStore.generated" . }}
{{- $secret := include "iagent.objectStore.secretName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-object-store-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-object-store-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Read exactly the one Secret by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ $secret | quote }}]
  # Kubernetes CANNOT restrict `create` by resource name (the name does not exist yet when the request
  # is authorized), so this verb is namespace-wide on secrets. It cannot read, change or delete any.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-object-store-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-object-store-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-object-store-secret
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-object-store-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "object-store-secret" "root" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Before minioBucketInit (-5), which reads the Secret this Job creates.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "object-store-secret" "root" .) | nindent 8 }}
    spec:
      {{- include "invincible-agent.avoidStatefulNodes" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-object-store-secret
      containers:
        - name: object-store-secret
          # Same image and helper as the engine-reregister Job (the prime image): python3 + stdlib.
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.primeSubstrate.image.registry "repository" .Values.primeSubstrate.image.repository "tag" .Values.primeSubstrate.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.primeSubstrate.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            {{- if .Values.tlsTrust.secretName }}
            {{- include "iagent.tlsTrust.env" . | nindent 12 }}
            {{- end }}
            - name: POD_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: STORE_SECRET_NAME
              value: {{ $secret | quote }}
            - name: STORE_ACCESS_KEY_KEY
              value: {{ .Values.objectStore.consumerSecret.accessKeyKey | quote }}
            - name: STORE_SECRET_KEY_KEY
              value: {{ .Values.objectStore.consumerSecret.secretKeyKey | quote }}
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import base64, json, os, secrets, ssl, string, sys, urllib.error, urllib.request

              SA = "/var/run/secrets/kubernetes.io/serviceaccount/"


              def http(method, path, body=None):
                  """The ONLY network layer. Returns (status, parsed-json-or-None). Injectable for tests."""
                  tok = open(SA + "token").read().strip()
                  ctx = ssl.create_default_context(cafile=SA + "ca.crt")
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(
                      "https://kubernetes.default.svc" + path, data=data, method=method,
                      headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                          raw = r.read()
                          return r.status, (json.loads(raw) if raw else None)
                  except urllib.error.HTTPError as e:
                      raw = e.read()
                      try:
                          return e.code, json.loads(raw)
                      except ValueError:
                          return e.code, None


              def ensure(http, ns, name, akey, skey):
                  """Create the Secret only if it is absent. Returns the exit code; prints no value."""
                  path = "/api/v1/namespaces/%s/secrets/%s" % (ns, name)
                  status, obj = http("GET", path)
                  if status == 200:
                      data = (obj or {}).get("data") or {}
                      for k in (akey, skey):
                          if not data.get(k):
                              print("refused: Secret %s exists but key %s is missing or empty; "
                                    "not overwriting" % (name, k), flush=True)
                              return 1
                      print("present", flush=True)
                      return 0
                  if status != 404:
                      print("refused: GET of Secret %s returned HTTP %s" % (name, status), flush=True)
                      return 1
                  access = "".join(secrets.choice(string.ascii_uppercase + string.digits) for _ in range(20))
                  secret = "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(40))
                  body = {
                      "apiVersion": "v1", "kind": "Secret", "type": "Opaque",
                      "metadata": {"name": name, "namespace": ns,
                                   "annotations": {"helm.sh/resource-policy": "keep"}},
                      "data": {akey: base64.b64encode(access.encode()).decode(),
                               skey: base64.b64encode(secret.encode()).decode()},
                  }
                  status, _ = http("POST", "/api/v1/namespaces/%s/secrets" % ns, body)
                  if status not in (200, 201):
                      print("refused: create of Secret %s returned HTTP %s" % (name, status), flush=True)
                      return 1
                  print("created", flush=True)
                  return 0


              if __name__ == "__main__":
                  sys.exit(ensure(http, os.environ["POD_NAMESPACE"], os.environ["STORE_SECRET_NAME"],
                                  os.environ["STORE_ACCESS_KEY_KEY"], os.environ["STORE_SECRET_KEY_KEY"]))
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          {{- if .Values.tlsTrust.secretName }}
          volumeMounts:
            {{- include "iagent.tlsTrust.volumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.tlsTrust.secretName }}
      volumes:
        {{- include "iagent.tlsTrust.volume" . | nindent 8 }}
      {{- end }}
{{- end }}
