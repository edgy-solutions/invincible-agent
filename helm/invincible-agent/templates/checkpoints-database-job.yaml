{{- /*
ENGINE-LG'S CHECKPOINT DATABASE (graphHost.checkpointsDatabase.enabled; off by default). Creates the database as
`postgres`, idempotently (CREATE DATABASE only when absent), owned by the chart's pg user, and revokes CONNECT from
PUBLIC, so a role the owner has not granted cannot connect: Electric's own role (electric.db.enabled) has no CONNECT here.
The control holds ONLY alongside that role, and the helper refuses to render without it. The Job moves no data: a new
database is empty. In-flight handling is Chris's decision and is in the PR body.

Hook: post-install,post-upgrade at weight -4, as templates/database-split-job.yaml (before electric-role at -3). Both Jobs
may name the same database by default, and both are idempotent.
*/ -}}
{{- $db := include "invincible-agent.checkpointsDatabase" . }}
{{- if $db }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-checkpoints-database
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: checkpoints-database
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "postgres"
            {{- if eq (default "postgres" .Values.postgresql.imageStyle) "bitnami" }}
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            {{- else }}
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres; do sleep 2; done
              psql -v ON_ERROR_STOP=1 <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', '{{ $db }}', '{{ include "invincible-agent.pgUser" . }}')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $db }}') \gexec
              REVOKE CONNECT ON DATABASE "{{ $db }}" FROM PUBLIC;
              SQL
{{- end }}
