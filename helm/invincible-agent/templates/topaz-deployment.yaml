{{- if .Values.topaz.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-topaz
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: topaz
spec:
  replicas: 1
  # RollingUpdate + ReadWriteOnce PVC = MultiAttach error on every
  # helm upgrade: the new pod tries to mount the PVC before the old
  # one releases it (same node scheduling), stalls in ContainerCreating
  # while k8s waits for the old pod, times out. Recreate strategy
  # kills the old pod first so the PVC is free when the new one starts.
  # Safe here because topaz is a single-replica policy engine with a
  # local BoltDB — brief availability gap during upgrade is acceptable.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "topaz" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "topaz" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: topaz
          image: {{ include "invincible-agent.image" (dict "name" "topaz" "registry" .Values.topaz.image.registry "repository" .Values.topaz.image.repository "tag" .Values.topaz.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["run", "--config-file", "/config/config.yaml"]
          # Container port declarations must match the topaz-configmap
          # config.yaml's listen_addresses. Prior version declared only
          # 8282/8383/9292/9494 which reflected the (broken) old
          # port scheme; the 2026-07-01 config rewrite splits authorizer
          # (8282/8383) from directory (9292/9393) and moves metrics
          # from 9292 → 9696 to free the directory port.
          ports:
            - name: console-http
              containerPort: 8080
            - name: console-grpc
              containerPort: 8081
            - name: authz-grpc
              containerPort: 8282
            - name: authz-http
              containerPort: 8383
            - name: dir-grpc
              containerPort: 9292
            - name: dir-http
              containerPort: 9393
            - name: metrics
              containerPort: 9696
            - name: health
              containerPort: 9494
          volumeMounts:
            - name: data
              mountPath: /db
            - name: config
              mountPath: /config
            - name: policies
              mountPath: /policies
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-topaz-data
        - name: config
          configMap:
            name: {{ .Release.Name }}-topaz-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: policies
          configMap:
            name: {{ .Release.Name }}-topaz-config
            items:
              - key: manifest.yaml
                path: manifest.yaml
              - key: data_broker.rego
                path: data_broker.rego
              # ADR-0025 hop 2: the catalog domain-view policy query_metadata
              # ASKS (successor to its in-code gate). MUST be listed here or
              # the bundle at /policies never loads it — the same reason
              # persona_entitlement.rego (absent from this list) stays dormant.
              - key: catalog_domain_view.rego
                path: catalog_domain_view.rego
{{- end }}