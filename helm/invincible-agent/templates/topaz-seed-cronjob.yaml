{{- /*
Topaz seed CronJob (ADR-0025 enforcement hop-1) — the DURABLE automation of
the authorization-directory sync, and the fix for the manual-run fragility
that hid the readback bug.

WHY THIS EXISTS AS AUTOMATION (not a script someone remembers to run): the
enforcement arc's premise is "Topaz decides on what's seeded", which means
the seed must stay CURRENT — a manually-seeded authz directory goes stale
the moment DataHub changes and nobody re-runs the sync, and Topaz then
decides on wrong relations with no signal. Automation also makes the
readback failure IMPOSSIBLE TO IGNORE: `set -e` + a non-zero exit
(main() returns 4 on readback failure) fails the Job loudly, unlike a
manual run where a crash-at-readback-after-apply got tolerated (which is
exactly how the original readback bug hid).

POLICY SOURCE (`topazSeed.policySource.type`) — where the six DATA files
(users, groups, asset_grants, task_grants, ontology_compartments) come from:
  image     — /app/policy baked into topazSeed.image (sandbox default).
  configMap — a ConfigMap holding the six files, applied out-of-band
              (e.g. by a private policy repo's CI).
  git       — an initContainer clones a PRIVATE policy repo on EVERY run;
              merging to the tracked ref converges the cluster on the next
              schedule tick. GitOps for entitlements with no extra
              controllers — the CronJob *is* the reconcile loop.
In the non-image modes the run COMPOSES a working policy dir. The six data
files MUST come from the overlay — a missing file is FATAL, because falling
back to the image's sandbox copy would silently seed sandbox users into a
real cluster. The enum files (personas.yaml / domains.yaml) come from the
image by default, and a deployment may ASSERT ownership of either via
`policySource.overlayEnums` (then the overlay MUST provide it, and the
image copy is ignored). The two enums are not symmetric:
  domains.yaml  — a deployment's CLASSIFICATION vocabulary. Nothing in code
                  evaluates specific domain values; what matters is that the
                  labels match the deployment's data tagging at ingest (see
                  docs/architecture/personas-and-domains.md). Overriding is
                  the NORMAL private-deployment move.
  personas.yaml — fully assertable since chart 0.3.12, ADDING personas
                  included: catalog_domain_view.rego walks the directory
                  (domain.can_view = cell->can_assume over the edges this
                  seed writes) instead of enumerating a hardcoded list, so
                  the effective personas.yaml is the ONLY vocabulary source.
Both directions fail loud: an enum file asserted in overlayEnums but absent
from the overlay is FATAL, and an enum file present in the overlay but NOT
asserted is FATAL too — a file that LOOKS authoritative while being ignored
is the two-truths trap this chart kills everywhere else.
Either way validate_policy.py gates the run BEFORE any write, so a broken
overlay refuses whole (fail-closed) instead of applying four syncs and
dying on the fifth. A failed clone likewise fails the Job before any
apply — an unreachable repo can never prune the directory.

Runs all six syncs with the fixed readback as a GATING step (see the
script below for the order rationale).

DEFAULT-DISABLED (`topazSeed.enabled: false`) so it never surprise-runs and
never surprise-prunes the authz directory. Enable in values when ready for
keep-current; a one-off run is `kubectl create job --from=cronjob/…`.
ENABLE_AGENTIC_AUTH stays OFF regardless — seeding changes no behavior until
the flag flips and the enforcement points migrate.
*/ -}}
{{- if .Values.topazSeed.enabled }}
{{- $src := .Values.topazSeed.policySource }}
{{- $mode := $src.type | default "image" }}
{{- if not (has $mode (list "image" "configMap" "git")) }}
{{- fail (printf "topazSeed.policySource.type must be one of image|configMap|git, got %q" $mode) }}
{{- end }}
{{- if and (eq $mode "configMap") (not $src.configMap.name) }}
{{- fail "topazSeed.policySource.configMap.name is required when type=configMap" }}
{{- end }}
{{- if and (eq $mode "git") (not $src.git.repoUrl) }}
{{- fail "topazSeed.policySource.git.repoUrl is required when type=git" }}
{{- end }}
{{- /* Image resolution — both seed images honor global.imageRegistry via
the invincible-agent.image helper when given in structured form (map with
name/registry/repository/tag). A plain STRING is honored verbatim (legacy
0.3.11 form) — it bypasses the global registry, so airgapped overlays
should prefer the map form. */}}
{{- $seedImg := .Values.topazSeed.image }}
{{- if not (kindIs "string" $seedImg) }}
{{- $seedImg = include "invincible-agent.image" (dict "name" ($seedImg.name | default "cortex-bff") "registry" $seedImg.registry "repository" $seedImg.repository "tag" ($seedImg.tag | default "latest") "root" .) }}
{{- end }}
{{- $gitImg := $src.git.image }}
{{- if not (kindIs "string" $gitImg) }}
{{- $gitImg = include "invincible-agent.image" (dict "registry" ($gitImg.registry | default "docker.io") "repository" ($gitImg.repository | default "alpine/git") "tag" ($gitImg.tag | default "v2.45.2") "root" .) }}
{{- end }}
{{- $overlayEnums := $src.overlayEnums | default (list) }}
{{- range $overlayEnums }}
{{- if not (has . (list "personas.yaml" "domains.yaml")) }}
{{- fail (printf "topazSeed.policySource.overlayEnums may only contain personas.yaml and/or domains.yaml, got %q" .) }}
{{- end }}
{{- end }}
{{- if and $overlayEnums (eq $mode "image") }}
{{- fail "topazSeed.policySource.overlayEnums requires policySource.type configMap|git — image mode has no overlay to assert enums from" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  # NOTE: was `include "invincible-agent.fullname"` — a helper this chart
  # never defined. Latent because the CronJob is default-disabled (helm
  # only evaluates the include once enabled). Release.Name matches every
  # other resource here and the documented `cronjob/<release>-topaz-seed`.
  name: {{ .Release.Name }}-topaz-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: topaz-seed
    app.kubernetes.io/part-of: enforcement
spec:
  schedule: {{ .Values.topazSeed.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0          # a failure is a real signal, not flakiness
      template:
        metadata:
          labels:
            app.kubernetes.io/component: topaz-seed
        spec:
          restartPolicy: Never
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $mode "git" }}
          initContainers:
            # Clone the private policy repo fresh on every run — the
            # tracked ref's HEAD is what gets asserted. Auth (optional)
            # is username/password (PAT) via GIT_ASKPASS so credentials
            # never appear in process args or on-disk config.
            - name: fetch-policy
              image: {{ $gitImg | quote }}
              env:
                - name: GIT_REPO_URL
                  value: {{ $src.git.repoUrl | quote }}
                - name: GIT_REF
                  value: {{ $src.git.ref | default "main" | quote }}
                {{- if $src.git.authSecretName }}
                - name: GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $src.git.authSecretName | quote }}
                      key: username
                - name: GIT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $src.git.authSecretName | quote }}
                      key: password
                {{- end }}
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  if [ -n "${GIT_USERNAME:-}" ]; then
                    printf '#!/bin/sh\ncase "$1" in\n  Username*) echo "$GIT_USERNAME" ;;\n  Password*) echo "$GIT_PASSWORD" ;;\nesac\n' > /tmp/askpass.sh
                    chmod +x /tmp/askpass.sh
                    export GIT_ASKPASS=/tmp/askpass.sh
                  fi
                  git clone --depth 1 --branch "$GIT_REF" -- "$GIT_REPO_URL" /overlay-src/repo
                  echo "policy overlay at commit: $(git -C /overlay-src/repo rev-parse HEAD)"
              volumeMounts:
                - name: overlay-src
                  mountPath: /overlay-src
          {{- end }}
          containers:
            - name: topaz-seed
              image: {{ $seedImg | quote }}
              imagePullPolicy: {{ .Values.topazSeed.imagePullPolicy }}
              env:
                - name: TOPAZ_DIRECTORY_URL
                  value: {{ .Values.topazSeed.topazDirectoryUrl | quote }}
                - name: DATAHUB_GMS_URL
                  value: {{ .Values.topazSeed.datahubGmsUrl | quote }}
                # Optional DataHub PAT (work posture) — empty/absent sends
                # no header, so tokenless sandbox DataHub is unchanged.
                - name: DATAHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-secrets
                      key: DATAHUB_TOKEN
                      optional: true
                - name: PYTHONPATH
                  value: "/app/policy/sync"
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  cd /app
                  {{- if eq $mode "image" }}
                  POLICY_DIR=/app/policy
                  {{- else }}
                  echo "===== COMPOSE policy dir (enums from image, data from overlay) ====="
                  {{- if eq $mode "git" }}
                  OVERLAY="/overlay-src/repo/{{ $src.git.path | default "policy" }}"
                  {{- else }}
                  OVERLAY=/overlay
                  {{- end }}
                  mkdir -p /work/policy
                  # Enum files: image-canonical UNLESS the deployment asserts
                  # ownership via policySource.overlayEnums (see header note —
                  # domains are deployment vocabulary; personas are code-coupled,
                  # subset-safe only). Fail loud in BOTH directions: asserted-
                  # but-missing and present-but-unasserted are each FATAL.
                  {{- range list "personas.yaml" "domains.yaml" }}
                  {{- if has . $overlayEnums }}
                  if [ ! -f "$OVERLAY/{{ . }}" ]; then
                    echo "FATAL: policySource.overlayEnums asserts {{ . }} but the overlay does not provide it" >&2
                    exit 2
                  fi
                  cp "$OVERLAY/{{ . }}" /work/policy/
                  {{- else }}
                  if [ -f "$OVERLAY/{{ . }}" ]; then
                    echo "FATAL: overlay contains {{ . }} but policySource.overlayEnums does not assert it — an ignored-but-authoritative-looking enum is the two-truths trap; add it to overlayEnums or delete the file" >&2
                    exit 2
                  fi
                  cp /app/policy/{{ . }} /work/policy/
                  {{- end }}
                  {{- end }}
                  # Data files are DEPLOYMENT assertions — always from the overlay.
                  # Missing file = FATAL: falling back to the image's sandbox copy
                  # would silently seed sandbox users into this cluster.
                  for f in users.yaml groups.yaml asset_grants.yaml task_grants.yaml ontology_compartments.yaml capability_grants.yaml; do
                    if [ ! -f "$OVERLAY/$f" ]; then
                      echo "FATAL: policy overlay is missing $f — refusing (no fallback to the image's sandbox copy)" >&2
                      exit 2
                    fi
                    cp "$OVERLAY/$f" /work/policy/
                  done
                  POLICY_DIR=/work/policy
                  {{- end }}
                  export ASSET_GRANTS_FILE="$POLICY_DIR/asset_grants.yaml"
                  export TASK_GRANTS_FILE="$POLICY_DIR/task_grants.yaml"
                  export ONTOLOGY_COMPARTMENTS_FILE="$POLICY_DIR/ontology_compartments.yaml"
                  export CAPABILITY_GRANTS_FILE="$POLICY_DIR/capability_grants.yaml"
                  echo "===== VALIDATE (all six files, BEFORE any apply) ====="
                  # Fail-closed gate: a malformed overlay refuses the WHOLE run
                  # here, instead of applying four syncs and dying on the fifth.
                  python policy/sync/validate_policy.py --policy-dir "$POLICY_DIR"
                  echo ""
                  echo "===== PERSONA SYNC (topaz_sync) ====="
                  {{- if .Values.topazSeed.loadManifest }}
                  # --load-manifest is idempotent; carrying it on every run
                  # retires the fresh-cluster manual extract-and-load step and
                  # picks up chart-shipped manifest updates automatically.
                  python policy/sync/topaz_sync.py --topaz-url "$TOPAZ_DIRECTORY_URL" --policy-dir "$POLICY_DIR" --load-manifest /topaz-config/manifest.yaml
                  {{- else }}
                  python policy/sync/topaz_sync.py --topaz-url "$TOPAZ_DIRECTORY_URL" --policy-dir "$POLICY_DIR"
                  {{- end }}
                  echo ""
                  echo "===== ASSET SYNC (datahub_topaz_sync) ====="
                  python policy/sync/datahub_topaz_sync.py
                  echo ""
                  echo "===== GRANT SYNC (grant_sync — git-asserted reader grants) ====="
                  # AFTER the asset sync: reader grants reference dataset objects,
                  # and grant_sync REFUSES a grant to an asset not yet in the
                  # directory (deny-on-dangling). Exits 2 (malformed) / 3
                  # (dangling) / 4 (readback) — `set -e` fails the Job loudly, so
                  # a bad grant file cannot silently seed a broken grant.
                  python policy/sync/grant_sync.py
                  echo ""
                  echo "===== ONTOLOGY COMPARTMENT SYNC (ontology_compartment_sync) ====="
                  python policy/sync/ontology_compartment_sync.py
                  echo ""
                  echo "===== TASK GRANT SYNC (task_grant_sync — HITL fifth namespace) ====="
                  # task_audience `actor` relations from policy/task_grants.yaml.
                  # Disjoint scope from the other syncs; exits 2 (malformed) / 4
                  # (readback) — `set -e` fails the Job loudly on a bad overlay.
                  python policy/sync/task_grant_sync.py
                  echo ""
                  echo "===== CAPABILITY GRANT SYNC (capability_grant_sync — ADR-0029 sixth namespace) ====="
                  # capability `invoker` relations from policy/capability_grants.yaml.
                  # Disjoint scope from the other syncs; exits 2 (malformed) / 4
                  # (readback) — `set -e` fails the Job loudly on a bad overlay.
                  # Runs AFTER the manifest load (topaz_sync --load-manifest) so the
                  # `capability` object type exists before set_object.
                  python policy/sync/capability_grant_sync.py
                  echo ""
                  echo "===== SEED COMPLETE — six syncs applied + readbacks passed ====="
              {{- if or (ne $mode "image") .Values.topazSeed.loadManifest }}
              volumeMounts:
                {{- if eq $mode "git" }}
                - name: overlay-src
                  mountPath: /overlay-src
                  readOnly: true
                {{- end }}
                {{- if eq $mode "configMap" }}
                - name: overlay
                  mountPath: /overlay
                  readOnly: true
                {{- end }}
                {{- if ne $mode "image" }}
                - name: work
                  mountPath: /work
                {{- end }}
                {{- if .Values.topazSeed.loadManifest }}
                - name: topaz-manifest
                  mountPath: /topaz-config
                  readOnly: true
                {{- end }}
              {{- end }}
          {{- if or (ne $mode "image") .Values.topazSeed.loadManifest }}
          volumes:
            {{- if eq $mode "git" }}
            - name: overlay-src
              emptyDir: {}
            {{- end }}
            {{- if eq $mode "configMap" }}
            - name: overlay
              configMap:
                name: {{ $src.configMap.name | quote }}
            {{- end }}
            {{- if ne $mode "image" }}
            - name: work
              emptyDir: {}
            {{- end }}
            {{- if .Values.topazSeed.loadManifest }}
            - name: topaz-manifest
              configMap:
                name: {{ .Release.Name }}-topaz-config
                items:
                  - key: manifest.yaml
                    path: manifest.yaml
            {{- end }}
          {{- end }}
{{- end }}
