{{- if .Values.topaz.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-topaz-config
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  # ================================================================
  # config.yaml — Topaz runtime configuration.
  #
  # 2026-07-01 rewrite: prior config declared reader/writer/model on
  # 8282/8383 but never wired them together (no `needs:` blocks, no
  # `remote_directory`, no `auth` block, no `authorizer` service). The
  # symptom was Topaz logging "disabling local directory services" and
  # "model service not configured" on startup and serving nothing but
  # the console. Confirmed by:
  #   - `/db/directory.db` 32KB (metadata-seed only, empty of data),
  #   - central-gateway hitting `topaz-svc:8383` and getting a
  #     connection error (nothing listening under the Service on the
  #     right port),
  #   - `ALLOW_MOCK_AUTH=true` in central-gateway silently converting
  #     every topaz exception into an allow-by-default (fail-open),
  # which meant data-access authz has been mock-allow the whole time.
  # See ADR-0026 "coupled interim mechanisms retire together" — the
  # mock branch's only remaining function post-fix was hiding the next
  # outage; it's removed in this same arc (dag-tools/central_gateway).
  #
  # New port scheme (matches `topaz config new` reference output):
  #   - 9494  health
  #   - 9696  metrics  (was 9292 — moved to free 9292 for directory)
  #   - 8080  console gateway   (Aserto UI)
  #   - 8081  console grpc
  #   - 8282  authorizer grpc   (native `is` check)
  #   - 8383  authorizer gateway (HTTP /api/v2/authz/is — the port
  #                               `TOPAZ_AUTHORIZER_URL` already targets)
  #   - 9292  directory grpc    (reader/writer/model/exporter/importer)
  #   - 9393  directory gateway (HTTP)
  # ================================================================
  config.yaml: |
    version: 2
    logging:
      prod: true
      log_level: info
      grpc_log_level: info

    directory:
      db_path: /db/directory.db
      request_timeout: 5s
      seed_metadata: true

    # Authorizer resolves subject identities via a directory reader.
    # Point it at ourselves — the reader below is on the same host.
    # `no_tls: true` = plain HTTP/2 (no TLS at all). Do NOT also set
    # `insecure: true` — those are mutually exclusive (`insecure`
    # means TLS-with-skip-verify).
    remote_directory:
      address: "0.0.0.0:9292"
      no_tls: true
      # `insecure` defaults to true in some topaz builds. That plus
      # explicit `no_tls: true` trips the "insecure and no_tls
      # options are mutually exclusive" check. Set it false
      # explicitly so we don't inherit the default.
      insecure: false

    # Anonymous access from inside the cluster. Topaz-svc is not
    # ingress-exposed; the tightening path if that ever changes is
    # `enable_api_key: true` + shared secret, which we can do without
    # a manifest change.
    auth:
      options:
        default:
          enable_api_key: false
          enable_anonymous: true

    api:
      health:
        listen_address: "0.0.0.0:9494"
      metrics:
        listen_address: "0.0.0.0:9696"
        zpages: true
      services:
        # Aserto console UI (view relations, run queries interactively).
        # Not needed for programmatic access, but useful for debugging
        # entitlements in-cluster via `kubectl port-forward`.
        console:
          grpc:
            listen_address: "0.0.0.0:8081"
          gateway:
            listen_address: "0.0.0.0:8080"

        # Directory services all share 9292 (grpc) / 9393 (gateway).
        # `needs:` establishes startup ordering — model boots first,
        # reader/writer/importer depend on it. Without these blocks
        # topaz says "disabling local directory services" and refuses
        # to open the ports.
        model:
          grpc:
            listen_address: "0.0.0.0:9292"
          gateway:
            listen_address: "0.0.0.0:9393"
        reader:
          needs:
            - model
          grpc:
            listen_address: "0.0.0.0:9292"
          gateway:
            listen_address: "0.0.0.0:9393"
        writer:
          needs:
            - model
          grpc:
            listen_address: "0.0.0.0:9292"
          gateway:
            listen_address: "0.0.0.0:9393"
        exporter:
          grpc:
            listen_address: "0.0.0.0:9292"
        importer:
          needs:
            - model
          grpc:
            listen_address: "0.0.0.0:9292"

        # Authorizer serves POST /api/v2/authz/is (gateway on 8383) and
        # the gRPC Authorizer API (on 8282). This is what
        # `dag-tools/central_gateway.check_topaz_authz` posts to.
        authorizer:
          needs:
            - reader
          grpc:
            listen_address: "0.0.0.0:8282"
          gateway:
            listen_address: "0.0.0.0:8383"

    opa:
      instance_id: "topaz"
      graceful_shutdown_period_seconds: 2
      local_bundles:
        paths: ["/policies"]
        skip_verification: true

  # ================================================================
  # manifest.yaml — ReBAC schema (types, relations, permissions).
  #
  # Shared substrate for:
  #   - ADR-0025 (instance-plane access control as provenance) —
  #     user/dataset types + can_read / can_write permissions.
  #   - ADR-0026 (persona/entitlement authorization) — user/persona/
  #     domain/group/cell types + can_assume permission.
  #
  # Both live in ONE Topaz store per the ADR-0026 "single authz
  # truth" decision. The manifest is loaded into the Directory at
  # startup by the topaz-seed Job (see topaz-seed-job.yaml).
  # ================================================================
  manifest.yaml: |
    types:
      user: {}
      dataset:
        relations:
          owner: user
          reader: user
        permissions:
          can_read: reader | owner
          can_write: owner

      # ADR-0025 engines arc — the `document` type gates Engine W's source
      # documents (technical manuals), identified by their `doc_id` (an IRI
      # like http://edgy-solutions.com/ontology/mil#wpn-m0004-...). Same
      # deny-by-default shape as `dataset` (explicit owner/reader grants;
      # entitlement NEVER sufficient); Engine W's per-chunk result-filter
      # checks can_read on the chunk's source `document` BEFORE synthesis.
      #
      # NOT a permanent separate namespace. Per ADR-0025 Amendment 2026-07-06b
      # (lineage-integrity correction), lineage-participating documents are
      # first-class CATALOGED ASSETS that unify into the asset-resource
      # namespace — a document that feeds a cataloged ML pipeline whose output
      # is cataloged must itself be cataloged, or DataHub lineage shows a
      # phantom root. This `document` type is the INTERIM: the doc_id IRIs are
      # already catalog-URN-shaped, so when the document-cataloging arc lands
      # (doc-tools registers documents at ingest), those SAME IRIs become the
      # catalog URNs and the gate does NOT re-key — cataloging adds the catalog
      # entry + lineage, not a new identity. Grants: interim manual/`asset_grants`
      # (extend grant_sync to documents); catalog-sourced once the arc lands.
      document:
        relations:
          owner: user
          reader: user
        permissions:
          can_read: reader | owner
          can_write: owner

      # ADR-0025 ontology-IRI namespace (2026-07-08) — Engine O's ontology
      # class/IRI VISIBILITY gate. Same deny-by-default, Topaz-decided,
      # git-asserted, overlay-configurable model as `dataset`/`document`, on a
      # third namespace (the ontology vocabulary). An IRI is visible iff the
      # caller is a `viewer` — granted either directly or (usual case) via
      # membership in the group that IS the IRI's COMPARTMENT (compartments are
      # reused `group`s). `restricted` is a presence MARKER the sync sets on
      # every compartment-assigned IRI so the rego can distinguish UNASSIGNED
      # (no marker → governed by the per-deployment default_visibility) from
      # ASSIGNED-BUT-UNGRANTED (marker present, viewer absent → deny). This is
      # what makes "compartment general vocabulary to make the whole ontology
      # secret" a per-deployment OVERLAY config, not a data/code change:
      # default_visibility=deny + assign-everything = fully secret; same manifest.
      marker: {}
      ontology_class:
        relations:
          viewer: user | group#member
          restricted: marker
        permissions:
          can_view: viewer

      # HITL substrate (2026-07-09) — the HumanTask queue's FIFTH namespace.
      # "May this caller ACT on (approve/reject) this task's audience" is a
      # can_act decision asked of the SAME Topaz single-decider, deny-by-default,
      # git-asserted (policy/task_grants.yaml → task_grant_sync.py), uniform with
      # dataset/document/ontology_class. A `task_audience` is an approval-authority
      # class (key "<task_kind>:<compartment>", e.g. "promotion:DATA_ENGINEERING");
      # a caller may act iff they are an `actor` — granted directly or via a group
      # (reusing groups.yaml membership). No marker needed: deny-by-default IS the
      # posture (no actor grant → can_act false → the task is invisible + unactable,
      # the existence-oracle-safe default). Registration resolves an audience's
      # actors from Topaz and materializes one queue row per actor, so the Electric
      # replication filter and this can_act gate derive from ONE decision.
      task_audience:
        relations:
          actor: user | group#member
        permissions:
          can_act: actor

      # ADR-0029 Slice 1 — the direct_call capability gate. A direct_call step is
      # a TRANSITIONAL workflow action not (yet) a mesh verb; it escapes the verb
      # ontology but NOT the gate — it is decided by the SAME single decider,
      # can_invoke(caller, capability). deny-by-default: no invoker grant ->
      # can_invoke false -> the step fails-and-releases, never dispatches. Close
      # the hatch by promoting the action to a real verb (spo_operation, through
      # /find_compatible_verbs) or by granting the capability here.
      capability:
        relations:
          invoker: user | group#member
        permissions:
          can_invoke: invoker

      # ---------------------------------------------------------------
      # ADR-0026 additions — persona/entitlement authorization.
      #
      # Model in one line: users are members of groups; groups grant
      # entitlement to (persona, domain) CELLS. cortex-bff authorizes
      # a per-prompt persona/domain override with
      #     is(user:<sub>, "can_assume", cell:<PERSONA>:<DOMAIN>)
      # which returns true iff the user is a member of any group whose
      # grant matches that cell.
      #
      # Cell reification (a synthetic object per persona×domain pair
      # that any group grants) is what makes can_assume a NATIVE Topaz
      # permission check rather than a graph walk cortex-bff would have
      # to reimplement client-side. Cells are created on-demand by the
      # CI sync tool — cells with no grant do not exist in the store
      # and evaluate to false, which is the honest default (see ADR-0026
      # "cell not entitled → 403 with `cell_not_entitled` code").
      #
      # persona is declared as a bare type (no relations) so the sync
      # tool can enforce that every cell's key components exist as
      # canonical vocabulary objects — a Topaz-side positive control
      # that complements the YAML validator on the git side per
      # `[[verification-must-fail]]`.
      #
      # Cell key format: "<PERSONA>:<DOMAIN>" — colon-delimited,
      # matching the canonical enum casing from ADR-0009 (uppercase).
      # Example: cell:DATA_ENGINEER:AVIATION
      persona: {}
      # domain carries the WALKABLE vocabulary edge (de-hardcode
      # phase 1). Why: rego cannot LIST objects of a type — bare
      # objects are unreachable from policy, which is why
      # catalog_domain_view.rego had to hardcode the persona list just
      # to CONSTRUCT candidate cell IDs. Reifying cell→domain
      # membership as a real relation makes the question walkable
      # instead of enumerable:
      #     domain:<D> #cell @cell:<P>:<D>     (written by topaz_sync)
      #     can_view = cell->can_assume         ("can assume any cell
      #                                          belonging to this domain")
      # Phase 2 (next rev) swaps catalog_domain_view.rego's persona
      # loop for a single ds.check on domain…can_view — after this
      # edge is seeded AND readback-verified in every cluster (the
      # sync's readback proves the allow path while the old rego still
      # carries traffic). Then personas.yaml joins domains.yaml as pure
      # deployment-owned data (overlayEnums-safe, including ADDING
      # personas).
      domain:
        relations:
          cell: cell
        permissions:
          can_view: cell->can_assume
      group:
        relations:
          member: user
      cell:
        relations:
          # A cell is assumable_by either:
          #   - a direct user relation (rare — reserved for one-off
          #     exception grants; groups.yaml prefers group-based),
          #   - or "any member of group X" via userset-rewrite
          #     (group#member), which is how the seed Job and future
          #     CI sync tool wire group grants.
          assumable_by: user | group#member
        permissions:
          # can_assume is the permission cortex-bff checks. Named
          # differently from the relation (assumable_by) to keep the
          # subject/verb read natural at call sites:
          #     is(user:foo, "can_assume", cell:DATA_ENGINEER:AVIATION)
          can_assume: assumable_by

  # ================================================================
  # data_broker.rego — ADR-0025 instance-plane access policy.
  #
  # Package path matches what `dag-tools/central_gateway.check_topaz_authz`
  # posts (`policy_context.path`). This is the policy that gates
  # DA reads through the CortexDataClient path.
  # ================================================================
  data_broker.rego: |
    package data_mesh.GET.api.v1.assets.__asset_key.authorize

    # 2026-07-01: converted to Rego v1 syntax. Topaz v0.33.13's OPA
    # rejected the v0 form ("`if` keyword is required before rule
    # body"). Behavior is unchanged.
    import future.keywords.if

    default allowed := false
    default allowed_columns := []
    default row_filters := ""

    # ADR-0025 DA-read gate — DENY-BY-DEFAULT (governing invariant: access
    # regulates persona/domain). A subject may read an asset ONLY via an
    # EXPLICIT grant — owner or an explicit `reader` relation a human
    # asserted (manifest: can_read = reader | owner). Entitlement / persona /
    # domain are ELIGIBILITY, never sufficient, and are NOT consulted here:
    # "cleared for the domain" is not "granted this asset" (need-to-know).
    # At this classification (TS/SCI / government / proprietary / PII) an
    # over-grant is a SPILL, so the only safe error is deny-until-granted.
    # owner-OR-entitled is REJECTED as a model, not deferred.
    #
    # TWO corrections vs the prior (dormant-broken) form, both from hop 2:
    #   * ds.check — NOT ds.check_relation, which is DEAD on this Topaz build
    #     (v2->v3 unification; the twin of the readback /check/permission and
    #     the ds.check_permission deaths). The dormant gate returned false
    #     for a real owner via the authorizer.
    #   * subject key from input.resource.user_id — input.user.id is EMPTY on
    #     this Topaz (no identity->user resolution objects seeded). The
    #     enforcement point passes the caller's VERIFIED identity in
    #     resourceContext. can_read is a PERMISSION (reader|owner); ds.check
    #     evaluates it, mirroring the working REST /check.
    allowed if {
        ds.check({
            "object_type": "dataset",
            "object_id": input.resource.asset_key,
            "relation": "can_read",
            "subject_type": "user",
            "subject_id": input.resource.user_id
        })
    }

    # Example mock policies for CLS/RLS
    allowed_columns := ["timestamp", "rotor_id", "status"] if {
        allowed
        input.user.role == "mechanic"
    }

    row_filters := "region = 'US-EAST'" if {
        allowed
        input.user.role == "mechanic"
    }

  # ================================================================
  # persona_entitlement.rego — ADR-0026 persona/domain authorization.
  #
  # Called by cortex-bff at the per-prompt persona/domain-override
  # validation seat (step 3 of the ADR-0026 rollout). Returns
  # `allowed: true` iff the user is member of any group that grants
  # the (persona, domain) cell they're trying to assume.
  #
  # Uses check_permission (not check_relation) so Topaz walks the
  # userset rewrite `assumable_by: user | group#member` — this is
  # what makes group-based grants work through a single check call,
  # which is the whole point of reifying cells.
  #
  # Input shape (POST /api/v2/authz/is with
  # policyContext.path = "invincible_agent.persona.can_assume",
  # decisions = ["allowed"]):
  #   input.user.id  — Keycloak `sub`
  #   input.cell.id  — "<PERSONA>:<DOMAIN>" string
  #
  # Decision key: "allowed" (boolean).
  #
  # This rego lands in step 1's PR so that step 3 (cortex-bff client)
  # is purely client-side work. The rego is not exercised by any
  # runtime component in step 1 — verification of step 1 is native
  # `topaz ds check` (see topaz-seed-job.yaml positive controls).
  # ================================================================
  persona_entitlement.rego: |
    package invincible_agent.persona.can_assume

    import future.keywords.if

    default allowed := false

    allowed if {
        ds.check_permission({
            "subject": {"type": "user", "key": input.user.id},
            "object": {"type": "cell", "key": input.cell.id},
            "permission": "can_assume"
        })
    }

  # ================================================================
  # catalog_domain_view.rego — ADR-0025 enforcement hop 2.
  #
  # The successor to query_metadata's IN-CODE domain gate (the
  # 2026-07-02 stopgap: `served_domain in entitled_domains`, evaluated
  # in Python — a policy predicate living in application code, which
  # the single-decider tenet forbids). Hop 2 moves that predicate HERE
  # so Topaz is the single decider and query_metadata only ASKS.
  #
  # DEEP-DERIVE, not thin-relocate: this rule reads Topaz's OWN seeded
  # relations — it does NOT trust a caller-supplied entitled_domains
  # list. So the decision can't drift from its source (the git-asserted
  # (persona,domain) grants the persona sync materialized).
  # "entitled to domain D" == "holds ANY (persona, D) cell", answered
  # by ONE walk on the domain's can_view permission (manifest:
  # can_view = cell->can_assume over the domain:<D> #cell @cell:<P>:<D>
  # edges topaz_sync seeds + readback-verifies since chart 0.3.11).
  # No persona enumeration: the vocabulary lives ONLY in the directory,
  # seeded from the EFFECTIVE personas.yaml — so a deployment-overlay
  # persona (topazSeed.policySource.overlayEnums) entitles identically
  # to a shipped one. The previous revision hardcoded the persona list
  # here purely because rego cannot LIST objects of a type; that
  # enumeration is now GONE, not parameterized (the safest list is no
  # list).
  #
  #   input.resource.user_id — the caller's ENTITLEMENT KEY (email by
  #                           default, matching policy/users.yaml and
  #                           the seeded `user` objects — NOT the JWT
  #                           sub; see auth.USER_ENTITLEMENT_CLAIM).
  #                           Passed EXPLICITLY in resourceContext, not
  #                           via identityContext: this Topaz has no
  #                           `identity`→`user` resolution objects
  #                           seeded (the sync writes `user` objects +
  #                           cells directly), so `input.user.id` is
  #                           empty. The enforcement point already holds
  #                           the caller's VERIFIED email (from the JWT,
  #                           threaded through config) — it asserts the
  #                           subject; Topaz still DECIDES whether that
  #                           subject holds the cell. Verified 2026-07-04
  #                           against the live directory (alice's cell
  #                           resolves True, bob's False).
  #   input.resource.domain — the domain the catalog serves
  #                           (DATA_ENGINEERING).
  #
  # Decision key: "allowed" (boolean). Called via POST
  # /api/v2/authz/is, policyContext.path =
  # "invincible_agent.catalog.can_view", decisions = ["allowed"].
  # ================================================================
  catalog_domain_view.rego: |
    package invincible_agent.catalog.can_view

    import future.keywords.if

    default allowed := false

    # Walkable derivation (de-hardcode phase 2, chart 0.3.12). ONE
    # check on the domain's can_view permission; the manifest defines
    #     domain.can_view = cell->can_assume
    # over the domain:<D> #cell @cell:<P>:<D> edges the persona sync
    # seeds, prunes, and readback-verifies on every run (chart 0.3.11).
    # PRECONDITION (already release-ordered): the 0.3.11 seed must have
    # run against this directory before this rego serves — the sync's
    # can_view readback going green is the evidence. Fail-CLOSED: no
    # edge → deny.
    #
    # This replaces a HARDCODED persona list (a workaround for rego's
    # inability to list objects of a type — enumeration was the only
    # way to construct candidate cell IDs). With the walk, the persona
    # vocabulary lives ONLY in the directory, seeded from the EFFECTIVE
    # personas.yaml — a deployment-overlay persona entitles identically
    # to a shipped one. Sealed live by
    # tests/sandbox_e2e/_seal_walkable_domain_view.py: entitled allows,
    # unentitled denies, and a NOVEL (never-shipped) persona entitles
    # through the walk — the case the hardcoded list could never pass.
    allowed if {
        ds.check({
            "object_type": "domain",
            "object_id": input.resource.domain,
            "relation": "can_view",
            "subject_type": "user",
            "subject_id": input.resource.user_id
        })
    }

  # ================================================================
  # ontology_can_view.rego — ADR-0025 ontology-IRI VISIBILITY gate.
  #
  # Engine O's /resolve filters its OntologyClass candidate pool through this
  # BEFORE BAML classifies (select-from-authorized-set: the LLM can't pick a
  # class it was never shown). Deny-by-default; Topaz is the single decider;
  # the git-asserted `ontology_compartments.yaml` overlay INFORMS (via the
  # compartment sync), this policy DECIDES, the gate only ASKS.
  #
  # can_view(caller, IRI) is TRUE iff:
  #   (a) the caller is a `viewer` of the IRI — directly or via membership in
  #       the group that is the IRI's compartment (ds.check on can_view); OR
  #   (b) the IRI is UNASSIGNED (no `restricted` marker) AND the deployment's
  #       default_visibility is "releasable".
  # The DEFAULT_VISIBILITY is a per-deployment POLICY INPUT (resource_context),
  # NOT hardcoded — that is the configurable-default the ruling required:
  #   * demo/unclassified: default_visibility="releasable" → ordinary vocabulary
  #     resolves for everyone; only compartment-assigned (marked) classes gate.
  #   * classified: default_visibility="deny" → rule (b) never fires, so an
  #     UNASSIGNED class is invisible to an ungranted caller (fail-CLOSED). Assign
  #     ALL vocabulary to compartments and the whole ontology is secret — same
  #     manifest + policy, different overlay. forgot-to-classify fails SAFE.
  # Marker discipline: the sync sets `restricted marker:REGISTRY` on every
  # compartment-assigned IRI, so rule (b) applies ONLY to genuinely-unassigned
  # IRIs — never leaking an assigned-but-ungranted (compartmented) class.
  ontology_can_view.rego: |
    package invincible_agent.ontology.can_view

    import future.keywords.if

    default allowed := false

    # (a) explicit compartment grant — caller is a viewer of the IRI (direct
    #     or via the compartment group's membership; manifest can_view = viewer).
    allowed if {
        ds.check({
            "object_type": "ontology_class",
            "object_id": input.resource.iri,
            "relation": "can_view",
            "subject_type": "user",
            "subject_id": input.resource.user_id
        })
    }

    # (b) releasable default — ONLY for IRIs with no `restricted` marker
    #     (genuinely unassigned) AND only when the deployment default is
    #     releasable. Never fires for a compartment-assigned class (marker
    #     present), so a restricted class is never leaked by the default.
    allowed if {
        input.resource.default_visibility == "releasable"
        not ds.check({
            "object_type": "ontology_class",
            "object_id": input.resource.iri,
            "relation": "restricted",
            "subject_type": "marker",
            "subject_id": "REGISTRY"
        })
    }
{{- end }}
