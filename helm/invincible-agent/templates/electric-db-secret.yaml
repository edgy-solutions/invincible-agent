{{- /*
Electric's own database-role password (electric.db.enabled): generated on first install, KEPT on upgrade, by the
same `lookup` block as templates/electric-api-secret.yaml (read its header for the GitOps caveat: with no cluster
`lookup` is empty and the password rotates per render; name a pre-made Secret in electric.db.secret.name instead).
Never in values.yaml, never printed. If Lane 1's shared generate-and-keep helper lands first, switch to it.
*/ -}}
{{- if and .Values.electric.enabled .Values.electric.db.enabled (not .Values.electric.db.secret.name) }}
{{- $name := include "invincible-agent.electricDbSecretName" . }}
{{- $key := include "invincible-agent.electricDbSecretKey" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $live $live.data (hasKey $live.data $key) }}
  {{ $key }}: {{ index $live.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
