{{- /*
  Optional oauth2-proxy sign-in in front of the Dagster webserver. Renders nothing unless
  `dagster.webserver.signIn.enabled`. The chart never creates or carries the client or cookie
  secret: both come from `signIn.existingSecret` by secretKeyRef.
*/ -}}
{{- if .Values.dagster.webserver.signIn.enabled }}
{{- $si := .Values.dagster.webserver.signIn -}}
{{- $ing := .Values.dagster.webserver.ingress -}}
{{- $issuer := $si.issuerUrl | default ((.Values.cortexUi.env | default dict).VITE_KEYCLOAK_REALM_URL) | default (include "invincible-agent.keycloakRealmUrl" .) -}}
{{- if not $si.existingSecret }}{{ fail "dagster.webserver.signIn.existingSecret is required when dagster.webserver.signIn.enabled is true (the chart never creates the secret)" }}{{ end }}
{{- if and (not $si.allowedRoles) (not $si.allowedGroups) }}{{ fail "dagster.webserver.signIn.allowedRoles and dagster.webserver.signIn.allowedGroups are both empty: sign-in alone would admit every realm user to the job launcher; set at least one" }}{{ end }}
{{- if not (hasPrefix "http" $issuer) }}{{ fail "dagster.webserver.signIn.issuerUrl is empty (or not an http(s) URL) and no realm URL could be resolved from cortexUi.env.VITE_KEYCLOAK_REALM_URL or keycloakRealmUrl" }}{{ end }}
{{- if not $ing.enabled }}{{ fail "dagster.webserver.ingress.enabled must be true when dagster.webserver.signIn.enabled is true (the proxy needs the ingress host for its redirect URL)" }}{{ end }}
{{- if not (and $ing.hosts (first $ing.hosts).host) }}{{ fail "dagster.webserver.ingress.hosts needs a first host when dagster.webserver.signIn.enabled is true" }}{{ end }}
{{- $host := (first $ing.hosts).host -}}
{{- $parts := splitList "/" $si.image.repository -}}
{{- $registry := first $parts -}}
{{- $repo := join "/" (rest $parts) -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dagster-signin
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-signin" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-signin" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-signin" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oauth2-proxy
          image: {{ include "invincible-agent.image" (dict "name" "oauth2-proxy" "registry" $registry "repository" $repo "tag" $si.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url={{ $issuer }}
            - --client-id={{ $si.clientId }}
            - --upstream=http://{{ .Release.Name }}-dagster:{{ .Values.dagster.webserver.port }}
            - --http-address=0.0.0.0:{{ $si.port }}
            - --email-domain=*
            - --reverse-proxy=true
            - --cookie-secure=true
            - --skip-provider-button=true
            - --redirect-url=https://{{ $host }}/oauth2/callback
            {{- range $si.allowedRoles }}
            - --allowed-role={{ . }}
            {{- end }}
            {{- range $si.allowedGroups }}
            - --allowed-group={{ . }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $si.existingSecret }}
                  key: {{ $si.clientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $si.existingSecret }}
                  key: {{ $si.cookieSecretKey }}
          ports:
            - name: http
              containerPort: {{ $si.port }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $si.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dagster-signin
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-signin" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ $si.port }}
      targetPort: http
{{- end }}
