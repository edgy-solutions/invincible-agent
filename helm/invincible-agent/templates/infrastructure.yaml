---
{{- if .Values.fuseki.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-fuseki
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "fuseki" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-fuseki
  replicas: 1
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "fuseki" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "fuseki" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fuseki
          image: {{ include "invincible-agent.image" (dict "name" "fuseki" "registry" .Values.fuseki.image.registry "repository" .Values.fuseki.image.repository "tag" .Values.fuseki.image.tag "root" .) }}
          ports:
            - name: http
              containerPort: 3030
          env:
            - name: ADMIN_PASSWORD
              value: "{{ .Values.fuseki.auth.adminPassword }}"
          volumeMounts:
            - name: data
              # PERSIST the TDB2 dataset — NOT /fuseki (the PVC was mounted there but the image's
              # FUSEKI_BASE is /fuseki-base, so /fuseki held nothing and every restart came up EMPTY;
              # a power-loss reboot silently lost the ontology + disposition ruleset -> RULES_NOT_FOUND).
              # The baked assembler is tdb:DatasetTDB at /fuseki-base/databases/tdb, so we persist ONLY
              # /fuseki-base/databases: the graph data survives restarts, while the image-baked
              # configuration/ and the entrypoint-regenerated shiro.ini stay ephemeral (an empty PVC at
              # /fuseki-base would shadow the baked assembler and crash the sed under `set -e`).
              mountPath: /fuseki-base/databases
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.fuseki.persistence.storageClass }}
        storageClassName: {{ .Values.fuseki.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.fuseki.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-fuseki
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "fuseki" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 3030
      targetPort: http
{{- end }}
