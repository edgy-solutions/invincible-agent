{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "postgresql" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "postgresql" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "postgresql" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "invincible-agent.image" (dict "name" "postgres" "registry" .Values.postgresql.image.registry "repository" .Values.postgresql.image.repository "tag" .Values.postgresql.image.tag "root" .) }}
          {{- /*
          Two image styles supported:
            postgres (default) — Docker library postgres image.
              Uses `-c` args for wal_level config, POSTGRES_* env vars
              for auth, PGDATA at /var/lib/postgresql/data/pgdata.
            bitnami — Bitnami postgresql image.
              Ignores command args; reads config from env vars
              (POSTGRESQL_* prefix). Data at /bitnami/postgresql.
              Entrypoint script processes env into postgresql.conf
              before starting the postgres binary.
          Both flavors deliver identical Postgres behavior — the
          template just speaks each image's config protocol.

          Hop 3 (commit 0eda9f7): logical replication for Electric.
          Default postgres image ships wal_level=replica; Electric
          requires logical. max_replication_slots/max_wal_senders
          bumped to 10 for Electric headroom + ad-hoc subscribers.
          INTERIM under Decisions 0+1+3 — Restate+topic successor
          retires the need for these settings; they stay benign.
          */}}
          {{- $style := default "postgres" .Values.postgresql.imageStyle }}
          {{- if eq $style "postgres" }}
          args:
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "max_wal_senders=10"
          {{- end }}
          ports:
            - name: tcp-pg
              containerPort: 5432
          env:
            {{- if eq $style "bitnami" }}
            - name: POSTGRESQL_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRESQL_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRESQL_POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            - name: POSTGRESQL_WAL_LEVEL
              value: "logical"
            - name: POSTGRESQL_MAX_REPLICATION_SLOTS
              value: "10"
            - name: POSTGRESQL_MAX_WAL_SENDERS
              value: "10"
            {{- else }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
          volumeMounts:
            - name: data
              {{- if eq $style "bitnami" }}
              mountPath: /bitnami/postgresql
              {{- else }}
              mountPath: /var/lib/postgresql/data
              {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.auth.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.auth.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.auth.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "postgresql" "root" .) | nindent 4 }}
  ports:
    - name: tcp-pg
      port: 5432
      targetPort: tcp-pg
{{- end }}

---
{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-neo4j
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "neo4j" "root" .) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "neo4j" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "neo4j" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: neo4j
          image: {{ include "invincible-agent.image" (dict "name" "neo4j" "registry" .Values.neo4j.image.registry "repository" .Values.neo4j.image.repository "tag" .Values.neo4j.image.tag "root" .) }}
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: "{{ .Values.neo4j.auth.username }}/{{ .Values.neo4j.auth.password }}"
            - name: NEO4J_PLUGINS
              value: '["apoc", "n10s"]'
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.neo4j.persistence.storageClass }}
        storageClassName: {{ .Values.neo4j.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.neo4j.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-neo4j
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "neo4j" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
{{- end }}

