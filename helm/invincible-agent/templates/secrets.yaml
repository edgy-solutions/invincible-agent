apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  DATAHUB_TOKEN: {{ .Values.secrets.datahubToken | quote }}
  BPMN_POSTGRES_PASSWORD: {{ include "invincible-agent.pgPassword" . | quote }}
  FUSEKI_PASSWORD: {{ .Values.fuseki.auth.adminPassword | quote }}
  {{- /* The extraction->review sensor's service-account client secret. MUST match the
  `secret` on the iagent-review-starter client in the Keycloak realm import (keycloak-configmap.yaml)
  — same value, both sourced from keycloak.reviewStarterClientSecret. The sensor mints a fresh token
  per run via client-credentials (no static JWT to expire). hasKey-guarded for override. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "REVIEW_STARTER_CLIENT_SECRET") }}
  REVIEW_STARTER_CLIENT_SECRET: {{ .Values.keycloak.reviewStarterClientSecret | default "sandbox-review-starter-secret" | quote }}
  {{- end }}
  {{- /* Engine DA's service-account client secret — same contract as the review starter's above:
  MUST match the `secret` on the iagent-data-analyst client in the realm import, both sourced from
  keycloak.dataAnalystClientSecret. The CortexDataClient mints per call via client-credentials
  (CORTEX_CLIENT_ID/CORTEX_CLIENT_SECRET); with neither these nor MESH_DEV_TOKEN present it raises
  "Must provide either jwt_token or M2M credentials" and every DA data fetch fails. Was hand-set in
  sandbox and absent from the chart entirely, so it worked there and could not work on a fresh
  deploy. hasKey-guarded for override. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "CORTEX_CLIENT_SECRET") }}
  CORTEX_CLIENT_SECRET: {{ .Values.keycloak.dataAnalystClientSecret | default "sandbox-data-analyst-secret" | quote }}
  {{- end }}
  {{- /* Supervisor dispatch identity — matches the iagent-supervisor client in the realm
  import, both sourced from keycloak.supervisorClientSecret so they cannot drift. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "SUPERVISOR_CLIENT_SECRET") }}
  SUPERVISOR_CLIENT_SECRET: {{ .Values.keycloak.supervisorClientSecret | default "sandbox-supervisor-secret" | quote }}
  {{- end }}
  
  {{- /* REGISTRATION IDENTITY SECRETS (2026-08-08) — engines D, E, O, W. Each MUST match the
  `secret` on its iagent-<engine> client in the realm import, both sourced from the same
  keycloak.engineXClientSecret value so they cannot drift. The engine mints per registration
  attempt via client-credentials; there is no stored token to expire. hasKey-guarded so a
  deployment can override without editing the chart. */}}
  {{- /* Engine A's registration credential. FOUND MISSING 2026-08-10 by rendering the chart
  rather than trusting the serviceClients list: `svc:engine-a` was declared as a Keycloak client
  (secretRef engineAClientSecret) and reconciled into the realm, but the secret was never
  rendered to ANY env var — so Engine A could not mint as itself, and the identity existed in
  the directory while being unusable by the only process that needed it. Declared-but-unwired,
  which is exactly the class the env audit exists to catch. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_A_CLIENT_SECRET") }}
  ENGINE_A_CLIENT_SECRET: {{ .Values.keycloak.engineAClientSecret | default "sandbox-engine-a-secret" | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_D_CLIENT_SECRET") }}
  ENGINE_D_CLIENT_SECRET: {{ .Values.keycloak.engineDClientSecret | default "sandbox-engine-d-secret" | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_E_CLIENT_SECRET") }}
  ENGINE_E_CLIENT_SECRET: {{ .Values.keycloak.engineEClientSecret | default "sandbox-engine-e-secret" | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_O_CLIENT_SECRET") }}
  ENGINE_O_CLIENT_SECRET: {{ .Values.keycloak.engineOClientSecret | default "sandbox-engine-o-secret" | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_W_CLIENT_SECRET") }}
  ENGINE_W_CLIENT_SECRET: {{ .Values.keycloak.engineWClientSecret | default "sandbox-engine-w-secret" | quote }}
  {{- end }}
  {{- /* engine-p (2026-08-24). ABSENT UNTIL NOW: the client was declared in
  keycloak.serviceClients (secretRef planningAgentClientSecret) and reconciled into the realm,
  but the secret was never PROJECTED here — so the engine had no ENGINE_P_CLIENT_SECRET to mint
  with. Exactly the engine-a gap recorded above, repeated: a client can exist in the realm and
  be unusable by the workload that owns it, and nothing fails at deploy time because minting is
  lazy and OBSERVE tolerates a token-less caller.
  NAME SPLIT, which is why this was missed three times for this engine and only this engine:
  the values key is planningAgentClientSecret (after the IMAGE, planning-agent) while the env
  var is ENGINE_P_CLIENT_SECRET (after the SERVICE, engine-p). Grepping either name finds only
  half the wiring. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_P_CLIENT_SECRET") }}
  ENGINE_P_CLIENT_SECRET: {{ .Values.keycloak.planningAgentClientSecret | default "sandbox-planning-agent-secret" | quote }}
  {{- end }}
  {{- /* engine-fin (2026-08-29). WRITTEN AT THE SAME TIME AS THE CLIENT, not after — this
  exact projection was MISSING for engine-a and then again for engine-p, and both times the
  shape was identical: the client existed in the realm, was reconciled on every upgrade, and
  was UNUSABLE by the only workload that needed it, because the secret reached no env var.
  Nothing fails at deploy time when this is absent: minting is lazy and OBSERVE tolerates a
  token-less caller, so the first symptom is a 401 at registration — or, worse, a
  registration that silently never happens while /health stays green.
  THE NAME SPLIT AGAIN: values key financeAgentClientSecret (after the IMAGE, finance-agent),
  env var ENGINE_FIN_CLIENT_SECRET (after the SERVICE, engine-fin), and main.py names both
  at its own call site because identity is an ARGUMENT. Grepping either name alone finds
  half the wiring. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_FIN_CLIENT_SECRET") }}
  ENGINE_FIN_CLIENT_SECRET: {{ .Values.keycloak.financeAgentClientSecret | default "sandbox-finance-agent-secret" | quote }}
  {{- end }}
  {{- /* engine-cost's registration credential. THIS PROJECTION IS THE EDIT THAT GETS
  MISSED — it was missed twice before, and the failure is a 401 at registration or, worse, a
  registration that silently never happens while /health stays green. The name split again:
  values key costAgentClientSecret (after the IMAGE, cost-agent), env var
  ENGINE_COST_CLIENT_SECRET (after the SERVICE, engine-cost). Grepping either name alone
  finds half the wiring. */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "ENGINE_COST_CLIENT_SECRET") }}
  ENGINE_COST_CLIENT_SECRET: {{ .Values.keycloak.costAgentClientSecret | default "sandbox-cost-agent-secret" | quote }}
  {{- end }}
  # Shared Agent Fleet Secrets
  {{- /* Fleet neo4j password — SINGLE TRUTH from neo4j.auth.password /
  externalNeo4j.password via the (previously dead) neo4jPassword
  helper. Before this, engines read agentFleet.secrets.NEO4J_PASSWORD,
  whose chart default was the literal placeholder "xxxxx" — a second
  truth that silently diverged from what the SERVER booted with
  (neo4j.auth.password): the operator set the server password and the
  fleet kept sending "xxxxx". Override via agentFleet.secrets only for
  split topologies (fleet talks to a different neo4j than the chart
  deploys). */}}
  {{- if not (hasKey (.Values.agentFleet.secrets | default dict) "NEO4J_PASSWORD") }}
  NEO4J_PASSWORD: {{ include "invincible-agent.neo4jPassword" . | quote }}
  {{- end }}
  {{- if .Values.agentFleet.secrets }}
  {{- range $k, $v := .Values.agentFleet.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
