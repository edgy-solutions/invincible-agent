apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  DATAHUB_TOKEN: {{ .Values.secrets.datahubToken | quote }}
  BPMN_POSTGRES_PASSWORD: {{ include "invincible-agent.pgPassword" . | quote }}
  FUSEKI_PASSWORD: {{ .Values.fuseki.auth.adminPassword | quote }}
  
  # Shared Agent Fleet Secrets
  {{- if .Values.agentFleet.secrets }}
  {{- range $k, $v := .Values.agentFleet.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
