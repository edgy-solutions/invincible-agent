{{/*
  Agent Fleet — every engine as a Deployment + Service pair.
  Each engine is conditionally deployed via .enabled.

  ⚠ TWO ENTRIES LOOK LIKE "ENGINE F" AND THEY ARE DIFFERENT SERVICES:
    * `engineFinance` -> component `engine-fin`, image finance-agent, port 8096.
      The FINANCE engine (ADR-0045).
    * `engineF`       -> component `engine-f`,   image presentation-agent, port 8087.
      The PRESENTATION agent, and the target of PRESENTATION_AGENT_SVC_URL.
  ADR-0045 names the finance engine "Engine F" in prose; the component name was already
  taken. Prose names and component names are different registries — runbook §0.

  NOTE ON SYNTAX: the list below is ONE Go template action. `#` is not a comment inside
  `{{ }}`, so per-entry notes go here rather than between the entries.
*/}}

{{- $engines := list
  (dict "key" "engineO" "component" "engine-o" "values" .Values.engineO)
  (dict "key" "engineA" "component" "engine-a" "values" .Values.engineA)
  (dict "key" "engineB" "component" "engine-b" "values" .Values.engineB)
  (dict "key" "engineC" "component" "engine-c" "values" .Values.engineC)
  (dict "key" "engineD" "component" "engine-d" "values" .Values.engineD)
  (dict "key" "enginePlanning" "component" "engine-p" "values" .Values.enginePlanning)
  (dict "key" "engineFinance" "component" "engine-fin" "values" .Values.engineFinance)
  (dict "key" "engineCost" "component" "engine-cost" "values" .Values.engineCost)
  (dict "key" "engineE" "component" "engine-e" "values" .Values.engineE)
  (dict "key" "engineF" "component" "engine-f" "values" .Values.engineF)
  (dict "key" "engineW" "component" "engine-w" "values" .Values.engineW)
  (dict "key" "dataAnalyst" "component" "data-analyst" "values" .Values.dataAnalyst)
  (dict "key" "centralGateway" "component" "central-gateway" "values" .Values.centralGateway)
}}

{{- range $engines }}
{{- $eng := .values }}
{{- if $eng.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .component }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" .component "root" $) | nindent 4 }}
spec:
  replicas: {{ $eng.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" .component "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" $ | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" .component "root" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .component }}
          image: {{ include "invincible-agent.image" (dict "name" $eng.image.name "repository" $eng.image.repository "tag" $eng.image.tag "root" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $eng.port }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
            - secretRef:
                name: {{ $.Release.Name }}-secrets
          {{- if $eng.env }}
          env:
            {{- range $k, $v := $eng.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $eng.resources | nindent 12 }}
          # Probes tuned for engines whose first /analyze (or equivalent)
          # triggers a heavy lazy init: smolagents + mem0 + Weaviate gRPC
          # warmup is now off the event loop (see utils.mem0_utils singleton),
          # but the warmup itself still takes 5-30s on a worker thread.
          # Probe timing must give that headroom without masking real hangs.
          #
          # - Readiness uses /health (cheap, always async) so it stays green
          #   while warmup runs on a thread. timeoutSeconds=10 + failureThreshold=6
          #   gives ~60s grace if anything else stalls the loop.
          # - Liveness uses a TCP probe to avoid re-killing the pod for a slow
          #   /health response during a transient loop hiccup; only a true port
          #   loss restarts the container.
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 5
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .component }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" .component "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ $eng.port }}
      targetPort: http
{{- end }}
{{- end }}
