{{- if .Values.electric.enabled }}
# iagent-electric — Hop 3 of the projector build plan
# (docs/plans/projector-build-plan.md commit 0eda9f7 §4 Hop 3 Part 2).
#
# Electric is the CDC-from-Postgres server that delivers the
# `answer_artifact_projection` rows to the cortex-ui client over a
# long-lived shape subscription. It is the read-side path of the
# CQRS pair ADR-0023 names; the projector writes Postgres, Electric
# propagates to the client, the canvas store hydrates from the
# subscription.
#
# INTERIM under Decisions 0+1+3 per
# [[coupled-interim-mechanisms-retire-together]] — Electric is the
# THIRD leg of the trio (poll loop + watermark column + Electric
# subscription) that retires together under the Restate+topic
# successor. When that lands, the topic offset becomes the position
# and the cortex-ui client consumes the topic directly (or via a
# successor read-side); Electric exits with the same flip.
#
# Lifecycle independence rationale (Decision 4 §3.4): Electric has
# its own release cadence and image; bundling its lifecycle with the
# projector means upgrading Electric requires re-rolling the
# projector and vice versa. Distinct Deployment.
#
# Postgres prerequisite: wal_level=logical, max_replication_slots>=10,
# max_wal_senders>=10 (see infrastructure.yaml's Postgres args block).
# Without logical replication on Postgres, Electric will fail to
# create its replication slot on startup. Per
# [[feedback-baseline-regression-gate]], the postgres args are part
# of this hop's chart changes — not "fix it later".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-electric
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "electric" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.electric.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "electric" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "electric" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 2026-07-01: init container ensures the DB role Electric connects
      # with has the REPLICATION attribute needed to create logical
      # replication slots. The official `postgres` image happens to make
      # POSTGRES_USER a superuser (implicit REPLICATION), so this init
      # is redundant there. Bitnami's POSTGRESQL_USERNAME creates a
      # NON-superuser role — Electric crashes with "insufficient_privilege
      # to start WAL sender" on first boot until the role is granted.
      # `ALTER ROLE ... WITH REPLICATION` is idempotent (already-set is a
      # no-op), so this init runs safely on every pod restart across
      # both image styles.
      initContainers:
        - name: grant-replication
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: TARGET_ROLE
              value: {{ include "invincible-agent.pgUser" . }}
            {{- if eq (default "postgres" .Values.postgresql.imageStyle) "bitnami" }}
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            {{- else }}
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres at $PGHOST:$PGPORT..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres -d "$PGDATABASE"; do
                sleep 2
              done
              echo "Granting REPLICATION to $TARGET_ROLE (idempotent)..."
              psql -v ON_ERROR_STOP=1 -c "ALTER ROLE \"$TARGET_ROLE\" WITH REPLICATION;"
              echo "OK."
      containers:
        - name: electric
          image: {{ include "invincible-agent.image" (dict "name" "electric" "registry" .Values.electric.image.registry "repository" .Values.electric.image.repository "tag" .Values.electric.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.electric.port }}
          env:
            # Electric reads from Postgres via its connection URL. We
            # reuse the iagent-postgresql instance (Decision 2's wide
            # table lives there; Electric just subscribes).
            #
            # The DATABASE_URL secret form: uses the iagent role and
            # password. Electric creates its logical replication slot
            # ('electric_slot_*' prefix) on startup; the role needs the
            # REPLICATION attribute. For the official `postgres` image
            # POSTGRES_USER becomes a superuser (REPLICATION implicit).
            # For Bitnami, POSTGRESQL_USERNAME is NOT a superuser — the
            # `grant-replication` initContainer above grants REPLICATION
            # on every pod boot as an idempotent ALTER ROLE.
            - name: DATABASE_URL
              value: "postgresql://$(BPMN_POSTGRES_USER):$(BPMN_POSTGRES_PASSWORD)@$(BPMN_POSTGRES_HOST):$(BPMN_POSTGRES_PORT)/$(BPMN_POSTGRES_DB)?sslmode=disable"
            # Disable insecure mode in prod; sandbox/dev can flip on.
            - name: ELECTRIC_INSECURE
              value: {{ .Values.electric.insecure | quote }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          resources:
            {{- toYaml .Values.electric.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            # PROBE BUDGET, made explicit 2026-08-22. Was UNSET, so it inherited
            # Kubernetes' defaults: timeoutSeconds 1, failureThreshold 3. Nobody chose
            # one second — nobody chose anything, and the default is the one value that
            # asks a single-threaded event loop to answer inside a tick.
            #
            # cortex-bff was SIGKILLed by exactly this (exit 137, Reason: Error, kubelet
            # "Liveness probe failed x4 over 105m: context deadline exceeded") while
            # proxying Electric shapes. It was killed FOR BEING BUSY, and it died without
            # writing a reason — the last log lines are ordinary 200s.
            #
            # templates/engines.yaml solved this already, and says why: liveness there is a
            # TCP probe so "only a true port loss restarts the container". These services
            # keep an HTTP liveness check (their /health is meaningful), so they get the
            # other half of the same idea: a budget that survives a busy loop.
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-electric
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "electric" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.electric.port }}
      targetPort: http
{{- end }}
