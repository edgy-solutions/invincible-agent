{{- if .Values.projector.enabled }}
# iagent-projector — Hop 2 of the projector build plan.
#
# Decision 4 (PERMANENT per docs/plans/projector-build-plan.md commit
# 0eda9f7 §3.4): the projector runs as its OWN Deployment with its own
# lifecycle independent of cortex-bff. The Deployment shape mirrors
# cortex-bff's (single replica, env-driven config, no PVC — projector
# state lives in Postgres). The actual apply LOOP is INTERIM under
# Decision 1 + Decision 3 (Option C) per
# [[coupled-interim-mechanisms-retire-together]] — when the
# Restate+topic successor lands, the projector becomes a topic consumer
# and the polling code in iagent.projector.apply_loop dies.
#
# Migration: sql/create_answer_artifact_projection.sql is applied by
# the db-init post-install/post-upgrade helm hook (jobs.yaml), NOT by
# the projector itself. The projector reads projector_cursor.WHERE id=1
# on startup and hard-fails if the row is missing — the honest error
# preserves per [[verify-subtle-acceptance-by-inspection]] (silent
# default-to-0 would hide a missing migration). CREATE TABLE IF NOT
# EXISTS makes the hook's re-runs safe. Previous versions of this
# comment claimed the projector applied the migration itself — it
# never did; latent gap surfaced by fresh Bitnami work-cluster deploy
# 2026-07-01.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-projector
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "projector" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.projector.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "projector" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "projector" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: projector
          image: {{ include "invincible-agent.image" (dict "name" .Values.projector.image.name "repository" .Values.projector.image.repository "tag" .Values.projector.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # cortex-bff and projector ship in the same image (both pull
          # from src/iagent/). The projector's entry point is the module
          # invocation `python -m iagent.projector` — the same module
          # FastAPI app, running uvicorn on PROJECTOR_PORT.
          command: ["python", "-m", "iagent.projector"]
          ports:
            - name: http
              containerPort: {{ .Values.projector.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: PROJECTOR_PORT
              value: {{ .Values.projector.port | quote }}
            - name: PROJECTOR_HOST
              value: "0.0.0.0"
            - name: PROJECTOR_POLL_INTERVAL_SECONDS
              value: {{ .Values.projector.pollIntervalSeconds | quote }}
            - name: PROJECTOR_BATCH_LIMIT
              value: {{ .Values.projector.batchLimit | quote }}
            # PROJECTOR_POSTGRES_DSN: same iagent postgres as Dagster
            # uses (Decision 2's wide-table-with-discriminator lives in
            # the same DB; no isolated projector DB at Hop 2). The DSN
            # template uses the configmap's BPMN_POSTGRES_* and the
            # secret's BPMN_POSTGRES_PASSWORD — keeps the secret in
            # one place per [[fewer-permission-prompts]] discipline.
            - name: PROJECTOR_POSTGRES_DSN
              value: "postgresql://$(BPMN_POSTGRES_USER):$(BPMN_POSTGRES_PASSWORD)@$(BPMN_POSTGRES_HOST):$(BPMN_POSTGRES_PORT)/$(BPMN_POSTGRES_DB)"
            {{- if .Values.projector.env }}
            {{- range $k, $v := .Values.projector.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.projector.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            # Decision 4 (Option C revised, per
            # [[liveness-probe-watches-advance-not-just-correctness]]):
            # the kubelet probe hits /health which is a cheap shape-check.
            # The STRUCTURAL liveness signal — apply loop ADVANCING —
            # is GET /projector/watermark, which the probe SUITE checks
            # (twice with a write between) at Hop 2's closure. A future
            # operator-side probe could query /projector/watermark and
            # compare against an expected freshness; that's deferred.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-projector
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "projector" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.projector.port }}
      targetPort: http
{{- end }}
