{{- if .Values.primeSubstrate.enabled }}
# ============================================================================
# prime-substrate Job — Helm-managed canonical-pipeline bootstrap.
#
# Runs `setup/prime_databases.py` as a post-install / post-upgrade Helm hook
# inside the dagster-server image (the script + canonical TTL list + python
# deps are all baked in). Inherits the cluster's {{ .Release.Name }}-config
# ConfigMap and {{ .Release.Name }}-secrets so the script connects to
# whatever Neo4j / Weaviate / Jena / MinIO endpoints the chart declares —
# internal services for sandbox, external services for clusters that BYO
# their own stores.
#
# Gate: this Job only renders when `primeSubstrate.enabled=true`. The
# script's own --i-mean-it + --namespace guards still apply to wipe.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-prime-substrate
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "prime-substrate" "root" .) | nindent 4 }}
  annotations:
    # Helm hook: fires on initial install AND every subsequent upgrade
    # (when enabled=true). For "prime once" semantics, the operator sets
    # enabled=true for the install/upgrade that should prime, then flips
    # back to false for routine upgrades.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.primeSubstrate.hook.weight | quote }}
    # before-hook-creation: any previous prime-substrate Job (succeeded or
    # failed) is deleted before this hook runs. Re-runs don't accumulate
    # stale Jobs in the namespace; a failed prior attempt doesn't block
    # the next try.
    "helm.sh/hook-delete-policy": {{ .Values.primeSubstrate.hook.deletePolicy | quote }}
spec:
  # Don't restart on failure — the operator should investigate before
  # re-running. If the failure is transient (e.g., dagster webserver
  # not yet ready), the operator re-runs `helm upgrade` to re-fire the hook.
  backoffLimit: 0
  # Job lingers for 1 hour after completion so logs are inspectable. After
  # that, k8s reaps it. before-hook-creation on the next run also reaps it.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "prime-substrate" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Job pods don't restart on container exit; failure is reported to
      # the Job, which then either retries (backoffLimit > 0) or fails
      # outright (our backoffLimit: 0).
      restartPolicy: Never
      # ----------------------------------------------------------------
      # Readiness gate: wait until every prerequisite is actually
      # accepting traffic before the prime script runs.
      #
      # The post-install/post-upgrade hook fires once resources have
      # been APPLIED, not when their PODS are READY. If Neo4j / Jena /
      # MinIO / Dagster aren't fully up yet, the prime script's first
      # connection attempt can succeed-on-port-open but fail at the
      # application layer — and Neo4j in particular has a 5s lockout
      # after repeated bad-auth attempts (Neo.ClientError.Security.
      # AuthenticationRateLimit), so a script-internal retry loop can
      # outlast the init for ONE phase and not the next (observed at
      # work-cluster prime 2026-06-18: wipe failed rate-limited, prime
      # phase ~10s later succeeded with same creds).
      #
      # Probes are TCP-only (raw socket, never goes through HTTP_PROXY)
      # PLUS a Neo4j auth-loop that exits only when the configured
      # password is accepted. Image is the same dagster-control-plane
      # used by the main container — neo4j-python is already in its
      # venv, no extra image to mirror.
      # ----------------------------------------------------------------
      initContainers:
        - name: wait-for-prereqs
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.primeSubstrate.image.registry "repository" .Values.primeSubstrate.image.repository "tag" .Values.primeSubstrate.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.primeSubstrate.image.pullPolicy }}
          workingDir: /app
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: NEO4J_USERNAME
                  optional: true
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import os, time, socket
              from urllib.parse import urlparse

              def wait_tcp(name, host, port, timeout=300):
                  start = time.time()
                  while time.time() - start < timeout:
                      try:
                          with socket.create_connection((host, port), timeout=3):
                              print(f"[ready] {name} TCP {host}:{port}", flush=True)
                              return
                      except (OSError, socket.timeout):
                          pass
                      time.sleep(2)
                  raise TimeoutError(f"{name} not ready at {host}:{port} after {timeout}s")

              def parse_host_port(url, default_port):
                  p = urlparse(url)
                  return (p.hostname, p.port or default_port)

              checks = [
                  ("Neo4j", os.environ.get("NEO4J_URI"), 7687),
                  ("Jena", os.environ.get("JENA_URL") or os.environ.get("JENA_SPARQL_ENDPOINT"), 3030),
                  ("MinIO", os.environ.get("MINIO_ENDPOINT_URL") or os.environ.get("S3_ENDPOINT_URL"), 9000),
                  ("Dagster", os.environ.get("DAGSTER_URL") or os.environ.get("DAGSTER_HOST"), 80),
              ]
              for name, url, default_port in checks:
                  if not url:
                      print(f"[skip] {name}: no URL configured", flush=True)
                      continue
                  host, port = parse_host_port(url, default_port)
                  if not host:
                      print(f"[skip] {name}: unparseable URL {url!r}", flush=True)
                      continue
                  wait_tcp(name, host, port)

              # Extra: Neo4j auth probe — the prime wipe phase otherwise
              # hits AuthenticationRateLimit when neo4j's password setup
              # is racing the script. Loop until the configured password
              # is accepted; sleeps between attempts are >> neo4j's
              # rate-limit window (typ. 5s) so we don't accumulate
              # towards the lockout threshold.
              if os.environ.get("NEO4J_URI"):
                  from neo4j import GraphDatabase
                  print("[probe] Neo4j auth", flush=True)
                  user = os.environ.get("NEO4J_USERNAME") or os.environ.get("NEO4J_USER", "neo4j")
                  pw = os.environ.get("NEO4J_PASSWORD", "")
                  for attempt in range(60):
                      try:
                          d = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=(user, pw))
                          with d.session() as s:
                              s.run("RETURN 1").single()
                          d.close()
                          print("[ready] Neo4j auth", flush=True)
                          break
                      except Exception as e:
                          # Don't print full stack; just the error class so
                          # we don't leak passwords into logs.
                          print(f"[wait] Neo4j auth attempt {attempt+1}: {type(e).__name__}", flush=True)
                          time.sleep(6)  # > neo4j's 5s rate-limit window
                  else:
                      raise RuntimeError("Neo4j never accepted configured password")

              print("[OK] all prerequisites ready", flush=True)
      containers:
        - name: prime-substrate
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.primeSubstrate.image.registry "repository" .Values.primeSubstrate.image.repository "tag" .Values.primeSubstrate.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.primeSubstrate.image.pullPolicy }}
          # The dagster-control-plane image WORKDIR is /app and has the
          # full invincible-agent repo COPY'd in (it's the same image
          # the dagster-user-code Deployment runs, picked for source-
          # availability + uv-synced venv). Run the script from there.
          workingDir: /app
          command:
            - python
            - setup/prime_databases.py
          args:
            {{- if .Values.primeSubstrate.wipe }}
            # Default --wipe clears ONLY the reproducible routing substrate
            # (Neo4j OntologyClass + its edges, every Weaviate collection,
            # the Jena graphs, the MinIO TTLs) and PRESERVES answer-durability
            # data (AnswerArtifact/Actor/Source/WatermarkSequence) + the
            # Postgres projections — so a routine wipe+reprime can NOT strand
            # the projector's watermark cursor or delete answer history. The
            # script's --i-mean-it gate is honored; --namespace=<release-ns>
            # prevents a typo from wiping the wrong cluster.
            - "--wipe"
            - "--i-mean-it"
            - "--namespace={{ .Release.Namespace }}"
            {{- if .Values.primeSubstrate.nuclear }}
            # NUCLEAR — the strongest wipe. ALSO deletes the answer-durability
            # graph AND resets the Postgres projection stores
            # (answer_artifact_projection / human_task_projection truncated,
            # projector_cursor rewound to 0) together with the Neo4j source,
            # so scorched-earth still leaves a consistent state, never a
            # stranded cursor. Destroys answer history. Needs
            # PROJECTOR_POSTGRES_DSN (wired in env below).
            - "--nuclear"
            {{- end }}
            {{- end }}
            {{- if .Values.primeSubstrate.triggerIngest }}
            # Fire the dagster ingest_ontology_job per partition once
            # the canonical TTLs have been uploaded. Without this, only
            # the upload happens; ingestion waits for the dagster
            # sensor or a manual UI trigger.
            - "--trigger-ingest"
            {{- if .Values.primeSubstrate.waitForIngest }}
            # Makes "Prime complete" mean the ingest FINISHED, not that runs
            # were enqueued. The hook weights order the JOBS; without this the
            # async ingest escapes that ordering and reregister(20) runs against
            # a class graph that is still filling.
            - "--wait-for-ingest"
            - "--ingest-timeout={{ .Values.primeSubstrate.ingestTimeout }}"
            {{- end }}
            {{- end }}
          # Pull cluster-wide config (Neo4j/Weaviate/Jena URLs) from the
          # ConfigMap. The same ConfigMap engines envFrom so the priming
          # Job automatically targets the same backends — whether
          # internal or external (BYO Neo4j/Weaviate/Jena scenario).
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            # ------------------------------------------------------------
            # Env-var name bridges. The chart's ConfigMap publishes some
            # values under names the script doesn't read by default;
            # rewrite them here so the script picks them up. This keeps
            # the ConfigMap aligned with what engines expect (the
            # engineering convention) and avoids changing the script's
            # CLI surface.
            # ------------------------------------------------------------
            # JENA_URL: the script wants the BASE URL of the Fuseki server
            # (e.g., http://fuseki:3030). The ConfigMap publishes
            # JENA_SPARQL_ENDPOINT which is the full query URL
            # (.../ds/query) — strip the dataset path.
            - name: JENA_URL
              value: "{{ include "invincible-agent.fusekiUrl" . }}"
            # S3_ENDPOINT_URL / AWS_*: the canonical pipeline talks to
            # MinIO via S3-compatible API. ConfigMap/values use the
            # MINIO_* names; the script + dagster use AWS_* + S3_*
            # names. Bridge them here. The fallback keys make this safe
            # even when MinIO env vars aren't declared in values (chart
            # falls through to the script's defaults).
            - name: S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MINIO_ENDPOINT_URL
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MINIO_ACCESS_KEY
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MINIO_SECRET_KEY
                  optional: true
            # ONTOLOGY_BUCKET: where canonical TTLs go in MinIO. Defaults
            # to "ontologies" in the script; override here if your bucket
            # naming differs.
            - name: ONTOLOGY_BUCKET
              value: "ontologies"
            # DAGSTER_URL / DAGSTER_HOST: --trigger-ingest hits dagster's
            # GraphQL to launch ingest_ontology_job. Use the in-cluster
            # webserver endpoint. We publish under BOTH names because the
            # script accepts either (DAGSTER_URL is the historical name;
            # DAGSTER_HOST matches the engineering convention used by
            # other fleet services). Older script versions in stale images
            # only read DAGSTER_URL; newer ones (>=c26d033) read both.
            #
            # FQDN form is intentional. Bare release-name service names
            # (e.g. "invincible-agent-dagster-webserver") don't match a
            # NO_PROXY entry of ".svc" or ".svc.cluster.local" — they
            # have no trailing dot for suffix matching. The corporate
            # proxy then intercepts the in-cluster call and 502s the
            # whole --trigger-ingest pass (observed at work-cluster
            # prime 2026-06-18). The full FQDN form matches .svc.
            # .cluster.local suffix correctly, so operators only need
            # ".svc.cluster.local" in their NO_PROXY — not every
            # release-name-prefixed service name.
            - name: DAGSTER_URL
              value: "{{ include "invincible-agent.dagsterUrl" . }}"
            - name: DAGSTER_HOST
              value: "{{ include "invincible-agent.dagsterUrl" . }}"
            # NEO4J_USER alias: the script reads NEO4J_USERNAME (from
            # ConfigMap) AND falls back to NEO4J_USER. Both work; this
            # alias is defensive against older script versions in old
            # images.
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: NEO4J_USERNAME
                  optional: true
            # PROJECTOR_POSTGRES_DSN: consumed ONLY by a --nuclear wipe, to
            # reset the Electric-replicated projection tables + projector
            # cursor together with the Neo4j source (otherwise a nuclear
            # leaves the cursor stranded above the reset watermark sequence).
            # Same DSN template the projector Deployment uses; the $(VAR) refs
            # resolve from the BPMN_POSTGRES_* config + BPMN_POSTGRES_PASSWORD
            # secret this Job already envFrom's. Harmless on a non-nuclear run
            # — the script only reads it under --nuclear.
            - name: PROJECTOR_POSTGRES_DSN
              value: "postgresql://$(BPMN_POSTGRES_USER):$(BPMN_POSTGRES_PASSWORD)@$(BPMN_POSTGRES_HOST):$(BPMN_POSTGRES_PORT)/$(BPMN_POSTGRES_DB)"
            {{- if .Values.primeSubstrate.namespaceAllowlist }}
            # PRIME_NAMESPACE_ALLOWLIST: comma-separated cluster identifiers
            # the script will allow `--wipe --namespace=` against. Only
            # consulted when primeSubstrate.wipe=true. Required for clusters
            # whose namespace name isn't in the default {sandbox,work,local}
            # set (e.g. app-cluster).
            - name: PRIME_NAMESPACE_ALLOWLIST
              value: {{ .Values.primeSubstrate.namespaceAllowlist | quote }}
            {{- end }}
            {{- if .Values.primeSubstrate.caBundle.enabled }}
            # CA bundle for corporate-proxy TLS MITM. The bundle is
            # mounted from a Secret operators create out-of-band (chart
            # doesn't manage the bytes). Setting all three env vars below
            # covers requests / boto3 / weaviate-client (REQUESTS_CA_BUNDLE),
            # the python ssl module + httpx default + most other libs
            # (SSL_CERT_FILE), and curl (CURL_CA_BUNDLE). The mounted file
            # is treated as the FULL trust set — operators who want to
            # ALSO trust the system roots should concatenate the system
            # bundle into the file BEFORE creating the Secret.
            - name: REQUESTS_CA_BUNDLE
              value: "{{ .Values.primeSubstrate.caBundle.mountPath }}/{{ .Values.primeSubstrate.caBundle.secretKey }}"
            - name: SSL_CERT_FILE
              value: "{{ .Values.primeSubstrate.caBundle.mountPath }}/{{ .Values.primeSubstrate.caBundle.secretKey }}"
            - name: CURL_CA_BUNDLE
              value: "{{ .Values.primeSubstrate.caBundle.mountPath }}/{{ .Values.primeSubstrate.caBundle.secretKey }}"
            {{- end }}
            # ------------------------------------------------------------
            # Operator-supplied prime-only env. Iterated AFTER the
            # hardcoded bridges above so any name collision (e.g. operator
            # sets DAGSTER_HOST) wins. Use for:
            #   - corporate proxy that engines DON'T need (HTTP_PROXY /
            #     HTTPS_PROXY / NO_PROXY) — the prime script reaches out
            #     for external TTLs, engines do not.
            #   - one-shot overrides for a manual re-prime (e.g. pin
            #     ONTOLOGY_BUCKET to a side-bucket).
            #   - certificate bundle paths for self-signed TLS proxies.
            # Keys go on the prime container ONLY — agentFleet.env is for
            # everything that needs the value cluster-wide.
            # ------------------------------------------------------------
            {{- range $k, $v := .Values.primeSubstrate.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.primeSubstrate.caBundle.enabled }}
          volumeMounts:
            - name: ca-bundle
              mountPath: {{ .Values.primeSubstrate.caBundle.mountPath }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.primeSubstrate.resources | nindent 12 }}
      {{- if .Values.primeSubstrate.caBundle.enabled }}
      volumes:
        - name: ca-bundle
          secret:
            secretName: {{ .Values.primeSubstrate.caBundle.existingSecret }}
            items:
              - key: {{ .Values.primeSubstrate.caBundle.secretKey }}
                path: {{ .Values.primeSubstrate.caBundle.secretKey }}
      {{- end }}
{{- end }}
