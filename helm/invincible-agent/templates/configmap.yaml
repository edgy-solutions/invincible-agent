apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  # PostgreSQL — shared by Dagster, LangGraph, BPMN factory
  BPMN_POSTGRES_HOST: {{ include "invincible-agent.pgHost" . | quote }}
  BPMN_POSTGRES_PORT: {{ include "invincible-agent.pgPort" . | quote }}
  BPMN_POSTGRES_DB: {{ include "invincible-agent.pgDatabase" . | quote }}
  BPMN_POSTGRES_USER: {{ include "invincible-agent.pgUser" . | quote }}

  # Agent HTTP timeout
  AGENT_HTTP_TIMEOUT: "300"

  # LangGraph checkpointer
  LANGGRAPH_POSTGRES_URI: {{ include "invincible-agent.pgUri" . | quote }}

  # Infrastructure URLs
  RESTATE_INGRESS_URL: {{ include "invincible-agent.restateIngressUrl" . | quote }}
  CENTRAL_GATEWAY_URL: "http://{{ .Release.Name }}-central-gateway{{ include "invincible-agent.svcDomain" . }}:{{ .Values.centralGateway.port }}"
  {{- if .Values.topaz.enabled }}
  # ADR-0026 step 3: cortex-bff enriches the User model with a
  # (persona, domain) entitlement matrix from topaz. Directory HTTP
  # gateway is on port 9393. Setting this env in the shared config
  # (not per-consumer) so any component that decides to consult
  # entitlements gets the same URL. External-topaz override:
  # `externalTopaz.grpcUrl` is a separate value for the authorizer
  # port; for now we assume bundled topaz.
  TOPAZ_DIRECTORY_URL: "http://topaz-svc:9393"
  {{- else if .Values.externalTopaz.url }}
  # Operator-supplied external topaz — expect the base HTTP URL that
  # serves /api/v3/directory/*.
  TOPAZ_DIRECTORY_URL: {{ .Values.externalTopaz.url | quote }}
  {{- end }}
  {{- /* Neo4j client wiring — SINGLE TRUTH via the helpers (which read
  neo4j.auth.* or externalNeo4j.*). agentFleet.env may override any of
  these for split topologies; the hasKey guards keep the rendered CM
  free of DUPLICATE KEYS (previously NEO4J_URI appeared twice — helper
  line + a stale agentFleet.env default "bolt://neo4j" — and last-wins
  pointed a fresh deploy at a hostname that doesn't exist; sandbox
  survived only because its overlay overrode the stale default to the
  correct value). NEO4J_USER is a spelling alias: most of the fleet
  reads NEO4J_USERNAME, ontology_service prefers NEO4J_USER. */}}
  {{- if not (hasKey (.Values.agentFleet.env | default dict) "NEO4J_URI") }}
  NEO4J_URI: {{ include "invincible-agent.neo4jUri" . | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.env | default dict) "NEO4J_USERNAME") }}
  NEO4J_USERNAME: {{ include "invincible-agent.neo4jUsername" . | quote }}
  {{- end }}
  {{- if not (hasKey (.Values.agentFleet.env | default dict) "NEO4J_USER") }}
  NEO4J_USER: {{ include "invincible-agent.neo4jUsername" . | quote }}
  {{- end }}
  WEAVIATE_HTTP_HOST: "{{ .Release.Name }}-weaviate:8080"
  WEAVIATE_GRPC_HOST: "{{ .Release.Name }}-weaviate-grpc:50051"
  JENA_SPARQL_ENDPOINT: "{{ include "invincible-agent.fusekiUrl" . }}/ds/query"
  DATABASE_URL: {{ include "invincible-agent.pgUri" . | replace "postgresql://" "postgresql+asyncpg://" | quote }}

  # Engine service URLs (Internal K8s DNS)
  ONTOLOGY_SERVICE_URL: "http://{{ .Release.Name }}-engine-o{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineO.port }}"
  RESTATE_ANALYST_URL: "http://{{ .Release.Name }}-engine-a{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineA.port }}"
  LANGGRAPH_SUPPORT_SVC_URL: "http://{{ .Release.Name }}-engine-b{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineB.port }}"
  SWARMS_SCRAPER_URL: "http://{{ .Release.Name }}-engine-c{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineC.port }}"
  DATAHUB_WRAPPER_URL: "http://{{ .Release.Name }}-engine-d{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineD.port }}"
  NEO4J_EXPERT_SVC_URL: "http://{{ .Release.Name }}-engine-e{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineE.port }}"
  PRESENTATION_AGENT_SVC_URL: "http://{{ .Release.Name }}-engine-f{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineF.port }}"
  WEAVIATE_EXPERT_SVC_URL: "http://{{ .Release.Name }}-engine-w{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineW.port }}"

  # ------------------------------------------------------------------
  # Engine SELF-ADVERTISEMENT URLs — the endpoint each engine bakes into
  # its OWN verb registration ("here is where to reach me"). These are a
  # DISTINCT set of env-var names from the *_SVC_URL / *_URL vars above
  # (which are how OTHER services reach each engine): the engines read
  # ENGINE_*_PUBLIC_URL / DATAHUB_WRAPPER_SVC_URL / ENGINE_E_RESOLVE_*_URL
  # and, when UNSET, default to hardcoded SANDBOX names (http://iagent-
  # engine-*). At a non-`iagent` release (e.g. work's `invincible-agent`)
  # those defaults are UNRESOLVABLE, so every registered verb / resolve-
  # instance provider endpoint points at a host that doesn't exist
  # (`Name or service not known`) — routing resolves the subject and
  # finds the verb, then can't call it. Set them release-aware here so a
  # fresh deploy registers reachable endpoints. (After changing these,
  # rollout-restart the engines so they RE-register with the new URLs —
  # the old sandbox-named endpoints are baked into existing Neo4j edges /
  # Weaviate rows until re-registration overwrites them.)
  ENGINE_A_PUBLIC_URL: "http://{{ .Release.Name }}-engine-a{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineA.port }}/analyze"
  DATAHUB_WRAPPER_SVC_URL: "http://{{ .Release.Name }}-engine-d{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineD.port }}"
  ENGINE_E_PUBLIC_URL: "http://{{ .Release.Name }}-engine-e{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineE.port }}/query_graph"
  ENGINE_E_RESOLVE_INSTANCE_URL: "http://{{ .Release.Name }}-engine-e{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineE.port }}/resolve_instance"
  ENGINE_E_RESOLVE_DMC_URL: "http://{{ .Release.Name }}-engine-e{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineE.port }}/resolve_dmc"
  ENGINE_W_PUBLIC_URL: "http://{{ .Release.Name }}-engine-w{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineW.port }}/query_knowledge"
  ENGINE_DA_PUBLIC_URL: "http://{{ .Release.Name }}-data-analyst{{ include "invincible-agent.svcDomain" . }}:{{ .Values.dataAnalyst.port }}/analyze_data"

  # Dagster Discovery
  # DAGSTER_WEBSERVER_URL: consumed by cortex-bff and src/iagent/gateway.py
  # (DAGSTER_URL / DAGSTER_HOST is the equivalent for the prime job).
  # Helper-driven so the value tracks dagster.webserver.enabled (bundled)
  # vs externalDagster.url (BYO Dagster) cleanly, AND the bundled form
  # is the FQDN so a NO_PROXY entry of ".svc.cluster.local" suffix-
  # matches it under corporate proxies.
  DAGSTER_WEBSERVER_URL: {{ include "invincible-agent.dagsterUrl" . | quote }}
  DAGSTER_LOCATION: "iagent"
  DAGSTER_REPOSITORY: "__repository__"

  # legacy/compat
  ONTOLOGY_RESOLVE_URL: "http://{{ .Release.Name }}-engine-o{{ include "invincible-agent.svcDomain" . }}:{{ .Values.engineO.port }}/resolve"
  # DATAHUB_GMS_URL is provided via the agentFleet.env loop below — sourcing it
  # here from engineD.env.DATAHUB_GMS_URL was a duplicate source-of-truth that
  # would shadow operator overrides. Use agentFleet.env to set the cluster URL.
  SWARMS_MODEL: {{ .Values.engineC.env.SWARMS_MODEL | quote }}
  KEYCLOAK_REALM_URL: "http://{{ .Release.Name }}-keycloak{{ include "invincible-agent.svcDomain" . }}:8080/realms/{{ .Values.keycloak.realm }}"

  # Shared Agent Fleet Configs
  {{- if .Values.agentFleet.env }}
  {{- range $k, $v := .Values.agentFleet.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- /* Registrar auto-wiring — enabling the mesh-registrar DEPLOYMENT
  must also point the fleet AT it, or the gateway runs idle while every
  engine silently takes the legacy direct-GMS fallback (the two-truths
  trap seen live at work-deploy: meshRegistrar.enabled=true, container
  running, zero traffic — engines register per-pod based on THIS env
  var, not on the deployment existing). An explicit agentFleet.env
  value always wins; sandbox historically carried this key only in
  hand-supplied release values, which is exactly the committed-vs-
  deployed drift this default retires. */}}
  {{- if and .Values.meshRegistrar.enabled (not (hasKey (.Values.agentFleet.env | default dict) "MESH_REGISTRAR_URL")) }}
  MESH_REGISTRAR_URL: "http://{{ .Release.Name }}-mesh-registrar:8090"
  {{- end }}
{{- if .Values.postgresql.enabled }}
---
# InitDB ConfigMap — runs sql/create_bpmn_catalog.sql on first boot
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-initdb
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  create_bpmn_catalog.sql: |
    -- Auto-loaded by PostgreSQL initdb on first startup
    CREATE TABLE IF NOT EXISTS bpmn_catalog (
        id             SERIAL PRIMARY KEY,
        workflow_id    TEXT UNIQUE NOT NULL,
        name           TEXT NOT NULL DEFAULT '',
        bpmn_payload   JSONB NOT NULL DEFAULT '{}',
        is_active      BOOLEAN NOT NULL DEFAULT TRUE,
        created_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_bpmn_catalog_active
      ON bpmn_catalog (workflow_id)
      WHERE is_active = TRUE;

    CREATE OR REPLACE FUNCTION update_bpmn_catalog_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_bpmn_catalog_updated_at ON bpmn_catalog;
    CREATE TRIGGER trg_bpmn_catalog_updated_at
        BEFORE UPDATE ON bpmn_catalog
        FOR EACH ROW
        EXECUTE FUNCTION update_bpmn_catalog_updated_at();
{{- end }}
