apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-restate-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-restate-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Waiting for Restate Admin at {{ $restateAdmin }}..."
              until curl -sf {{ $restateAdmin }}/health; do sleep 2; done
              
              {{- if .Values.engineA.enabled }}
              echo "Waiting for Engine A..."
              until curl -sf http://{{ .Release.Name }}-engine-a:8081/health; do sleep 2; done
              {{- end }}
              
              {{- if .Values.engineE.enabled }}
              echo "Waiting for Engine E..."
              until curl -sf http://{{ .Release.Name }}-engine-e:8086/health; do sleep 2; done
              {{- end }}
              
              echo "Awaiting total readiness..."
              sleep 5
      containers:
        - name: register-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Registering Analyst Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-a:8081/restate", "force": true}'
              
              echo "Registering Neo4j Expert Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-e:8086/restate", "force": true}'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-db-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: {{ include "invincible-agent.pgUser" . }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at $PGHOST:$PGPORT (db: $PGDATABASE, user: $PGUSER)..."
              until pg_isready -h $PGHOST -p $PGPORT -d $PGDATABASE -U $PGUSER; do 
                echo "PostgreSQL not ready yet..."
                sleep 2
              done
              echo "PostgreSQL is reachable."
      containers:
        - name: apply-schema
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          # 2026-07-01: connect as the effective superuser, which
          # depends on imageStyle.
          #
          # Root cause of the schema-apply needing superuser: PG15+
          # removed the default `PUBLIC → CREATE` on the `public`
          # schema. Even a DATABASE OWNER (which Bitnami's
          # POSTGRESQL_USERNAME becomes for its POSTGRESQL_DATABASE)
          # cannot CREATE TABLE in public without an explicit grant.
          # PG17 continues this posture. `CREATE TABLE bpmn_catalog`
          # resolves to `public.bpmn_catalog` and gets denied.
          #
          # The prior fix said "just always connect as the postgres
          # superuser" — but that assumes a `postgres` role EXISTS,
          # which is only true when either (a) imageStyle=bitnami
          # (Bitnami always creates a separate `postgres` superuser
          # via POSTGRESQL_POSTGRES_PASSWORD), or (b) imageStyle=
          # postgres AND `auth.username=postgres`. On the OFFICIAL
          # postgres image with auth.username set to anything else
          # (like the default "iagent"), initdb runs with
          # `--username=<auth.username>` and creates that user as
          # THE superuser — there is no separate `postgres` role.
          # Sandbox has been running this way since first install,
          # which is why this bug only surfaced when the db-init
          # hook ran against sandbox for the first time on 2026-07-01.
          #
          # Correct branch:
          #   - Bitnami → `postgres` (separate superuser) with
          #     POSTGRESQL_POSTGRES_PASSWORD.
          #   - Official → `auth.username` (which IS the superuser)
          #     with `auth.password`.
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            {{- if and .Values.postgresql.enabled (eq (default "postgres" .Values.postgresql.imageStyle) "bitnami") }}
            # Bitnami: separate `postgres` superuser role with the
            # POSTGRESQL_POSTGRES_PASSWORD from the Bitnami image
            # env. Fall back to the app password only if the overlay
            # didn't set postgresPassword — same shape as the Postgres
            # container's env logic.
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            {{- else }}
            # Official postgres image: `auth.username` becomes the
            # sole superuser via `POSTGRES_USER` at initdb time. Its
            # password is `auth.password`. `auth.postgresPassword` is
            # NOT applicable on this path — there is no separate
            # `postgres` role. External Postgres deployments should
            # ALSO set `auth.username` to whichever user is a
            # superuser at the remote DB.
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Applying BPMN catalog schema (as postgres superuser)..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_bpmn_catalog.sql
              # 2026-07-01: projector schema was previously "applied by
              # the projector on startup" (per the projector template
              # comment) but the code never actually ran it — the loop
              # only READS projector_cursor and hard-fails if the row
              # is missing. Latent gap since Hop 2. Fix: apply both
              # schemas from this post-install/post-upgrade hook, in
              # order. Both use CREATE TABLE IF NOT EXISTS so re-runs
              # are safe.
              echo "Applying projector schema (answer_artifact_projection, projector_cursor, projector_skip_log)..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_answer_artifact_projection.sql
              # 2026-07-01: PG15+ requires explicit grant for the app
              # user to write to tables in the public schema. The
              # schemas were created as postgres superuser above; now
              # grant runtime read/write to the app user so cortex-bff,
              # engine-a, and projector can INSERT/UPDATE/DELETE.
              # OWNER stays with postgres — that's fine; runtime
              # doesn't need OWNER, just row-level access.
              echo "Granting runtime privileges to app user '{{ include "invincible-agent.pgUser" . }}'..."
              psql -v ON_ERROR_STOP=1 -c "
                GRANT USAGE ON SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO \"{{ include "invincible-agent.pgUser" . }}\";
              "
              # 2026-07-01: Electric needs to be able to configure a
              # PostgreSQL logical-replication PUBLICATION for
              # answer_artifact_projection (that's the row-level shape
              # it subscribes to). PG's rule for
              # CREATE PUBLICATION FOR TABLE x: caller must be the
              # OWNER of x OR a superuser. Electric connects with the
              # same DSN as the app user (BPMN_POSTGRES_USER via the
              # combined secret) — not superuser. If ownership stays
              # with postgres, Electric fails with:
              #   42501 (insufficient_privilege) must be owner of table
              # Transfer ownership after schema apply. iagent already
              # has REPLICATION (granted by electric.yaml's
              # grant-replication initContainer); with ownership it can
              # now add the table to a publication. Idempotent — ALTER
              # TABLE ... OWNER TO is safe when ownership already
              # matches.
              echo "Transferring table ownership to '{{ include "invincible-agent.pgUser" . }}' so Electric can publish..."
              psql -v ON_ERROR_STOP=1 -c "
                ALTER TABLE bpmn_catalog OWNER TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER TABLE answer_artifact_projection OWNER TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER TABLE projector_cursor OWNER TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER TABLE projector_skip_log OWNER TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER SEQUENCE projector_skip_log_id_seq OWNER TO \"{{ include "invincible-agent.pgUser" . }}\";
              "
              echo "DB init complete."
          volumeMounts:
            - name: sql-schema
              mountPath: /sql-schema
              readOnly: true
      volumes:
        - name: sql-schema
          configMap:
            name: {{ .Release.Name }}-db-schema
