apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-restate-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-restate-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Waiting for Restate Admin at {{ $restateAdmin }}..."
              until curl -sf {{ $restateAdmin }}/health; do sleep 2; done
              
              {{- if .Values.engineA.enabled }}
              echo "Waiting for Engine A..."
              until curl -sf http://{{ .Release.Name }}-engine-a:8081/health; do sleep 2; done
              {{- end }}
              
              {{- if .Values.engineE.enabled }}
              echo "Waiting for Engine E..."
              until curl -sf http://{{ .Release.Name }}-engine-e:8086/health; do sleep 2; done
              {{- end }}
              
              echo "Awaiting total readiness..."
              sleep 5
      containers:
        - name: register-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Registering Analyst Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-a:8081/restate", "force": true}'
              
              echo "Registering Neo4j Expert Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-e:8086/restate", "force": true}'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-db-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: {{ include "invincible-agent.pgUser" . }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at $PGHOST:$PGPORT (db: $PGDATABASE, user: $PGUSER)..."
              until pg_isready -h $PGHOST -p $PGPORT -d $PGDATABASE -U $PGUSER; do 
                echo "PostgreSQL not ready yet..."
                sleep 2
              done
              echo "PostgreSQL is reachable."
      containers:
        - name: apply-schema
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          # 2026-07-01: connect as postgres superuser (not the app user).
          #
          # Root cause: PG15+ removed the default `PUBLIC → CREATE` on
          # the `public` schema. Even a DATABASE OWNER (which Bitnami's
          # POSTGRESQL_USERNAME becomes for its POSTGRESQL_DATABASE)
          # cannot CREATE TABLE in public without an explicit grant.
          # PG17 continues this posture. `CREATE TABLE bpmn_catalog`
          # resolves to `public.bpmn_catalog` and gets denied.
          #
          # The official docker library postgres image happens to make
          # POSTGRES_USER a superuser (implicit privilege everywhere),
          # so this bug only surfaces on Bitnami. Rather than branch
          # on imageStyle, we just always connect as the postgres
          # superuser for the schema apply — schema DDL is a
          # privileged, one-time-per-cluster operation anyway, and
          # the app user only needs SELECT/INSERT/UPDATE at runtime,
          # which it already has via database ownership.
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: "postgres"
            {{- if and .Values.postgresql.enabled (eq (default "postgres" .Values.postgresql.imageStyle) "bitnami") }}
            # Bitnami separates the superuser (postgres) from the app
            # user; POSTGRESQL_POSTGRES_PASSWORD is the superuser's
            # password. Fall back to the app password only if the
            # overlay didn't set postgresPassword — same shape as the
            # Postgres container's env logic.
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            {{- else }}
            # Official postgres image: POSTGRES_USER IS the superuser
            # (POSTGRES_PASSWORD is its password). External Postgres:
            # operator must supply postgresql.auth.postgresPassword
            # with a password that can connect as `postgres`.
            - name: PGPASSWORD
              value: {{ .Values.postgresql.auth.postgresPassword | default .Values.postgresql.auth.password | quote }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Applying BPMN catalog schema (as postgres superuser)..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_bpmn_catalog.sql
              # 2026-07-01: projector schema was previously "applied by
              # the projector on startup" (per the projector template
              # comment) but the code never actually ran it — the loop
              # only READS projector_cursor and hard-fails if the row
              # is missing. Latent gap since Hop 2. Fix: apply both
              # schemas from this post-install/post-upgrade hook, in
              # order. Both use CREATE TABLE IF NOT EXISTS so re-runs
              # are safe.
              echo "Applying projector schema (answer_artifact_projection, projector_cursor, projector_skip_log)..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_answer_artifact_projection.sql
              # 2026-07-01: PG15+ requires explicit grant for the app
              # user to write to tables in the public schema. The
              # schemas were created as postgres superuser above; now
              # grant runtime read/write to the app user so cortex-bff,
              # engine-a, and projector can INSERT/UPDATE/DELETE.
              # OWNER stays with postgres — that's fine; runtime
              # doesn't need OWNER, just row-level access.
              echo "Granting runtime privileges to app user '{{ include "invincible-agent.pgUser" . }}'..."
              psql -v ON_ERROR_STOP=1 -c "
                GRANT USAGE ON SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"{{ include "invincible-agent.pgUser" . }}\";
                ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO \"{{ include "invincible-agent.pgUser" . }}\";
              "
              echo "DB init complete."
          volumeMounts:
            - name: sql-schema
              mountPath: /sql-schema
              readOnly: true
      volumes:
        - name: sql-schema
          configMap:
            name: {{ .Release.Name }}-db-schema
