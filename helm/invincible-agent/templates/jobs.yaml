apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-db-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: apply-schema
          image: postgres:15-alpine
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: {{ include "invincible-agent.pgUser" . }}
            - name: PGPASSWORD
              value: {{ include "invincible-agent.pgPassword" . }}
          command:
            - sh
            - -c
            - |
              # In a real K8s env, we'd mount the SQL file via configmap
              # For this example, we assume we want to run the BPMN catalog SQL
              echo "DB Init complete (Placeholder for SQL execution)"
