apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-restate-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-restate-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Waiting for Restate Admin at {{ $restateAdmin }}..."
              until curl -sf {{ $restateAdmin }}/health; do sleep 2; done
              
              {{- if .Values.engineA.enabled }}
              echo "Waiting for Engine A..."
              until curl -sf http://{{ .Release.Name }}-engine-a:8081/health; do sleep 2; done
              {{- end }}
              
              {{- if .Values.engineE.enabled }}
              echo "Waiting for Engine E..."
              until curl -sf http://{{ .Release.Name }}-engine-e:8086/health; do sleep 2; done
              {{- end }}
              
              echo "Awaiting total readiness..."
              sleep 5
      containers:
        - name: register-services
          image: {{ include "invincible-agent.image" (dict "name" "curl" "registry" .Values.utilImages.curl.registry "repository" .Values.utilImages.curl.repository "tag" .Values.utilImages.curl.tag "root" .) }}
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Registering Analyst Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-a:8081/restate", "force": true}'
              
              echo "Registering Neo4j Expert Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-e:8086/restate", "force": true}'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-db-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: {{ include "invincible-agent.pgUser" . }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at $PGHOST:$PGPORT (db: $PGDATABASE, user: $PGUSER)..."
              until pg_isready -h $PGHOST -p $PGPORT -d $PGDATABASE -U $PGUSER; do 
                echo "PostgreSQL not ready yet..."
                sleep 2
              done
              echo "PostgreSQL is reachable."
      containers:
        - name: apply-schema
          image: {{ include "invincible-agent.image" (dict "name" "postgres-client" "registry" .Values.utilImages.postgresClient.registry "repository" .Values.utilImages.postgresClient.repository "tag" .Values.utilImages.postgresClient.tag "root" .) }}
          env:
            - name: PGHOST
              value: {{ include "invincible-agent.pgHost" . }}
            - name: PGPORT
              value: {{ include "invincible-agent.pgPort" . | default "5432" | quote }}
            - name: PGDATABASE
              value: {{ include "invincible-agent.pgDatabase" . }}
            - name: PGUSER
              value: {{ include "invincible-agent.pgUser" . }}
            - name: PGPASSWORD
              value: {{ include "invincible-agent.pgPassword" . }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Applying BPMN catalog schema..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_bpmn_catalog.sql
              # 2026-07-01: projector schema was previously "applied by
              # the projector on startup" (per the projector template
              # comment) but the code never actually ran it — the loop
              # only READS projector_cursor and hard-fails if the row
              # is missing. Latent gap since Hop 2. Fix: apply both
              # schemas from this post-install/post-upgrade hook, in
              # order. Both use CREATE TABLE IF NOT EXISTS so re-runs
              # are safe.
              echo "Applying projector schema (answer_artifact_projection, projector_cursor, projector_skip_log)..."
              psql -v ON_ERROR_STOP=1 -f /sql-schema/create_answer_artifact_projection.sql
              echo "DB init complete."
          volumeMounts:
            - name: sql-schema
              mountPath: /sql-schema
              readOnly: true
      volumes:
        - name: sql-schema
          configMap:
            name: {{ .Release.Name }}-db-schema
