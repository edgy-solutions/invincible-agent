apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-restate-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-restate-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-services
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Waiting for Restate Admin at {{ $restateAdmin }}..."
              until curl -sf {{ $restateAdmin }}/health; do sleep 2; done
              
              {{- if .Values.engineA.enabled }}
              echo "Waiting for Engine A..."
              until curl -sf http://{{ .Release.Name }}-engine-a:8081/health; do sleep 2; done
              {{- end }}
              
              {{- if .Values.engineE.enabled }}
              echo "Waiting for Engine E..."
              until curl -sf http://{{ .Release.Name }}-engine-e:8086/health; do sleep 2; done
              {{- end }}
              
              echo "Awaiting total readiness..."
              sleep 5
      containers:
        - name: register-services
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              {{- $restateAdmin := (include "invincible-agent.restateAdminUrl" .) }}
              echo "Registering Analyst Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-a:8081/restate", "force": true}'
              
              echo "Registering Neo4j Expert Service..."
              curl -X POST {{ $restateAdmin }}/deployments -H 'Content-Type: application/json' -d '{"uri": "http://{{ .Release.Name }}-engine-e:8086/restate", "force": true}'

