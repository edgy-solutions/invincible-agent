{{- /*
Generic Dagster user-deployment template.

For each entry in .Values.userDeployments, renders THREE k8s
resources:

  1. Dagster code-location Deployment + Service — runs the user
     image's `dagster api grpc -m <module>` so iagent's Dagster
     daemon can discover the assets and trigger materializations.

  2. Broker Deployment + Service — runs the SAME image with
     `hypercorn dag_tools.domain_broker.main:app` plus
     DAGSTER_DEFS_MODULE=<module>:defs. The broker imports the
     user's Definitions, derives URNs, and registers with the
     mesh-level central-gateway. /resolve calls from the gateway
     route back to this broker.

The "same image, two startups" pattern keeps user-deployments
self-describing: the place that knows about an asset (the user's
Definitions module) is the place that serves it.

To add a new user-deployment to the mesh: add an entry to
.Values.userDeployments with the image, definitions module, and
any user-deployment-specific env/secrets. The chart renders the
two pods automatically — no per-deployment template needed.

Architecture: see [[project-sidecar-registry-pattern]].
*/}}
{{- range $name, $deploy := .Values.userDeployments }}
{{- if $deploy.enabled }}
{{- $fullName := printf "%s-%s" $.Release.Name $name }}
{{- $brokerName := printf "%s-broker" $fullName }}
{{- $codeLocationPort := default 4000 $deploy.codeLocation.port }}
{{- $brokerPort := default 8000 $deploy.broker.port }}
{{- /*
Per-pod toggles: an operator can enable ONLY the code-location
(Dagster daemon can trigger materializations; mesh URN resolution
unavailable), ONLY the broker (mesh URN resolution works; nothing
materializes locally — assets live elsewhere), or both (default).

Backward compat: `enabled` alone still renders both. Explicit
opt-out per side is:
  userDeployments.<name>.codeLocation.enabled: false
  userDeployments.<name>.broker.enabled: false

`hasKey` is used because a missing `enabled` key means "operator
did not opt out"; treating a missing key as "false" would silently
drop the pod on every existing overlay.
*/}}
{{- $codeLocationEnabled := true }}
{{- if and $deploy.codeLocation (hasKey $deploy.codeLocation "enabled") }}
  {{- $codeLocationEnabled = $deploy.codeLocation.enabled }}
{{- end }}
{{- $brokerEnabled := true }}
{{- if and $deploy.broker (hasKey $deploy.broker "enabled") }}
  {{- $brokerEnabled = $deploy.broker.enabled }}
{{- end }}
{{- if $codeLocationEnabled }}
---
# ---------------------------------------------------------------------------
# {{ $name }} — Dagster code-location (serves Definitions over gRPC)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ default 1 $deploy.codeLocation.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" $name "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" $ | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" $name "root" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: code-location
          image: {{ include "invincible-agent.image" (dict "name" $name "registry" $deploy.image.registry "repository" $deploy.image.repository "tag" $deploy.image.tag "root" $) }}
          imagePullPolicy: {{ default "Always" $deploy.imagePullPolicy }}
          command:
            - python
            - "-m"
            - dagster
            - api
            - grpc
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "{{ $codeLocationPort }}"
            - "-m"
            - {{ $deploy.dagsterModule | quote }}
          ports:
            - name: grpc
              containerPort: {{ $codeLocationPort }}
          # DAGSTER_POSTGRES_* are REQUIRED for the daemon's
          # launch_run subprocess to instantiate the
          # DagsterPostgresStorage backend configured in
          # iagent-dagster's dagster.yaml. Without these, every
          # asset materialization through DefaultRunLauncher fails
          # with a misleading "User code server timed out after
          # 60s" error — the actual cause is a config-loading
          # failure on the storage backend that the daemon never
          # gets back as a success. Mirror of what the central
          # ``dagster-user-code.yaml`` template wires in.
          env:
            - name: DAGSTER_POSTGRES_HOST
              value: {{ include "invincible-agent.pgHost" $ | quote }}
            - name: DAGSTER_POSTGRES_PORT
              value: {{ include "invincible-agent.pgPort" $ | quote }}
            - name: DAGSTER_POSTGRES_DB
              value: {{ include "invincible-agent.pgDatabase" $ | quote }}
            - name: DAGSTER_POSTGRES_USER
              value: {{ include "invincible-agent.pgUser" $ | quote }}
            - name: DAGSTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: BPMN_POSTGRES_PASSWORD
            # DataHub PAT for the io-manager's materialize-time catalog emit
            # (CortexPolarsIOManager._emit_to_datahub, when the metadata service
            # runs with METADATA_SERVICE_AUTH_ENABLED=true — the correct posture).
            # optional:true → empty/absent secret key = no auth header, so a
            # cluster without the token (or an unauthenticated GMS) still boots.
            - name: DATAHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: DATAHUB_TOKEN
                  optional: true
            {{- with $deploy.codeLocation.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "500m" "memory" "1Gi")) $deploy.codeLocation.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" $name "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $codeLocationPort }}
      targetPort: {{ $codeLocationPort }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" $name "root" $) | nindent 4 }}
{{- end }}{{/* end $codeLocationEnabled */}}
{{- if $brokerEnabled }}
---
# ---------------------------------------------------------------------------
# {{ $name }} — Broker (same image, runs dag_tools.domain_broker)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $brokerName }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" (printf "%s-broker" $name) "root" $) | nindent 4 }}
spec:
  replicas: {{ default 1 $deploy.broker.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" (printf "%s-broker" $name) "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" $ | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" (printf "%s-broker" $name) "root" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: {{ include "invincible-agent.image" (dict "name" $name "registry" $deploy.image.registry "repository" $deploy.image.repository "tag" $deploy.image.tag "root" $) }}
          imagePullPolicy: {{ default "Always" $deploy.imagePullPolicy }}
          command:
            - hypercorn
            - "dag_tools.domain_broker.main:app"
            - "--bind"
            - "0.0.0.0:{{ $brokerPort }}"
          env:
            - name: DAGSTER_DEFS_MODULE
              value: {{ printf "%s:defs" $deploy.dagsterModule | quote }}
            - name: CENTRAL_GATEWAY_URL
              value: {{ default (printf "http://%s-central-gateway:8090" $.Release.Name) $deploy.broker.centralGatewayUrl | quote }}
            - name: BROKER_URL
              value: {{ printf "http://%s:%d" $brokerName (int $brokerPort) | quote }}
            {{- with $deploy.broker.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $brokerPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $brokerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $brokerPort }}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "1Gi") "limits" (dict "cpu" "1000m" "memory" "2Gi")) $deploy.broker.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $brokerName }}
  labels:
    {{- include "invincible-agent.labels" $ | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" (printf "%s-broker" $name) "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $brokerPort }}
      targetPort: {{ $brokerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" (printf "%s-broker" $name) "root" $) | nindent 4 }}
{{- end }}{{/* end $brokerEnabled */}}
{{- end }}{{/* end $deploy.enabled */}}
{{- end }}{{/* end range .Values.userDeployments */}}
