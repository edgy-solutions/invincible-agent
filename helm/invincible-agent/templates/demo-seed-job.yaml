{{- if .Values.demoSeed.enabled }}
# ============================================================================
# demo-seed Job — GATED reproducible demo CONTENT (bootstrap-state-debt #4).
#
# Promotes the hand-run `scripts/seed_weaviate_manuals.py` (the Engine-W
# DocumentChunk knowledge corpus) to a reproducible, helm-gated Job so a fresh
# `helm install` — or a routine wipe+reprime — restores it with NO hand scripts.
# This is exactly the `demoSeed.enabled-style` gated seed the compliance test
# tests/test_bootstrap_reproducible.py already assumes exists.
#
# WHY GATED (default OFF): this is SANDBOX DEMO content, not something a work
# cluster wants — work ingests its own manuals from real sources. Leaving
# demoSeed.enabled=false at work keeps its Weaviate free of demo chunks; a
# sandbox sets it true so its Engine-W suite has a corpus to retrieve.
#
# WHY IT RUNS LAST (hook-weight 30 > prime 10 > reregister 20): the prime
# --wipe at weight 10 clears EVERY Weaviate collection (incl. DocumentChunk).
# If this seed ran before the wipe, its corpus would be deleted. Running after
# both prime and reregister guarantees the substrate is up and the wipe is done.
#
# SCOPE: folds BOTH demo seeds — seed_weaviate_manuals (DocumentChunk corpus)
# and seed_datahub_catalog (the demo datasets/dashboards the Engine-D suite
# resolves against). The catalog seed needs `acryl-datahub` (baked into the
# control-plane image's venv — the cluster has no PyPI egress, so it can't be
# installed at runtime; kept out of root deps to avoid bloating other images)
# and the GMS BASE url, not the `/api/graphql` form the ConfigMap publishes
# (the REST emitter 404s on that). Each seed is independently toggleable.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-demo-seed
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "demo-seed" "root" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.demoSeed.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.demoSeed.hook.deletePolicy | quote }}
spec:
  # One retry: the seed is idempotent (it DROPs+recreates DocumentChunk), so a
  # transient Weaviate-not-ready is safe to re-attempt without accumulating state.
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "invincible-agent.selectorLabels" (dict "component" "demo-seed" "root" .) | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: demo-seed
          # Same dagster-control-plane image prime uses: it has the full repo
          # (scripts/ included) + neo4j + weaviate-client in /app's uv venv.
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.demoSeed.image.registry "repository" .Values.demoSeed.image.repository "tag" .Values.demoSeed.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.demoSeed.image.pullPolicy }}
          workingDir: /app
          # Run the enabled demo-content seeds. Each is independent (manuals ->
          # Weaviate, catalog -> DataHub), so a failure in one doesn't block the
          # other, but the Job fails if either does. acryl-datahub is baked into
          # this image's venv (control-plane build), so the catalog seed needs no
          # runtime install (the cluster has no PyPI egress). Toggles from env.
          command: ["sh", "-c"]
          args:
            - |
              set -u; rc=0
              if [ "${SEED_MANUALS:-true}" = "true" ]; then
                echo "[demoSeed] weaviate manuals (DocumentChunk)…"
                python scripts/seed_weaviate_manuals.py || rc=1
              fi
              if [ "${SEED_CATALOG:-true}" = "true" ]; then
                echo "[demoSeed] datahub demo catalog -> ${DATAHUB_GMS_URL}…"
                python scripts/seed_datahub_catalog.py || rc=1
              fi
              echo "[demoSeed] done (rc=$rc)"; exit $rc
          # Cluster-wide config (WEAVIATE_DOC_COLLECTION, OLLAMA_*, etc.) from
          # the shared ConfigMap/secrets — same backends the engines use.
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            # The ConfigMap publishes WEAVIATE_HTTP_HOST / WEAVIATE_GRPC_HOST as
            # COMBINED host:port (e.g. "iagent-weaviate:8080") — the shape the
            # weaviate-client v4 connect helpers used by the ENGINES expect. But
            # seed_weaviate_manuals reads host and port SEPARATELY. Override with
            # the split form here (explicit env wins over envFrom). Defaults
            # target the chart's in-cluster Weaviate services; BYO-Weaviate
            # clusters override via demoSeed.env below.
            - name: WEAVIATE_HTTP_HOST
              value: {{ .Values.demoSeed.weaviate.httpHost | default (printf "%s-weaviate" .Release.Name) | quote }}
            - name: WEAVIATE_HTTP_PORT
              value: {{ .Values.demoSeed.weaviate.httpPort | quote }}
            - name: WEAVIATE_GRPC_HOST
              value: {{ .Values.demoSeed.weaviate.grpcHost | default (printf "%s-weaviate-grpc" .Release.Name) | quote }}
            - name: WEAVIATE_GRPC_PORT
              value: {{ .Values.demoSeed.weaviate.grpcPort | quote }}
            # DataHub demo catalog (seed_datahub_catalog). The ConfigMap
            # publishes DATAHUB_GMS_URL in the GraphQL form (…/api/graphql),
            # which the acryl REST emitter chokes on — it wants the GMS BASE.
            # Override with the base here (the banked DATAHUB_GMS_URL-
            # over-specified debt, worked around at this consumer). DATAHUB_TOKEN
            # (if any) rides in from the secrets envFrom above.
            - name: DATAHUB_GMS_URL
              value: {{ .Values.demoSeed.datahubGmsUrl | quote }}
            # Which demo seeds to run. A cluster with a REAL DataHub can set
            # seedCatalog=false (keep manuals) — but demoSeed is default-OFF at
            # work anyway. Both default on when demoSeed is enabled.
            - name: SEED_MANUALS
              value: {{ .Values.demoSeed.seedManuals | quote }}
            - name: SEED_CATALOG
              value: {{ .Values.demoSeed.seedCatalog | quote }}
            # seed_weaviate_manuals configures a text2vec-ollama vectorizer; its
            # apiEndpoint is the ollama BASE (no /v1). The seed's own default
            # already targets the sandbox ollama, so nothing is bridged from the
            # ConfigMap's OLLAMA_BASE_URL (which carries a /v1 the vectorizer
            # can't use). Work overrides OLLAMA_API_ENDPOINT via demoSeed.env.
            {{- range $k, $v := .Values.demoSeed.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.demoSeed.resources | nindent 12 }}
{{- end }}
