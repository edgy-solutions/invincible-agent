{{- /*
Electric's API secret: generated on first install, KEPT on upgrade. `lookup` reads the live Secret, so an
upgrade re-renders the stored value rather than a new random one (a new one would make the BFF and Electric
roll onto a secret neither had). `helm template` and `--dry-run` have no cluster, so `lookup` is empty
there and they render a throwaway value. Skipped when `electric.apiSecret.name` names a pre-made Secret.
The value is never in values.yaml and is never printed; read it by Secret and key name only.
Generate-and-keep is this one small block; if Lane 1's shared helper lands first, switch to it.
*/ -}}
{{- if and .Values.electric.enabled (not .Values.electric.apiSecret.name) }}
{{- $name := include "invincible-agent.electricApiSecretName" . }}
{{- $key := include "invincible-agent.electricApiSecretKey" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $live $live.data (hasKey $live.data $key) }}
  {{ $key }}: {{ index $live.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
