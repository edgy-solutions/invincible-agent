{{- if .Values.dagster.webserver.enabled }}
# Dagster Webserver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dagster-webserver
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-webserver" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.dagster.webserver.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-webserver" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-webserver" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webserver
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.dagster.webserver.image.registry "repository" .Values.dagster.webserver.image.repository "tag" .Values.dagster.webserver.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Canonical dagster-k8s image registers `dagster-webserver` as a
          # binary on PATH; older iagent dagster-control-plane image had
          # the same code via `python -m dagster webserver`. Both forms
          # work because dagster-webserver entrypoint dispatches the same.
          command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "{{ .Values.dagster.webserver.port }}", "-w", "/dagster-workspace/workspace.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.dagster.webserver.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: DAGSTER_POSTGRES_HOST
              value: {{ include "invincible-agent.pgHost" . | quote }}
            - name: DAGSTER_POSTGRES_PORT
              value: {{ include "invincible-agent.pgPort" . | quote }}
            - name: DAGSTER_POSTGRES_DB
              value: {{ include "invincible-agent.pgDatabase" . | quote }}
            - name: DAGSTER_POSTGRES_USER
              value: {{ include "invincible-agent.pgUser" . | quote }}
            - name: DAGSTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: BPMN_POSTGRES_PASSWORD
          volumeMounts:
            - name: dagster-workspace
              mountPath: /dagster-workspace
          resources:
            {{- toYaml .Values.dagster.webserver.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            # PROBE BUDGET, 2026-08-25. Was UNSET, inheriting Kubernetes' defaults
            # (timeoutSeconds 1, failureThreshold 3). One second asks a busy event loop
            # to answer inside a tick; a READINESS failure silently removes the pod from
            # every load balancer while `kubectl get pods` still reads Running, and the
            # edge then answers 404 with no CORS headers. Found by the seal that
            # enumerated what the 2026-08-22 liveness sweep missed.
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /server_info
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            # PROBE BUDGET, made explicit 2026-08-22. Was UNSET, so it inherited
            # Kubernetes' defaults: timeoutSeconds 1, failureThreshold 3. Nobody chose
            # one second — nobody chose anything, and the default is the one value that
            # asks a single-threaded event loop to answer inside a tick.
            #
            # cortex-bff was SIGKILLed by exactly this (exit 137, Reason: Error, kubelet
            # "Liveness probe failed x4 over 105m: context deadline exceeded") while
            # proxying Electric shapes. It was killed FOR BEING BUSY, and it died without
            # writing a reason — the last log lines are ordinary 200s.
            #
            # templates/engines.yaml solved this already, and says why: liveness there is a
            # TCP probe so "only a true port loss restarts the container". These services
            # keep an HTTP liveness check (their /health is meaningful), so they get the
            # other half of the same idea: a budget that survives a busy loop.
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: dagster-workspace
          configMap:
            name: {{ .Release.Name }}-dagster-workspace
{{- end }}
---
{{- if .Values.dagster.daemon.enabled }}
# Dagster Daemon
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dagster-daemon
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-daemon" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.dagster.daemon.replicas }}
  selector:
    matchLabels:
      {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-daemon" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-daemon" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daemon
          # Daemon uses .Values.dagster.daemon.image.* (was bug: referenced
          # dagster.webserver.image.* which prevented per-component overrides).
          image: {{ include "invincible-agent.image" (dict "name" "dagster-control-plane" "registry" .Values.dagster.daemon.image.registry "repository" .Values.dagster.daemon.image.repository "tag" .Values.dagster.daemon.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # `python -m dagster-daemon` is broken (Python module names can't
          # contain dashes). The canonical dagster-k8s image registers
          # `dagster-daemon` as a binary on PATH; use that directly.
          command: ["dagster-daemon", "run", "-w", "/dagster-workspace/workspace.yaml"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: DAGSTER_POSTGRES_HOST
              value: {{ include "invincible-agent.pgHost" . | quote }}
            - name: DAGSTER_POSTGRES_PORT
              value: {{ include "invincible-agent.pgPort" . | quote }}
            - name: DAGSTER_POSTGRES_DB
              value: {{ include "invincible-agent.pgDatabase" . | quote }}
            - name: DAGSTER_POSTGRES_USER
              value: {{ include "invincible-agent.pgUser" . | quote }}
            - name: DAGSTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: BPMN_POSTGRES_PASSWORD
          volumeMounts:
            - name: dagster-workspace
              mountPath: /dagster-workspace
          resources:
            {{- toYaml .Values.dagster.daemon.resources | nindent 12 }}
      volumes:
        - name: dagster-workspace
          configMap:
            name: {{ .Release.Name }}-dagster-workspace
{{- end }}
---
{{- if .Values.dagster.webserver.enabled }}
# Dagster Webserver Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dagster
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "invincible-agent.selectorLabels" (dict "component" "dagster-webserver" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dagster.webserver.port }}
      targetPort: http
{{- end }}
