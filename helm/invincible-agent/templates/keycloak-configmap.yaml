{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  realm-export.json: |
    {
      "realm": "{{ .Values.keycloak.realm }}",
      "enabled": true,
      "accessTokenLifespan": 3600,
      "ssoSessionIdleTimeout": 28800,
      "ssoSessionMaxLifespan": 86400,
      "clientSessionIdleTimeout": 28800,
      "clientSessionMaxLifespan": 86400,
      "users": [
          {
              "username": "agent-user",
              "enabled": true,
              "email": "agent@example.com",
              "firstName": "Invincible",
              "lastName": "User",
              "credentials": [
                  {
                      "type": "password",
                      "value": "password",
                      "temporary": false
                  }
              ],
              "realmRoles": [
                  "user"
              ],
              "clientRoles": {
                  "cortex-ui": [
                      "user"
                  ]
              }
          },
          {
              "username": "alice",
              "enabled": true,
              "email": "alice@example.com",
              "firstName": "Alice",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "alice", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          },
          {
              "username": "bob",
              "enabled": true,
              "email": "bob@example.com",
              "firstName": "Bob",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "bob", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          },
          {
              "username": "carol",
              "enabled": true,
              "email": "carol@example.com",
              "firstName": "Carol",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "carol", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          }
      ],
      "clients": [
          {
              "clientId": "cortex-ui",
              "enabled": true,
              "publicClient": true,
              "directAccessGrantsEnabled": true,
              "redirectUris": [
                  "*"
              ],
              "webOrigins": [
                  "*"
              ]
          },
          {{- range $i, $c := .Values.keycloak.serviceClients }}
          {
              "clientId": {{ $c.clientId | quote }},
              "enabled": true,
              "publicClient": false,
              "serviceAccountsEnabled": true,
              "standardFlowEnabled": false,
              "directAccessGrantsEnabled": false,
              "secret": {{ get $.Values.keycloak $c.secretRef | quote }},
              "protocolMappers": [
                  {
                      "name": "authz-id-svc",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-hardcoded-claim-mapper",
                      "config": {
                          "claim.name": {{ $.Values.keycloak.authzClaim | default "email" | quote }},
                          "claim.value": {{ $c.authzId | quote }},
                          "jsonType.label": "String",
                          "access.token.claim": "true",
                          "id.token.claim": "true",
                          "userinfo.token.claim": "true"
                      }
                  }
              ]
          }{{ if lt (add1 $i) (len $.Values.keycloak.serviceClients) }},{{ end }}
          {{- end }}
      ],
      "roles": {
          "realm": [
              {
                  "name": "user",
                  "description": "General user role"
              },
              {
                  "name": "admin",
                  "description": "Administrator role"
              }
          ]
      }
    }
{{- end }}
