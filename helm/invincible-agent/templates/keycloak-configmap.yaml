{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  realm-export.json: |
    {
      "realm": "{{ .Values.keycloak.realm }}",
      "enabled": true,
      "accessTokenLifespan": 3600,
      "ssoSessionIdleTimeout": 28800,
      "ssoSessionMaxLifespan": 86400,
      "clientSessionIdleTimeout": 28800,
      "clientSessionMaxLifespan": 86400,
      "users": [
          {
              "username": "agent-user",
              "enabled": true,
              "email": "agent@example.com",
              "firstName": "Invincible",
              "lastName": "User",
              "credentials": [
                  {
                      "type": "password",
                      "value": "password",
                      "temporary": false
                  }
              ],
              "realmRoles": [
                  "user"
              ],
              "clientRoles": {
                  "cortex-ui": [
                      "user"
                  ]
              }
          },
          {
              "username": "alice",
              "enabled": true,
              "email": "alice@example.com",
              "firstName": "Alice",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "alice", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          },
          {
              "username": "bob",
              "enabled": true,
              "email": "bob@example.com",
              "firstName": "Bob",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "bob", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          },
          {
              "username": "carol",
              "enabled": true,
              "email": "carol@example.com",
              "firstName": "Carol",
              "lastName": "Tester",
              "credentials": [
                  { "type": "password", "value": "carol", "temporary": false }
              ],
              "realmRoles": [ "user" ],
              "clientRoles": { "cortex-ui": [ "user" ] }
          }
      ],
      "clients": [
          {
              "clientId": "cortex-ui",
              "enabled": true,
              "publicClient": true,
              "directAccessGrantsEnabled": true,
              "redirectUris": [
                  "*"
              ],
              "webOrigins": [
                  "*"
              ]
          },
          {
              "clientId": "iagent-review-starter",
              "enabled": true,
              "publicClient": false,
              "serviceAccountsEnabled": true,
              "standardFlowEnabled": false,
              "directAccessGrantsEnabled": false,
              "secret": "{{ .Values.keycloak.reviewStarterClientSecret | default "sandbox-review-starter-secret" }}",
              "protocolMappers": [
                  {
                      "name": "authz-id-svc",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-hardcoded-claim-mapper",
                      "config": {
                          "claim.name": "email",
                          "claim.value": "svc:review-starter",
                          "jsonType.label": "String",
                          "access.token.claim": "true",
                          "id.token.claim": "true",
                          "userinfo.token.claim": "true"
                      }
                  }
              ]
          },
          {
              "_comment": "Engine DA's TRANSPORT identity (ADR-0034 mint contract). Client-credentials only, per the svc:<name> / iagent-<name> convention iagent-review-starter established. NOT an entitlement answer: DA authenticating as svc:data-analyst says WHICH SERVICE is calling, never WHOSE data it may read. The acting human travels separately (X-Originator-Email -> the email-keyed can_read check), and formalising that delegation is its own governed decision. Replaces the hand-created sandbox client `engine-da-svc`, which followed neither half of the convention AND carried NO claim mapper — its token's authz_id fell back to the opaque Keycloak sub UUID, exactly the not-human-reviewable identity users.yaml refuses. NOTE: the realm import applies on FIRST BOOT only; an existing Keycloak needs this client created out-of-band.",
              "clientId": "iagent-data-analyst",
              "enabled": true,
              "publicClient": false,
              "serviceAccountsEnabled": true,
              "standardFlowEnabled": false,
              "directAccessGrantsEnabled": false,
              "secret": "{{ .Values.keycloak.dataAnalystClientSecret | default "sandbox-data-analyst-secret" }}",
              "protocolMappers": [
                  {
                      "name": "authz-id-svc",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-hardcoded-claim-mapper",
                      "config": {
                          "claim.name": "email",
                          "claim.value": "svc:data-analyst",
                          "jsonType.label": "String",
                          "access.token.claim": "true",
                          "id.token.claim": "true",
                          "userinfo.token.claim": "true"
                      }
                  }
              ]
          }
      ],
      "roles": {
          "realm": [
              {
                  "name": "user",
                  "description": "General user role"
              },
              {
                  "name": "admin",
                  "description": "Administrator role"
              }
          ]
      }
    }
{{- end }}
