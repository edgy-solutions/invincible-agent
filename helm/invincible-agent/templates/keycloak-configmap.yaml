{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
data:
  realm-export.json: |
    {
      "realm": "{{ .Values.keycloak.realm }}",
      "enabled": true,
      "accessTokenLifespan": 3600,
      "ssoSessionIdleTimeout": 28800,
      "ssoSessionMaxLifespan": 86400,
      "clientSessionIdleTimeout": 28800,
      "clientSessionMaxLifespan": 86400,
      "users": [
          {
              "username": "agent-user",
              "enabled": true,
              "email": "agent@example.com",
              "firstName": "Invincible",
              "lastName": "User",
              "credentials": [
                  {
                      "type": "password",
                      "value": "password",
                      "temporary": false
                  }
              ],
              "realmRoles": [
                  "user"
              ],
              "clientRoles": {
                  "cortex-ui": [
                      "user"
                  ]
              }
          }
      ],
      "clients": [
          {
              "clientId": "cortex-ui",
              "enabled": true,
              "publicClient": true,
              "directAccessGrantsEnabled": true,
              "redirectUris": [
                  "*"
              ],
              "webOrigins": [
                  "*"
              ],
              "protocolMappers": [
                  {
                      "name": "minio-sts-audience",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-audience-mapper",
                      "consentRequired": false,
                      "config": {
                          "included.client.audience": "minio-sts",
                          "id.token.claim": "false",
                          "access.token.claim": "true"
                      }
                  }
              ]
          },
          {
              "clientId": "minio-sts",
              "enabled": true,
              "publicClient": false,
              "bearerOnly": true,
              "serviceAccountsEnabled": true,
              "redirectUris": [],
              "webOrigins": [],
              "protocolMappers": [
                  {
                      "name": "minio-policy",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-hardcoded-claim-mapper",
                      "consentRequired": false,
                      "config": {
                          "claim.name": "policy",
                          "claim.value": "KeycloakS3Reader",
                          "jsonType.label": "String",
                          "id.token.claim": "true",
                          "access.token.claim": "true"
                      }
                  }
              ]
          }
      ],
      "roles": {
          "realm": [
              {
                  "name": "user",
                  "description": "General user role"
              },
              {
                  "name": "admin",
                  "description": "Administrator role"
              }
          ]
      }
    }
{{- end }}
