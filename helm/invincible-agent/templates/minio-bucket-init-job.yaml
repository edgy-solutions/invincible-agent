{{- /*
MinIO bucket initialization Job.

Runs as a helm pre-install AND pre-upgrade hook to ensure the
buckets each user-deployment writes to actually exist before the
first materialization fires. MinIO itself is deployed externally
(``iagent-minio`` service); the chart's responsibility is making
sure the buckets each deployment expects are present in MinIO
before the deployment's pods start pulling/pushing.

Idempotent: ``mc mb --ignore-existing`` is a no-op when the bucket
already exists, so re-running on every chart upgrade is safe.

Values-driven: add a bucket name to ``.Values.minioBucketInit.buckets``
to have the Job create it. The default list covers known
user-deployment buckets (``publog-lake`` for pub-tools' publog
content, ``dag-lake`` for dag-tools' demo/singleton content).

Skip the whole Job by setting ``minioBucketInit.enabled: false`` —
useful when MinIO isn't reachable from inside the cluster (e.g.,
an external MinIO that the helm-install host can't see) or when
bucket creation is owned by a different ops process.
*/}}
{{- if .Values.minioBucketInit.enabled }}
{{- $admin := .Values.objectStore.adminSecret }}
{{- $policyBuckets := concat .Values.minioBucketInit.buckets (.Values.objectStore.consumerUser.buckets | default list) }}
{{- if not $admin.name }}{{ fail "objectStore.adminSecret.name is empty: minioBucketInit needs MinIO's root pair by reference (a Secret the deployment creates), or set minioBucketInit.enabled=false" }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-bucket-init
  labels:
    {{- include "invincible-agent.labels" . | nindent 4 }}
    {{- include "invincible-agent.selectorLabels" (dict "component" "minio-bucket-init" "root" .) | nindent 4 }}
  annotations:
    # Run BEFORE any deployment that might try to write to a
    # missing bucket. pre-upgrade ensures new buckets added between
    # releases (like ``dag-lake`` 2026-06-26) appear before the
    # deployment that needs them rolls.
    "helm.sh/hook": pre-install,pre-upgrade
    # Highest-priority cleanup: delete the job after the next
    # successful hook cycle so completed Jobs don't accumulate.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Run early so the buckets are ready before any downstream
    # deployment expects them.
    "helm.sh/hook-weight": "-5"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "invincible-agent.labels" . | nindent 8 }}
        {{- include "invincible-agent.selectorLabels" (dict "component" "minio-bucket-init" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "invincible-agent.avoidStatefulNodes" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mc
          # 0.3.0 sweep: image resolved through `invincible-agent.image`
          # helper from `utilImages.mc.{registry,repository,tag}`.
          # Legacy `global.images.mc` and `.Values.minioBucketInit.image`
          # are RETIRED — overlays that set either key are ignored.
          image: {{ include "invincible-agent.image" (dict "name" "mc" "registry" .Values.utilImages.mc.registry "repository" .Values.utilImages.mc.repository "tag" .Values.utilImages.mc.tag "root" .) }}
          imagePullPolicy: IfNotPresent
          env:
            # The ADMIN (root) pair, by reference. Only this job reads it; MC_HOST is assembled in the
            # shell from these three so no credential is ever a rendered value.
            - name: STORE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $admin.name | quote }}
                  key: {{ $admin.accessKeyKey | quote }}
            - name: STORE_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $admin.name | quote }}
                  key: {{ $admin.secretKeyKey | quote }}
            - name: STORE_ENDPOINT
              value: {{ trimPrefix "http://" (trimPrefix "https://" .Values.minioBucketInit.endpoint) | quote }}
            {{- if .Values.objectStore.consumerUser.create }}
            # The CONSUMER pair every workload reads (created here as a MinIO user).
            - name: CONSUMER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "iagent.objectStore.secretName" . | quote }}
                  key: {{ .Values.objectStore.consumerSecret.accessKeyKey | quote }}
            - name: CONSUMER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "iagent.objectStore.secretName" . | quote }}
                  key: {{ .Values.objectStore.consumerSecret.secretKeyKey | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Never trace and never dump the environment: the pairs are in it.
              set +x
              MC_HOST_iagent="http://${STORE_ADMIN_KEY}:${STORE_ADMIN_SECRET}@${STORE_ENDPOINT}"
              export MC_HOST_iagent
              echo "Initializing MinIO buckets at {{ .Values.minioBucketInit.endpoint }}"
              # Wait briefly for MinIO to be reachable. The hook runs
              # very early in install, so MinIO may still be coming
              # up alongside; retry for up to ~60s before failing.
              for i in $(seq 1 12); do
                if mc ls iagent >/dev/null 2>&1; then
                  echo "MinIO reachable on attempt $i"
                  break
                fi
                echo "MinIO not reachable (attempt $i/12); sleeping 5s..."
                sleep 5
              done
              {{- range $b := .Values.minioBucketInit.buckets }}
              echo "Ensuring bucket: {{ $b }}"
              mc mb --ignore-existing iagent/{{ $b }}
              {{- end }}
              echo "All buckets ensured."
              {{- if .Values.objectStore.consumerUser.create }}
              # Consumer user + policy, limited to the buckets above plus objectStore.consumerUser.buckets (read, not created; `*` = prefix). Idempotent on re-run:
              #  * `mc admin user add` on an existing user sets its secret again (an update, no error);
              #  * `mc admin policy create` fails when the policy already exists. That case is handled
              #    EXPLICITLY: the policy must then be readable (`policy info`) and must still name every
              #    bucket arn above, else the job fails and names the bucket; a policy that is already
              #    right is kept. Any other create failure stops the job;
              #  * attach runs only when `user info` does not already show the policy.
              POLICY="{{ .Release.Name }}-consumer"
              cat > /tmp/consumer-policy.json <<POLICY_EOF
              {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":[{{ range $i, $b := $policyBuckets }}{{ if $i }},{{ end }}"arn:aws:s3:::{{ $b }}","arn:aws:s3:::{{ $b }}/*"{{ end }}]}]}
              POLICY_EOF
              mc admin user add iagent "$CONSUMER_ACCESS_KEY" "$CONSUMER_SECRET_KEY" >/dev/null
              if ! mc admin policy create iagent "$POLICY" /tmp/consumer-policy.json >/dev/null 2>&1; then
                mc admin policy info iagent "$POLICY" > /tmp/policy-info.json
                {{- range $b := $policyBuckets }}
                grep -qF 'arn:aws:s3:::{{ $b }}/*' /tmp/policy-info.json || { echo "policy ${POLICY} exists without bucket {{ $b }}; remove it and re-run"; exit 1; }
                {{- end }}
                echo "Policy ${POLICY} already exists and covers every bucket; kept."
              fi
              if ! mc admin user info iagent "$CONSUMER_ACCESS_KEY" 2>/dev/null | grep -qF "$POLICY"; then
                mc admin policy attach iagent "$POLICY" --user "$CONSUMER_ACCESS_KEY" >/dev/null
              fi
              echo "Consumer user and policy ${POLICY} ensured."
              {{- end }}
{{- end }}
