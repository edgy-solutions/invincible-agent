# Roll overlay: the frontend digest, and NOTHING else.
#
# WHY THIS FILE EXISTS AS ITS OWN FILE, measured 2026-09-19 rather than reasoned:
#
# A roll runs `helm upgrade --reuse-values`, which does not read a values file unless the
# command passes one with `-f`. So the digest pinned in `values-sandbox.yaml` is INVISIBLE to
# the canonical roll command — the dry-run rendered the frontend as `:latest`, i.e. the roll
# would have been a silent no-op on the one line it exists to change.
#
# THE OBVIOUS FIX IS WRONG, AND ONLY A FULL-MANIFEST DIFF SHOWS IT. Adding
# `-f values-sandbox.yaml` does carry the digest — and it ALSO re-asserts every other key in
# that file over the values `--reuse-values` preserved. Measured on the dry-run:
#
#     DATAHUB_TOKEN: "eyJhbGciOiJIUzI1NiJ9…"   <- --reuse-values, the live token
#     DATAHUB_TOKEN: ""                         <- with -f values-sandbox.yaml
#
# The token is empty in the values file because it is injected at deploy time. Passing the
# whole file would have blanked it and broken DataHub auth, for a roll whose only intended
# change was one image reference. An image-line diff cannot see that; the full manifest can,
# which is why the check is the manifest and not the images.
#
# So: a DECLARED values file (R-034 — never a bare `--set` for the pin) scoped to exactly the
# one key the roll needs. Helm merges values, so every other key still comes from
# `--reuse-values`.
#
#     helm upgrade iagent helm/invincible-agent -n sandbox \
#       --reuse-values \
#       -f helm/invincible-agent/values-roll-frontend-digest.yaml \
#       --set global.imageTag=<roll sha> \
#       --no-hooks
#
# THE DIGEST IS NOT PERMANENT HERE. It names the cortex-ui build this roll was verified
# against; the next frontend roll replaces it, and the `values-sandbox.yaml` entry stays as the
# environment's declared default for a fresh install. Two places name a digest and they answer
# different questions: that one is "what does a clean install get", this one is "what did THIS
# roll put on the cluster".
cortexUi:
  image:
    # RE-ARMED AGAIN 2026-09-23 for roll #2, superseding `38cda6c8`. cortex-ui tag
    # `a6950b2500b369456680b23f29db7189524bf4c0` — the head of the six-commit push
    # `ea060f3..a6950b2`.
    #
    # THE GHCR TAG IS THE FULL 40-CHARACTER SHA, and this is a footgun with a measured control:
    # the architect's order carried the tag abbreviated (`a6950b25`), and
    # `imagetools inspect …/frontend:a6950b25` answers `not found`. A 404 there is
    # INDISTINGUISHABLE from "not built yet" and from "no anonymous pull access" — three very
    # different states, one message. So the tag below is the full sha, and it was not accepted on
    # its face: it was resolved, and the resolution matched the digest the order named.
    #
    # Verified in this seat before arming (measured 2026-09-23 — cortex-60's packet asserts all of
    # this too, and that is why it was re-run here rather than quoted):
    #   * `…/frontend@sha256:28f752f2…` resolves as an OCI image index
    #     (`application/vnd.oci.image.index.v1+json`)
    #   * linux/arm64 present alongside linux/amd64 — the nodes are arm64
    #   * BOTH DIRECTIONS of the tag↔digest binding: the full tag above resolves to exactly
    #     `sha256:28f752f2…`. A digest that merely "exists" is not the digest that tag ships.
    #   * control, in the same breath: the superseded `sha256:38cda6c8…` STILL resolves. Nothing
    #     was deleted; it was overtaken. An absence assertion would have been wrong here.
    #
    # `:latest` NOW RESOLVES TO THIS DIGEST — and that is the second time a cortex-ui push has
    # moved `:latest` off a digest the architect had already accepted (cortex-60 reports the same
    # shape at `4c0375b`/`8a13dd6`). It is a property of the pipeline, not an accident, and the
    # previous version of this comment predicted exactly it. The pin is BY DIGEST, so what
    # `:latest` points at cannot change what this roll deploys — which is the whole reason the
    # pin is a digest and not a tag. Recorded so the coincidence is never re-derived as though it
    # had been re-checked.
    #
    # WHAT CHANGED BETWEEN `38cda6c8` AND THIS DIGEST — cortex-60's measurement, not mine, and
    # marked as theirs deliberately: six commits, of which the only two touching `src/` are
    # comment-only, and `sessions/`-only commits do not reach the image. So the two digests differ
    # by no behavioural change to shipped code. They differ AS DIGESTS regardless — build metadata
    # and layer timestamps guarantee that — so a differing digest here is NOT evidence of a
    # differing application, and nobody should read one into it. Not independently re-measured in
    # this seat; the roll's gate does not depend on it, because the pin is exact either way.
    #
    # THE BEFORE-SIDE, re-measured rather than carried forward from the previous arming: the
    # cluster is running `sha256:c8d6553f142ebb70024bf09f4b7f93c77c2ad62ebe4e0cc009465461b3824ced`
    # (cortex-ui `8a13dd6`) — pod `iagent-cortex-ui-5c7c784464-7g5xl`. `38cda6c8` was ARMED AND
    # NEVER FIRED, so it deployed nothing and there is no intermediate state to unwind. The
    # frontend line of this roll is therefore `c8d6553f` -> `28f752f2`, one step, and the dry-run
    # manifest must show exactly that.
    digest: "sha256:28f752f2111b760c9110db6389e0f057da9b268b63c4464d2ce889cbb3a03479"
