# Roll overlay: the frontend digest, and NOTHING else.
#
# WHY THIS FILE EXISTS AS ITS OWN FILE, measured 2026-09-19 rather than reasoned:
#
# A roll runs `helm upgrade --reuse-values`, which does not read a values file unless the
# command passes one with `-f`. So the digest pinned in `values-sandbox.yaml` is INVISIBLE to
# the canonical roll command — the dry-run rendered the frontend as `:latest`, i.e. the roll
# would have been a silent no-op on the one line it exists to change.
#
# THE OBVIOUS FIX IS WRONG, AND ONLY A FULL-MANIFEST DIFF SHOWS IT. Adding
# `-f values-sandbox.yaml` does carry the digest — and it ALSO re-asserts every other key in
# that file over the values `--reuse-values` preserved. Measured on the dry-run:
#
#     DATAHUB_TOKEN: "eyJhbGciOiJIUzI1NiJ9…"   <- --reuse-values, the live token
#     DATAHUB_TOKEN: ""                         <- with -f values-sandbox.yaml
#
# The token is empty in the values file because it is injected at deploy time. Passing the
# whole file would have blanked it and broken DataHub auth, for a roll whose only intended
# change was one image reference. An image-line diff cannot see that; the full manifest can,
# which is why the check is the manifest and not the images.
#
# So: a DECLARED values file (R-034 — never a bare `--set` for the pin) scoped to exactly the
# one key the roll needs. Helm merges values, so every other key still comes from
# `--reuse-values`.
#
#     helm upgrade iagent helm/invincible-agent -n sandbox \
#       --reuse-values \
#       -f helm/invincible-agent/values-roll-frontend-digest.yaml \
#       --set global.imageTag=<roll sha> \
#       --no-hooks
#
# THE DIGEST IS NOT PERMANENT HERE. It names the cortex-ui build this roll was verified
# against; the next frontend roll replaces it, and the `values-sandbox.yaml` entry stays as the
# environment's declared default for a fresh install. Two places name a digest and they answer
# different questions: that one is "what does a clean install get", this one is "what did THIS
# roll put on the cluster".
cortexUi:
  image:
    # RE-ARMED 2026-09-23 for roll #2. cortex-ui `ea060f37e6078ef666f35db72956afa3e75971ba`
    # (`ea060f3`) — the commit that binds `cost:LotCostingReview` to `SOURCE_LEDGER`, i.e. the
    # frontend half that turned `test_the_two_MIRRORS_agree_FLEET_WIDE` green on master.
    #
    # DERIVED, NOT TYPED. The architect's order carried this digest abbreviated
    # (`sha256:38cda6c84b3c…`). An abbreviated digest cannot be diffed and must never be
    # completed by hand, so the full value below was resolved from the registry by walking
    # cortex-ui's recent shas against `imagetools inspect` until one matched that prefix — the
    # match is `ea060f3`, and nothing else in the last eight commits has a published tag.
    #
    # Verified before arming (measured 2026-09-23, not carried over from the previous pin):
    #   * resolves in GHCR as an OCI image index (`application/vnd.oci.image.index.v1+json`)
    #   * linux/arm64 present alongside linux/amd64 — the nodes are arm64
    #
    # WHAT IS NO LONGER TRUE, and is deliberately not copied forward from the previous pin:
    # that comment asserted the pinned digest was "NOT the same image as `:latest`". For THIS
    # digest that is false — `:latest` resolves to `sha256:38cda6c8…` today, the same image,
    # because `ea060f3` is the newest push to cortex-ui's default branch. That coincidence is
    # not a problem and not a reason to wait: the pin is BY DIGEST, so what `:latest` points at
    # is irrelevant to what this roll deploys. It is recorded only so nobody re-derives the old
    # sentence as though it had been re-checked — it would be a stale claim wearing a pin's
    # authority, and `:latest` will move away from this digest on cortex-ui's next merge.
    #
    # The previous pin was `sha256:c8d6553f142ebb70024bf09f4b7f93c77c2ad62ebe4e0cc009465461b3824ced`
    # (cortex-ui `8a13dd6`), and that IS what the cluster is running right now — measured, not
    # assumed from this file's own history: pod `iagent-cortex-ui-5c7c784464-7g5xl` reports
    # `…/cortex-ui/frontend@sha256:c8d6553f…`. So the frontend line of this roll is a real change,
    # `c8d6553f` -> `38cda6c8`, and the dry-run manifest must show exactly that.
    digest: "sha256:38cda6c84b3ce6a23f2545c9ae8a7e23cf4e97c7cd632f69da042851eeba21d7"
