# Roll overlay: the four CROSS-REPO digests this roll pins, and NOTHING else.
#
# WHY THIS FILE EXISTS AS ITS OWN FILE, measured 2026-09-19 rather than reasoned:
#
# A roll runs `helm upgrade --reuse-values`, which does not read a values file unless the
# command passes one with `-f`. So the digest pinned in `values-sandbox.yaml` is INVISIBLE to
# the canonical roll command — the dry-run rendered the frontend as `:latest`, i.e. the roll
# would have been a silent no-op on the one line it exists to change.
#
# THE OBVIOUS FIX IS WRONG, AND ONLY A FULL-MANIFEST DIFF SHOWS IT. Adding
# `-f values-sandbox.yaml` does carry the digest — and it ALSO re-asserts every other key in
# that file over the values `--reuse-values` preserved. Measured on the dry-run:
#
#     DATAHUB_TOKEN: "eyJhbGciOiJIUzI1NiJ9…"   <- --reuse-values, the live token
#     DATAHUB_TOKEN: ""                         <- with -f values-sandbox.yaml
#
# The token is empty in the values file because it is injected at deploy time. Passing the
# whole file would have blanked it and broken DataHub auth, for a roll whose only intended
# change was one image reference. An image-line diff cannot see that; the full manifest can,
# which is why the check is the manifest and not the images.
#
# So: a DECLARED values file (R-034 — never a bare `--set` for the pin) scoped to exactly the
# one key the roll needs. Helm merges values, so every other key still comes from
# `--reuse-values`.
#
#     helm upgrade iagent helm/invincible-agent -n sandbox \
#       --reuse-values \
#       -f helm/invincible-agent/values-roll-frontend-digest.yaml \
#       --set global.imageTag=<roll sha> \
#       --no-hooks
#
# THE DIGEST IS NOT PERMANENT HERE. It names the cortex-ui build this roll was verified
# against; the next frontend roll replaces it, and the `values-sandbox.yaml` entry stays as the
# environment's declared default for a fresh install. Two places name a digest and they answer
# different questions: that one is "what does a clean install get", this one is "what did THIS
# roll put on the cluster".
cortexUi:
  image:
    # RE-ARMED 2026-09-26 for the frontend-only bump, superseding `28f752f2`. cortex-ui tag
    # `092b0bab7eb4e7796ba7d01b4b9ff6b2e383efea` — DELIBERATELY NOT master head. Head is
    # `219c19a` (and has since moved to `15552d03`), and `219c19a` is a `sessions/`-only commit
    # with NO IMAGE. Arch's order names the tag for this reason; a pin chosen from a commit
    # subject rather than a built-and-measured image is the "a name is not a measurement" defect,
    # and it is why `546e6bee` was rejected earlier this week despite its subject reading well.
    #
    # THE GHCR TAG IS THE FULL 40-CHARACTER SHA, and this is a footgun with a measured control:
    # an abbreviated tag answers `not found`, and a 404 there is INDISTINGUISHABLE from "not built
    # yet" and from "no anonymous pull access" — three very different states, one message. So the
    # instrument was positive-controlled before anything was believed of it: measured 2026-09-26,
    # `imagetools inspect …/frontend:092b0bab` (abbreviated) -> `not found`, while the full sha
    # resolves. A `found` from this instrument therefore discriminates; without that control it
    # would only have been an absence of evidence.
    #
    # ⚠ THE ORDER CARRIED THE DIGEST ABBREVIATED (`sha256:6e2fc31d…`), AND A DIGEST CANNOT BE
    # EXPANDED THE WAY A TAG CAN. A short tag has a git object behind it to `rev-parse`; a short
    # digest has nothing in this repo to derive it from — `grep 6e2fc31d` over the whole tree
    # returns zero hits. It was recovered from cortex-60's packet in the SIBLING repo
    # (`cortex-ui/sessions/2026-09-26-packet-to-lane-1-digest-6e2fc31d-…md`), then re-resolved
    # here rather than copied on trust. Recorded because the next order will abbreviate too, and
    # the answer is "read it from the producer's packet", never "type the tail".
    #
    # Verified in this seat before arming (measured 2026-09-26 — cortex-60's packet asserts all of
    # this too, and that is precisely why it was re-run here rather than quoted):
    #   * `…/frontend@sha256:6e2fc31d…` resolves as an OCI image index
    #     (`application/vnd.oci.image.index.v1+json`)
    #   * linux/arm64 present alongside linux/amd64 — the nodes are arm64
    #   * BOTH DIRECTIONS of the tag↔digest binding: the full tag above resolves to exactly
    #     `sha256:6e2fc31d…`. A digest that merely "exists" is not the digest that tag ships.
    #   * control, in the same breath: the superseded `sha256:28f752f2…` STILL resolves. Nothing
    #     was deleted; it was overtaken. An absence assertion would have been wrong here.
    #
    # ⛔ `:latest` HAS ALREADY MOVED OFF THIS DIGEST, AND THE PACKET SAYS OTHERWISE. cortex-60's
    # packet records "`:latest` resolves to this same digest" — true when written, and FALSE BY
    # THE TIME THIS WAS ARMED: measured here 2026-09-26, `:latest` ->
    # `sha256:f3b363332fd21d70c6163e6dafd5e3a484a540fafa2d061a38a46daffcaecd75`, a third image.
    # Two more cortex-ui commits landed behind it (`c3a7ac44` fix(elicitation), `15552d03`
    # fix(picker)). This is the THIRD consecutive arming at which a cortex-ui push has moved
    # `:latest` off a digest the architect had already accepted, so it is a property of the
    # pipeline and not an accident. It changes nothing about what this roll deploys — the pin is
    # BY DIGEST, which is the whole reason the pin is a digest and not a tag — and it is written
    # down because a stale claim about `:latest` is pre-authenticated: it was measured once, it
    # reads as current, and the only thing that distinguishes the two is a re-measurement.
    #
    # ⚠ `c3a7ac44` fix(elicitation) — "a pick with no question behind it locked the card and was
    # never sent" — MAY BE cortex's half of the lot 3 elicitation defect that the packet routed to
    # "the NEXT digest". If so it is in `:latest` and NOT in this pin. Not verified here: naming
    # a fix from its commit subject is the same defect this comment block opens with. Flagged for
    # the next arming to resolve by reading the diff, not the subject.
    #
    # THE BEFORE-SIDE, re-measured rather than carried forward from the previous arming: the
    # cluster is running `sha256:28f752f2111b760c9110db6389e0f057da9b268b63c4464d2ce889cbb3a03479`
    # — pod `iagent-cortex-ui-5c6d647bfd-bzw8c`, helm revision 151. Unlike the last two armings
    # this one's predecessor WAS fired: the running `imageID` and the digest this file pinned
    # agree exactly, so the pin is being honoured and there is no drift to unwind. The frontend
    # line of this roll is therefore `28f752f2` -> `6e2fc31d`, one step, and the dry-run manifest
    # must show exactly that and nothing else.
    digest: "sha256:6e2fc31db21f718b1aebc73d1cb5fcc2bc72361c0494c03512ce3e0093e3bbd0"

# ===========================================================================================
# THE THREE SIBLINGS — pinned 2026-09-23 on the architect's order, to their RUNNING digests.
#
# THE FILE'S NAME IS NOW NARROWER THAN ITS CONTENTS. It was created for the frontend alone and
# the architect's order names it explicitly, so it keeps the name rather than gaining a rename
# nobody asked for. Read it as "the roll's cross-repo digest overlay".
#
# WHY THESE THREE AND NOT THE OTHER SEVENTEEN: `global.imageTag` is scoped to `$ours` — images
# whose repository sits under `global.imagePrefix`. These three plus the frontend are the whole
# cross-repo population (`_helpers.tpl:77,95` names them, and that list was paid for twice in
# ImagePullBackOffs). Nothing retags them by digest for us, so `latest` is the floor and a floor
# that moves is not a pin.
#
# DERIVED, NOT TYPED. The order carried the three digests abbreviated; the binding of digest to
# image was read off the cluster (`imageID` on the running pods), not inferred from the order's
# list order — which it then happened to match. `imageID` is the REPO digest, not the per-arch
# manifest digest: proved on the frontend, whose pod reports `imageID`
# `…/cortex-ui/frontend@sha256:c8d6553f…`, the same index digest measured independently in GHCR.
#
# MEASURED FOR EACH OF THE THREE, 2026-09-23:
#   * the digest resolves as `application/vnd.oci.image.index.v1+json`
#   * linux/arm64 present alongside linux/amd64 — the nodes are arm64
#   * one distinct `imageID` across every pod of each image (pub-tools and dag-tools run two
#     pods apiece; a split would have meant the deployment was mid-flight)
#
# WHAT `:latest` POINTS AT, read in the same breath, because that is the whole reason for the pin:
#
#     central-gateway   running c05e0131   :latest c05e0131   CONVERGED
#     user-deployment   running 70092098   :latest 70092098   CONVERGED
#     pub-tools         running ed93f7b1   :latest 1555b341   DIVERGED
#
# SO TWO OF THESE THREE PINS CHANGE NOTHING TODAY AND ONE IS LOAD-BEARING, and saying so is the
# point. For the two converged images the pin is prospective: it fixes bytes that already match,
# so the next push to that repository can no longer move them under us. For pub-tools the pin is
# what makes this roll correct at all — measured, not assumed:
#
#     all five containers:  ref=…:latest   pullPolicy=Always
#
# A roll restarts pods. With `:latest` + `Always` and `:latest` already moved, the two pub-tools
# pods would have pulled `1555b341` DURING THIS ROLL — an unreviewed image arriving as a side
# effect of a roll whose intended change was the frontend. The pin is the thing that stops it.
#
# `1555b341` IS NOT REJECTED, IT IS NOT REVIEWED. It does not ship here. It ships as its own
# deliberate roll, after someone reads what is in it — recorded so the next hand finds a deferral
# with a reason attached and not an unexplained older digest.
#
# SETTING A DIGEST HERE WAS NOT ENOUGH, AND THAT IS WHY THE GATE IS A MANIFEST DIFF. The first
# arming of these three pins rendered `:latest` for all three — the values were correct and the
# pin was inert. The helper honours a digest; three of its four cross-repo call sites never passed
# it one, so `.digest` was nil and every path fell through to the tag branch. The frontend worked
# only because `frontend.yaml` passes it explicitly. Fixed at `engines.yaml` and at both
# `user-deployments.yaml` call sites, in the same commit as this block.
#
# AN IMAGE-LINE DIFF WOULD HAVE PASSED THAT. It would have shown the frontend digest arriving —
# the change everyone was looking for — and said nothing about three pins that did not arrive. If
# you add a digest to a fourth image, render it and read the rendered reference: a values file is
# a request, and only the manifest is the answer.
centralGateway:
  image:
    digest: "sha256:c05e0131995d52bca6fe047f982789fee6d8a2673d50870716a8afdfe395e268"

userDeployments:
  # Partial entries on purpose: helm merges maps recursively, so `registry`, `repository` and
  # `tag` continue to come from `--reuse-values`. That is an assertion about helm's merge, and
  # the FULL-MANIFEST diff is what checks it — an image-line diff would show the digest arriving
  # and stay silent about a sibling key it quietly dropped.
  pub-tools:
    image:
      digest: "sha256:ed93f7b14b6a3d4a094c098d0fb6233deb077b1271440fb851e8952d717bc9bc"
  dag-tools:
    image:
      digest: "sha256:70092098e5f3615e12c96c834b29e3e30122291e4169b578eb06753248f295f3"
