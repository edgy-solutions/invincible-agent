<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <rect rx="12" width="64" height="64" fill="url(#sg)"/>
  <g transform="translate(32,32)">
    <!-- antenna -->
    <line x1="0" y1="-20" x2="0" y2="-14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-21" r="3" fill="#fff"/>
    <!-- head -->
    <rect x="-14" y="-14" width="28" height="22" rx="6" fill="#fff"/>
    <!-- eyes -->
    <circle cx="-6" cy="-4" r="3.5" fill="#341f97"/>
    <circle cx="6" cy="-4" r="3.5" fill="#341f97"/>
    <!-- mouth -->
    <rect x="-6" y="2" width="12" height="2.5" rx="1" fill="#341f97"/>
    <!-- body -->
    <rect x="-10" y="10" width="20" height="10" rx="3" fill="#fff"/>
  </g>
</svg>
